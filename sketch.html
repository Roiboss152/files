  function paintReviews(){ const box = document.getElementById('reviewBox'); if (box) box.innerHTML = renderReviews(); }

  async function fetchReviews(){
    if (!state.bundle || (state.reviews && state.reviews.running)) return;
    const urlInput = $('#rvUrl');
    const placeUrl = urlInput ? urlInput.value.trim() : '';
    const k = $('#rvKakao'), g = $('#rvGoogle');
    state.reviewOpts = { kakao: Boolean(k && k.checked && !k.disabled), google: Boolean(g && g.checked) };
    const sources = ['naver'].concat(state.reviewOpts.kakao?['kakao']:[], state.reviewOpts.google?['google']:[]);
    state.reviews = { running:true, message:'리뷰 수집을 시작합니다' };
    paintReviews();
    try {
      const start = await api('/reviews/start', { method:'POST', body:{ store:state.bundle.store, placeUrl:placeUrl||undefined, sources }, timeout:30000 });
      const runs = {};
      Object.entries(start.runs||{}).forEach(([key,r]) => { if (r && r.runId) runs[key] = r.runId; });
      const skipped = Object.entries(start.runs||{}).filter(([,r]) => r && r.error).map(([key,r]) => `${RV_LABEL[key]||key}: ${r.error}`);
      const label = Object.keys(runs).map(key => RV_LABEL[key]||key).join('·');
      for (let i = 0; i < RV_TRIES; i += 1){
        await new Promise(r => setTimeout(r, RV_POLL_MS));
        state.reviews = { running:true, message:`${label} 리뷰를 모으는 중입니다 · ${Math.round(((i+1)*RV_POLL_MS)/1000)}초 지남 (1~3분 걸립니다)${skipped.length?` · 건너뜀 — ${skipped.join(' / ')}`:''}` };
        paintReviews();
        const r = await api('/reviews/result', { method:'POST', body:{ runs, runId:start.runId, store:state.bundle.store }, timeout:30000 });
        if (r.done){
          if (r.usage) state.apifyUsage = r.usage;
          state.reviews = { running:false, data:r.data, source:r.source, fetchedAt:r.fetchedAt, skipped };
          paintReviews();
          return;
        }
        if (r.failed) throw new Error('리뷰 수집이 중간에 멈췄습니다. 잠시 뒤 다시 시도해 주세요.');
      }
      throw new Error('리뷰 수집이 너무 오래 걸립니다. 잠시 뒤 다시 시도해 주세요.');
    } catch (err) {
      state.reviews = { running:false, error: err && err.message ? err.message : String(err) };
      paintReviews();
      if (err && err.status === 401) lockAuth('비밀번호가 바뀌었거나 맞지 않습니다. 다시 연결해 주세요.');
    }
  }


  /* ══════════ 배관 ══════════
     리포트는 수집이 끝난 뒤(10~20초) 한 번, 리뷰가 도착한 뒤(1~3분) 또 한 번 그려진다.
     기준선은 요소의 실측 좌표로, 스크러빙은 섹션의 문서 좌표로 그리므로
     내용이 바뀔 때마다 둘 다 다시 재야 한다. */

  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* 화면 배율 — getBoundingClientRect는 배율이 곱해진 값을 돌려주므로 잴 때 나눠 준다 */
  let ZOOM = 1;
  const GC='#E4E4E4', GC2='#FAFAFA', GC0='#FFFFFF', EXT=168, LO=-26, HI=616;
  let _drawing = false;

  function inkRect(e){
    try { const r=document.createRange(); r.selectNodeContents(e);
      const b=r.getBoundingClientRect(); if(b.width>4&&b.height>4) return b; } catch(_){}
    return e.getBoundingClientRect();
  }
  function grad(dir, span, fade){
    const f = fade/span*100;
    return `linear-gradient(${dir},${GC0} 0%,${GC2} ${(f*.45).toFixed(1)}%,`+
      `${GC} ${f.toFixed(1)}%,${GC} ${(100-f).toFixed(1)}%,`+
      `${GC2} ${(100-f*.45).toFixed(1)}%,${GC0} 100%)`;
  }
  function drawRules(){
    _drawing = true;
    $$('.arule').forEach(n => n.remove());
    const cnt = new Map();
    $$('[data-rule]').forEach((e) => {
      const sec = e.closest('.sec'); if(!sec) return;
      const a = inkRect(e), b = sec.getBoundingClientRect(), Z = ZOOM;
      const x=(a.left-b.left)/Z, y=(a.top-b.top)/Z, w=a.width/Z, h=a.height/Z;
      e.dataset.rule.split(/\s*,\s*/).forEach((kind) => {
        const i = document.createElement('i');
        i.className = 'arule';
        i.classList.add(kind[0]==='v' ? 'v' : 'h');
        const rd = cnt.get(sec) || 0; cnt.set(sec, rd+1);
        if (kind[0]==='v'){
          const SH=b.height/Z, s0=Math.max(y-EXT,-18), s1=Math.min(y+h+EXT,SH+18), span=s1-s0;
          const fade=Math.min(EXT, span*.34);
          const cx = kind==='vl' ? x : kind==='vr' ? x+w : x+w/2;
          i.style.cssText = `left:${cx.toFixed(1)}px;top:${s0.toFixed(1)}px;width:1px;`+
            `height:${span.toFixed(1)}px;background:${grad('to bottom',span,fade)}`;
        } else {
          const s0=Math.max(x-EXT,LO), s1=Math.min(x+w+EXT,HI), span=s1-s0;
          const fade=Math.min(EXT, span*.34);
          const cy = kind==='ht' ? y : y+h;
          i.style.cssText = `left:${s0.toFixed(1)}px;top:${cy.toFixed(1)}px;height:1px;`+
            `width:${span.toFixed(1)}px;background:${grad('to right',span,fade)}`;
        }
        i.style.setProperty('--rd', (rd*110)+'ms');   // cssText 뒤에 설정해야 살아남는다
        sec.insertBefore(i, sec.firstChild);
      });
    });
    Promise.resolve().then(() => { _drawing = false; });
  }

  /* 배경 타이포 스크러빙 — 오른쪽 밖에서 300% 크기로 들어와 제자리로 */
  let SCRUB = [], _sy = 0, _run = false;
  function buildScrub(){
    SCRUB = $$('.bgw').filter(e => !e.closest('.sec.static')).map((e,i) => ({
      el:e, ax:790+((i*67)%170), top:0 }));
    _sy = window.scrollY;
    measure();
  }
  function measure(){
    const so = window.scrollY;
    SCRUB.forEach(o => { o.el.style.transform = 'none'; });      // 변형을 걷고 원래 자리를 잰다
    SCRUB.forEach(o => { o.top = o.el.getBoundingClientRect().top + so; });
  }
  function paint(sy){
    const vh = innerHeight || 900;
    SCRUB.forEach((o) => {
      // 글자가 화면 바닥에 들어오면 0, 거기서 0.62화면 더 내려오면 1 (화면 중상단에서 수렴 완료)
      let p = (sy + vh - o.top) / (vh*.62); p = p<0?0:p>1?1:p;
      const k = (1-p)*(1-p);
      o.el.style.transform = `translate3d(${(o.ax*k).toFixed(2)}px,0,0) scale(${(1+2.00*k).toFixed(4)})`;
    });
  }
  function tick(){
    const t = window.scrollY;
    _sy += (t-_sy)*0.11;                 // 휠은 100px씩 튄다 — 부드러운 값을 따로 두고 따라간다
    if (Math.abs(t-_sy) < 0.3) _sy = t;
    paint(_sy);
    if (_sy !== t) requestAnimationFrame(tick); else _run = false;
  }
  function kick(){ if(!_run){ _run=true; requestAnimationFrame(tick); } }

  /* 숫자 카운트업 */
  function countUp(e){
    const to = parseFloat(e.dataset.n), dec = +(e.dataset.d||0), t0 = performance.now();
    (function step(t){
      const k = Math.min((t-t0)/2200, 1), q = 1-Math.pow(1-k,4);
      e.textContent = (to*q).toLocaleString('ko-KR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
      if (k<1) requestAnimationFrame(step);
    })(t0);
  }
  function fire(sec){
    sec.classList.add('on');
    if (MOTION==='fast' || reduce || sec.classList.contains('static')) return;
    sec.querySelectorAll('.kpi .v[data-n]').forEach((n,i) => setTimeout(() => countUp(n), i*260));
  }
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting){ fire(e.target); io.unobserve(e.target); } }), { threshold:.2 });

  /* 상호가 길면 히어로가 칼럼을 넘는다 — 들어갈 때까지 줄인다 */
  function fitHero(){
    $$('#report .nm').forEach((n) => {
      n.style.fontSize = '';
      const max = n.parentElement.clientWidth || 590;
      let size = 76;
      n.style.whiteSpace = 'nowrap';
      while (size > 30 && n.scrollWidth > max){ size -= 2; n.style.fontSize = size + 'px'; }
      if (n.scrollWidth > max){ n.style.whiteSpace = 'normal'; n.style.fontSize = '46px'; }
    });
  }

  /* 내용이 바뀌면 다시 재고 다시 붙인다 */
  let _rt = 0;
  function refresh(){
    fitHero();
    drawRules();
    buildScrub();
    $$('.sec').forEach((s) => {
      if (s.classList.contains('static')){ s.classList.add('on'); return; }
      if (!s.dataset.obs){ s.dataset.obs='1'; io.observe(s); }
    });
    paint(_sy);
  }
  function scheduleRefresh(){ clearTimeout(_rt); _rt = setTimeout(refresh, 90); }

  new MutationObserver(() => { if(!_drawing) scheduleRefresh(); })
    .observe(el.result, { childList:true, subtree:true });
  new ResizeObserver(() => { if(!_drawing) scheduleRefresh(); }).observe(el.result);

  if (!reduce && MOTION!=='fast'){
    ['scroll','wheel','touchmove','keydown'].forEach(e => addEventListener(e, kick, {passive:true}));
  }
  addEventListener('resize', () => { measure(); scheduleRefresh(); }, {passive:true});
  addEventListener('load', () => scheduleRefresh());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => scheduleRefresh());
  addEventListener('beforeprint', () => {
    SCRUB.forEach(o => { o.el.style.transform='none'; });
    $$('.sec').forEach(s => s.classList.add('on'));
    drawRules();
  });

  /* 입력 구역 스포트라이트 */
  (() => {
    const set = (on) => { el.scrim.classList.toggle('on', on); el.tool.classList.toggle('lit', on); };
    const active = () => el.tool.contains(document.activeElement) || el.tool.matches(':hover');
    ['mouseenter','focusin'].forEach(e => el.tool.addEventListener(e, () => set(true)));
    ['mouseleave','focusout'].forEach(e => el.tool.addEventListener(e, () => setTimeout(() => set(active()), 0)));
  })();

  /* ══ 화면 배율 — 590px는 인쇄 폭이라 못 늘린다. 종이째 확대한다 ══
     인쇄에는 zoom:1이 걸려 있어 출력물은 배율과 무관하다. */
  (() => {
    const STEPS = [100,125,150,175,200];
    let touched = false;

    function auto(){
      const w = innerWidth;
      return w>=3200 ? 200 : w>=2560 ? 175 : w>=1920 ? 150 : w>=1600 ? 125 : 100;
    }
    function apply(pc, why){
      pc = Math.min(200, Math.max(100, pc));
      ZOOM = pc/100;
      document.documentElement.style.setProperty('--zoom', ZOOM);
      const lb = document.getElementById('zoomNow');
      if (lb) lb.textContent = pc + '%';
      if (why==='user') touched = true;
      scheduleRefresh();
    }
    function step(dir){
      const now = Math.round(ZOOM*100);
      let i = STEPS.indexOf(now);
      if (i < 0) i = STEPS.findIndex(v => v>=now);
      i = Math.min(STEPS.length-1, Math.max(0, (i<0?0:i)+dir));
      apply(STEPS[i], 'user');
    }

    const ui = document.createElement('div');
    ui.className = 'zoomui';
    ui.innerHTML = '<button type="button" id="zoomOut" aria-label="작게">−</button>'+
      '<span id="zoomNow">100%</span>'+
      '<button type="button" id="zoomIn" aria-label="크게">+</button>';
    document.body.appendChild(ui);
    ui.querySelector('#zoomOut').addEventListener('click', () => step(-1));
    ui.querySelector('#zoomIn').addEventListener('click', () => step(1));

    apply(auto(), 'auto');
    addEventListener('resize', () => { if(!touched) apply(auto(),'auto'); }, {passive:true});
  })();

  /* ── 코파일럿용 묶음 ── */
  function buildMarkdown(b) {
    const s = b.store || {};
    const R = (b.options && b.options.radius) || 500;
    const L = [];
    const region = mod(b, 'region');
    const nearby = mod(b, 'nearby');
    const comp = mod(b, 'competition');
    const pop = mod(b, 'population');
    const online = mod(b, 'online');
    const news = mod(b, 'news');
    const trend = mod(b, 'trend');
    const notices = mod(b, 'notices');
    const events = mod(b, 'events');
    const o = online.ok ? onlineParts(online.data) : null;
    const admin = region.ok && region.data.admin;
    const src = (m) => md(srcText(m));
    const cnt = (p) => (!p ? '—' : p.error ? `수집 안 됨: ${md(p.error)}` : num(p.total, '건'));

    L.push('# 매장 데이터 묶음 (자동 수집)');
    L.push(`- 수집: ${b.collectedAt} · 수집기 ${b.version} / 페이지 ${PAGE_VERSION} · 반경 ${dist(R)}`);
    L.push('- 규칙: 아래 표에 있는 숫자만 쓰고, 없는 숫자는 만들지 마세요. 숫자를 쓸 때는 출처를 함께 적으세요. "—"는 값이 없다는 뜻입니다.');
    L.push('');
    L.push('## 1. 매장');
    L.push('| 항목 | 값 | 출처 |', '|---|---|---|');
    L.push(`| 상호 | ${md(s.name)} | ${md((s.sources || []).join('·') || '검색')} 검색 결과 |`);
    L.push(`| 업종(카카오) | ${md(s.category || '—')} | 카카오 로컬 API |`);
    L.push(`| 업종(네이버) | ${md(s.naverCategory || '—')} | 네이버 지역검색 API |`);
    L.push(`| 도로명 주소 | ${md(s.roadAddress || '—')} | 검색 결과 |`);
    L.push(`| 행정동 | ${region.ok ? md(admin ? `${admin.name} (코드 ${admin.code})` : '—') : `수집 안 됨: ${md(region.error)}`} | ${src(region)} |`);
    const PL = placeInfo(b);

      const rc = rv.ratingCounts || {};
      if (has(rv.rated) && rv.sources && rv.sources.naver && !rv.sources.naver.error) {
        L.push(`- 네이버는 2021년부터 별점 대신 키워드로 평가하므로 최근 리뷰에는 별점이 없습니다. 네이버 별점 분포는 옛 리뷰만 센 것이니 대표값으로 쓰지 마세요.${rv.rated ? ` (별점 있는 ${rv.rated}건: ${[5, 4, 3, 2, 1].map((n) => `${n}점 ${Number(rc[n] || 0)}건`).join(', ')})` : ''}`);
      }
      if ((rv.keywords || []).length) {
        L.push(`- 네이버 손님이 고른 키워드: ${md(rv.keywords.map((k) => `${k.word} ${k.count}`).join(', '))}`);
      }
      if ((rv.keywordsKakao || []).length) {
        L.push(`- 카카오 손님이 고른 키워드: ${md(rv.keywordsKakao.map((k) => `${k.word} ${k.count}`).join(', '))}`);
      }
      const toSig2 = tableOrderSignals(rv);
      if (toSig2.count) {
        L.push(`- 테이블 주문기 사용 흔적 ${toSig2.count}건: ${md(toSig2.hits.map((h) => `${h.source} ${h.date || ''} “${h.text}”`).join(' / '))}`);
      }
      const items = rv.complaints || [];
      const analyzed = has(rv.countedAll) ? rv.countedAll : rv.counted;
      if (!items.length) L.push(`- 분석한 ${analyzed}건 가운데 불만이 적힌 리뷰가 없습니다. 리뷰가 고르게 긍정적인 매장이므로 이 사실을 강점으로 쓰세요.`);
      else {
        L.push('');
        L.push('| 출처 | 분류 | 하이오더 보완 | 별점 | 날짜 | 리뷰 내용 | 사장님 답글 | 링크 |');
        L.push('|---|---|---|---|---|---|---|---|');
        items.forEach((x) => {
          const c = x.category;
          L.push(`| ${md(x.source || '네이버')} | ${md(c ? c.label : '분류 안 됨')} | ${c && c.hiorder ? '○' : '×'} | ${has(x.rating) ? x.rating : '없음'} | ${md(x.date || '—')} | ${md(x.text)}${x.lang && x.lang !== 'ko' ? ` (원문 ${md(x.lang)})` : ''} | ${x.reply ? '있음' : '없음'} | ${md(x.link || '—')} |`);
        });
        L.push('');
        const fixes = [...new Set(items.filter((x) => x.category && x.category.hiorder).map((x) => `${x.category.label} → ${x.category.fix}`))];
        if (fixes.length) {
          L.push('- 하이오더로 이어 말할 수 있는 것:');
          fixes.forEach((t) => L.push(`  - ${md(t)}`));
        }
      }
    }
    L.push('');

    L.push('## 10. 사장님께 알려드릴 지원사업·교육');
    L.push('- 규칙: 안내만 하고 신청은 사장님이 직접 하십니다. 대신 신청하거나 수수료를 받는 내용은 절대 쓰지 마세요.');
    L.push('- 규칙: 금액·마감·대상은 바뀝니다. 리포트에는 “공고 원문에서 확인”이라는 말을 함께 넣고, 확정된 금액처럼 쓰지 마세요.');
    L.push('- 규칙: 정부지원금을 미끼로 접근하는 사칭 업체가 있으니 공식 누리집에서만 신청하시라는 안내를 함께 넣으세요.');
    const sido = admin ? admin.sido : '';
    L.push('');
    if (notices.ok) {
      const ni = (notices.data.items || []);
      L.push(`### 지금 접수 중인 공고 (${src(notices)})`);
      if (!ni.length) L.push(`- ${md(notices.data.note)}`);
      else {
        L.push('| 공고 | 소관 | 접수기간 | 대상 | 링크 |');
        L.push('|---|---|---|---|---|');
        ni.forEach((x) => L.push(`| ${md(x.title)} | ${md(x.org || '—')} | ${md(x.period || '—')} | ${md(x.target || '—')} | ${md(x.link || '—')} |`));
      }
    } else {
      L.push(`### 지금 접수 중인 공고\n- 수집 안 됨: ${md(errLine(notices))}`);
    }
    L.push('');
    if (events.ok) {
      const ei = (events.data.items || []);
      L.push(`### 갈 만한 교육·행사 (${src(events)})`);
      if (!ei.length) L.push(`- ${md(events.data.note)}`);
      else {
        L.push('| 행사 | 종류 | 주관 | 행사기간 | 접수 | 링크 |');
        L.push('|---|---|---|---|---|---|');
        ei.forEach((x) => L.push(`| ${md(x.title)} | ${md(x.kind || '—')} | ${md(x.org || '—')} | ${md(x.period || '—')} | ${md(x.apply || '—')} | ${md(x.link || '—')} |`));
      }
    } else {
      L.push(`### 갈 만한 교육·행사\n- 수집 안 됨: ${md(errLine(events))}`);
    }
    L.push('');
    L.push(`### 상시 제도 (${SUPPORT_CHECKED} 확인 · 마감 없는 창구)`);
    L.push('| 구분 | 제도 | 무엇을 도와주는지 | 창구 | 주소 |');
    L.push('|---|---|---|---|---|');
    SUPPORT.filter((x) => x.scope !== '인천' || /인천/.test(String(sido || ''))).forEach((x) => {
      L.push(`| ${md(x.scope === '가구' ? '사장님 가구' : x.scope)} | ${md(x.what)} | ${md(x.why)} | ${md(x.where)} | ${md(x.href)} |`);
    });
    L.push('');
    L.push('- 사장님께 여쭤볼 것 (대답에 따라 해당 제도가 갈립니다):');
    ASK_OWNER.forEach((x) => L.push(`  - ${md(x)}`));
    L.push('');

    const KW = (typeof kwBuild === 'function') ? kwBuild(b) : null;
    L.push('## 11. 플레이스 노출 키워드 후보 (조합 규칙 · 검색량 미검증)');
    if (!KW){
      L.push('- 지역 또는 업종을 정하지 못해 후보를 만들지 못했습니다.');
    } else {
      L.push(`- 만드는 방법: 지역어(${md(KW.places.map(p=>p.t).join(', '))}) × 업종어(${md(KW.kinds.map(k=>k.t).join(', '))})`+
        (KW.occs.length ? ` × 상황어(${md(KW.occs.map(o=>o.w).join(', '))} — 동네 블로그·카페 글 제목에서 뽑음)` : ''));
      L.push('- 주의: 검색량을 확인하지 않은 후보입니다. 네이버 데이터랩은 상대값만 주므로 "월 몇 건"은 낼 수 없습니다.');
      L.push('- 주의: 대표키워드는 스마트플레이스에 5개까지만 넣을 수 있습니다. 주차·단체석·예약은 키워드가 아니라 편의시설에서 켭니다.');
      L.push('');
      L.push('### 대표키워드 5칸 후보');
      L.push('| 후보 | 근거 | 확인할 것 |');
      L.push('|---|---|---|');
      KW.top.forEach(c => L.push(`| ${md(c.t)} | ${md(c.why)} | ${md(c.ask || '—')} |`));
      if (KW.rest.length){
        L.push('');
        L.push('### 소개글·메뉴명에 섞어 쓸 후보');
        L.push('| 후보 | 근거 |');
        L.push('|---|---|');
        KW.rest.forEach(c => L.push(`| ${md(c.t)} | ${md(c.why)} |`));
      }
      L.push('');
      L.push('- AI에게: 위 후보 중 이 매장에 맞는 5개를 고르고, 왜 나머지를 뺐는지 한 줄씩 적어 주세요. 후보에 없는 말을 새로 지어내지 마세요.');
    }
    L.push('');
    const fails = failedModules(b);
    if (fails.length) {
      L.push('## 12. 수집하지 못한 항목');
      fails.forEach(([k, m]) => L.push(`- ${LABEL[k] || k}: ${md(errLine(m))}`));
    }
    return L.join('\n');
  }

  /* ── 복사·저장 ── */
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 아래 방식으로 재시도 */ }
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'absolute';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  el.copyBtn.addEventListener('click', async () => {
    if (!state.bundle) return;
    const ok = await copyText(buildMarkdown(state.bundle));
    setMsg(el.copyMsg, ok ? '복사했습니다. 코파일럿 에이전트에 붙여넣으세요. 입력창에서 뒤가 잘리면 「묶음 파일 저장」으로 첨부하세요.' : '복사하지 못했습니다. 「묶음 파일 저장」을 이용해 주세요.', ok ? 'ok' : 'err');
  });

  function fileStem() {
    const s = state.bundle.store || {};
    const day = String(state.bundle.collectedAt || '').slice(0, 10);
    return `${String(s.name || '매장').replace(/[\\/:*?"<>|\s]+/g, '_')}_${day}`;
  }
  function downloadFile(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    setMsg(el.copyMsg, `${name} 파일로 저장했습니다.`, 'ok');
  }

  // 코파일럿 입력창 글자 한도(표면마다 8,000~10,240자)에 걸리지 않게 파일로 첨부하는 용도. 에이전트 빌더는 .md를 안 받아서 .txt로 저장한다.
  el.txtBtn.addEventListener('click', () => {
    if (!state.bundle) return;
    const name = `매장데이터묶음_${fileStem()}.txt`;
    downloadFile(name, new Blob([buildMarkdown(state.bundle)], { type: 'text/plain;charset=utf-8' }));
  });

  el.result.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'rvBtn') fetchReviews();
  });

  el.result.addEventListener('click', async (e) => {
    if (e.target.id !== 'copyNameBtn' || !state.bundle) return;
    const s = state.bundle.store || {};
    const ok = await copyText([s.name, s.roadAddress || s.address].filter(Boolean).join(' '));
    setMsg(el.copyMsg, ok ? '상호와 주소를 복사했습니다.' : '복사하지 못했습니다.', ok ? 'ok' : 'err');
  });

  // 메뉴판 사진은 화면 참고용이라 저장 파일에는 사진 주소를 빼고 개수만 남긴다
  function forExport(b) {
    const copy = JSON.parse(JSON.stringify(b));
    const im = copy.modules && copy.modules.images;
    if (im && im.ok && im.data) {
      im.data.shownOnScreen = (im.data.items || []).length;
      delete im.data.items;
    }
    if (state.reviews && state.reviews.data) {
      copy.reviews = { fetchedAt: state.reviews.fetchedAt, source: state.reviews.source, data: state.reviews.data };
    }
    return copy;
  }


  /* ══════════ 흐름 ══════════ */
  function setBusy(on){
    state.busy = on;
    el.searchSet.disabled = on || !state.pass;
    el.authBtn.disabled = on;
  }

  /* 1. 연결 */
  el.authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!configured) return setMsg(el.authMsg, '이 파일의 API_BASE 값을 Worker 주소로 바꿔서 올려 주세요.', 'err');
    const pass = el.pass.value.trim();
    if (!pass) return;
    state.pass = pass;
    setBusy(true);
    setMsg(el.authMsg, '연결 중…');
    setMsg(el.connMsg, '');
    try {
      const s = await api('/status', { timeout: 12000 });
      state.pass = pass;
      const keys = s.keys || {};
      el.chips.innerHTML = Object.keys(KEY_LABEL)
        .map(k => `<span class="chip${keys[k] ? '' : ' off'}">${esc(KEY_LABEL[k])}${keys[k] ? '' : ' 없음'}</span>`).join('');
      const missing = Object.keys(KEY_LABEL).filter(k => !keys[k]).length;
      const mismatch = s.version !== PAGE_VERSION;
      const verNote = mismatch ? ` · 이 페이지는 ${PAGE_VERSION}입니다. worker.js와 sketch.html을 같은 버전으로 올려야 모든 항목이 나옵니다` : '';
      setMsg(el.authMsg, '');
      setMsg(el.connMsg, `연결됨 · 중계 서버 ${s.version || '버전 모름'}${missing ? ` · 키 ${missing}곳이 비어 있어 해당 항목은 빠집니다 (공공데이터포털은 키가 있어도 데이터셋별로 활용신청이 따로입니다)` : ''}${verNote}`, mismatch ? 'warn' : '');
      el.login.classList.add('done');          // 팝업은 처음 한 번만
      setBusy(false);
      el.searchSet.disabled = false;
      setTimeout(() => el.q.focus(), 420);
    } catch (err) { state.pass=''; setBusy(false); showError(err, el.authMsg); }
  });

  /* 2. 검색 */
  el.searchForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = el.q.value.trim();
    if (!q || state.busy) return;
    setBusy(true);
    setMsg(el.searchMsg, '찾는 중…');
    el.cands.innerHTML = '';
    try {
      const r = await api(`/search?q=${encodeURIComponent(q)}`);
      state.search = r;
      renderCandidates(r);
      setBusy(false);
    } catch (err) { setBusy(false); showError(err, el.searchMsg); }
  });

  function renderCandidates(r){
    const list = r.candidates || [];
    const notes = (r.notes || []).join(' / ');
    if (!list.length){ setMsg(el.searchMsg, notes || '찾지 못했습니다. 상호에 동네 이름을 붙여 보세요.', 'err'); return; }
    setMsg(el.searchMsg, `${list.length}곳 찾았습니다. 맞는 매장을 고르세요.${notes ? ` · ${notes}` : ''}`);
    el.cands.innerHTML = list.map((c, i) => {
      const notFood = c.categoryGroupCode && !['FD6','CE7'].includes(c.categoryGroupCode);
      const tags = (c.sources||[]).map(s => `<span class="bdg info">${esc(s)}</span>`).join(' ')
        + (notFood ? ` ${badge('warn','음식점 아님')}` : '');
      const noXY = (c.x===null || c.y===null) ? ' · 좌표 없음(주소로 찾음)' : '';
      return `<li class="cand"><div><div class="nm">${esc(c.name)} ${tags}</div>
        <div class="meta">${esc(c.category || c.naverCategory || '업종 정보 없음')} · ${esc(c.roadAddress || c.address || '주소 정보 없음')}${esc(noXY)}</div></div>
        <button class="pick" type="button" data-i="${i}">이 매장 수집</button></li>`;
    }).join('');
  }

  el.cands.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-i]');
    if (!btn || state.busy || !state.search) return;
    collect(state.search.candidates[Number(btn.dataset.i)]);
  });

  /* 3. 수집 */
  async function collect(c){
    setBusy(true);
    state.reviews = null;
    el.result.innerHTML = '';
    el.acts.hidden = true;
    setMsg(el.copyMsg, '');
    el.prog.hidden = false;
    const started = Date.now();
    const timer = setInterval(() => {
      el.progText.textContent = `${c.name} 수집 중 · ${Math.round((Date.now()-started)/1000)}초 (보통 10~20초)`;
    }, 1000);
    el.progText.textContent = `${c.name} 수집 중`;
    try {
      const bundle = await api('/collect', {
        method: 'POST',
        body: { store: c, radius: Number(el.radius.value)||500,
          keywords: el.keywords.value.split(',').map(s=>s.trim()).filter(Boolean) },
        timeout: 90000,
      });
      state.bundle = bundle;
      el.result.innerHTML = renderReport(bundle);
      paintReviews();                    // 리뷰 칸은 비어 있어도 버튼은 나와야 한다
      el.acts.hidden = false;
      setMsg(el.searchMsg, '');
      el.cands.innerHTML = '';
      scheduleRefresh();
    } catch (err) { showError(err, el.searchMsg); }
    finally { clearInterval(timer); el.prog.hidden = true; setBusy(false); }
  }

  /* 4. 내보내기 */
  el.jsonBtn.addEventListener('click', () => {
    if (!state.bundle) return;
    downloadFile(`매장데이터_${fileStem()}.json`,
      new Blob([JSON.stringify(forExport(state.bundle), null, 2)], { type:'application/json' }));
  });
  el.printBtn.addEventListener('click', () => {
    $$('.sec').forEach(s => s.classList.add('on'));
    setTimeout(() => window.print(), 260);
  });
  document.getElementById('replay') && document.getElementById('replay').addEventListener('click', () => {
    $$('.sec').forEach(s => s.classList.remove('on'));
    requestAnimationFrame(() => setTimeout(() => $$('.sec').forEach((s,i) => setTimeout(() => fire(s), i*130)), 60));
  });

  if (!configured) setMsg(el.authMsg, '중계 서버 주소가 설정되지 않았습니다. 이 파일의 API_BASE 값을 바꿔 주세요.', 'err');
})();

</script>
</body></html>
