<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>와이파이 플레이스 연동 페이지 생성기 — KT Synergy</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f8f8f6;
  --surface:  #ffffff;
  --border:   #e4e4e0;
  --text:     #111;
  --muted:    #888;
  --accent:   #03C75A;
  --accent-d: #029447;
  --kt-red:   #e8002d;
  --radius:   12px;
}

html { font-size: 16px; }
body {
  font-family: 'Apple SD Gothic Neo', 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── 헤더 ── */
.top-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.top-bar .logo {
  font-size: 13px;
  font-weight: 700;
  color: var(--kt-red);
  letter-spacing: 0.04em;
}
.top-bar .sep { color: var(--border); }
.top-bar .page-title { font-size: 13px; color: var(--muted); }

/* ── 레이아웃 ── */
.layout {
  display: grid;
  grid-template-columns: 440px 1fr;
  gap: 0;
  min-height: calc(100vh - 49px);
}

/* ── 좌측: 폼 패널 ── */
.form-panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 32px 28px 40px;
  overflow-y: auto;
}

.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 16px;
}

.field-group { margin-bottom: 20px; }

.field-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #444;
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}

.field-group input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color 0.2s;
}
.field-group input:focus { border-color: var(--accent); }
.field-group input::placeholder { color: #bbb; }

.field-hint {
  margin-top: 5px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
}

.divider {
  height: 1px;
  background: var(--border);
  margin: 24px 0;
}

/* 생성 버튼 */
.generate-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  letter-spacing: -0.01em;
}
.generate-btn:hover { background: var(--accent-d); }
.generate-btn:active { transform: scale(0.98); }

/* ── 우측: 결과 패널 ── */
.result-panel {
  padding: 32px 32px 40px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.result-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.result-section-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 700;
  color: #444;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fafaf8;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.badge-green { background: #e6f9ee; color: #027a3a; }
.badge-blue  { background: #e6f0ff; color: #1a56c4; }

/* 플레이스홀더 */
.placeholder {
  padding: 48px 24px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}
.placeholder .icon {
  font-size: 32px;
  margin-bottom: 12px;
  opacity: 0.4;
  display: block;
}

/* URL 결과 */
.url-box {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.url-text {
  flex: 1;
  font-size: 12px;
  color: #444;
  word-break: break-all;
  line-height: 1.5;
  font-family: 'SF Mono', 'Consolas', monospace;
  background: #f5f5f3;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.copy-url-btn {
  flex-shrink: 0;
  padding: 8px 14px;
  background: #f0f0ee;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 12px;
  font-weight: 600;
  color: #444;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.copy-url-btn:hover { background: #e8e8e5; }
.copy-url-btn.copied { border-color: var(--accent); color: var(--accent); background: #e6f9ee; }

/* QR 결과 */
.qr-area {
  padding: 24px;
  display: flex;
  align-items: flex-start;
  gap: 24px;
}
#qrcode {
  flex-shrink: 0;
  width: 140px;
  height: 140px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#qrcode canvas, #qrcode img { display: block; }
.qr-actions { flex: 1; }
.qr-actions p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 14px;
}
.dl-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  background: #fff;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  text-decoration: none;
  margin-right: 8px;
  margin-bottom: 8px;
}
.dl-btn:hover { background: #e6f9ee; }
.dl-btn.primary { background: var(--accent); color: #fff; }
.dl-btn.primary:hover { background: var(--accent-d); }

/* 미리보기 iframe */
.preview-wrap {
  padding: 20px;
  background: #1a1a1a;
  display: flex;
  justify-content: center;
}
.phone-frame {
  width: 280px;
  height: 520px;
  border-radius: 28px;
  overflow: hidden;
  border: 6px solid #333;
  background: #0f0f0f;
  position: relative;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.phone-notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 22px;
  background: #222;
  border-radius: 0 0 14px 14px;
  z-index: 2;
}
#previewFrame {
  width: 100%;
  height: 100%;
  border: none;
  transform-origin: top left;
}

/* 반응형 */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .form-panel { border-right: none; border-bottom: 1px solid var(--border); }
  .result-panel { padding: 20px; }
  .qr-area { flex-direction: column; align-items: center; text-align: center; }
}
</style>
</head>
<body>

<div class="top-bar">
  <span class="logo">KT SYNERGY</span>
  <span class="sep">|</span>
  <span class="page-title">와이파이 × 네이버 플레이스 연동 페이지 생성기</span>
</div>

<div class="layout">

  <!-- ── 좌측: 입력 폼 ── -->
  <div class="form-panel">

    <p class="section-label">매장 정보</p>

    <div class="field-group">
      <label>매장명 <span style="color:#e8002d">*</span></label>
      <input type="text" id="storeName" placeholder="예: 신포우리만두 신포점" maxlength="30">
    </div>

    <div class="field-group">
      <label>네이버 플레이스 URL <span style="color:#e8002d">*</span></label>
      <input type="url" id="placeUrl" placeholder="https://naver.me/xxxxxxxx" value="https://naver.me/Fy2F6RQ5">
      <p class="field-hint">네이버 플레이스 → 공유하기 → 링크 복사</p>
    </div>

    <div class="divider"></div>
    <p class="section-label">와이파이 정보</p>

    <div class="field-group">
      <label>네트워크 이름 (SSID) <span style="color:#e8002d">*</span></label>
      <input type="text" id="ssid" placeholder="예: SINPO_GUEST" maxlength="32">
    </div>

    <div class="field-group">
      <label>비밀번호 <span style="color:#e8002d">*</span></label>
      <input type="text" id="password" placeholder="예: sinpo1234" maxlength="63">
    </div>

    <div class="divider"></div>
    <p class="section-label">추가 설정 (선택)</p>

    <div class="field-group">
      <label>하단 안내 문구</label>
      <input type="text" id="footerMsg" placeholder="와이파이를 즐겁게 이용하세요 😊" maxlength="50"
             value="리뷰 한 줄이 저희에게 큰 힘이 됩니다 🙏">
    </div>

    <div class="divider"></div>

    <button class="generate-btn" onclick="generate()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      페이지 생성하기
    </button>

    <p style="margin-top:14px;font-size:11px;color:#bbb;text-align:center;line-height:1.6">
      생성된 링크를 QR코드로 만들어 테이블에 부착하세요.<br>
      서버 없이 순수 URL 파라미터로 동작합니다.
    </p>

  </div>

  <!-- ── 우측: 결과 ── -->
  <div class="result-panel">

    <!-- URL -->
    <div class="result-section">
      <div class="result-section-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                stroke="#444" stroke-width="2" stroke-linecap="round"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                stroke="#444" stroke-width="2" stroke-linecap="round"/>
        </svg>
        공유 링크
        <span class="badge badge-blue">URL</span>
      </div>
      <div class="url-box">
        <div class="url-text" id="urlDisplay">— 아직 생성 전입니다 —</div>
        <button class="copy-url-btn" id="copyUrlBtn" onclick="copyUrl()">복사</button>
      </div>
    </div>

    <!-- QR 코드 -->
    <div class="result-section">
      <div class="result-section-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1" stroke="#444" stroke-width="2"/>
          <rect x="14" y="3" width="7" height="7" rx="1" stroke="#444" stroke-width="2"/>
          <rect x="3" y="14" width="7" height="7" rx="1" stroke="#444" stroke-width="2"/>
          <path d="M14 14h.01M14 17h3M17 14v3M20 17v3M20 14h.01" stroke="#444" stroke-width="2" stroke-linecap="round"/>
        </svg>
        QR 코드
        <span class="badge badge-green">인쇄용</span>
      </div>
      <div class="qr-area">
        <div id="qrcode">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" opacity="0.2">
            <rect x="3" y="3" width="7" height="7" rx="1" stroke="#888" stroke-width="2"/>
            <rect x="14" y="3" width="7" height="7" rx="1" stroke="#888" stroke-width="2"/>
            <rect x="3" y="14" width="7" height="7" rx="1" stroke="#888" stroke-width="2"/>
          </svg>
        </div>
        <div class="qr-actions">
          <p>생성 후 QR 코드를 다운받아<br>테이블 스티커로 인쇄하세요.<br>권장 크기: <strong>5cm × 5cm</strong> 이상</p>
          <a class="dl-btn primary" id="dlPng" href="#" onclick="downloadQR(event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <path d="M12 15V3M12 15l-4-4M12 15l4-4" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
            QR 이미지 다운로드
          </a>
          <a class="dl-btn" id="dlHtml" href="#" onclick="downloadHtml(event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <path d="M12 15V3M12 15l-4-4M12 15l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            HTML 파일 다운로드
          </a>
        </div>
      </div>
    </div>

    <!-- 미리보기 -->
    <div class="result-section">
      <div class="result-section-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <rect x="5" y="2" width="14" height="20" rx="3" stroke="#444" stroke-width="2"/>
          <path d="M12 18h.01" stroke="#444" stroke-width="2" stroke-linecap="round"/>
        </svg>
        스마트폰 미리보기
      </div>
      <div class="preview-wrap">
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <iframe id="previewFrame" src="about:blank" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* ── 랜딩페이지 HTML 템플릿 ── */
function buildLandingHtml(cfg) {
  return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>${esc(cfg.storeName)} — 와이파이 안내</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#03C75A;--accent-dark:#029447}
html,body{height:100%;font-family:'Apple SD Gothic Neo','Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:#0f0f0f;color:#f0f0f0;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px 20px 40px}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#ffffff08 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}
.card{position:relative;z-index:1;width:100%;max-width:360px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;overflow:hidden}
.header{background:#111;padding:28px 24px 24px;text-align:center;border-bottom:1px solid #222}
.wifi-icon{display:flex;justify-content:center;margin-bottom:16px}
.wifi-icon svg{width:48px;height:48px}
.store-label{font-size:11px;letter-spacing:.18em;color:#666;text-transform:uppercase;margin-bottom:6px}
.store-name{font-size:22px;font-weight:700;color:#f0f0f0;letter-spacing:-.02em}
.body{padding:28px 24px}
.guide-text{font-size:14px;line-height:1.75;color:#999;text-align:center;margin-bottom:24px}
.guide-text strong{color:#f0f0f0;font-weight:600}

.step-num.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px #03C75A33}

.pw-box.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.pw-box-header{padding:10px 16px;background:#161616;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:8px}

.copy-btn:active{background:#222;color:#aaa}
.copy-btn.copied{border-color:var(--accent);color:var(--accent)}
.footer-note{margin-top:20px;font-size:11px;color:#444;text-align:center;line-height:1.6}
@media(prefers-color-scheme:light){body{background:#f5f5f5}body::before{background-image:radial-gradient(circle,#00000008 1px,transparent 1px)}.card{background:#fff;border-color:#e8e8e8}.header{background:#fafafa;border-color:#eee}.store-label{color:#aaa}.store-name{color:#111}.guide-text{color:#888}.guide-text strong{color:#111}.step-num{background:#fafafa;border-color:#ddd;color:#aaa}.step-line{background:#e8e8e8}.pw-box{background:#fafafa;border-color:#e8e8e8}.pw-box-header{background:#f5f5f5;border-color:#eee}.pw-box-title{color:#aaa}.pw-key{color:#aaa}.pw-value{color:#111}.pw-value.ssid{color:#444}.copy-btn{border-color:#e0e0e0;color:#aaa}.footer-note{color:#bbb}}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="wifi-icon"><svg viewBox="0 0 48 48" fill="none"><path d="M24 36a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" fill="#03C75A"/><path d="M14.5 27.5C17.1 24.8 20.4 23 24 23s6.9 1.8 9.5 4.5" stroke="#03C75A" stroke-width="2.5" stroke-linecap="round" opacity=".7"/><path d="M7 20.5C11.5 15.8 17.4 13 24 13s12.5 2.8 17 7.5" stroke="#03C75A" stroke-width="2.5" stroke-linecap="round" opacity=".35"/></svg></div>
    <p class="store-label">Guest Wi-Fi</p>
    <p class="store-name">${esc(cfg.storeName)}</p>
  </div>
  <div class="body">
    <p class="guide-text">비밀번호는 아래 버튼을 누른 후<br><strong>네이버 플레이스</strong>에서 확인하실 수 있어요 😊</p>
    <div class="steps">
      <div class="step"><div class="step-num active" id="s1">1</div><div class="step-label active">플레이스<br>방문</div></div>
      <div class="step-line" id="l1"></div>
      <div class="step"><div class="step-num" id="s2">2</div><div class="step-label">비밀번호<br>확인</div></div>
      <div class="step-line" id="l2"></div>
      <div class="step"><div class="step-num" id="s3">3</div><div class="step-label">와이파이<br>접속</div></div>
    </div>
    <button class="naver-btn" id="naverBtn" onclick="openPlace()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z" fill="white"/></svg>
      네이버 플레이스에서 비밀번호 확인
    </button>
    <div class="pw-box" id="pwBox">
      <div class="pw-box-header"><div class="pw-dot"></div><span class="pw-box-title">Wi-Fi 접속 정보</span></div>
      <div class="pw-content">
        <div class="pw-row"><span class="pw-key">네트워크</span><span class="pw-value ssid">${esc(cfg.ssid)}</span></div>
        <div class="pw-row"><span class="pw-key">비밀번호</span><span class="pw-value" id="pwText">${esc(cfg.password)}</span></div>
        <button class="copy-btn" id="copyBtn" onclick="copyPw()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2"/></svg>
          비밀번호 복사
        </button>
      </div>
    </div>
    <p class="footer-note">${esc(cfg.footerMsg)}</p>
  </div>
</div>
<script>
var PW="${escJs(cfg.password)}",PLACE="${escJs(cfg.placeUrl)}",opened=false;
function openPlace(){
  var btn=document.getElementById('naverBtn'),box=document.getElementById('pwBox');
  btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 플레이스 열림 — 비밀번호 확인하세요';
  btn.style.background='#029447';btn.onclick=null;
  document.getElementById('s1').className='step-num done';document.getElementById('s1').textContent='✓';
  document.getElementById('l1').className='step-line done';
  document.getElementById('s2').className='step-num active';
  box.classList.add('visible');
  if(!opened){window.open(PLACE,'_blank');opened=true;}
  setTimeout(function(){
    document.getElementById('s2').className='step-num done';document.getElementById('s2').textContent='✓';
    document.getElementById('l2').className='step-line done';
    document.getElementById('s3').className='step-num active';
  },2000);
}
function copyPw(){
  var btn=document.getElementById('copyBtn');
  navigator.clipboard.writeText(PW).then(function(){
    btn.textContent='✓  복사 완료!';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='비밀번호 복사';btn.classList.remove('copied');},2500);
  }).catch(function(){
    var el=document.getElementById('pwText');
    var r=document.createRange();r.selectNode(el);
    window.getSelection().removeAllRanges();window.getSelection().addRange(r);
  });
}
<\/script>
</body>
</html>`;
}

/* ── HTML 이스케이프 ── */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function escJs(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/'/g,"\\'");
}

/* ── 현재 생성된 데이터 ── */
let currentHtml = '';
let currentUrl  = '';
let qrInstance  = null;

/* ── 생성 메인 ── */
function generate() {
  const storeName = document.getElementById('storeName').value.trim();
  const placeUrl  = document.getElementById('placeUrl').value.trim();
  const ssid      = document.getElementById('ssid').value.trim();
  const password  = document.getElementById('password').value.trim();
  const footerMsg = document.getElementById('footerMsg').value.trim() || '와이파이를 즐겁게 이용하세요 😊';

  /* 필수값 검증 */
  if (!storeName) { alert('매장명을 입력해주세요.'); return; }
  if (!placeUrl)  { alert('네이버 플레이스 URL을 입력해주세요.'); return; }
  if (!ssid)      { alert('와이파이 SSID를 입력해주세요.'); return; }
  if (!password)  { alert('와이파이 비밀번호를 입력해주세요.'); return; }

  const cfg = { storeName, placeUrl, ssid, password, footerMsg };

  /* HTML 생성 */
  currentHtml = buildLandingHtml(cfg);

  /* ── URL 방식: Data URI (서버 없이 공유 가능한 방법) ── */
  /* 실제 서버 배포 시에는 아래를 kt-synergy.com/wifi?store=...&place=...&ssid=...&pw=... 형태로 교체 */
  const params = new URLSearchParams({
    store: storeName,
    place: placeUrl,
    ssid:  ssid,
    pw:    password,
    msg:   footerMsg
  });
  /* 현재 페이지 기반 링크 생성 */
  const base = window.location.href.replace(/wifi-generator\.html.*$/, 'wifi.html');
  currentUrl = base + '?' + params.toString();

  /* URL 표시 */
  document.getElementById('urlDisplay').textContent = currentUrl;
  document.getElementById('copyUrlBtn').textContent = '복사';
  document.getElementById('copyUrlBtn').classList.remove('copied');

  /* QR 코드 생성 */
  const qrEl = document.getElementById('qrcode');
  qrEl.innerHTML = '';
  qrInstance = new QRCode(qrEl, {
    text:          currentUrl,
    width:         140,
    height:        140,
    colorDark:     '#000000',
    colorLight:    '#ffffff',
    correctLevel:  QRCode.CorrectLevel.M
  });

  /* iframe 미리보기 */
  const frame = document.getElementById('previewFrame');
  const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });
  const blobUrl = URL.createObjectURL(blob);
  frame.src = blobUrl;
}

/* ── URL 복사 ── */
function copyUrl() {
  if (!currentUrl) return;
  const btn = document.getElementById('copyUrlBtn');
  navigator.clipboard.writeText(currentUrl).then(() => {
    btn.textContent = '복사됨 ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2500);
  });
}

/* ── QR PNG 다운로드 ── */
function downloadQR(e) {
  e.preventDefault();
  if (!qrInstance) { alert('먼저 페이지를 생성해주세요.'); return; }
  const canvas = document.querySelector('#qrcode canvas');
  if (!canvas) { alert('QR 코드를 먼저 생성해주세요.'); return; }

  /* 여백 추가한 최종 캔버스 */
  const pad = 24;
  const size = canvas.width + pad * 2;
  const out = document.createElement('canvas');
  out.width = size; out.height = size;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  ctx.drawImage(canvas, pad, pad);

  const a = document.createElement('a');
  const storeName = document.getElementById('storeName').value.trim() || '매장';
  a.download = `QR_와이파이_${storeName}.png`;
  a.href = out.toDataURL('image/png');
  a.click();
}

/* ── HTML 파일 다운로드 ── */
function downloadHtml(e) {
  e.preventDefault();
  if (!currentHtml) { alert('먼저 페이지를 생성해주세요.'); return; }
  const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  const storeName = document.getElementById('storeName').value.trim() || '매장';
  a.download = `와이파이_랜딩_${storeName}.html`;
  a.href = URL.createObjectURL(blob);
  a.click();
}
</script>
</body>
</html>
