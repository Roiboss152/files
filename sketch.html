          ? `중계 서버가 아직 옛 버전입니다 — ${wv}. worker.js를 ${WORKER_VERSION}로 올린 뒤 PUBLIC_PASS를 넣어 주세요.`
          : `중계 서버에 PUBLIC_PASS가 없거나 값이 다릅니다. Workers → Settings → Variables and Secrets에서 PUBLIC_PASS를 ${PUBLIC_PASS} 로 넣고 Deploy 해 주세요.`;
        note += ' 그 전까지는 팀 비밀번호로 들어가시면 됩니다.';
      }

    }
  });

  /* 1-b. 자동 연결 — 직원은 비밀번호를 넣지 않는다.
     페이지에 적어 둔 공개 토큰으로 바로 연결하고, 실패하면 팝업이 열려
     팀 비밀번호로 직접 들어갈 수 있다. */
  (function autoConnect(){
    if (!configured || !PUBLIC_PASS) return;
    const lg = document.getElementById('login');
    if (lg) lg.classList.add('done');          // 팝업이 깜빡이지 않게 먼저 숨긴다

  })();

  /* 오늘 남은 횟수 — 중계 서버가 KV로 세고 있을 때만 나온다 */
  /* v3.20: 남은 횟수는 ● 줄(paintUsage) 한 곳에서만 보인다. 연결 줄에는 한도 셈이 꺼진 경우만 적는다 */
  /* ── v3.20 첫 화면 그림: 한 번 재생, 글자를 치기 시작하거나 수집이 시작되면 물러난다 ── */
  function heroAway(){ if (el.hero && !el.hero.classList.contains('away')) el.hero.classList.add('away'); }
  function heroBack(){ if (el.hero) el.hero.classList.remove('away'); }
  /* v3.37: 영상 heroInit 은 SVG 스케치로 대체 — 파일 끝의 스크립트 참조 */
  /* v3.29: 0장 칩 — 폰(마우스 없음)에서는 누르면 근거가 칩 아래 한 줄로 뜬다. 다시 누르면 닫힌다 */
  document.addEventListener('click', (e) => {
    if (!matchMedia('(hover: none)').matches) return;
    const c = e.target && e.target.closest && e.target.closest('.axes .ax'); if (!c) return;
    const box = c.closest('.axes'); let why = box.querySelector('.axwhy');
    const was = c.classList.contains('sel');

    c.classList.add('sel'); why.hidden = false;

  });

  function usageText(u){
    if (!u) return ' · 한도 셈 꺼짐(중계 서버에 KV 미연결)';
    return '';
  }
  function paintUsage(){
    const node = document.getElementById('usageNote');
    if (!node) return;
    const u = state.usage;
    if (!u) { node.textContent = ''; return; }
    const c = u.collect || {};
    const left = Math.max(0, (c.limit || 0) - (c.used || 0));
    let t = `오늘 남은 수집 ${left}회 / ${c.limit || 0}`;
    if (u.reviews) t += ` · 리뷰 ${Math.max(0, (u.reviews.limit || 0) - (u.reviews.used || 0))}회`;
    const calls = state.apiCalls;
    if (calls && calls.byHost) {
      const H = calls.byHost, n = (k) => H[k] || 0;
      const parts = [['카카오', n('dapi.kakao.com')], ['네이버', n('naverapihub.apigw.ntruss.com') + n('search.naver.com')], ['공공데이터', n('apis.data.go.kr')],
                     ['통계청', n('sgisapi.mods.go.kr')], ['기업마당', n('www.bizinfo.go.kr')]].filter(x => x[1]);
      if (parts.length) t += ` · 방금 수집 ${parts.map(x => `${x[0]} ${x[1]}`).join(' · ')}건`;
    }
    node.textContent = t;
    node.classList.toggle('low', left <= 20);

  }
  /* v3.21 (#86): 직접 수집이 막히면 상태줄 아래에 배지가 뜬다. 다시 뚫리면 내려간다 */
  function paintDirectBadge(){
    let box = document.getElementById('directNote');
    if (!box) { box = document.createElement('p'); box.id = 'directNote'; box.className = 'usage direct'; const u = document.getElementById('usageNote'); if (u && u.parentNode) u.parentNode.insertBefore(box, u.nextSibling); else return; }
    const d = state.direct || {};
    const bad = ['naver','kakao'].filter(k => d[k] && d[k].ok === false);
    if (!bad.length) { box.textContent = ''; box.hidden = true; return; }
    const nm = { naver:'네이버', kakao:'카카오' };

    box.innerHTML = bad.map(k => `${badge('warn', `${nm[k]} 직접 수집 막힘`)} ${esc(String(d[k].since||'').slice(0,10))}부터${k==='naver' ? ' — 리뷰는 Apify로 대신 가져옵니다 (1~3분, 크레딧 확인)' : ' — 메뉴·영업시간·카카오 후기가 빠집니다'}${d[k].lastError ? ` <span class="src9">${esc(d[k].lastError)}</span>` : ''}`).join('<br>');
  }

  /* 리뷰 비밀번호를 한 번 받아 둔다 — 없으면 팝업, 닫으면 수집을 하지 않는다 */
  function ensureReviewPass(){
    if (state.rvPass) return Promise.resolve(true);
    const m = document.getElementById('rvLogin');
    if (!m) return Promise.resolve(true);
    const f = document.getElementById('rvForm');
    const inp = document.getElementById('rvPassInput');
    const cancel = document.getElementById('rvCancel');
    return new Promise((resolve) => {
      const close = (ok) => { m.classList.add('done'); f.onsubmit = null; cancel.onclick = null; resolve(ok); };
      inp.value = '';
      m.classList.remove('done');
      setTimeout(() => inp.focus(), 80);
      f.onsubmit = (e) => {
        e.preventDefault();
        const v = inp.value.trim();
        if (!v) return;
        state.rvPass = v;
        try { localStorage.setItem(RVKEY, v); } catch (_) {}
        close(true);
      };
      cancel.onclick = () => close(false);
    });
  }

  /* 2. 검색 */
  el.searchForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const raw = el.q.value.trim();
    if (!raw || state.busy) return;
    const q = raw;   // v3.21: 범위 선택을 없앴다 — 입력한 그대로 찾는다 (동네 이름을 붙이면 좁혀진다)
    setBusy(true);
    setMsg(el.searchMsg, '찾는 중…');
    el.cands.innerHTML = '';
    try {
      const r = await api(`/search?q=${encodeURIComponent(q)}`);
      state.search = r;
      renderCandidates(r);
      setBusy(false);
    } catch (err) { setBusy(false); showError(err, el.searchMsg); }
  });

  try { localStorage.removeItem('sketch.region'); } catch (_) {}   // v3.21: 범위 선택 제거

  function renderCandidates(r){
    const list = r.candidates || [];
    const notes = (r.notes || []).join(' / ');
    if (!list.length){ setMsg(el.searchMsg, notes || '찾지 못했습니다. 상호에 동네 이름을 붙여 보세요.', 'err'); return; }
    setMsg(el.searchMsg, `${list.length}곳 찾았습니다. 맞는 매장을 고르세요.${notes ? ` · ${notes}` : ''}`);
    el.cands.innerHTML = list.map((c, i) => {
      const notFood = c.categoryGroupCode && !['FD6','CE7'].includes(c.categoryGroupCode);
      const tags = (c.sources||[]).map(s => `<span class="bdg info">${esc(s)}</span>`).join(' ')
        + (notFood ? ` ${badge('warn','음식점 아님')}` : '');
      const noXY = (c.x===null || c.y===null) ? ' · 좌표 없음(주소로 찾음)' : '';
      return `<li class="cand"><div><div class="nm">${esc(c.name)} ${tags}</div>
        <div class="meta">${esc(c.category || c.naverCategory || '업종 정보 없음')} · ${esc(c.roadAddress || c.address || '주소 정보 없음')}${esc(noXY)}</div></div>
        <button class="pick" type="button" data-i="${i}">이 매장 수집</button></li>`;
    }).join('');
  }

  el.cands.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-i]');
    if (!btn || state.busy || !state.search) return;
    collect(state.search.candidates[Number(btn.dataset.i)]);
  });

  /* 3. 수집 */
  function sumCalls(a, b){
    if (!a) return b || null; if (!b) return a;
    const byHost = Object.assign({}, a.byHost || {}); Object.entries(b.byHost || {}).forEach(([h, n]) => { byHost[h] = (byHost[h] || 0) + n; });
    return { total: (a.total || 0) + (b.total || 0), byHost };
  }
  function mergeDirect(bundle, d){
    Object.entries(d.modules || {}).forEach(([k, v]) => { if (v) bundle.modules[k] = v; });
    /* v3.25: 관광 신호(환전소·게스트하우스·관광안내소)는 중계 v1.35부터 /direct 가 센다 — 4장 주변 시설 자료에 붙여 넣는다 */
    const tm = bundle.modules.tourism, nb = bundle.modules.nearby;
    if (tm) { if (tm.ok && tm.data && nb && nb.ok && nb.data) nb.data.tourism = tm.data; delete bundle.modules.tourism; }
    bundle.direct = Object.assign({}, bundle.direct || {}, d.direct || {}, { split: true });
    bundle.apiCalls = sumCalls(bundle.apiCalls, d.apiCalls);
    if (d.version && bundle.version && d.version !== bundle.version) bundle.version = `${bundle.version} / ${d.version}`;
  }
  async function collect(c){
    setBusy(true);
    setCust(false, false);                  // v3.31: 새 매장은 영업용 화면으로 시작
    state.reviews = null;
    el.result.innerHTML = '';
    el.acts.hidden = true;
    setMsg(el.copyMsg, '');
    el.prog.hidden = false;
    const heroGone = !el.hero || el.hero.classList.contains('away');     // 검색어를 치면 이미 접혀 있다 — 최근 목록에서 바로 고르면 지금 접힌다(0.55초)
    heroAway();
    const started = Date.now();
    /* v3.30: 로딩 20~40초(실측) 동안 '어디서 모으나'를 한 줄씩 쌓는다. 실제로는 동시에 모으고, 화면은 읽기 좋게 하나씩 띄운다.
       줄이 제자리에 남아서 발표 중에 가운데 클릭으로 그은 밑줄이 다른 문장 밑으로 옮겨 가지 않는다. 36초가 넘으면 마지막 줄 */
    const JOBS = [['카카오 지도', '위치, 주변 시설, 관광 신호'], ['소상공인시장진흥공단 상가정보', '같은 업종 점포'], ['행정안전부 인허가', '영업장 면적과 업력'],
                  ['국가데이터처 SGIS', '동네 인구와 사업체'], ['네이버 플레이스', '최신 리뷰 최대 150건, 메뉴, 소식, 편의시설'], ['가게 블로그', '이벤트, 신메뉴, 공지'],
                  ['네이버 검색·데이터랩', '블로그, 카페, 뉴스, 검색 추이'], ['구글 지도·코네스트', '외국인 손님 신호'], ['기업마당', '사장님께 알려 드릴 지원사업'],
                  ['', '모은 자료로 진단서를 그리는 중…']];
    const STEP = 3600;
    if (el.progList) el.progList.innerHTML = JOBS.map(([s, w]) => `<li>${s ? `<b>${esc(s)}</b> · ` : ''}${esc(w)}</li>`).join('');
    const jobAt = (t) => { if (!el.progList) return; const k = Math.min(JOBS.length - 1, Math.floor(t / STEP));
      [...el.progList.children].forEach((li, i) => { li.classList.toggle('on', i <= k); li.classList.toggle('now', i === k); }); };
    /* 밑그림이 채워지는 진행 표시 — 서버가 한 번에 답하므로 시간으로 채우되 95%에서 멈추고, 답이 오면 100%.
       v3.30: 실측 20~40초에 맞춰 40초 기준으로 (18초 기준이면 20초부터 그림이 멈춘 채 기다렸다) */
    const EXPECT = 40000;
    const progAt = (p) => { const i = Math.max(0, Math.min(29, Math.round(p*29))); el.progFrame.style.backgroundPosition = `${(i%6)/5*100}% ${Math.floor(i/6)/4*100}%`; };
    progAt(0); jobAt(0);
    const timer = setInterval(() => {
      const t = Date.now()-started, sec = Math.round(t/1000);
      const p = Math.min(0.95, 1 - Math.pow(1 - Math.min(1, t/EXPECT), 1.6));
      progAt(p); jobAt(t);
      const ps = el.progText.querySelector('.psec'); if (ps) ps.textContent = String(sec);
    }, 250);
    /* 초만 바꾼다 — 숫자 칸 폭을 고정해 두어 글이 줄바꿈을 바꾸지 않게(아래 목록이 움직이면 발표 중 그은 밑줄이 어긋난다) */
    el.progText.innerHTML = `${esc(c.name)} 자료를 모으는 중 · <span class="psec">0</span>초 (보통 20~40초)`;
    el.progSub.textContent = '';
    /* v3.30: 로딩 칸을 화면 가운데로 — 배율이 큰 발표 화면에서는 검색창·후보 아래로 밀려 청중에게 안 보였다 */
    const centerProg = () => { try { el.prog.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (_) {} };
    if (heroGone) requestAnimationFrame(centerProg); else setTimeout(centerProg, 620);   // 머리 그림이 접히는 중이면 다 접힌 뒤에 잰다
    try {
      /* v3.23: 수집을 두 호출로 — /collect(공공·카카오·네이버 API)와 /direct(리뷰·가게 정보·브랜드)를 나란히. 무료 워커는 한 호출에 외부 요청 50개까지라
         v1.32에서 인허가가 밀려 빠졌다. 옛 중계(v1.32 이하)면 /direct 가 없어도 /collect 안에 리뷰가 그대로 들어 있어 그대로 쓴다 */
      const body = { store: c, radius: Number(el.radius.value)||500, keywords: el.keywords ? el.keywords.value.split(',').map(s=>s.trim()).filter(Boolean) : [], split: true };
      const [colRes, dirRes] = await Promise.allSettled([
        api('/collect', { method: 'POST', body, timeout: 90000 }),
        api('/direct', { method: 'POST', body: { store: c, radius: body.radius }, timeout: 90000 }),
      ]);
      if (colRes.status === 'rejected') throw colRes.reason;
      const bundle = colRes.value; bundle.modules = bundle.modules || {};
      if (dirRes.status === 'fulfilled' && dirRes.value && dirRes.value.modules) mergeDirect(bundle, dirRes.value);
      else if (!bundle.modules.reviews) {
        const why = dirRes.status === 'rejected' ? String((dirRes.reason && dirRes.reason.message) || dirRes.reason) : '응답 없음';
        bundle.modules.reviews = { ok:false, error:`리뷰·가게 정보 호출 실패 — ${why}`, mode:'direct', fallback:'apify' };
        bundle.direct = Object.assign({}, bundle.direct, { naver:'error', kakao:'error', kakaoNote: why });
      }
      /* 이웃 매장 리뷰 수(눈금의 '기준')는 상가정보 이웃이 정해진 뒤 세 번째 호출로 */
      const nbList = (((bundle.modules.competition||{}).data||{}).neighbors || []).filter(x => x && x.name).slice(0, 5);
      if (nbList.length && bundle.modules.reviews && bundle.modules.reviews.ok && !bundle.modules.rank) {
        el.progSub.textContent = '옆 가게 리뷰 수를 읽는 중…';
        try { const r = await api('/direct/rank', { method:'POST', body:{ store: c, neighbors: nbList }, timeout: 45000 });
          if (r && r.rank && r.rank.ok && r.rank.data && (r.rank.data.neighbors||[]).length) bundle.modules.rank = r.rank;
          if (r && r.apiCalls) bundle.apiCalls = sumCalls(bundle.apiCalls, r.apiCalls);
        } catch (_) { /* 기준 눈금만 빠진다 */ }
      }
      state.bundle = bundle; state.kwTrend = null; state.kwTrendPending = '';
      state.apiCalls = bundle.apiCalls || null;
      clearInterval(timer); progAt(1); el.progSub.textContent = '다 됐습니다';
      await new Promise(r => setTimeout(r, 420));              // 마지막 프레임을 잠깐 보여 준다
      rememberBundle(bundle);                                    // 최근 5건 (브라우저 안)
      if (bundle.usage && bundle.usage.collect) {
        state.usage = Object.assign({}, state.usage || {}, { collect: bundle.usage.collect });
      }
      paintUsage();
      adoptDirectReviews(bundle);        // v3.21 (#87): 리뷰가 수집에 같이 온다 — 없으면 Apify로 자동 대체
      el.result.innerHTML = renderReport(bundle);
      paintReviews();
      fetchKwTrend();                    // 10장 후보 5개의 검색 추이 — 후보가 정해진 뒤에만 부를 수 있다
      if (state.autoFallback) { state.autoFallback = false; fetchReviews({ auto:true }); }
      el.acts.hidden = false;
      setMsg(el.searchMsg, '');
      el.cands.innerHTML = '';
      paintTrack();
      scheduleRefresh();
    } catch (err) { showError(err, el.searchMsg); }
    finally { clearInterval(timer); el.prog.hidden = true; setBusy(false); }
  }

  /* 3-1. 실측 테이블 수·홀 인력 입력칸은 뺐다(2026-09-21) — 상호와 반경만 넣는 화면으로.
     quote.js의 repaintQuote()와 el.tables/el.staff 검사는 그대로 두었으니 칸만 되살리면 다시 돈다. */

  /* 4. 내보내기 — JSON 저장 버튼은 뺐다(2026-09-21). forExport()는 남겨 뒀으니
     파워오토메이트가 붙으면 버튼 한 줄과 처리기 세 줄만 되살리면 된다. */
  /* v3.31: 고객용 진단서 보기 — 다시 그리고 리포트 맨 위로 */
  function setCust(on, rerender = true){
    state.cust = Boolean(on);
    document.body.classList.toggle('cust', state.cust);
    if (el.custBtn) { el.custBtn.textContent = state.cust ? '영업용 화면으로' : '고객용 진단서'; el.custBtn.classList.toggle('on', state.cust); }
    if (!rerender || !state.bundle) return;
    el.result.innerHTML = renderReport(state.bundle);
    $$('.sec').forEach(sec => sec.classList.add('on'));
    paintReviews();
    if (!state.cust) fetchKwTrend();
    requestAnimationFrame(() => { try { el.result.scrollIntoView({ block: 'start' }); } catch (_) {} });
  }
  if (el.custBtn) el.custBtn.addEventListener('click', () => setCust(!state.cust));
  el.printBtn.addEventListener('click', () => {
    $$('.sec').forEach(s => s.classList.add('on'));
    $$('.acc.pshow').forEach(d => { d.open = true; });
    setTimeout(() => window.print(), 260);
  });
  document.getElementById('replay') && document.getElementById('replay').addEventListener('click', () => {
    $$('.sec').forEach(s => s.classList.remove('on'));
    requestAnimationFrame(() => setTimeout(() => $$('.sec').forEach((s,i) => setTimeout(() => fire(s), i*130)), 60));
  });


  /* ══ v3.20 연필 — 끌면 4B 연필(왼쪽 검정·오른쪽 빨강), 낱말 클릭 = 동그라미, 가운데 클릭 = 그 줄 빨간 밑줄.

  function hatches(sh,gap){
    const polys=[sh.o,...(sh.holes||[])]; const dir=[1,-.62], nrm=[.62,1];
    const proj=sh.o.map(p=>p[0]*nrm[0]+p[1]*nrm[1]); const segs=[];

  let passes=[]; let raf=null; let raf2=null;
  const gT=document.getElementById('brushT');
  function build(){
    gJ.innerHTML=''; gG.innerHTML=''; gT.innerHTML=''; passes=[]; defs.querySelectorAll('mask[id^=mj]').forEach(c=>c.remove());
    GUIDES.forEach(g=>passes.push({p:mk(poly(g,false),18,gG),v:1.4,lift:.15}));

  // 연필 하나를 다루는 컨트롤러
  function makePen(pencilId,ghostId,shadowId){
    const pen=document.getElementById(pencilId), ghost=document.getElementById(ghostId), sh=document.getElementById(shadowId);
    let px=null,py=null,pt=0;
    function set(x,y,press){
      const liftY=(1-press)*22; const gx=x, gy=y-liftY;
      pen.setAttribute('transform',`translate(${gx},${gy})`);
      sh.setAttribute('transform',`translate(${liftY*.7},${liftY*.9})`); sh.setAttribute('opacity',(.12*press).toFixed(3));

        const vx=(gx-px)/dt*16, vy=(gy-py)/dt*16;
        const sx=Math.min(16,Math.abs(vx)*.3), sy=Math.min(16,Math.abs(vy)*.3);

        const sp=Math.hypot(vx,vy); ghost.setAttribute('transform',`translate(${px},${py})`);

      px=gx; py=gy;
    }
    function hide(){pen.style.opacity=0;ghost.setAttribute('opacity',0);mb.setAttribute('stdDeviation','0 0');px=null;py=null;}

  }
  const mb=document.getElementById('mb');
  const pen1=makePen('pencil','pencilGhost','shadow'), pen2=makePen('pencil2','pencilGhost2','shadow2');

  // 타임라인 재생: list=passes, pen=컨트롤러, enter=(dx,dy) 들어오는 방향, onDone
  function play(list,pen,speed,enter,exit,onDone){
    const tl=[]; let t=250;
    list.forEach(s=>{const dur=s.p._len/(speed*s.v)*1000;const lift=12+120*s.lift;tl.push({...s,start:t,end:t+dur,lift});t+=dur+lift;});

        const last=at(tl[tl.length-1],1); let s0=null;

      }

  }
