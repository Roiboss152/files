<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>주차권 QR | KT 인천지사</title>
<style>
@font-face{font-family:'DIGICO';src:url('assets/fonts/digicottf-light.ttf') format('truetype');font-weight:300;}
@font-face{font-family:'DIGICO';src:url('assets/fonts/digicottf-medium.ttf') format('truetype');font-weight:500;}
@font-face{font-family:'DIGICO';src:url('assets/fonts/digicottf-bold.ttf') format('truetype');font-weight:700;}
:root{--accent:#6c757d;--dark:#343a40;--gray:#868e96;--border:#ced4da;}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'DIGICO','Apple SD Gothic Neo',sans-serif;
  background:linear-gradient(160deg,#f8f9fa 0%,#e9ecef 60%,#dee2e6 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px 20px;position:relative;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 15% 20%,rgba(255,255,255,0.9) 0%,transparent 60%),
    radial-gradient(ellipse 60% 80% at 85% 80%,rgba(210,215,225,0.5) 0%,transparent 60%);
  pointer-events:none;
}
.geo{position:fixed;pointer-events:none;border-radius:50%;border:1px solid rgba(0,0,0,0.04);}
.geo.a{width:360px;height:360px;top:-100px;right:-100px;}
.geo.b{width:220px;height:220px;top:-40px;right:-40px;}
.geo.c{width:500px;height:500px;bottom:-220px;left:-220px;}
.card{
  position:relative;z-index:1;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.9);
  border-radius:28px;
  padding:40px 32px;
  text-align:center;
  max-width:380px;width:100%;
  box-shadow:0 8px 40px rgba(0,0,0,0.08);
  animation:fadeUp 0.7s ease forwards;opacity:0;transform:translateY(20px);
}
@keyframes fadeUp{to{opacity:1;transform:none;}}
.kt-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;}
.kt-row img{height:24px;width:auto;opacity:0.45;filter:grayscale(1);}
.kt-row span{font-size:11px;color:var(--gray);letter-spacing:1.5px;font-weight:500;}
.eyebrow{font-size:11px;font-weight:500;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;}
.title{font-size:24px;font-weight:700;color:var(--dark);letter-spacing:-1px;line-height:1.3;margin-bottom:6px;}
.subtitle{font-size:14px;font-weight:300;color:var(--gray);line-height:1.7;margin-bottom:28px;}
.qr-wrap{
  display:inline-block;padding:16px;
  background:#fff;border-radius:20px;
  border:1.5px solid var(--border);
  margin-bottom:24px;
  box-shadow:0 2px 16px rgba(0,0,0,0.06);
}
.qr-wrap img{width:180px;height:180px;display:block;}
.divider{height:1px;background:linear-gradient(to right,transparent,var(--border),transparent);margin:20px 0;}
.info-list{text-align:left;display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.info-item{display:flex;gap:12px;font-size:14px;}
.info-item .ik{font-weight:700;color:var(--dark);min-width:52px;}
.info-item .iv{font-weight:300;color:var(--gray);}
.url{font-size:11px;color:#bbb;letter-spacing:0.5px;margin-top:4px;}
.footer{margin-top:24px;font-size:11px;color:#bbb;line-height:1.8;}
</style>
</head>
<body>
<div class="geo a"></div>
<div class="geo b"></div>
<div class="geo c"></div>
