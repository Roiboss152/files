<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="/favicon.ico" type="image/x-icon"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>인천지사 시너지영업3팀</title>
<style>
@font-face{font-family:'DIGICO';src:url('/assets/fonts/digicottf-light.ttf') format('truetype');font-weight:300;font-style:normal;}
@font-face{font-family:'DIGICO';src:url('/assets/fonts/digicottf-medium.ttf') format('truetype');font-weight:500;font-style:normal;}
@font-face{font-family:'DIGICO';src:url('/assets/fonts/digicottf-bold.ttf') format('truetype');font-weight:700;font-style:normal;}
</style>
<style>
:root{
  --red:#e60012;--dark:#0a0a0a;--gray:#6e6e73;
  --light:#f5f5f7;--white:#fff;--border:#d2d2d7;
  --max:1100px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DIGICO',sans-serif;background:#fff;color:var(--dark);overflow-x:hidden;}

/* ── 히어로 ── */
.hero{position:relative;height:100vh;min-height:700px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--dark);}
.hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;opacity:0;transform:scale(1.0);transition:opacity 1.5s ease-in-out, transform 7s ease-in-out;}
.hero-slide.active{opacity:1;transform:scale(1.1);}

.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.05) 0%,rgba(0,0,0,0.25) 100%);z-index:1;}
.hero-ci{position:absolute;top:40px;left:48px;z-index:10;opacity:0;animation:fadeUp 0.8s 0.2s ease forwards;}
.hero-ci img{height:56px;width:auto;}
.hero-content{position:relative;z-index:2;text-align:center;color:#fff;padding:0 24px;}

/* 글래스 뒤 블러 레이어 */
.hero-blur-layer{position:absolute;inset:0;background-size:cover;background-position:center;background-image:url('/assets/image/files/city_airplane.png');filter:blur(18px);transform:scale(1.08);z-index:0;opacity:0;transition:opacity 0s;}

@keyframes pulseGlow{0%,100%{box-shadow:0 12px 48px rgba(0,0,0,0.3),0 0 15px rgba(255,255,255,0.1);}50%{box-shadow:0 12px 48px rgba(0,0,0,0.3),0 0 60px rgba(255,255,255,0.35);}}
.hero-glass{background:rgba(255,255,255,0.18);backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:20px;padding:0;overflow:hidden;display:inline-block;width:clamp(340px,96vw,920px);text-align:center;position:relative;z-index:3;border:1.5px solid rgba(255,255,255,0.45);box-shadow:0 12px 48px rgba(0,0,0,0.3);}
.hero-blur-slide{position:absolute;inset:0;background-repeat:no-repeat;z-index:1;opacity:0;transition:opacity 1.5s ease-in-out;pointer-events:none;}
.hero-blur-slide.active{opacity:1;}
.hero-glass-row{position:relative;z-index:2;padding:clamp(18px,3.5vh,40px) clamp(20px,3vw,40px);}
.hero-glass-divider{width:100%;height:1px;background:rgba(255,255,255,0.45);position:relative;z-index:2;}
.hero-glass-badge{font-size:clamp(13px,1.8vw,20px);font-weight:600;letter-spacing:3px;color:rgba(255,255,255,0.7);text-transform:uppercase;}
.hero-glass-btn{display:inline-block;color:#fff;font-size:clamp(16px,1.8vw,22px);font-weight:600;font-family:'DIGICO',sans-serif;cursor:pointer;background:none;border:none;padding:4px 0;letter-spacing:1px;position:relative;transition:color 0.3s ease,letter-spacing 0.3s ease;}
.hero-glass-btn::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1.5px;background:#fff;transition:width 0.35s ease;}
.hero-glass-btn:hover::after{width:100%;}
.hero-glass-btn:hover{letter-spacing:2.5px;color:rgba(255,255,255,0.9);}
.hero-glass-btn .arrow{display:inline-block;transition:transform 0.35s ease;}
.hero-glass-btn:hover .arrow{transform:translateX(8px);}
.hero-glass-btn-row{padding:20px 40px;position:relative;z-index:2;}.hero-title{font-size:clamp(36px,9vw,140px);font-weight:700;line-height:1.2;letter-spacing:-2px;margin-bottom:0;opacity:1;transform:none;animation:none;white-space:nowrap;}
.hero-title em{color:var(--red);font-style:normal;}
.hero-sub{font-size:clamp(15px,1.8vw,22px);font-weight:300;color:rgba(255,255,255,0.75);line-height:1.9;margin:0 auto;opacity:1;transform:none;animation:none;}
.hero-btn{display:inline-block;background:rgba(255,255,255,0.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:18px 52px;border-radius:6px;font-size:17px;font-weight:600;border:2px solid rgba(255,255,255,0.4);box-shadow:0 8px 32px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.2);opacity:0;transform:translateY(30px);animation:fadeUp 0.9s 0.9s ease forwards;transition:transform 0.2s,box-shadow 0.2s,background 0.2s;cursor:pointer;font-family:'DIGICO',sans-serif;}
.hero-btn:hover{background:rgba(255,255,255,0.25);transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.25);}
.hero-scroll{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(255,255,255,0.4);font-size:10px;letter-spacing:3px;opacity:0;animation:fadeUp 1s 1.4s ease forwards;}
.scroll-line{width:1px;height:44px;background:linear-gradient(to bottom,rgba(255,255,255,0.5),transparent);animation:scrollPulse 2s infinite;}
@keyframes scrollPulse{0%,100%{opacity:0.3;}50%{opacity:1;}}

/* ── 공통 ── */
.section-inner{max-width:var(--max);margin:0 auto;padding:0 60px;}
.section-badge{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.section-badge .badge-icon{display:flex;gap:10px;flex-shrink:0;}
.section-badge .badge-icon span{display:block;width:10px;height:26px;background:var(--dark);border-radius:1px;}
.section-badge .label{background:var(--dark);color:#fff;font-size:11px;font-weight:600;letter-spacing:2px;padding:7px 12px;text-transform:uppercase;white-space:nowrap;min-width:220px;text-align:center;}

/* ── 인트로 ──
