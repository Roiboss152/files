  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n\n\n\n\n\n\n\n<script src=\"84d5b3e2-b1e4-4bc9-b270-adbbcdfcab89\"><\u002Fscript>\n\n\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"color-scheme\" content=\"dark\">\n\n<script src=\"5b83e266-58e4-46c5-983f-5cb23e501ddd\"><\u002Fscript>\n<style>\n  html,body{margin:0;padding:0;background:#020204;color:#fff;font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic','Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;word-break:keep-all;}\n  a{color:#4facfe;text-decoration:none;} a:hover{color:#8cc8ff;}\n  input,button,select{font-family:inherit;}\n  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}\n  input[type=number]{-moz-appearance:textfield;}\n  @keyframes emberA{\n    0%,100%{transform:translate(-50%,0) scale(1);opacity:.55;}\n    25%{transform:translate(-46%,-3%) scale(1.08);opacity:.75;}\n    50%{transform:translate(-52%,2%) scale(.96);opacity:.45;}\n    75%{transform:translate(-48%,-2%) scale(1.05);opacity:.68;}\n  }\n  @keyframes emberB{\n    0%,100%{transform:translate(0,0) scale(1);opacity:.35;}\n    33%{transform:translate(3%,-4%) scale(1.12);opacity:.55;}\n    66%{transform:translate(-2%,3%) scale(.94);opacity:.28;}\n  }\n  @keyframes emberC{\n    0%,100%{transform:translate(0,0) scale(1);opacity:.30;}\n    50%{transform:translate(-4%,-5%) scale(1.15);opacity:.5;}\n  }\n  @keyframes riseIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}\n  button{transition:transform .38s cubic-bezier(.34,1.56,.64,1),background .25s ease,color .25s ease,border-color .25s ease,box-shadow .3s ease,opacity .25s ease;}\n  button:hover{transform:translateY(-2px);}\n  button:active{transform:translateY(1px) scale(.93);transition-duration:.12s;}\n  @keyframes numFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}\n  @keyframes numPopA{0%{transform:scale(1);}40%{transform:scale(1.16);}100%{transform:scale(1);}}\n  @keyframes numPopB{0%{transform:scale(1);}40%{transform:scale(1.16);}100%{transform:scale(1);}}\n  @keyframes pictoPopA{0%{transform:scale(.3);opacity:0;}60%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);opacity:1;}}\n  @keyframes pictoPopB{0%{transform:scale(.3);opacity:0;}60%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);opacity:1;}}\n  @keyframes cardInA{0%{transform:scale(.25) translateY(34%);opacity:0;}55%{opacity:1;}100%{transform:scale(1) translateY(0);opacity:1;}}\n  @keyframes cardInB{0%{transform:scale(.25) translateY(34%);opacity:0;}55%{opacity:1;}100%{transform:scale(1) translateY(0);opacity:1;}}\n  @keyframes cardOutA{0%{transform:scale(1);opacity:1;}100%{transform:scale(.82);opacity:0;}}\n  @keyframes cardOutB{0%{transform:scale(1);opacity:1;}100%{transform:scale(.82);opacity:0;}}\n  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55);}70%{box-shadow:0 0 0 9px rgba(74,222,128,0);}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);}}\n  @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;position:relative;overflow-x:clip;\">\n\n  <!-- ember background: slow flame-like blue shimmer -->\n  <sc-if value=\"{{ember}}\" hint-placeholder-val=\"{{true}}\">\n    <div style=\"position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;\">\n      <div style=\"position:absolute;top:-25%;left:50%;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(79,172,254,0.10) 0%,rgba(48,82,130,0.06) 40%,transparent 65%);animation:emberA 26s ease-in-out infinite;\"><\u002Fdiv>\n      <div style=\"position:absolute;bottom:-30%;right:-15%;width:1000px;height:1000px;bo olor:#1d3b57;margin-bottom:6px;\">배정 방식 비교 — 대수 우선(그리디) vs 금액 최적화<\u002Fdiv>\n                    <sc-for list=\"{{allocCompareRows}}\" as=\"ar\" hint-placeholder-count=\"2\">\n                      <div style=\"padding:5px 0;border-bottom:1px dashed rgba(29,127,212,0.18);\">\n                        <div style=\"font-size:13px;font-weight:800;color:#15181d;\">{{ar.name}} <sc-if value=\"{{ar.best}}\" hint-placeholder-val=\"{{false}}\"><span style=\"background:#4ade80;color:#052e1a;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;\">채택<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                        <div style=\"font-size:12.5px;color:#345;line-height:1.6;\">{{ar.detail}}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <div style=\"font-size:12px;color:#5a708a;margin-top:6px;\">{{allocCompareNote}}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{penTouched}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"font-size:14.4px;font-weight:800;color:#7a828e;letter-spacing:0.06em;margin-bottom:8px;\">위약금 계산<\u002Fdiv>\n                <div style=\"border:1px solid #e4e8ee;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px;color:#555;line-height:1.8;\">\n                  {{penDocLine1}}<br>{{penDocLine2}}<br><b style=\"color:#15181d;\">위약금 합계 {{penTotalText}} (VAT포함 {{penTotalInclText}})<\u002Fb>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <p style=\"margin:0;font-size:13.2px;color:#c0392b;line-height:1.6;font-weight:600;\">실무자 참고용 — 고객에게 내부 산식·선납 배정 내역을 직접 노출하지 마세요.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{dlStaff}}\" style=\"margin-top:16px;border:none;border-radius:14px;padding:15px 26px;background:linear-gradient(180deg,#7cc4ff 0%,#4facfe 48%,#2f7fd6 100%);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,0.5) inset,0 8px 12px rgba(255,255,255,0.16) inset,0 -8px 14px rgba(10,58,120,0.5) inset,0 8px 16px rgba(0,0,0,0.45),0 14px 30px rgba(79,172,254,0.35);\" style-hover=\"box-shadow:0 8px 28px rgba(79,172,254,0.5);\">실무자용 PNG 다운로드<\u002Fbutton>\n        <\u002Fsc-if>\n        <p style=\"margin:12px 0 0;font-size:14.4px;color:#71717a;\">{{dlStatus}}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <footer style=\"border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;font-size:14.4px;color:#5a6270;\">\n        내부 검토용 · 단가 및 정책은 변경될 수 있습니다.\n      <\u002Ffooter>\n    <\u002Fmain>\n\n    <!-- desktop spacer reserving room for fixed quote card -->\n    <sc-if value=\"{{isDesktop}}\" hint-placeholder-val=\"{{true}}\">\n      <div style=\"width:372px;flex-shrink:0;\"><\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- desktop fixed live quote card -->\n  <sc-if value=\"{{isDesktop}}\" hint-placeholder-val=\"{{true}}\">\n    <aside style=\"position:fixed;top:64px;right:max(56px,calc((100vw - 1192px)/2 + 56px));width:320px;z-index:30;background:rgba(13,18,26,0.55);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);color:#fff;border:1px solid rgba(79,172,254,0.3);border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,0.55),0 0 40px rgba(79,172,254,0.14),0 1px 0 rgba(255,255,255,0.12) inset;animation:riseIn .6s cubic-bezier(.22,1,.36,1);\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;\">\n        <span style=\"font-size:15.6px;font-weight:800;letter-spacing:0.06em;color:#9fc9ee;\">실시간 견적<\u002Fspan>\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,0.8);display:block;animation:pulseDot 2s ease-out infinite;\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:15.6px;color:#8b93a1;font-weight:600;\">월 요금 (VAT포함)<\u002Fdiv>\n      <div style=\"font-size:45.6px;font-weight:800;letter-spacing:-0.02em;line-height:1.1;margin:4px 0 16px;color:#7cc4ff;text-shadow:0 0 24px rgba(79,172,254,0.35);\">{{monthlyInclAnim}}<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,0.12);padding-top:14px;\">\n        <div style=\"display:flex;justify-content:space-between;font-size:16.2px;\"><span style=\"color:#8b93a1;\">하이오더 메뉴판<\u002Fspan><b style=\"color:#fff;\">{{menuQty}}대<\u002Fb><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:16.2px;\"><span style=\"color:#8b93a1;\">알림판<\u002Fspan><b style=\"color:#fff;\">{{noticeTotal}}대<\u002Fb><\u002Fdiv>\n        <sc-if value=\"{{showAllocation}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"display:flex;justify-content:space-between;font-size:16.2px;\"><span style=\"color:#8b93a1;\">지원금 선납<\u002Fspan><b style=\"color:#7cc4ff;\">{{prepaidCount}} / {{totalDevices}}대<\u002Fb><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{hasLump}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"display:flex;justify-content:space-between;font-size:16.2px;\"><span style=\"color:#8b93a1;\">초기 일시불<\u002Fspan><b style=\"color:#fbbf24;\">{{lumpInclText}}<\u002Fb><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{goQuote}}\" style=\"width:100%;margin-top:18px;border:none;border-radius:14px;padding:14px;background:linear-gradient(180deg,#7cc4ff 0%,#4facfe 48%,#2f7fd6 100%);color:#fff;font-size:16.8px;font-weight:800;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,0.5) inset,0 6px 10px rgba(255,255,255,0.16) inset,0 -7px 12px rgba(10,58,120,0.5) inset,0 6px 14px rgba(0,0,0,0.45),0 12px 26px rgba(79,172,254,0.3);\">견적서 보기 ↓<\u002Fbutton>\n    <\u002Faside>\n  <\u002Fsc-if>\n\n  <!-- mobile fixed bottom quote bar -->\n  <sc-if value=\"{{isMobile}}\" hint-placeholder-val=\"{{false}}\">\n    <div sc-camel-on-click=\"{{goQuote}}\" style=\"position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;background:rgba(13,18,26,0.6);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);color:#fff;border:1px solid rgba(79,172,254,0.3);border-radius:20px;padding:14px 18px;box-shadow:0 16px 50px rgba(0,0,0,0.6),0 0 30px rgba(79,172,254,0.15),0 1px 0 rgba(255,255,255,0.12) inset;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;\">\n      <div style=\"min-width:0;\">\n        <div style=\"font-size:13.2px;font-weight:700;color:#9fc9ee;\">선택한 단말<\u002Fdiv>\n        <div style=\"font-size:18px;font-weight:800;line-height:1.3;white-space:nowrap;color:#fff;\">메뉴판 {{menuQty}} · 알림판 {{noticeTotal}}<\u002Fdiv>\n        <div style=\"font-size:13.8px;color:#8b93a1;margin-top:1px;white-space:nowrap;\">총 {{totalDevices}}대{{mobileLumpNote}}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex-shrink:0;text-align:right;\">\n        <div style=\"font-size:13.2px;font-weight:700;color:#9fc9ee;\">월 요금 · VAT포함<\u002Fdiv>\n        <div style=\"font-size:28.8px;font-weight:800;letter-spacing:-0.02em;line-height:1.15;color:#7cc4ff;white-space:nowrap;text-shadow:0 0 18px rgba(79,172,254,0.4);\">{{monthlyInclAnim}}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;ember&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;배경&quot;},\n  &quot;defaultView&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;staff&quot;, &quot;customer&quot;], &quot;default&quot;: &quot;staff&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;견적서&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    menuQty: 5, menuColor: '화이트', menuMount: '스탠드', saleType: 'postpaid',\n    n10Qty: 0, n15Qty: 0, readerQty: 5,\n    contractType: 'contract', devicePay: 'monthly',\n    storeName: '', subsidy: 0,\n    adConsent: false, ansim: false, mou: false, mouTier: 'tier10', bundle: false,\n    penMonths: 36, penUsed: 6, penDevicesOverride: null, penPromo: 0, penInstallment: false, penTouched: false, penOpen: false, cmpOpen: false, chartIn: false,\n    quoteView: null, isMobile: false, activeSection: 'sec-devices', dlStatus: ''\n  };\n\n  PRICE = {\n    device10: { monthlyEx: 5000, lumpEx: 170000, lumpIncl: 187000 },\n    device15: { monthlyEx: 7000, lumpEx: 237000, lumpIncl: 260700 },\n    serviceRate: { contract: 15000, free: 21000 },\n    prepayDiscount: 0.10, reader: 2000, adMonthly: 556,\n    ansim: { monthly: 1650, minDevices: 5 },\n    mouPerDevice: { tier10: 1000, tier30: 2000 },\n    bundleFlat: 5000, vat: 0.10\n  };\n\n  pimg(cd){ return (window.__resources && window.__resources['img' + cd]) || ('https://www.kt-synergy.com/assets/image/hiorder/' + cd + '_500.PNG'); }\n  won(n){ return Math.round(n).toLocaleString('ko-KR') + '원'; }\n\n  // 숫자 카운트업(트윈) 컴포넌트 — 값이 바뀌면 0.7초간 촤라락 굴러감\n  num(value, fmt){\n    if (!this._Num){\n      class Num extends React.Component {\n        constructor(p){ super(p); this.state = { v: p.value }; }\n        componentDidUpdate(prev){\n          if (prev.value !== this.props.value){\n            if (this._raf) cancelAnimationFrame(this._raf);\n            const from = this.state.v, to = this.props.value, t0 = performance.now(), dur = 700;\n            const step = t => {\n              const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);\n              this.setState({ v: from + (to - from) * e });\n              if (k < 1) this._raf = requestAnimationFrame(step);\n            };\n            this._raf = requestAnimationFrame(step);\n          }\n        }\n        componentWillUnmount(){ if (this._raf) cancelAnimationFrame(this._raf); }\n        render(){ return React.createElement('span', null, this.props.fmt(this.state.v)); }\n      }\n      this._Num = Num;\n    }\n    return React.createElement(this._Num, { value, fmt });\n  }\n\n  // 값이 바뀔 때마다 A/B 키프레임을 번갈아 반환해 pop 애니메이션 재발동\n  flip(key, val, a, b){\n    if (this['_lv_' + key] !== val){ this['_lv_' + key] = val; this['_fl_' + key] = !this['_fl_' + key]; }\n    return this['_fl_' + key] ? (a || 'numPopA') : (b || 'numPopB');\n  }\n  today(){ const d = new Date(); return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0'); }\n\n  componentDidMount(){\n    ['2W','2WC','2B','2BC','2SW','2SWC','2SB','2SBC'].forEach(cd => { const im = new Image(); im.src = this.pimg(cd); });\n    this.mq = window.matchMedia('(max-width: 1180px)');\n    this.mqNarrow = window.matchMedia('(max-width: 663px)');\n    const apply = () => this.setState({ isMobile: this.mq.matches, isNarrow: this.mqNarrow.matches });\n    this.mq.addEventListener('change', apply);\n    this.mqNarrow.addEventListener('change', apply); apply();\n    this.sectionIds = ['sec-devices','sec-terms','sec-subsidy','sec-monthly','sec-compare','sec-penalty','sec-quote'];\n    this.onScroll = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => {\n        this._raf = null;\n        const mark = window.scrollY + window.innerHeight * 0.35;\n        let cur = this.sectionIds[0];\n        for (const id of this.sectionIds){\n          const el = document.getElementById(id);\n          if (el && el.offsetTop <= mark) cur = id;\n        }\n        if (cur !== this.state.activeSection) this.setState({ activeSection: cur });\n      });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches){\n      requestAnimationFrame(() => {\n        const io = new IntersectionObserver((ents) => {\n          ents.forEach(en => {\n            if (!en.isIntersecting) return;\n            const el = en.target;\n            el.style.opacity = '1'; el.style.transform = 'none'; el.style.filter = 'none';\n            io.unobserve(el);\n          });\n        }, { threshold: 0.06, rootMargin: '0px 0px -40px 0px' });\n        this.sectionIds.forEach(id => {\n          const el = document.getElementById(id);\n          if (!el) return;\n          const r = el.getBoundingClientRect();\n          if (r.top < window.innerHeight * 0.85) return;\n          el.style.transition = 'opacity 1s cubic-bezier(0.22,1,0.36,1), transform 1s cubic-bezier(0.22,1,0.36,1), filter 1s cubic-bezier(0.22,1,0.36,1)';\n          el.style.opacity = '0'; el.style.transform = 'translateY(30px)'; el.style.filter = 'blur(10px)';\n          io.observe(el);\n        });\n        this._io = io;\n      });\n    }\n  }\n  componentWillUnmount(){\n    window.removeEventListener('scroll', this.onScroll);\n    if (this._io) this._io.disconnect();\n  }\n\n  computeCore(forceContract){\n    const s = this.state, P = this.PRICE;\n    const countA = s.menuQty + s.n10Qty, countB = s.n15Qty;\n    const totalDevices = countA + countB;\n    const isContract = forceContract ? true : s.contractType === 'contract';\n    const serviceRate = isContract ? P.serviceRate.contract : P.serviceRate.free;\n    return {\n      countA, countB, totalDevices,\n      deviceMonthlyExFull: countA*P.device10.monthlyEx + countB*P.device15.monthlyEx,\n      deviceLumpExFull: countA*P.device10.lumpEx + countB*P.device15.lumpEx,\n      deviceLumpInclFull: countA*P.device10.lumpIncl + countB*P.device15.lumpIncl,\n      serviceMonthly: totalDevices*serviceRate,\n      servicePrepayTotal: totalDevices*serviceRate*36*(1-P.prepayDiscount),\n      readerMonthly: s.saleType === 'prepaid' ? s.readerQty*P.reader : 0,\n      adDiscountMonthly: s.adConsent ? totalDevices*P.adMonthly : 0,\n      ansimMonthlyIncl: s.ansim ? totalDevices*P.ansim.monthly : 0,\n      mouDiscountMonthly: (s.mou && isContract) ? totalDevices*(P.mouPerDevice[s.mouTier]||1000) : 0,\n      bundleDiscountMonthly: s.bundle ? P.bundleFlat : 0,\n      totalSubsidyIncl: s.subsidy * totalDevices\n    };\n  }\n\n  findGreedyAllocation(countA, countB, budget){\n    const P = this.PRICE;\n    const a = Math.min(countA, Math.floor(budget / P.device10.lumpIncl));\n    const b = Math.min(countB, Math.floor((budget - a*P.device10.lumpIncl) / P.device15.lumpIncl));\n    return { a, b, used: a*P.device10.lumpIncl + b*P.device15.lumpIncl,\n      remainingFee: (countA-a)*P.device10.monthlyEx + (countB-b)*P.device15.monthlyEx };\n  }\n\n  findOptimalAllocation(countA, countB, budget){\n    const P = this.PRICE;\n    let best = { a:0, b:0, remainingFee: countA*P.device10.monthlyEx + countB*P.device15.monthlyEx, used:0 };\n    for(let b=0; b<=countB; b++){\n      const costB = b*P.device15.lumpIncl;\n      if(costB > budget) break;\n      const a = Math.min(countA, Math.floor((budget-costB)/P.device10.lumpIncl));\n      const remainingFee = (countA-a)*P.device10.monthlyEx + (countB-b)*P.device15.monthlyEx;\n      const used = a*P.device10.lumpIncl + b*P.device15.lumpIncl;\n      if(remainingFee < best.remainingFee || (remainingFee === best.remainingFee && used > best.used)) best = { a, b, remainingFee, used };\n    }\n    return best;\n  }\n\n  pill(active){\n    return active\n      ? { bg:'transparent', fg:'#fff' }\n      : { bg:'transparent', fg:'#8b93a1' };\n  }\n\n  async download(elId, name){\n    const el = document.getElementById(elId);\n    if(!el || !window.html2canvas) return;\n    this.setState({ dlStatus: '이미지 생성 중…' });\n    // html2canvas는 zoom/음수 마진과 궁합이 나빠 글자가 겹침 → 캡처 동안 원복\n    const prev = { zoom: el.style.zoom, ml: el.style.marginLeft, mr: el.style.marginRight };\n    el.style.zoom = '1'; el.style.marginLeft = '0'; el.style.marginRight = '0';\n    const restore = () => { el.style.zoom = prev.zoom; el.style.marginLeft = prev.ml; el.style.marginRight = prev.mr; };\n    try {\n      const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });\n      restore();\n      const link = document.createElement('a');\n      link.download = name; link.href = canvas.toDataURL('image/png'); link.click();\n      this.setState({ dlStatus: '다운로드 완료 ✓' });\n    } catch(e){ restore(); this.setState({ dlStatus: '생성 실패 — 다시 시도해 주세요' }); }\n  }\n\n  goTo(id){\n    const el = document.getElementById(id);\n    if(el) window.scrollTo({ top: el.offsetTop - 24, behavior: 'smooth' });\n  }\n\n  renderVals(){\n    const s = this.state, P = this.PRICE;\n    const set = (patch) => () => this.setState(patch);\n    const step = (key, d, min, max) => () => this.setState(st => ({ [key]: Math.min(max ?? 99, Math.max(min ?? 0, (st[key]||0) + d)) }));\n    const c = this.computeCore(false);\n    const isFree = s.contractType === 'free';\n    const devicePay = isFree ? 'lump' : s.devicePay;\n\n    // allocation\n    let allocation = null, prepaidCount = 0;\n    if (devicePay === 'monthly' && c.totalSubsidyIncl > 0 && c.totalDevices > 0){\n      allocation = this.findOptimalAllocation(c.countA, c.countB, c.totalSubsidyIncl);\n      prepaidCount = allocation.a + allocation.b;\n    }\n    const deviceMonthlyEff = allocation ? allocation.remainingFee : (devicePay === 'monthly' ? c.deviceMonthlyExFull : 0);\n\n    // monthly lines\n    const lines = [];\n    if (devicePay === 'monthly'){\n      const label = allocation && prepaidCount > 0\n        ? `단말대금 월납 (잔여 ${c.totalDevices - prepaidCount}대 · ${prepaidCount}대 선납 처리)`\n        : '단말대금 (월납)';\n      lines.push({ label, ex: deviceMonthlyEff });\n    }\n    lines.push({ label: '서비스이용료 (월납)', ex: c.serviceMonthly });\n    if (c.readerMonthly > 0) lines.push({ label: `카드리더기 임대료 (${s.readerQty}대)`, ex: c.readerMonthly });\n    if (c.adDiscountMonthly > 0) lines.push({ label: '광고 수신동의 할인', ex: -c.adDiscountMonthly, minus: true });\n    if (c.mouDiscountMonthly > 0) lines.push({ label: `MOU 프랜차이즈 할인 (${s.mouTier==='tier30'?'30가맹점↑':'10가맹점↑'})`, ex: -c.mouDiscountMonthly, minus: true });\n    if (c.bundleDiscountMonthly > 0) lines.push({ label: '으랏차차 결합할인', ex: -c.bundleDiscountMonthly, minus: true });\n    if (s.ansim) lines.push({ label: `안심매입 (${c.totalDevices}대)`, ex: c.ansimMonthlyIncl/1.1 });\n    let monthlyEx = deviceMonthlyEff + c.serviceMonthly + c.readerMonthly - c.adDiscountMonthly - c.mouDiscountMonthly - c.bundleDiscountMonthly;\n    const monthlyIncl = monthlyEx*1.1 + c.ansimMonthlyIncl;\n    const monthlyExTrue = monthlyEx + c.ansimMonthlyIncl/1.1;\n    const monthlyLines = lines.map(l => ({\n      label: l.label,\n      exAnim: this.num(l.ex, v => (v < 0 ? '−' : '') + this.won(Math.abs(v))),\n      exText: (l.ex < 0 ? '−' : '') + this.won(Math.abs(l.ex)),\n      inclText: (l.ex < 0 ? '−' : '') + this.won(Math.abs(l.ex)*1.1),\n      c: l.minus ? '#fbbf24' : '#fff',\n      docC: l.minus ? '#c47c00' : '#15181d'\n    }));\n\n    // lump\n    let lumpIncl = 0;\n    if (devicePay === 'lump') lumpIncl = Math.max(c.deviceLumpInclFull - c.totalSubsidyIncl, 0);\n    const hasLump = lumpIncl > 0;\n\n    // pictogram — max 20 icon slots; long runs collapsed with a \"+N대\" gap marker\n    const buildPicto = (N, P) => {\n      const SLOT = 20, raw = [];\n      const pushIcon = (n, lit) => raw.push({ gap: false, n, lit });\n      const pushGap = (from, to, lit) => raw.push({ gap: true, skip: to - from + 1, lit });\n      if (N <= SLOT){ for (let i = 1; i <= N; i++) pushIcon(i, i <= P); }\n      else {\n        let litQ = Math.min(P, Math.max(P > 0 ? 2 : 0, Math.round(SLOT * P / N)));\n        let darkQ = SLOT - litQ;\n        if (N - P > 0 && darkQ < 2){ darkQ = 2; litQ = SLOT - 2; }\n        const seg = (start, end, quota, lit) => {\n          const cnt = end - start + 1;\n          if (cnt <= 0 || quota <= 0) return;\n          if (cnt <= quota){ for (let i = start; i <= end; i++) pushIcon(i, lit); }\n          else {\n            for (let i = start; i < start + quota - 1; i++ n    const view = s.quoteView ?? (this.props.defaultView ?? 'staff');\n    const isDesktop = !s.isMobile;\n\n    // rail\n    const sections = [\n      { id: 'sec-devices', label: '구성' }, { id: 'sec-terms', label: '조건' },\n      { id: 'sec-subsidy', label: '지원금' }, { id: 'sec-monthly', label: '월요금' },\n      { id: 'sec-compare', label: '비교' }, { id: 'sec-penalty', label: '위약금' },\n      { id: 'sec-quote', label: '견적서' }\n    ];\n    const activeIdx = Math.max(0, sections.findIndex(sec => sec.id === s.activeSection));\n    const railGapPx = s.isMobile ? 39 : 57;\n    const railItems = sections.map((sec, i) => {\n      const act = i === activeIdx;\n      const passed = i < activeIdx;\n      return {\n        label: sec.label,\n        n: i + 1,\n        numC: act ? '#ffffff' : (passed ? '#cfe6ff' : '#5a6270'),\n        dotBg: act ? '#4facfe' : (passed ? '#2f5f96' : '#0b1017'),\n        dotBd: act ? '3px solid #ffffff' : '2px solid ' + (passed ? 'rgba(124,196,255,0.75)' : 'rgba(255,255,255,0.3)'),\n        dotGlow: act ? '0 0 16px rgba(79,172,254,0.85)' : 'none',\n        sc: act ? 1.28 : 1,\n        go: () => this.goTo(sec.id)\n      };\n    });\n    const railFill = (activeIdx * (20 + railGapPx)) + 'px';\n\n    // discounts\n    const discountRows = [\n      { key: 'ansim', t: '하이오더 안심매입', hint: '대당 월 1,650원(VAT포함) · 최소 5대 이상', amt: c.ansimMonthlyIncl, on: s.ansim, isCost: true },\n      { key: 'adConsent', t: '테이블 광고 수신 동의', hint: '단말 1대당 월 556원 할인', amt: c.adDiscountMonthly, on: s.adConsent },\n      { key: 'bundle', t: '으랏차차 결합 (2종 이상)', hint: '고정 월 5,500원 할인 (VAT포함)', amt: c.bundleDiscountMonthly, on: s.bundle },\n      { key: 'mou', t: 'MOU체결 프랜차이즈', hint: isFree ? '3년 약정 한정 (무약정 시 미적용)' : '3년 약정 한정 · 등급 선택', amt: c.mouDiscountMonthly, on: s.mou, dim: isFree }\n    ].map(d => ({\n      t: d.t, hint: d.hint,\n      pillAnim: d.on && d.amt > 0 ? this.num(d.amt, v => (d.isCost ? '월 +' : '월 −') + this.won(Math.abs(v))) : null,\n      pill: d.on && d.amt > 0 ? (d.isC n      const base = PRODS.findIndex(p => p[0] === prodCode);\n      const dist = k => Math.min(Math.abs(k - idx16), N16 - Math.abs(k - idx16));\n      idx16 = dist(base) <= dist(base + 8) ? base : base + 8;\n    }\n    const prodDrag = s.prodDrag || 0;\n    const prodCards = Array.from({ length: N16 }, (_, i) => {\n      const [cd, col, mnt, sale] = PRODS[i % 8];\n      let off = ((i - idx16) % N16 + N16) % N16;\n      if (off > N16 / 2) off -= N16;\n      const ang = off * P_STEP + prodDrag;\n      const act = off === 0 && Math.abs(prodDrag) < P_STEP / 2;\n      const vis = Math.abs(ang) < 31;\n      const zi = 100 - Math.abs(Math.round((ang / P_STEP) * 10));\n      return {\n        img: this.pimg(cd),\n        name: '하이오더' + (mnt === '아일랜드' ? '2S' : '2') + ' ' + col + (sale === 'prepaid' ? ' 선불형' : ' 후불형'),\n        cap: '하이오더' + (mnt === '아일랜드' ? '2S' : '2') + ' · ' + col + (sale === 'prepaid' ? ' · 선불' : ''),\n        z: zi,\n        tf: 'rotate(' + ang.toFixed(2) + 'deg)',\n        tfi: 'scale(' + (1.07 - 0.085 * Math.min(Math.abs(ang) / P_STEP, 3)).toFixed(3) + ') translateY(' + (-9 + 8 * Math.min(Math.abs(ang) / P_STEP, 1)).toFixed(1) + 'px)',\n        fi: Math.abs(ang) / P_STEP >= 1.5 ? 'blur(1.1px) saturate(.85)' : 'none',\n        tr: s.prodDragging ? 'opacity .3s ease' : 'transform .65s cubic-bezier(.22,1,.36,1), opacity .35s ease',\n        tri: s.prodDragging ? 'filter .45s ease' : 'transform .65s cubic-bezier(.22,1,.36,1), border-color .3s ease, box-shadow .45s ease, filter .45s ease',\n        op: vis ? (act ? '1' : '0.88') : '0',\n        bd: act ? '2px solid #4facfe' : '1px solid rgba(255,255,255,0.12)',\n        glow: act ? '0 14px 30px rgba(0,0,0,0.5),0 0 26px rgba(79,172,254,0.35)' : '0 10px 22px rgba(0,0,0,0.4)',\n        tc: act ? '#dceafd' : '#8b93a1',\n        sel: () => { if (this._pdMoved) return; this.setState({ prodIdx16: i, menuColor: col, menuMount: mnt, saleType: sale, prodDrag: 0 }); }\n      };\n    });\n    const prodDown = e => {
