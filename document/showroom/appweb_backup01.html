<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KT Synergy Showroom - Test Page</title>
    <style>
        /* 패드 화면에 꽉 차게 디자인 (가로 모드 최적화) */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; /* 텍스트 드래그 방지 */
        }

        .container {
            text-align: center;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 80%;
        }

        h1 {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: 800;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* 테스트용 상호작용 버튼 */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #0284c7;
            color: white;
        }
        .btn-primary:active { background-color: #0369a1; transform: scale(0.95); }

        .btn-secondary {
            background-color: #334155;
            color: #cbd5e1;
        }
        .btn-secondary:active { background-color: #1e293b; transform: scale(0.95); }

        /* 상태 표시 태그 */
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background-color: #10b981;
            color: white;
            font-weight: bold;
            border-radius: 9999px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">✓ KIOSK MODE ACTIVE</div>
        <h1>KT Synergy 디지탈 쇼룸</h1>
        <p>본 페이지는 하이오더 전용 앱(v2.0) 구동 및 가두기 성능 검증용 테스트 페이지입니다.</p>
        
        <div class="btn-group">
            <button class="btn btn-primary" onclick="location.href='https://www.naver.com'">1. 외부 이동 테스트 (네이버)</button>
            <button class="btn btn-secondary" onclick="alert('웹뷰 자바스크립트가 정상 작동 중입니다!')">2. 터치 알림 테스트</button>
        </div>
    </div>

    <script>
        // 손님들이 화면을 확대/축소해서 레이아웃 깨지는 현상 방지 (더블 탭 줌 차단)
        document.addEventListener('touchmove', function (event) {
            if (event.scale !== 1) { event.preventDefault(); }
        }, { passive: false });
    </script>
</body>
</html>
