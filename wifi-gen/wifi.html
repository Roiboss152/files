<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>와이파이 안내</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#03C75A;--accent-d:#029447}
html,body{height:100%;font-family:'Apple SD Gothic Neo','Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:#0f0f0f;color:#f0f0f0;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px 20px 48px}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#ffffff08 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}
.card{position:relative;z-index:1;width:100%;max-width:360px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;overflow:hidden}
.header{background:#111;padding:24px 24px 20px;text-align:center;border-bottom:1px solid #222}
.wifi-icon{display:flex;justify-content:center;margin-bottom:12px}
.store-label{font-size:10px;letter-spacing:.18em;color:#555;text-transform:uppercase;margin-bottom:4px}
.store-name{font-size:21px;font-weight:700;color:#f0f0f0;letter-spacing:-.02em}
.body{padding:24px}
.reward-box{background:#111;border:1px solid #2a2a2a;border-radius:12px;padding:16px;margin-bottom:20px}
.reward-title{font-size:14px;font-weight:700;margin-bottom:8px}
.reward-msg{font-size:13px;color:#aaa;line-height:1.7;margin-bottom:10px}
.reward-example{font-size:11px;color:#555;line-height:1.6;padding-top:10px;border-top:1px solid #222}
.reward-example em{color:#03C75A;font-style:normal}
.guide-text{font-size:14px;line-height:1.75;color:#999;text-align:center;margin-bottom:20px}
.guide-text strong{color:#f0f0f0}
.steps{display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.step-num{width:30px;height:30px;border-radius:50%;border:1.5px solid #333;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#555;background:#111;transition:all .4s}
.step-num.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px #03C75A33}
.step-num.done{border-color:var(--accent);background:var(--accent);color:#fff}
.step-label{font-size:10px;color:#444;text-align:center;line-height:1.3;white-space:nowrap}
.step-label.active{color:#999}
.step-line{width:24px;height:1.5px;background:#222;margin-bottom:16px;flex-shrink:0;transition:background .4s}
.step-line.done{background:var(--accent)}
.naver-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;background:var(--accent);border:none;border-radius:12px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:-.01em;transition:background .2s,transform .15s;-webkit-tap-highlight-color:transparent;font-family:inherit}
.naver-btn:active{background:var(--accent-d);transform:scale(.98)}
.pw-box{margin-top:16px;background:#111;border:1px solid #2a2a2a;border-radius:12px;overflow:hidden;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;pointer-events:none}
.pw-box.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.pw-head{padding:9px 14px;background:#161616;border-bottom:1px solid #222;display:flex;align-items:center;gap:7px}
.pw-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px #03C75A66;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pw-title{font-size:10px;color:#444;letter-spacing:.1em;text-transform:uppercase}
.pw-body{padding:14px}
.pw-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.pw-row:last-child{margin-bottom:0}
.pw-key{font-size:11px;color:#444}
.pw-val{font-size:15px;font-weight:700;color:#f0f0f0;letter-spacing:.06em}
.pw-val.ssid{font-size:12px;color:#bbb}
.copy-btn{width:100%;margin-top:10px;padding:9px;background:transparent;border:1px solid #2a2a2a;border-radius:8px;font-size:12px;color:#555;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;-webkit-tap-highlight-color:transparent;font-family:inherit}
.copy-btn.copied{border-color:var(--accent);color:var(--accent)}
.footer-note{margin-top:16px;font-size:10px;color:#333;text-align:center;line-height:1.6}
.kt-credit{margin-top:6px;font-size:10px;color:#222;text-align:center}
.error-card{text-align:center;padding:40px 24px}
.error-card p{font-size:14px;color:#666;line-height:1.7}
@media(prefers-color-scheme:light){
  body{background:#f5f5f5}
  body::before{background-image:radial-gradient(circle,#00000008 1px,transparent 1px)}
  .card{background:#fff;border-color:#e8e8e8}
  .header{background:#fafafa;border-color:#eee}
  .store-label{color:#aaa}.store-name{color:#111}
  .guide-text{color:#888}.guide-text strong{color:#111}
  .reward-box{background:#fafafa;border-color:#eee}
  .step-num{background:#fafafa;border-color:#ddd;color:#aaa}
  .step-line{background:#e8e8e8}
  .pw-box{background:#fafafa;border-color:#eee}
  .pw-head{background:#f5f5f5;border-color:#eee}
  .pw-key{color:#aaa}.pw-val{color:#111}.pw-val.ssid{color:#555}
  .copy-btn{border-color:#e0e0e0;color:#aaa}
  .footer-note{color:#bbb}.kt-credit{color:#ddd}
}
</style>
</head>
<body>
<div class="card" id="card"></div>

<script>
/* URL 파라미터 파싱 */
const p = new URLSearchParams(location.search);
const CFG = {
  storeName : p.get('store') || '',
  ssid      : p.get('ssid')  || '',
  password  : p.get('pw')    || '',
  mode      : p.get('mode')  || 'basic',
  rewardMsg : p.get('reward')|| '',
  hiorder   : p.get('hiorder') === '1',
  hiorderEx : p.get('hiex')  || '',
};

/* 플레이스 URL — 매장명으로 네이버 지도 검색 */
const placeUrl = CFG.storeName
  ? 'https://map.naver.com/p/search/' + encodeURIComponent(CFG.storeName)
  : '';

const card = document.getElementById('card');

/* 필수 파라미터 없을 때 */
if (!CFG.storeName || !CFG.ssid || !CFG.password) {
  document.title = '잘못된 링크';
  card.innerHTML = '<div class="error-card"><p style="font-size:32px;margin-bottom:16px">⚠️</p><p>잘못된 링크입니다.<br>QR 코드를 다시 스캔해주세요.</p></div>';
} else {
  document.title = CFG.storeName + ' — 와이파이 안내';

  /* 혜택형 박스 */
  const rewardHtml = CFG.mode === 'reward' && CFG.rewardMsg ? `
    <div class="reward-box">
      <div class="reward-title">🎁 잠깐만요!</div>
      <div class="reward-msg">${nl(CFG.rewardMsg)}</div>
      ${CFG.hiorder && CFG.hiorderEx ? `<div class="reward-example">후기 예시: <em>"${esc(CFG.hiorderEx)}"</em><br><span>번호는 본인 테이블 번호로 바꿔주세요 😊</span></div>` : ''}
    </div>` : '';

  const guideText = CFG.mode === 'reward'
    ? '아래 버튼을 눌러 별점을 남겨주시면<br><strong>비밀번호를 확인하실 수 있어요 😊</strong>'
    : '아래 버튼을 누른 후<br><strong>네이버 플레이스</strong>에서 비밀번호를 확인하세요';

  const btnLabel = CFG.mode === 'reward'
    ? '플레이스에서 별점 남기기'
    : '네이버 플레이스에서 비밀번호 확인';

  const footerMsg = CFG.mode === 'reward'
    ? '리뷰 하나가 저희에게 큰 힘이 됩니다 🙏'
    : '와이파이를 즐겁게 이용해주세요 😊';

  card.innerHTML = `
    <div class="header">
      <div class="wifi-icon">
        <svg viewBox="0 0 48 48" fill="none" width="44" height="44">
          <path d="M24 36a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" fill="#03C75A"/>
          <path d="M14.5 27.5C17.1 24.8 20.4 23 24 23s6.9 1.8 9.5 4.5" stroke="#03C75A" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
          <path d="M7 20.5C11.5 15.8 17.4 13 24 13s12.5 2.8 17 7.5" stroke="#03C75A" stroke-width="2.5" stroke-linecap="round" opacity=".35"/>
        </svg>
      </div>
      <p class="store-label">Guest Wi-Fi</p>
      <p class="store-name" id="sname"></p>
    </div>
    <div class="body">
      ${rewardHtml}
      <p class="guide-text">${guideText}</p>
      <div class="steps">
        <div class="step"><div class="step-num active" id="s1">1</div><div class="step-label active">플레이스<br>방문</div></div>
        <div class="step-line" id="l1"></div>
        <div class="step"><div class="step-num" id="s2">2</div><div class="step-label">비밀번호<br>확인</div></div>
        <div class="step-line" id="l2"></div>
        <div class="step"><div class="step-num" id="s3">3</div><div class="step-label">와이파이<br>접속</div></div>
      </div>
      <button class="naver-btn" id="naverBtn" onclick="go()">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
          <path d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z" fill="white"/>
        </svg>
        <span id="btnLabel"></span>
      </button>
      <div class="pw-box" id="pwBox">
        <div class="pw-head"><div class="pw-dot"></div><span class="pw-title">Wi-Fi 접속 정보</span></div>
        <div class="pw-body">
          <div class="pw-row"><span class="pw-key">네트워크</span><span class="pw-val ssid" id="ssidEl"></span></div>
          <div class="pw-row"><span class="pw-key">비밀번호</span><span class="pw-val" id="pwEl"></span></div>
          <button class="copy-btn" id="cpBtn" onclick="cp()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2"/>
            </svg>
            비밀번호 복사
          </button>
        </div>
      </div>
      <p class="footer-note" id="footerNote"></p>
      <p class="kt-credit">Powered by KT 인천지사 시너지영업3팀</p>
    </div>`;

  /* XSS 방지: textContent로 삽입 */
  document.getElementById('sname').textContent    = CFG.storeName;
  document.getElementById('ssidEl').textContent   = CFG.ssid;
  document.getElementById('pwEl').textContent     = CFG.password;
  document.getElementById('btnLabel').textContent = btnLabel;
  document.getElementById('footerNote').textContent = footerMsg;
}

let done = false;

function go() {
  if (done) return; done = true;
  const btn = document.getElementById('naverBtn');
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 열림 — 비밀번호 확인하세요';
  btn.style.background = '#029447';
  const s1=document.getElementById('s1'), l1=document.getElementById('l1'), s2=document.getElementById('s2');
  if(s1){s1.className='step-num done';s1.textContent='✓';}
  if(l1) l1.className='step-line done';
  if(s2) s2.className='step-num active';
  const box=document.getElementById('pwBox');
  if(box) box.classList.add('visible');
  if(placeUrl){
    const a=document.createElement('a');
    a.href=placeUrl;a.target='_blank';a.rel='noopener noreferrer';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }
  setTimeout(function(){
    const s2b=document.getElementById('s2'),l2=document.getElementById('l2'),s3=document.getElementById('s3');
    if(s2b){s2b.className='step-num done';s2b.textContent='✓';}
    if(l2) l2.className='step-line done';
    if(s3) s3.className='step-num active';
  },2000);
}

function cp(){
  const btn=document.getElementById('cpBtn');
  navigator.clipboard.writeText(CFG.password).then(function(){
    btn.textContent='✓ 복사됨';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='비밀번호 복사';btn.classList.remove('copied');},2500);
  }).catch(function(){
    const el=document.getElementById('pwEl');
    if(!el)return;
    const r=document.createRange();r.selectNode(el);
    window.getSelection().removeAllRanges();window.getSelection().addRange(r);
  });
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
</script>
</body>
</html>
