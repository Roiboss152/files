<title>KT 설명회 QR코드</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f5f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.1);
  }
  .kt-ci {
    margin-bottom: 20px;
  }
  .kt-ci img {
    height: 56px;
    width: auto;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    color: #0a0a0a;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 13px;
    color: #6e6e73;
    margin-bottom: 32px;
    font-weight: 300;
  }
  .qr-wrap {
    display: inline-block;
    padding: 16px;
    border: 2.5px solid #e60012;
    border-radius: 16px;
    margin-bottom: 28px;
  }
  .qr-wrap img {
    width: 200px;
    height: 200px;
    display: block;
  }
  .info {
    font-size: 14px;
    color: #444;
    line-height: 2;
    margin-bottom: 24px;
    text-align: left;
    display: inline-block;
  }
  .info strong { color: #0a0a0a; font-weight: 700; }
  .divider {
    height: 1px;
    background: #f0f0f0;
    margin: 20px 0;
  }
  .url {
    font-size: 11px;
    color: #aaa;
    word-break: break-all;
    margin-bottom: 20px;
  }
  .download-btn {
    display: inline-block;
    background: #e60012;
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s;
    text-decoration: none;
  }
  .download-btn:hover { opacity: 0.85; }
</style>
