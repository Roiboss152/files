  <text class=\"wf-node-title\" x=\"80\" y=\"145\" text-anchor=\"middle\" font-size=\"12\">맞춤형 QR 솔루션<\u002Ftext>\n                                    <text class=\"wf-node-sub\" x=\"80\" y=\"162\" text-anchor=\"middle\" font-size=\"10\">Wi-Fi · 프랜차이즈<\u002Ftext>\n                                <\u002Fg>\n                                <g class=\"wf-node\">\n                                    <rect x=\"520\" y=\"125\" width=\"160\" height=\"50\" rx=\"8\" stroke-width=\"0.5\"><\u002Frect>\n                                    <text class=\"wf-node-title\" x=\"600\" y=\"145\" text-anchor=\"middle\" font-size=\"12\">창업설명회 영상<\u002Ftext>\n                                    <text class=\"wf-node-sub\" x=\"600\" y=\"162\" text-anchor=\"middle\" font-size=\"10\">대리점 모집<\u002Ftext>\n                                <\u002Fg>\n                                <g class=\"wf-node\">\n                                    <rect x=\"60\" y=\"215\" width=\"180\" height=\"50\" rx=\"8\" stroke-width=\"0.5\"><\u002Frect>\n                                    <text class=\"wf-node-title\" x=\"150\" y=\"235\" text-anchor=\"middle\" font-size=\"12\">하이오더 쇼룸 페이지<\u002Ftext>\n                                    <text class=\"wf-node-sub\" x=\"150\" y=\"252\" text-anchor=\"middle\" font-size=\"10\">무인 상시 홍보<\u002Ftext>\n                                <\u002Fg>\n                                <g class=\"wf-node\">\n                                    <rect x=\"440\" y=\"215\" width=\"180\" height=\"50\" rx=\"8\" stroke-width=\"0.5\"><\u002Frect>\n                                    <text class=\"wf-node-title\" x=\"530\" y=\"235\" text-anchor=\"middle\" font-size=\"12\">세일즈 에셋 라이브러리<\u002Ftext>\n                                    <text class=\"wf-node-sub\" x=\"530\" y=\"252\" text-anchor=\"middle\" font-size=\"10\">이미지·영상 자산<\u002Ftext>\n                                <\u002Fg>\n                            <\u002Fsvg>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Farticle>\n\n                <!-- Workflow 03 · 프랜차이즈 QR 자동 확산 -->\n                <article class=\"workflow-card\">\n                    <aside class=\"workflow-side\">\n                        <div class=\"workflow-num\">03<\u002Fdiv>\n                        <div class=\"workflow-tag\">Automation<\u002Fdiv>\n                    <\u002Faside>\n                    <div class=\"workflow-body\">\n                        <h4 class=\"workflow-title\">브랜드별 수작업 대응을 자동 확산 시스템으로 — 프랜차이즈 QR 자동 생성 구조<\u002Fh4>\n                        <p class=\"workflow-caption\">\n                            브랜드 하나, 디자인 하나, 가맹점마다 다른 QR. 브랜드별 CI가 자동 적용된 Wi-Fi QR을 정보 입력만으로 즉시 생성합니다.\n                        <\u002Fp>\n                        <div class=\"workflow-svg-wrap\">\n                            <svg viewBox=\"0 0 680 230\" role=\"img\" aria-labelledby=\"wf3-title wf3-desc\">\n                                <title id=\"wf3-title\">프랜차이즈 QR 자동 생성 및 확산<\u002Ftitle>\n                                <desc id=\"wf3-desc\">가맹점 정보 입력에서 시작해 자동 QR 생성을 거쳐 매장 배포로 이어지는 흐름<\u002Fdesc>\n                                <defs>\n                                    <marker id=\"wf3-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n                                        <path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#4facfe\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n                                    <\u002Fmarker>\n                                <\u002Fdefs>\n\n                                <!-- Before 스트립 -->\n                                <g class=\"wf-strip-before\">\n                                    <rect x=\"40\" y=\"20\" width=\"600\" height=\"30\" rx=\"6\" stroke-width=\"0.5\"><\u002Frect>\n                                    <text x=\"340\" y=\"35\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"12\">Before · 브랜드별 개별 QR 수작업 제작 · 관리자 1인 의존<\u002Ftext>\n                                <\u002Fg>\n\n                                <!-- 3단계 -->\n                                <g class=\"wf-node\">\n                                    <rect x=\"60\" y=\"80\" width=\"160\" height=\"90\" rx=\"8\" stroke-width=\"0.5\"><\u002Frect>\n                                    <text class=\"wf-node-num\" x=\"140\" y=\"100\" text-anchor=\"middle\" dominant-baseline=\"central\">INPUT<\u002Ftext>\n                                    <text class=\"wf-node-title\" x=\"140\" y=\"125\" text-anchor=\"middle\" dominant-baseline=\"central\">가맹점 정보 입력<\u002Ftext>\n                                    <text class=\"wf-node-sub\" x=\"140\" y=\"145\" text-anchor=\"middle\" dominant-baseline=\"central\">브랜드·WiFi 정보<\u002Ftext>\n                                <\u002Fg>\n                                <line class=\"wf-arrow\" x1=\"222\" y1=\"125\" x2=\"258\" y2=\"125\" marker-end=\"url(#wf3-arrow)\"><\u002Fline>\n\n                                <g class=\"wf-node\">\n                                    <rect x=\"260\" y=\"80\" width=\"160\" height=\"90\" rx=\"8\" stroke-width=\"0.5\"><\u002Frect>\n                                    <text class=\"wf-node-num\" x=\"340\" y=\"100\" text-anchor=\"middle\" dominant-baseline=\"central\">PROCESS<\u002Ftext>\n                                    <text class=\"wf-node-title\" x=\"340\" y=\"125\" text-anchor=\"middle\" dominant-baseline=\"central\">브랜드 맞춤 QR 자동 생성<\u002Ftext>\n                                    <text class=\"wf-node-sub\" x=\"340\" y=\"145\" text-anchor=\"middle\" dominant-baseline=\"central\">9개 브랜드 CI 자동 적용<\u002Ftext>\n                                <\u002Fg>\n                                <line class=\"wf-arrow\" x1=\"422\" y1=\"125\" x2=\"458\" y2=\"125\" marker-end=\"url(#wf3-arrow)\"><\u002Fline>\n\n                                <g class=\"wf-node\">\n                                    <rect x=\"460\" y=\"80\" width=\"160\" height=\"90\" rx=\"8\" stroke-width=\"0.5\"><\u002Frect>\n                                    <text class=\"wf-node-num\" x=\"540\" y=\"100\" text-anchor=\"middle\" dominant-baseline=\"central\">OUTPUT<\u002Ftext>\n                                    <text class=\"wf-node-title\" x=\"540\" y=\"125\" text-anchor=\"middle\" dominant-baseline=\"central\">매장 즉시 배포<\u002Ftext>\n                                    <text class=\"wf-node-sub\" x=\"540\" y=\"145\" text-anchor=\"middle\" dominant-baseline=\"central\">현장 영업 · 타 채널 확산<\u002Ftext>\n                                <\u002Fg>\n\n                                <!-- After 스트립 -->\n                                <g class=\"wf-strip-after\">\n                                    <rect x=\"40\" y=\"190\" width=\"600\" height=\"30\" rx=\"6\" stroke-width=\"0.5\"><\u002Frect>\n                                    <text x=\"340\" y=\"205\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"12\">After · 시스템이 확산을 지속 · 개인 노하우가 조직 자산으로 전환<\u002Ftext>\n                                <\u002Fg>\n                            <\u002Fsvg>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Farticle>\n            <\u002Fsection>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 이미지 팝업 모달 -->\n    <div class=\"img-modal\" id=\"img-modal\" onclick=\"closeImgModal(event)\">\n        <div class=\"img-modal-backdrop\"><\u002Fdiv>\n        <div class=\"img-modal-body\" onclick=\"event.stopPropagation()\">\n            <button class=\"img-modal-close\" onclick=\"closeImgModal()\">×<\u002Fbutton>\n            <div class=\"img-modal-img-wrap\">\n                <img id=\"img-modal-img\" src=\"\" alt=\"\">\n                <div class=\"img-modal-overlay-text\" id=\"img-modal-overlay\"><\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <script>\n        if ('scrollRestoration' in history) {\n            history.scrollRestoration = 'manual';\n        }\n        window.scrollTo(0, 0);\n\n        /* [v1.38c] 번들/지연 로드 환경에서 DOMContentLoaded가 이미 지나간 경우에도\n           히어로가 초기화되도록 즉시 실행 가능한 함수로 변경 */\n        const __initHero = () => {\n            const canvas = document.getElementById('webgl-canvas');\n            const introTextWrapper = document.getElementById('intro-text');\n            const mainTitleEl = document.querySelector('.main-title');\n            const subTitleEl = document.querySelector('.sub-title');\n            const uiLayer = document.getElementById('ui-layer');\n            const satOrbit = document.getElementById('sat-orbit'); // [v1.36]\n            /* [v1.40] 입체 궤도 상태 */\n            const satEls = satOrbit ? Array.prototype.slice.call(satOrbit.querySelectorAll('.sat')) : [];\n            const satRing = document.getElementById('sat-ring');\n            const satHalo = document.getElementById('sat-halo');\n            const SAT_TILT = 28 * Math.PI / 180;  // 10시-4시 방향 기울기\n            const SAT_FLAT = 0.34;                // 궤도 납작(입체) 비율\n            const SAT_R = 175;                    // 기준 궤도 반경(px, gs 배율 적용)\n            const SAT_SPEED = 360 / 30;           // 초당 회전 각도\n            const satReduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n            let satAngle = 0, satLastTs = null, satHoverPause = false;\n            satEls.forEach(el => {\n                el.addEventListener('pointerenter', () => { satHoverPause = true; });\n                el.addEventListener('pointerleave', () => { satHoverPause = false; });\n            });\n            /* [v1.42] 스와이프로 궤도 앞뒤 회전: 가로 위주 드래그만 반응(세로=스크롤 양보).\n               스와이프 중·직후 2초간 자동 회전 정지, 이후 재개 */\n            let satPauseUntil = 0;\n            let satDragging = false, satDragX = 0, satDragY = 0, satDragMoved = false;\n            window.addEventListener('pointerdown', (e) => {\n                if (!satOrbit || !satOrbit.classList.contains('sat-visible')) return;\n                satDragging = true; satDragMoved = false;\n                satDragX = e.clientX; satDragY = e.clientY;\n            }, { passive: true });\n            window.addEventListener('pointermove', (e) => {\n                if (!satDragging) return;\n                const dx = e.clientX - satDragX, dy = e.clientY - satDragY;\n                satDragX = e.clientX; satDragY = e.clientY;\n                if (Math.abs(dx) < Math.abs(dy) * 0.7) return;\n                satAngle += dx * 0.35;\n                satDragMoved = true;\n                satPauseUntil = performance.now() + 2000;\n            }, { passive: true });\n            const satDragEnd = () => {\n                if (satDragging && satDragMoved) satPauseUntil = performance.now() + 2000;\n                satDragging = false;\n            };\n            window.addEventListener('pointerup', satDragEnd, { passive: true });\n            window.addEventListener('pointercancel', satDragEnd, { passive: true });\n            const body = document.body;\n            \n            window.scrollTo(0, 0);\n\n            const scene = new THREE.Scene();\n            const fogNear = 1000;\n            const fogFar = 7000; \n            scene.fog = new THREE.Fog(0x020202, fogNear, fogFar);\n\n            const isMobile = window.innerWidth <= 768;\n            const fov = isMobile ? 75 : 50; \n            const camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.1, 15000);\n            \n            camera.position.set(0, 280, 0); \n            camera.rotation.set(-0.523, 0, 0);\n\n            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });\n            renderer.setSize(window.innerWidth, window.innerHeight);\n            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n\n            function getTrackX(z) {\n                return Math.sin(z * 0.0025) * 350 + Math.cos(z * 0.001) * 100;\n            }\n\n            const points = [];\n            for (let z = -8000; z <= 2000; z += 50) {\n                points.push(new THREE.Vector3(getTrackX(z), 0, z));\n            }\n            const curve = new THREE.CatmullRomCurve3(points);\n            const tubeGeo = new THREE.TubeGeometry(curve, 1500, 1.2, 12, false);\n\n            const shaderMat = new THREE.ShaderMaterial({\n                uniforms: { uTrainZ: { value: 0.0 } },\n                vertexShader: `\n                    varying vec3 vWorldPos;\n                    void main() {\n                        vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;\n                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n                    }\n                `,\n                fragmentShader: `\n                    uniform float uTrainZ;\n                    varying vec3 vWorldPos;\n                    void main() {\n                        vec3 trackColor = vec3(0.05, 0.1, 0.2);\n                        float glow = 0.0;\n                        if (vWorldPos.z <= uTrainZ) {\n                            float dist = uTrainZ - vWorldPos.z; \n                            glow = 1.0 - smoothstep(0.0, 3000.0, dist);\n                            float coreGlow = 1.0 - smoothstep(0.0, 150.0, dist);\n                            trackColor = mix(trackColor, vec3(0.2, 0.6, 1.0), glow);\n                            trackColor = mix(trackColor, vec3(1.0, 1.0, 1.0), coreGlow);\n                        }\n                        gl_FragColor = vec4(trackColor, max(0.3, glow));\n                    }\n                `,\n                transparent: true,\n                side: THREE.DoubleSide\n            });\n\n            const track = new THREE.Mesh(tubeGeo, shaderMat);\n\n            const trainGeo = new THREE.SphereGeometry(4, 16, 16); \n            const trainMat = new THREE.MeshBasicMaterial({ color: 0xffffff });\n            const train = new THREE.Mesh(trainGeo, trainMat);\n            \n            const auraGeo = new THREE.SphereGeometry(14, 16, 16);\n            const auraMat = new THREE.MeshBasicMaterial({ color: 0x4facfe, transparent: true, opacity: 0.5 });\n            const trainAura = new THREE.Mesh(auraGeo, auraMat);\n            train.add(trainAura);\n\n            const worldGroup = new THREE.Group();\n            worldGroup.add(track);\n            worldGroup.add(train);\n            scene.add(worldGroup);\n\n            /* [v1.37] 분리형 SKIP 오브: 인트로 종료 시 원에서 분리되어\n               궤도를 따라 앞으로 전진하는 작은 구체 + 화면 투영 칩 */\n            const skipOrb = new THREE.Mesh(\n                new THREE.SphereGeometry(2.2, 16, 16),\n                new THREE.MeshBasicMaterial({ color: 0xffffff })\n            );\n            const skipOrbAura = new THREE.Mesh(\n                new THREE.SphereGeometry(7, 16, 16),\n                new THREE.MeshBasicMaterial({ color: 0x4facfe, transparent: true, opacity: 0.45 })\n            );\n            skipOrb.add(skipOrbAura);\n            skipOrb.visible = false;\n            worldGroup.add(skipOrb);\n            const skipOrbEl = document.getElementById('skip-orb-btn');\n            let skipOrbT0 = null;          // 분리 애니 시작 시각\n            let skipOrbFromZ = 0;          // [v1.39] 분리 시점의 기차 z(멈추기 직전 분리)\n            const SKIP_ORB_TRAVEL = 190;   // 궤도를 따라 전진하는 거리 (화면 하단 이탈 방지)\n            const SKIP_ORB_DUR = 1700;     // 분리 이동 시간(ms)\n\n            // 3단계로 축소 (원본 5단계에서 4,5 제거, z값 재분배)\n            const signpostsData = [\n                { id: 1, z: -5000, side: 'left',   title: \"KT 인천지사 시너지영업3팀은\", desc: \"파트너의 DX 세일즈를 함께 완성합니다.\" },\n                { id: 2, z: -3000, side: 'right',  title: \"현장 중심의 강력한 Co-Selling\", desc: \"하이오더 VR과 로봇 PoC로 현장에서 파트너와 실질적인 성공을 만듭니다.\" },\n                { id: 3, z: -1000, side: 'left',   title: \"맞춤형 세일즈 에셋 & 콘텐츠\", desc: \"홍보 영상·브로슈어 등 영업력을 높일 트렌디한 마케팅 자료를 제공합니다.\" }\n            ];\n\n            const signpostElements = [];\n            signpostsData.forEach(data => {\n                const wrapper = document.createElement('div');\n                wrapper.className = `checkpoint-wrapper`;\n                wrapper.innerHTML = `\n                    <div class=\"step-num\">${data.id}<\u002Fdiv>\n                    <div class=\"checkpoint-inner\">\n                        <h2>${data.title}<\u002Fh2>\n                        <p>${data.desc}<\u002Fp>\n                    <\u002Fdiv>\n                `;\n                uiLayer.appendChild(wrapper);\n\n                data.vec3 = new THREE.Vector3(getTrackX(data.z), 0, data.z);\n                data.el = wrapper;\n                data.side = data.side;\n                signpostElements.push(data);\n            });\n\n            let isIntroComplete = false;\n            let introProgress = 0; \n            const initialDroneZ = -6000;\n            const introStartTrainZ = -8000; \n            const introEndTrainZ = initialDroneZ - 450; \n\n            let scrollProgress = 0;\n            let targetScroll = 0;\n\n            // ─────────────────────────────────────────────────────────\n            // 슬로우모션 워프 테이블 v2 (강화판)\n            // 각 signpost 활성화 지점에서 카메라 이동을 최대 ~10배 감속.\n            // 사이 구간은 상대적으로 빠르게 지나가서 대비감이 뚜렷하게 느껴짐.\n            // signpost가 3개(z: -5000/-3000/-1000)이고 camera range가 7000이므로\n            // 각 cp의 timelineProgress = (sp.z + 450 - initialDroneZ) / 7000\n            //   → 대략 0.207, 0.493, 0.779\n            // ─────────────────────────────────────────────────────────\n            const CAMERA_Z_RANGE = 7000;      // -6000 → +1000\n            const CAMERA_Z_START = initialDroneZ; // -6000\n            const WARP_SAMPLES   = 1024;\n            const warpTable      = new Float32Array(WARP_SAMPLES);\n\n            const SLOW_HALF_WIDTH = 0.13;   // 슬로우존 반경 (넓힐수록 더 오래 느림)\n            const SLOW_FACTOR     = 0.10;   // 중심 속도 배율 (낮출수록 강한 감속: 0.10 = 10배)\n\n            (function buildWarpTable() {\n                const cpCenters = signpostsData.map(sp =>\n                    (sp.z + 450 - CAMERA_Z_START) / CAMERA_Z_RANGE\n                );\n\n                const velocities = new Float32Array(WARP_SAMPLES);\n                for (let i = 0; i < WARP_SAMPLES; i++) {\n                    const t = i / (WARP_SAMPLES - 1);\n                    let v = 1.0;\n                    for (const cp of cpCenters) {\n                        const dist = Math.abs(t - cp);\n                        if (dist < SLOW_HALF_WIDTH) {\n                            // 코사인 벨: 가장자리 0, 중심 1\n                            const bell = 0.5 * (1 + Math.cos(Math.PI * dist / SLOW_HALF_WIDTH));\n                            // 벨 크기만큼 속도를 SLOW_FACTOR 쪽으로 끌어당김\n                            v *= (1 - bell * (1 - SLOW_FACTOR));\n                        }\n                    }\n                    velocities[i] = v;\n                }\n\n                // 누적합 → 정규화 (전체 0..1 유지)\n                let cum = 0;\n                for (let i = 0; i < WARP_SAMPLES; i++) {\n                    cum += velocities[i];\n                    warpTable[i] = cum;\n                }\n                const total = warpTable[WARP_SAMPLES - 1];\n                for (let i = 0; i < WARP_SAMPLES; i++) warpTable[i] /= total;\n            })();\n\n            function applyScrollWarp(rawT) {\n                if (rawT <= 0) return 0;\n                if (rawT >= 1) return 1;\n                const idx  = rawT * (WARP_SAMPLES - 1);\n                const i0   = Math.floor(idx);\n                const i1   = Math.min(i0 + 1, WARP_SAMPLES - 1);\n                const frac = idx - i0;\n                return warpTable[i0] * (1 - frac) + warpTable[i1] * frac;\n            }\n\n            // ─────────────────────────────────────────────────────────\n            // Signpost 활성화 순간 1초 완전 정지 로직\n            // 각 signpost가 처음으로 활성화되는 프레임에서 카메라와 스크롤을\n            // 완전히 얼려서 사용자가 확실히 텍스트를 읽을 수 있게 함.\n            // ─────────────────────────────────────────────────────────\n            const FREEZE_DURATION_MS = 1000;\n            let   freezeUntilTime    = 0;\n            let   freezeScrollY      = null;\n                  sp.el.classList.add('active'); \n                            baseOpacity = 1 - (dist / 8000); \n                            if (baseOpacity < 0.35) baseOpacity = 0.35; \n                        } else {\n                            sp.el.classList.remove('active'); \n                        }\n                        \n                        sp.el.style.opacity = outroProgress > 0 ? baseOpacity * (1 - outroProgress) : baseOpacity;\n                    }\n                });\n\n                renderer.render(scene, camera);\n            }\n            animate();\n\n            window.addEventListener('resize', () => {\n                const newIsMobile = window.innerWidth <= 768;\n                camera.fov = newIsMobile ? 75 : 50;\n                camera.aspect = window.innerWidth / window.innerHeight;\n                camera.updateProjectionMatrix();\n                renderer.setSize(window.innerWidth, window.innerHeight);\n            });\n        };\n        if (document.readyState === 'loading') {\n            document.addEventListener('DOMContentLoaded', __initHero);\n        } else {\n            __initHero();\n        }\n    <\u002Fscript>\n\n    <script>\n    window.__skipForce = false;\n    window.__skipDone  = false;\n    /* [v1.23] skip 재작성 — '검은 화면 멈춤' 버그 수정\n       기존: ① 자체 스크롤로 timeline 끝까지 → ② scrollIntoView(smooth)로 하단\n       섹션 이동 → ③ 600ms 후 잠금 해제. 느린 기기에서 ②가 ③보다 늦게 끝나면\n       해제 직후 서명판 freeze가 뒤늦게 발동, 매 프레임 스크롤을 되돌려\n       아웃트로 검은 구간에 고정되는 경합이 있었음.\n       개선: 목적지(하단 섹션 상단)까지 자체 rAF로 '한 번에' 이동하고,\n       도착을 확인한 다음 프레임에 잠금 해제 → 해제 시점 경합 원천 차단. */\n    function skipToBottom() {\n        if (window.__skipForce) return; // 연타 가드\n        window.__skipForce = true;\n        window.__skipDone  = true;\n        document.body.classList.remove('locked');\n        var introEl = document.getElementById('intro-text');\n        if (introEl) introEl.style.opacity = '0';\n        var next = document.querySelector('.next-page-section');\n        if (!next) { window.scrollTo(0, document.body.scrollHeight); window.__skipForce = false; return; }\n        var startY = window.scrollY;\n        var endY = next.offsetTop; // 목적지: 하단 섹션 상단\n        var dur = 1100, t0 = null;\n        function ease(t) { return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }\n        function step(ts) {\n            if (!window.__skipForce) return; // [v1.30] 리셋(__resetJourney) 시 skip 즉시 중단\n            if (!t0) t0 = ts;\n            var p = Math.min((ts - t0) / dur, 1);\n            window.scrollTo(0, Math.round(startY + (endY - startY) * ease(p)));\n            if (p < 1) {\n                requestAnimationFrame(step);\n            } else {\n                // 도착 프레임 이후에 잠금 해제\n                requestAnimationFrame(function () {\n                    window.__skipForce = false;\n                    // [v1.27] skip으로 하단 도달 시에도 편도 잠금 확실히 발동\n                    if (window.__lockJourney) window.__lockJourney();\n                });\n            }\n        }\n        requestAnimationFrame(step);\n    }\n\n    /* ── [v1.30] 헤더 로고(KT CI) 클릭 → 첫 페이지(히어로) 복귀 ──\n       [v1.31] 하이브리드: 평소 클릭은 깜빡임 없는 __resetJourney,\n       href는 실제 주소(kt-synergy.com)라 JS 실패 시에도 홈 링크로 동작,\n       Cmd/Ctrl/Shift+클릭(새 탭 열기)은 브라우저 기본 동작을 존중. */\n    function goHero(e) {\n        if (e && (e.metaKey || e.ctrlKey || e.shiftKey)) return true; // 새 탭 열기 허용\n        if (e) e.preventDefault();\n        if (window.__resetJourney) { window.__resetJourney(); }\n        else { window.location.href = 'https://kt-synergy.com/'; }\n        return false;\n    }\n    <\u002Fscript>\n\n    <script>\n    // 이미지 팝업 모달\n    function openImgModal(src, overlayText) {\n        const modal = document.getElementById('img-modal');\n        const img = document.getElementById('img-modal-img');\n        const overlay = document.getElementById('img-modal-overlay');\n        img.src = src;\n        overlay.textContent = overlayText || '';\n        overlay.style.display = overlayText ? 'block' : 'none';\n        modal.classList.add('open');\n        document.body.style.overflow = 'hidden';\n    }\n    function closeImgModal(e) {\n        if (e && e.target && e.target.closest('.img-modal-body') && !e.target.classList.contains('img-modal-close')) return;\n        const modal = document.getElementById('img-modal');\n        modal.classList.remove('open');\n        document.body.style.overflow = '';\n    }\n    document.addEventListener('keydown', function(e) {\n        if (e.key === 'Escape') closeImgModal();\n    });\n    <\u002Fscript>\n\n    <!-- ═══════════════════════════════════════════════════════════\n         ✨ v1.11 애니메이션 로직\n         - Reveal / Text Split / Number Count-up / SVG Draw / Parallax\n         ═══════════════════════════════════════════════════════════ -->\n    <script>\n    (function initSectionAnimations() {\n        // 접근성: 모션 최소화 사용자에게는 애니메이션 발동 안 함\n        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n        if (reduceMotion) return;\n\n        /* [v1.35] 등장 전환 종료 후 blur 필터·will-change 레이어 해제 헬퍼.\n           filter:blur()와 will-change는 전환이 끝나도 요소를 GPU 레이어로\n           계속 승격시켜 두는데, Edge에서는 이 잔류 필터 레이어가 이전 프레임\n           글리프를 남겨 새 글리프와 겹쳐 보이는 고스팅(제목 겹침)의 원인이 됨.\n           모든 등장 애니는 1회성(io.unobserve)이므로 종료 즉시 해제해도 무방하며,\n           페이지 전체의 상시 GPU 레이어 수도 크게 줄어듦(저사양 기기 이득). */\n        function releaseAfterTransition(el) {\n            el.addEventListener('transitionend', function onEnd(e) {\n                /* 자식(split-word)의 transitionend가 버블링되어 부모(h2) 필터를\n                   전환 도중 강제 해제하지 않도록 target·속성을 정확히 가드 */\n                if (e.target !== el || e.propertyName !== 'filter') return;\n                el.style.filter = 'none';\n                el.style.willChange = 'auto';\n                el.removeEventListener('transitionend', onEnd);\n            });\n        }\n\n        // ─── [1] Reveal 대상 자동 클래스 부여 ───\n        const revealSelectors = [\n            '.next-content h2',\n            '.next-content > p',\n            '.metrics-strip',\n            '.workflow-section-header',\n            '.workflow-card'\n        ];\n        revealSelectors.forEach(sel => {\n            document.querySelectorAll(sel).forEach(el => {\n                el.classList.add('reveal');\n                releaseAfterTransition(el); // [v1.35]\n            });\n        });\n        // 6개 카드는 그리드 안에서 순차 딜레이 (delay-1 ~ delay-6)\n        document.querySelectorAll('.card-wrap').forEach((el, i) => {\n            el.classList.add('reveal');\n            el.classList.add('delay-' + (((i) % 6) + 1));\n            releaseAfterTransition(el); // [v1.35]\n        });\n\n        // ─── [2] Text Split — 단어 단위 span 분할 ───\n        document.querySelectorAll('.split-target').forEach(el => {\n            const raw = el.textContent;\n            // 이미 분할되었으면 skip\n            if (el.querySelector('.split-word')) return;\n            const parts = raw.split(/(\\s+)/); // 공백 유지\n            el.textContent = '';\n            let wordIndex = 0;\n            parts.forEach(part => {\n                if (/^\\s+$/.test(part)) {\n                    el.appendChild(document.createTextNode(part));\n                } else if (part.length > 0) {\n                    const span = document.createElement('span');\n                    span.className = 'split-word';\n                    span.textContent = part;\n                    span.style.transitionDelay = (wordIndex * 0.05) + 's';\n                    releaseAfterTransition(span); // [v1.35] 등장 후 blur 레이어 해제\n                    el.appendChild(span);\n                    wordIndex++;\n                }\n            });\n        });\n\n        // ─── [3] Number Count-up 유틸 ───\n        function startCountUp(el) {\n            if (el.dataset.counted === '1') return;\n            el.dataset.counted = '1';\n            const target = parseInt(el.dataset.target, 10);\n            const start  = parseInt(el.dataset.start || '0', 10);\n            const duration = 3200; // ms [v1.20] 카운트업 속도 50% 감속(1600→3200): 스크롤 통과 시에도 효과 인지 가능하도록\n            const startTime = performance.now();\n\n            function tick(now) {\n                const t = Math.min((now - startTime) / duration, 1);\n                const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic\n                const val = Math.round(start + (target - start) * eased);\n                el.textContent = val;\n                if (t < 1) requestAnimationFrame(tick);\n                else el.textContent = target;\n            }\n            // 시작 시점 초기값 표시\n            el.textContent = start;\n            requestAnimationFrame(tick);\n        }\n\n        // ─── [4] IntersectionObserver — 뷰포트 진입 시 애니 발동 ───\n        const io = new IntersectionObserver((entries) => {\n            entries.forEach(entry => {\n                if (!entry.isIntersecting) return;\n                const el = entry.target;\n\n                // Reveal\n                if (el.classList.contains('reveal')) {\n                    el.classList.add('is-visible');\n                }\n                // Text split (부모에 클래스 부여)\n                if (el.classList.contains('split-target')) {\n                    el.classList.add('split-visible');\n                }\n                // Count up (metrics-strip 진입 시 내부 num-target 모두 시작)\n                if (el.classList.contains('metrics-strip')) {\n                    el.querySelectorAll('.num-target').forEach(startCountUp);\n                }\n                // SVG draw — 노드와 화살표에 순차 딜레이 부여 후 is-drawn 클래스로 트리거\n                if (el.classList.contains('workflow-svg-wrap')) {\n                    // 각 wf-node에 순차 딜레이 (0.18s 간격)\n                    el.querySelectorAll('.wf-node').forEach((node, i) => {\n                        node.style.transitionDelay = (0.18 + i * 0.14) + 's';\n                    });\n                    // 각 wf-arrow에 노드보다 살짝 뒤로 (노드 등장 후 화살표가 그려지도록)\n                    el.querySelectorAll('.wf-arrow').forEach((arrow, i) => {\n    ringMaskImg.setAttribute('x', '0');\n    ringMaskImg.setAttribute('y', '0');\n    ringMaskImg.setAttribute('result', 'ringMaskRaw');\n\n    const ringBlur = document.createElementNS(ns, 'feGaussianBlur');\n    ringBlur.setAttribute('in', 'ringMaskRaw');\n    ringBlur.setAttribute('stdDeviation', String(RING_BLUR));\n    ringBlur.setAttribute('result', 'ringMask');\n\n    /* [v1.13 수정] 변위맵 중립 보장 구조로 전면 교체\n       문제: feImage는 data URI를 비동기 로드하므로, 매 프레임 href 교체 시\n       아직 디코딩 안 된 프레임에서는 마스크가 '완전 투명'이 됨.\n       - 기존 arithmetic(k4=0)  : 투명 → 채널 0   → 카드가 우측 하단으로 밀림\n       - v1.12 arithmetic(k4=.5): 투명 → 채널 1.0 → 카드가 좌측 상단으로 밀림\n       해결: 링 밝기를 luminanceToAlpha로 알파로 변환해 노이즈를 마스킹(in)한 뒤,\n       중립 회색(#808080) flood 위에 over 합성. 마스크가 미로딩·투명·검정\n       어떤 상태여도 결과는 중립 0.5 = 변위 0 → 카드 위치 절대 불변.\n       실제 렌더된 링 위에서만 노이즈 왜곡이 일어나 물결 효과는 유지됨. */\n    const lumToAlpha = document.createElementNS(ns, 'feColorMatrix');\n    lumToAlpha.setAttribute('in', 'ringMask');\n    lumToAlpha.setAttribute('type', 'luminanceToAlpha');\n    lumToAlpha.setAttribute('result', 'ringAlpha');\n\n    const maskIn = document.createElementNS(ns, 'feComposite');\n    maskIn.setAttribute('in', 'noiseOpaque');\n    maskIn.setAttribute('in2', 'ringAlpha');\n    maskIn.setAttribute('operator', 'in');\n    maskIn.setAttribute('result', 'maskedNoise');\n\n    const neutralFlood = document.createElementNS(ns, 'feFlood');\n    neutralFlood.setAttribute('flood-color', '#808080');\n    neutralFlood.setAttribute('flood-opacity', '1');\n    neutralFlood.setAttribute('result', 'neutralBase');\n\n    const overNeutral = document.createElementNS(ns, 'feComposite');\n    overNeutral.setAttribute('in', 'maskedNoise');\n    overNeutral.setAttribute('in2', 'neutralBase');\n    overNeutral.setAttribute('operator', 'over');\n    overNeutral.setAttribute('result', 'dispMap');\n\n    const noiseBlur = document.createElementNS(ns, 'feGaussianBlur');\n    noiseBlur.setAttribute('in', 'dispMap');\n    noiseBlur.setAttribute('stdDeviation', String(NOISE_BLUR));\n    noiseBlur.setAttribute('result', 'dispMapSoft');\n\n    const disp = document.createElementNS(ns, 'feDisplacementMap');\n    disp.setAttribute('in', 'SourceGraphic');\n    disp.setAttribute('in2', 'dispMapSoft');\n    disp.setAttribute('scale', '0');\n    disp.setAttribute('xChannelSelector', 'R');\n    disp.setAttribute('yChannelSelector', 'G');\n\n    filter.appendChild(turb);\n    filter.appendChild(colorMatrix);\n    filter.appendChild(ringMaskImg);\n    filter.appendChild(ringBlur);\n    filter.appendChild(lumToAlpha);\n    filter.appendChild(maskIn);\n    filter.appendChild(neutralFlood);\n    filter.appendChild(overNeutral);\n    filter.appendChild(noiseBlur);\n    filter.appendChild(disp);\n\n    ensureFilterHost().appendChild(filter);\n\n    return { id, ringMaskImg, disp };\n  }\n\n  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }\n\n  function buildRingMaskDataURI(cx, cy, rings, w, h) {\n    let circles = '';\n    for (const r of rings) {\n      circles += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r.radius.toFixed(1)}\" fill=\"none\" stroke=\"white\" stroke-width=\"${RING_WIDTH}\" stroke-opacity=\"${r.strength.toFixed(3)}\" />`;\n    }\n    const svg = `<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"${w}\" height=\"${h}\"><rect width=\"100%\" height=\"100%\" fill=\"black\"/>${circles}<\u002Fsvg>`;\n    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);\n  }\n\n  function attachRipple(el) {\n    if (el.dataset.rippleAttached) return;\n    el.dataset.rippleAttached = '1';\n    el.classList.add('ripple-ready');\n\n    const { id, ringMaskImg, disp } = createRippleFilter();\n    el.style.filter = `url(#${id})`;\n\n    let animId = null;\n    /* [v1.34] 자동 물결 등록 정보 — animate 정의 후 하단에서 연결·등록 */\n    const reg = { el, animate: null, visible: false, activeUntil: 0 };\n\n    function animate(cx, cy) {\n      cancelAnimationFrame(animId);\n      const rect = el.getBoundingClientRect();\n      const w = rect.width, h = rect.height;\n      const diag = Math.hypot(w, h);\n      const maxRadius = diag * MAX_RADIUS_RATIO;\n\n      ringMaskImg.setAttribute('width', w);\n      ringMaskImg.setAttribute('height', h);\n      /* [v1.12 수정] scale을 켜기 전에 빈 마스크(전체 중립)를 먼저 세팅.\n         첫 클릭 시 href가 비어 있는 한 프레임 동안 카드가 튀는 것 방지. */\n      const initialHref = buildRingMaskDataURI(cx, cy, [], w, h);\n      ringMaskImg.setAttribute('href', initialHref);\n      ringMaskImg.setAttributeNS('http://www.w3.org/1999/xlink', 'href', initialHref);\n      disp.setAttribute('scale', DISPLACEMENT_SCALE);\n\n      const startTime = performance.now();\n      reg.activeUntil = startTime + DURATION; // [v1.34] 물결 진행 중 표시(자동 발동 겹침 방지)\n\n      function frame(now) {\n        const elapsed = now - startTime;\n        const t = Math.min(elapsed / DURATION, 1);\n        const eased = easeOutQuad(t);\n\n        const frontRadius = eased * maxRadius;\n        const globalEnvelope = 1 - Math.pow(t, 2);\n\n        let rings = [];\n        let cumulativeOffset = 0;\n        for (let i = 0; i < NUM_RINGS; i++) {\n          const wavelength = BASE_WAVELENGTH + i * WAVELENGTH_GROWTH;\n          cumulativeOffset += (i === 0 ? 0 : wavelength);\n          const ringRadius = frontRadius - cumulativeOffset;\n          if (ringRadius <= 0) break;\n          const ringStrength = Math.pow(DECAY_PER_RING, i) * globalEnvelope;\n          if (ringStrength < 0.04) continue;\n          rings.push({ radius: ringRadius, strength: ringStrength });\n        }\n\n        const href = buildRingMaskDataURI(cx, cy, rings, w, h);\n        ringMaskImg.setAttribute('href', href);\n        ringMaskImg.setAttributeNS('http://www.w3.org/1999/xlink', 'href', href);\n\n        if (t < 1) {\n          animId = requestAnimationFrame(frame);\n        } else {\n          disp.setAttribute('scale', 0);\n        }\n      }\n      animId = requestAnimationFrame(frame);\n    }\n\n    // 버튼(.card-btn) 클릭 시에는 물결을 발동시키지 않고 바로 링크 이동되도록 제외\n    // preventDefault는 호출하지 않음 (모바일 터치 스크롤/바운스를 막아\n    // 카드가 튕기듯 이동하는 부작용을 유발하므로 제거)\n    el.addEventListener('pointerdown', (e) => {\n      if (e.target.closest('.card-btn')) return;\n      const rect = el.getBoundingClientRect();\n      const cx = e.clientX - rect.left;\n      const cy = e.clientY - rect.top;\n      animate(cx, cy);\n    });\n\n    // [v1.34] 자동 물결 대상으로 등록\n    reg.animate = animate;\n    autoRippleTargets.push(reg);\n  }\n\n  /* ── [v1.34] 자동 물결 스케줄러 ──\n     카드마다 독립 타이머로 2~6초 사이 랜덤 간격마다 카드 내부\n     랜덤 좌표에서 클릭과 동일한 물결을 발동한다.\n     · IntersectionObserver: 화면에 35% 이상 보이는 카드만 발동\n       (오프스크린 카드의 프레임별 마스크 재생성 비용 차단)\n     · document.hidden(탭 비활성) 시 이번 회차 건너뜀\n     · 해당 카드에 물결(클릭 포함)이 진행 중이면 건너뛰어 끊김 방지\n     · 전체 동시 진행 물결이 AUTO_MAX_CONCURRENT 이상이면 건너뜀\n       (데스크톱에서 6장 동시 발동으로 인한 프레임 드랍 예방)\n     · 건너뛴 회차도 다음 랜덤 간격으로 항상 재예약되므로 멈추지 않음\n     · prefers-reduced-motion 환경에서는 자동 발동만 비활성(클릭 물결은 유지) */\n  function initAutoRipple() {\n    if (!autoRippleTargets.length) return;\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        const t = autoRippleTargets.find((r) => r.el === entry.target);\n        if (t) t.visible = entry.isIntersecting;\n      });\n    }, { threshold: 0.35 });\n\n    const randDelay = () =>\n      AUTO_MIN_DELAY + Math.random() * (AUTO_MAX_DELAY - AUTO_MIN_DELAY);\n\n    const activeCount = () => {\n      const now = performance.now();\n      return autoRippleTargets.reduce((n, r) => n + (r.activeUntil > now ? 1 : 0), 0);\n    };\n\n    function fire(t) {\n      if (\n        !document.hidden &&\n        t.visible &&\n        performance.now() >= t.activeUntil &&\n        activeCount() < AUTO_MAX_CONCURRENT\n      ) {\n        const rect = t.el.getBoundingClientRect();\n        const m = AUTO_POS_MARGIN;\n        const cx = rect.width  * (m + Math.random() * (1 - 2 * m));\n        const cy = rect.height * (m + Math.random() * (1 - 2 * m));\n        t.animate(cx, cy);\n      }\n      setTimeout(() => fire(t), randDelay()); // 다음 회차 재예약(간격도 매번 새로 랜덤)\n    }\n\n    autoRippleTargets.forEach((t) => {\n      io.observe(t.el);\n      setTimeout(() => fire(t), randDelay()); // 최초 발동도 2~6초 랜덤 → 카드끼리 자연 분산\n    });\n  }\n\n  function initCardRipple() {\n    // 01~06 소개 카드\n    document.querySelectorAll('.grid-card').forEach(attachRipple);\n    initAutoRipple(); // [v1.34] 자동 물결 시작\n    /* [v1.18] 워크플로우 01~03 카드는 물결 효과 제거.\n       카드 면적이 커서 SVG 필터 영역이 과대해지고 매 프레임 마스크 재생성\n       비용이 급증 → 모바일에서 프레임 드랍(렉) 유발하여 비활성화. */\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', initCardRipple);\n  } else {\n    initCardRipple();\n  }\n})();\n<\u002Fscript>\n\n<script>\n/* ═══════════════════════════════════════════════════════\n   [궤도 타이틀] 제목 주위 3D 회전 텍스트 링 (v1.20)\n   - orbit_title_final 프로토타입의 파라미터를 2D 수식으로 동일 재현\n     · tiltX 10° / tiltZ -30°, 회전 30°/s(=0.5°/frame@60fps)\n     · 깊이별 가변 반경 0.48~1.25배 → 원근 과장 효과\n     · 깊이별 크기 0.55~1.32배(전면 +10%, v1.23), 투명도 0.5~1.0\n     · perspective 1000px 원근 투영(화면 좌표·크기에 반영)\n     · 프로토타입 체인의 rotateZ(-30°) 잔여 화면 기울기(≈-29.5°)를\n       각 글자에 상수 rotate로 재현 → 리본을 따라 흐르는 조판\n   - 문장 전체를 360°에 배분하되 공백은 글자 폭의 50%만 차지시켜\n     어절 간격 과대를 방지. 공백 DOM은 생성하지 않음(글리프만 생성)\n   - 반응형(v1.21): 데스크톱 = 프로토타입 반경 164px, 제목이 여러 줄로\n     감기는 화면에서는 블록 높이에 맞춰 반경 확대(뷰포트 상한 적용),\n     글자 크기는 0.8~1rem 범위에서 반경 비례\n   - z(깊이) 부호로 z-index 1↔3 전환 → 제목 뒤/앞 통과\n   - 시간 기반 회전(프레임레이트 무관), 화면 밖 일시정지\n   ═══════════════════════════════════════════════════════ */\n(function () {\n  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n\n  function initOrbitTitle() {\n    const stage = document.getElementById('orbit-stage');\n    const scene = document.getElementById('orbit-scene');\n    if (!stage || !scene || scene.childElementCount > 0) return;\n\n    /* ── orbit_title_final 프로토타입 config 이식 ── */\n    const PHRASE = 'KT인천지사 시너지영업3팀은 채널 발굴부터 VR컨설팅,로봇PoC,상품 견적 지원,세일즈 에셋까지 현장DX영업을 지원합니다. ';\n    const SPEED = 30;               // 초당 회전 각도(도) = -0.5°/frame @60fps [v1.22 감속: 기존 -0.69]\n    const A = 10 * Math.PI / 180;   // tiltX\n    const C = -30 * Math.PI / 180;  // tiltZ\n    const sinA = Math.sin(A), cosA = Math.cos(A);\n    const sinC = Math.sin(C), cosC = Math.cos(C);\n    const BASE_RADIUS = 164;                                      // 프로토타입 radius\n    const S_MID = (1.32 + 0.55) / 2, S_HALF = (1.32 - 0.55) / 2;  // frontScale 1.32(=1.20×1.1, v1.23 전면 +10%) / backScale\n    const R_MID = (1.25 + 0.48) / 2, R_HALF = (1.25 - 0.48) / 2;  // frontRadiusScale/backRadiusScale\n    const O_MID = (1 + 0.50) / 2,  O_HALF = (1 - 0.50) / 2;       // opacityMin 0.50\n    const PERSP = 1000;                                           // 프로토타입 .stage perspective\n    /* rotateX(A)·rotateZ(C)·rotateY(θ)·translateZ(r)·rotateY(-θ)·rotateX(-A) 체인에서\n       rotateZ(C)는 되돌리지 않으므로 모든 글자에 상수 화면 회전 ≈ -29.5°가 남음 */\n    const GLYPH_TILT = ' rotate(-29.5deg)';\n\n    /* [v1.22] 문자 배치: 공백은 각도 슬롯만 차지(DOM 미생성)하되,\n       글자 폭의 50%(SPACE_W)만 차지시킴. 기존에는 공백도 글자 1자와\n       동일한 슬롯을 차지해 어절 사이가 글자 간격의 2배로 벌어졌음 */\n    const SPACE_W = 0.5; // 공백 폭 = 글자 폭 대비 비율 (1.0이면 기존과 동일)\n    const chars = PHRASE.split('');\n    let acc = 0;\n    const pos = chars.map(ch => { const p = acc; acc += (ch === ' ') ? SPACE_W : 1; return p; });\n    const unit = 360 / acc; // 전체 문장을 360°에 배분했을 때 글자 1자당 각도\n    const items = [];\n    chars.forEach((ch, i) => {\n      if (ch === ' ') return;\n      const span = document.createElement('span');\n      span.className = 'orbit-char';\n      span.textContent = ch;\n      scene.appendChild(span);\n      items.push({ el: span, base: pos[i] * unit });\n    });\n\n    /* [v1.21] 반응형 반경 — 제목 블록의 '높이'까지 반영\n       모바일에서 제목이 2줄로 감기면 블록이 세로 ~96px로 커지는데, 기존\n       폭 기반 축소(최소 90px)로는 링의 아래 돌출(≈0.44r)이 제목 절반\n       높이도 못 넘어 글자가 제목 안에 파묻힘 →\n       ① 폭 기반(데스크톱 164px 유지)과 ② 높이 기반(아래 궤도가 제목\n       아래로 ≥20px 빠져나오는 반경) 중 큰 값을 취하고\n       ③ 좌우가 뷰포트를 넘지 않는 상한으로 자름.\n       화면 돌출 상수(원근 포함): 위 ≈0.59r / 아래 ≈0.44r / 좌우 ≈0.87r */\n    let radius = BASE_RADIUS;\n    function updateRadius() {\n      const w = stage.offsetWidth || 600;\n      const h = stage.offsetHeight || 60;\n      const vw = document.documentElement.clientWidth || window.innerWidth || 1200;\n      const widthBased  = Math.min(BASE_RADIUS, w * 0.19);   // 데스크톱: 164 고정\n      const heightBased = (h / 2 + 20) / 0.44;               // 여러 줄 제목 감싸기\n      const viewportCap = (vw / 2 - 12) / 0.89;              // 좌우 화면 이탈 방지\n      radius = Math.max(90, Math.min(viewportCap, Math.max(widthBased, heightBased)));\n      /* 글자 크기: 반경 비례하되 0.8~1rem 범위로 제한\n         (모바일에서 과도하게 작아지던 문제 해결, 데스크톱은 1rem 유지) */\n      scene.style.fontSize = Math.min(1, Math.max(0.8, radius / BASE_RADIUS)).toFixed(3) + 'rem';\n    }\n    updateRadius();\n    if (window.ResizeObserver) {\n      new ResizeObserver(updateRadius).observe(stage);\n    } else {\n      window.addEventListener('resize', updateRadius);\n    }\n\n    let rafId = null;\n    let lastTs = null;\n    let t = 0; // 누적 회전각(도), 감소 방향 = 프로토타입(speed 음수)과 동일\n\n    function frame(ts) {\n      if (lastTs !== null) t -= (ts - lastTs) * SPEED / 1000;\n      lastTs = ts;\n      for (let k = 0; k < items.length; k++) {\n        const item = items[k];\n        const span = item.el;\n        const ang = (item.base + t) * Math.PI / 180;\n        const sinT = Math.sin(ang), cosT = Math.cos(ang);\n        /* 깊이 드라이버 = cosθ (tiltX 10°에서는 실제 z와 위상차 ≈5°로 사실상 일치) */\n        const effR = radius * (R_MID + cosT * R_HALF);   // 앞쪽은 멀리, 뒤쪽은 가깝게 → 원근 과장\n        /* rotateX(10°)·rotateZ(-30°)·rotateY(θ)·translateZ(effR) 원점 좌표 전개 */\n        const x = effR * sinT * cosC;\n        const y = effR * (sinT * sinC * cosA - cosT * sinA);\n        const z = effR * (sinT * sinC * sinA + cosT * cosA);\n        const p = PERSP / (PERSP - z);                   // 원근 투영 배율\n        const s = (S_MID + cosT * S_HALF) * p;\n        /* [v1.24] 스타일 변경 최소화: opacity·z-index는 실제 값이 바뀐\n           프레임에만 세팅 → 저사양·안드로이드 기기의 스타일 무효화 부하 감소 */\n        const op = (O_MID + cosT * O_HALF).toFixed(2);\n        if (item.op !== op) { item.op = op; span.style.opacity = op; }\n        span.style.transform =\n          'translate(-50%, -50%) translate(' + (x * p).toFixed(1) + 'px, ' + (y * p).toFixed(1) + 'px)' +\n          GLYPH_TILT + ' scale(' + s.toFixed(3) + ')';\n        const zi = z >= 0 ? 3 : 1; // 제목(z-index 2) 앞/뒤 전환\n        if (item.zi !== zi) { item.zi = zi; span.style.zIndex = zi; }\n      }\n      rafId = requestAnimationFrame(frame);\n    }\n\n    // 화면에 보일 때만 구동 (성능·배터리)\n    const io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (e) {\n        if (e.isIntersecting) {\n          if (rafId === null) { lastTs = null; rafId = requestAnimationFrame(frame); }\n        } else if (rafId !== null) {\n          cancelAnimationFrame(rafId);\n          rafId = null;\n        }\n      });\n    }, { threshold: 0 });\n    io.observe(stage);\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', initOrbitTitle);\n  } else {\n    initOrbitTitle();\n  }\n})();\n<\u002Fscript>\n\n<script>\n/* ── [v1.19] GNB 드롭다운 터치(탭) 토글 ──\n   iOS Safari는 href 없는 <a>를 '클릭 가능한 요소'로 인식하지 않아\n   탭 시 hover 시뮬레이션이 발동하지 않음 → CSS :hover 전용 드롭다운이\n   아이폰에서 열리지 않는 원인. click 핸들러를 부착하면 iOS가 클릭 가능\n   요소로 인식하며, .open 클래스로 열고 닫음. 데스크톱 hover는 기존 유지. */\n(function () {\n  function initDropdownToggle() {\n    document.querySelectorAll('.dropdown').forEach(function (dd) {\n      var btn = dd.querySelector('.dropbtn');\n      if (!btn) return;\n      btn.addEventListener('click', function (e) {\n        e.preventDefault();\n        e.stopPropagation();\n        // 다른 드롭다운이 열려 있으면 닫기\n        document.querySelectorAll('.dropdown.open').forEach(function (other) {\n          if (other !== dd) other.classList.remove('open');\n        });\n        dd.classList.toggle('open');\n      });\n    });\n    // 메뉴 바깥을 탭/클릭하면 닫기\n    document.addEventListener('click', function (e) {\n      if (!e.target.closest('.dropdown')) {\n        document.querySelectorAll('.dropdown.open').forEach(function (dd) {\n          dd.classList.remove('open');\n        });\n      }\n    });\n  }\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', initDropdownToggle);\n  } else {\n    initDropdownToggle();\n  }\n})();\n<\u002Fscript>\n\n<script>\n/* ── [v1.25] 물빛 출렁임 버튼 초기화 ──\n   대상(.skip-btn, .card-btn)에 .liquid-btn 클래스와 .liquid-fx 레이어\n   (블롭 6개 + 상단 광택)를 주입. 블롭 애니메이션은 IntersectionObserver로\n   뷰포트에 보이는 버튼에만 구동(.fx-live)해 GPU 부하를 최소화.\n   모션 최소화 설정 사용자에게는 정적 그라데이션만 적용. */\n(function () {\n  function initLiquidButtons() {\n    var targets = document.querySelectorAll('.skip-btn, .card-btn');\n    if (!targets.length) return;\n    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    var fxHTML =\n      '<span class=\"flow-blob b1\"><\u002Fspan><span class=\"flow-blob b2\"><\u002Fspan>' +\n      '<span class=\"flow-blob b3\"><\u002Fspan><span class=\"flow-blob b4\"><\u002Fspan>' +\n      '<span class=\"flow-blob b5\"><\u002Fspan><span class=\"flow-blob b6\"><\u002Fspan>' +\n      '<span class=\"top-sheen\"><\u002Fspan>'; /* [v1.29] sheen-sweep 스윕 제거 */\n    targets.forEach(function (btn) {\n      btn.classList.add('liquid-btn');\n      var fx = document.createElement('span');\n      fx.className = 'liquid-fx';\n      fx.setAttribute('aria-hidden', 'true');\n      if (!reduceMotion) fx.innerHTML = fxHTML; // 모션 최소화 시 블롭 없이 그라데이션만\n      btn.insertBefore(fx, btn.firstChild);\n    });\n    if (reduceMotion) return;\n    /* [v1.26] 클릭 지점에서 퍼지는 물결 리플 */\n    targets.forEach(function (btn) {\n      btn.addEventListener('pointerdown', function (e) {\n        var fx = btn.querySelector('.liquid-fx');\n        if (!fx) return;\n        var rect = btn.getBoundingClientRect();\n        var d = Math.max(rect.width, rect.height) * 2.2;\n        var r = document.createElement('span');\n        r.className = 'btn-ripple';\n        r.style.width = r.style.height = d + 'px';\n        r.style.left = (e.clientX - rect.left) + 'px';\n        r.style.top  = (e.clientY - rect.top) + 'px';\n        fx.appendChild(r);\n        r.addEventListener('animationend', function () { r.remove(); });\n      });\n    });\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (e) {\n        e.target.classList.toggle('fx-live', e.isIntersecting);\n      });\n    }, { rootMargin: '80px' });\n    targets.forEach(function (btn) { io.observe(btn); });\n  }\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', initLiquidButtons);\n  } else {\n    initLiquidButtons();\n  }\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
