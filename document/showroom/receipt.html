<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KT 하이오더 쇼룸 [시너지3팀]</title>
    <!-- QR 생성 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #F7F7F7; }
        
        /* 가로 스크롤 및 스와이프 최적화 (태블릿 맞춤) */
        .horizontal-scroll-wrapper { 
            display: flex; 
            width: 100vw; 
            height: 100vh; 
            overflow-x: auto; 
            overflow-y: hidden; 
            scroll-snap-type: x mandatory; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; /* Firefox */
        }
        .horizontal-scroll-wrapper::-webkit-scrollbar { display: none; } /* Chrome, Safari */
        
        .section { 
            flex: 0 0 100vw; 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            scroll-snap-align: start; 
        }
        
        /* 공통 레이아웃 */
        .content-box { position: absolute; top: 5vh; left: 5vw; z-index: 3; }
        .main-title { font-weight: 700; color: #111; white-space: nowrap; line-height: 1.3; }
        .section-num { color: #ff3366; font-weight: bold; margin-bottom: 5px; }
        
        .window-frame { 
            position: absolute; top: 15vh; left: 50%; transform: translateX(-50%); 
            width: 85vw; height: 65vh; z-index: 2; 
            background-size: contain; background-repeat: no-repeat; background-position: center; 
            background-color: transparent;
        }

        /* 우측 하단 플로팅 버튼 */
        .fixed-bottom-bar { 
            position: fixed; bottom: 30px; right: 30px; 
            background: #ff3366; color: white; text-align: center; 
            border-radius: 20px; font-weight: bold; cursor: pointer; 
            z-index: 999; box-shadow: 0 10px 20px rgba(255, 51, 102, 0.4); 
            display: flex; align-items: center; justify-content: center; line-height: 1.4;
            transition: transform 0.2s;
        }
        .fixed-bottom-bar:active { transform: scale(0.95); }

        /* 팝업창 스타일 */
        .fullscreen-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.85); z-index: 1000; 
            display: none; justify-content: center; align-items: center; 
        }
        .fullscreen-overlay.active { display: flex; }
        .popup-container { 
            background: #fff; width: 90%; max-width: 450px; 
            padding: 30px; border-radius: 20px; position: relative; 
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .popup-close { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; border: none; background: none; color: #333; }
        
        .popup-container h3 { margin-bottom: 20px; color: #111; font-size: 1.4rem; }
        .input-group { width: 100%; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; outline: none; }
        .input-group input:focus { border-color: #ff3366; }
        
        button#submitBtn { 
            width: 100%; padding: 15px; background: #ff3366; color: white; 
            border: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; 
            cursor: pointer; margin-top: 10px;
        }
        
        #qrcodeContainer { margin-top: 20px; display: none; flex-direction: column; align-items: center; }
        #qrcode { margin-top: 10px; padding: 10px; background: #fff; border: 1px solid #eee; border-radius: 10px; }
        .success-msg { color: #ff3366; font-weight: bold; margin-top: 10px; font-size: 1.1rem; }

        /* PC/태블릿 반응형 */
        @media screen and (min-width: 1024px) {
            .main-title { font-size: 3.5rem; }
            .section-num { font-size: 2rem; }
            .fixed-bottom-bar { width: 350px; height: 120px; font-size: 1.4rem; border-radius: 25px; }
            /* PC에서는 마우스 휠로 가로 스크롤 지원 */
            .horizontal-scroll-wrapper { overflow-x: hidden; } 
        }
        @media screen and (max-width: 1023px) {
            .main-title { font-size: 1.8rem; }
            .section-num { font-size: 1.2rem; }
            .fixed-bottom-bar { width: 220px; height: 90px; font-size: 0.95rem; right: 20px; bottom: 20px; }
        }
    </style>
</head>
<body>

    <!-- 가로 스크롤 전체 컨테이너 -->
    <div class="horizontal-scroll-wrapper" id="scrollContainer">
        
        <!-- 섹션 1: 메인 소개 -->
        <div class="section">
            <div class="content-box">
                <div class="section-num">01</div>
                <div class="main-title">KT 하이오더,<br>매출을 올리는 새로운 방법</div>
            </div>
            <div class="window-frame" style="background-image: url('https://kt-synergy.com/assets/image/showroom/기능1.jpg');"></div>
        </div>

        <!-- 섹션 2: 수수료 안내 -->
        <div class="section">
            <div class="content-box">
                <div class="section-num">02</div>
                <div class="main-title">부담 없는 수수료,<br>사장님의 이익을 극대화합니다</div>
            </div>
            <div class="window-frame" style="background-image: url('https://kt-synergy.com/assets/image/showroom/기능2.jpg');"></div>
        </div>

        <!-- 섹션 3: 기능 특장점 -->
        <div class="section">
            <div class="content-box">
                <div class="section-num">03</div>
                <div class="main-title">하이오더 특장점,<br>테이블오더, 왜 필요할까요?</div>
            </div>
            <div class="window-frame" style="background-image: url('https://kt-synergy.com/assets/image/showroom/기능3.jpg');"></div>
        </div>

    </div>

    <!-- 우측 하단 플로팅 버튼 (마케팅 문구) -->
    <div class="fixed-bottom-bar" id="openEstimateBtn">
        🎁 10초 견적 확인하고<br>메가커피 쿠폰 받기
    </div>

    <!-- 견적 및 팝업창 -->
    <div class="fullscreen-overlay" id="estimatePopup">
        <div class="popup-container">
            <button class="popup-close" id="closeEstimateBtn">✕</button>
            <h3>견적 확인 및 쿠폰 수령</h3>
            
            <div id="formContainer" style="width: 100%;">
                <div class="input-group">
                    <input type="text" id="storeName" placeholder="매장명 (예: 하이식당)">
                </div>
                <div class="input-group">
                    <input type="text" id="userName" placeholder="대표자 성함">
                </div>
                <div class="input-group">
                    <input type="tel" id="userPhone" placeholder="연락처 (- 없이 입력)">
                </div>
                <button id="submitBtn">견적 확인 및 쿠폰 받기</button>
            </div>

            <!-- QR 코드 표시 영역 (제출 후 나타남) -->
            <div id="qrcodeContainer">
                <div class="success-msg">✅ 견적 요청이 완료되었습니다!</div>
                <p style="margin-top: 5px; color: #555; font-size: 0.9rem;">아래 QR코드를 스캔하여 쿠폰을 받아가세요.</p>
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <script>
        // PC 환경에서 마우스 휠로 가로 스크롤 제어
        const scrollContainer = document.getElementById('scrollContainer');
        scrollContainer.addEventListener('wheel', (evt) => {
            if (window.innerWidth >= 1024) {
                evt.preventDefault();
                scrollContainer.scrollLeft += evt.deltaY * 2;
            }
        });

        // 팝업 열기/닫기 로직
        const estimatePopup = document.getElementById('estimatePopup');
        const formContainer = document.getElementById('formContainer');
        const qrcodeContainer = document.getElementById('qrcodeContainer');
        const qrcodeDiv = document.getElementById('qrcode');
        
        document.getElementById('openEstimateBtn').addEventListener('click', () => {
            estimatePopup.classList.add('active');
            // 팝업 열 때 초기화
            formContainer.style.display = 'block';
            qrcodeContainer.style.display = 'none';
            qrcodeDiv.innerHTML = '';
            document.getElementById('storeName').value = '';
            document.getElementById('userName').value = '';
            document.getElementById('userPhone').value = '';
        });

        document.getElementById('closeEstimateBtn').addEventListener('click', () => {
            estimatePopup.classList.remove('active');
        });

        // 데이터 전송 및 QR 생성 로직
        document.getElementById('submitBtn').addEventListener('click', () => {
            const store = document.getElementById('storeName').value;
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            
            if(!store || !name || !phone) {
                alert("정보를 모두 입력해주세요.");
                return;
            }

            // 1. 텔레그램 전송
            const botToken = '8708881644:AAHXQ0aPQiCwW9fzosVMblNVIig8KKLjDCI'; 
            const chatId = '458348198';
            const message = `🔔 [메가커피 견적 요청]\n상호명: ${store}\n성함: ${name}\n연락처: ${phone}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: message })
            }).then(response => {
                // 2. 전송 성공 시 폼을 숨기고 QR코드 생성
                formContainer.style.display = 'none';
                qrcodeContainer.style.display = 'flex';
                
                // 마케팅용 URL (예시)
                const eventUrl = `https://kt-synergy.com/event?phone=${phone}`;
                
                new QRCode(qrcodeDiv, {
                    text: eventUrl,
                    width: 150,
                    height: 150,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

            }).catch(err => {
                alert("네트워크 오류가 발생했습니다. 다시 시도해주세요.");
            });
        });
    </script>
</body>
</html>
