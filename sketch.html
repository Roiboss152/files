<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>밑그림 — 매장운영진단 기초자료 | KT 시너지영업3팀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#FFFFFF; --panel:#F5F5F7; --line:#E5E5E7; --grid:#F4F4F4;
  --ink:#201E1D; --sub:#6E6E73; --faint:#86868B;
  --accent:#EC3013; --accent-ink:#AE1800; --on:#FFFFFF;
  --W:590px; --pitch:147.5px;        /* 4분할 — 선을 절반 이하로 */
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);overflow-x:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:13px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}

.page{position:relative;z-index:1;width:var(--W);margin:0 auto;padding:55px 0 89px;
  background-image:linear-gradient(to right,var(--grid) 0 1px,var(--grid) 1px);
  background-size:1px 100%;background-position:442.5px 0;background-repeat:no-repeat}

/* ── 배경 타이포그래피 — 기능 없는 장식 단어 ── */
.bgw{position:absolute;z-index:-1;font-weight:900;letter-spacing:-.05em;line-height:.78;
  color:#F8F8F8;white-space:nowrap;pointer-events:none;user-select:none}
/* 그리드 — 기준이 되는 텍스트 블록에 붙고, 그 블록을 벗어나면서 흐려져 사라진다 */
.arule{position:absolute;z-index:-1;pointer-events:none;transform-origin:center center;
  transition:transform 1900ms cubic-bezier(.16,1,.3,1) var(--rd,0ms)}
.arule.h{transform:scaleX(0)} .sec.on .arule.h{transform:scaleX(1)}
.arule.v{transform:scaleY(0)} .sec.on .arule.v{transform:scaleY(1)}

/* ── 마스트헤드 ── */
.mast{display:flex;justify-content:space-between;align-items:flex-end;
  padding-bottom:9px;border-bottom:2px solid var(--ink)}
.mast .name{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mast .tag{font-size:11px;color:var(--faint);margin-top:5px}
.mast .tag em{font-style:normal;color:var(--accent);font-weight:700}
.mast .tag .en{color:var(--accent);font-weight:700;letter-spacing:.08em;margin-right:8px}
.mast .ver{font-size:9px;color:var(--faint);letter-spacing:.06em}

/* ── 섹션 ── */
.sec{position:relative;margin-top:55px}
.sec>.hd{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-top:16px;margin-bottom:18px}
.sec>.hd::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(to right,var(--ink) 0,var(--ink) 74%,var(--paper) 100%)}
.chap{position:relative;line-height:0;flex:none}
.chap .dig{display:block;width:58px;text-align:center;font-size:88px;font-weight:800;
  line-height:.92;letter-spacing:-.05em;color:#D2D2D2}
.chap h2{position:absolute;top:50%;left:29px;transform:translateY(-50%);white-space:nowrap;
  font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.sec>.hd .meta{font-size:9px;color:var(--faint);letter-spacing:.04em;white-space:nowrap}

/* ── 01 히어로 ── */
.hero .eyebrow{font-size:9px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:9px}
.hero .nm{font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero .meta2{font-size:11px;color:var(--sub);margin-top:13px}

/* Tier1 — 선 없이 여백으로만 나눈다 */
.kpis{display:grid;grid-template-columns:1fr 1fr;row-gap:34px;column-gap:34px;margin-top:42px;padding-top:21px}
.kpi .k{font-size:9px;letter-spacing:.08em;color:var(--faint);font-weight:600}
.kpi .v{font-size:66px;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin-top:5px;
  font-variant-numeric:tabular-nums}
.kpi .v u{text-decoration:none;font-size:19px;font-weight:600;color:var(--sub);margin-left:3px;
  vertical-align:.45em;letter-spacing:0}
.kpi .s{font-size:9px;color:var(--faint);margin-top:7px}

/* ── 발견 — 레드 면 대신 레드 세로선 하나 ── */
.find{position:relative;margin-top:42px;padding:3px 0 3px 21px;border-left:3px solid var(--accent)}
.find .eyebrow{font-size:9px;letter-spacing:.16em;font-weight:700;color:var(--accent)}
.find .lead{font-size:26px;font-weight:700;letter-spacing:-.022em;line-height:1.38;margin-top:10px}
.find .cite{font-size:9px;color:var(--faint);margin-top:12px;line-height:1.75}

/* ── 세로 막대 ── */
.bars{position:relative;display:grid;justify-content:start;column-gap:59.5px;align-items:end;margin-top:44px}
.bars::after{content:'';position:absolute;left:0;right:0;top:200px;height:1px;background:var(--line)}
.bars.n4{grid-template-columns:repeat(4,88px)}
.bars.n3{grid-template-columns:repeat(3,88px)}
.bar .track{position:relative;height:200px}
.bar .col{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*2px);background:var(--c);
  scale:1 0;transform-origin:bottom;opacity:0;border-radius:1px;
  transition:scale 2200ms cubic-bezier(.16,1,.3,1) var(--d,0ms),
             opacity 900ms ease var(--d,0ms),
             translate 300ms cubic-bezier(.2,.8,.2,1), filter 300ms ease}
.on .bar .col{scale:1 1;opacity:1}
.bar .n{position:absolute;left:0;right:0;text-align:center;bottom:calc(var(--p)*2px + 9px);
  font-size:22px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;
  opacity:0;translate:0 calc(var(--p)*2px + 30px);
  transition:translate 2200ms cubic-bezier(.16,1,.3,1) var(--d,0ms),
             opacity 1100ms ease var(--d,0ms), scale 300ms cubic-bezier(.2,.8,.2,1), color 300ms ease}
.on .bar .n{opacity:1;translate:0 0}
/* 마이크로 인터랙션 */
.bars:hover .bar{opacity:.4;transition:opacity 300ms ease}
.bars .bar:hover{opacity:1}
.bars .bar:hover .col{translate:0 -6px;filter:brightness(.82) saturate(1.1)}
.bars .bar:hover .n{scale:1.14}
.bar{transition:opacity 300ms ease}
.bar .lb{display:block;text-align:center;font-size:11px;color:var(--sub);margin-top:20px}
.bar .lb small{display:block;font-size:9px;color:var(--faint);margin-top:2px}
.bar.hot .n{color:var(--accent)}
.bar.hot .lb{color:var(--accent-ink);font-weight:600}
.axis{font-size:9px;color:var(--faint);margin-top:13px}

/* ── 로즈 ── */
.rosewrap{position:relative;width:100%}
.rose{width:100%;height:auto;display:block;overflow:visible}
.wedge{scale:.1;opacity:0;transform-origin:295px 214px;transform-box:view-box;cursor:default;
  transition:scale 2200ms cubic-bezier(.16,1,.3,1) var(--wd,0ms),
             opacity 1000ms ease var(--wd,0ms),
             translate 340ms cubic-bezier(.2,.8,.2,1), filter 340ms ease}
.on .wedge{scale:1;opacity:1}
.rosewrap:hover .wedge{opacity:.34}
.rosewrap .wedge:hover{opacity:1;translate:var(--ox) var(--oy);filter:brightness(1.06)}
.lbl.lit .n{scale:1.16}
.lbl{transition:opacity 900ms ease calc(var(--wd,0ms) + 1300ms)}
.lbl .n,.lbl .t{transition:scale 300ms cubic-bezier(.2,.8,.2,1),fill 300ms ease;
  transform-origin:center;transform-box:fill-box}
.lead-l{stroke:var(--faint);stroke-width:.75;stroke-dasharray:1.5 2.5;fill:none;opacity:0;
  transition:opacity 900ms ease calc(var(--wd,0ms) + 1100ms)}
.on .lead-l{opacity:.75}
.lbl{opacity:0}
.on .lbl{opacity:1}
.lbl .n{font-size:19px;font-weight:700;letter-spacing:-.02em;fill:var(--ink)}
.lbl .t{font-size:9px;fill:var(--faint)}
.lbl.hot .n{fill:var(--accent)}
.lbl.hot .t{fill:var(--accent-ink)}
/* 어두운 유리 — 색이 깔린 자리 위에만 */
.core{position:absolute;left:50%;top:47.6%;width:122px;height:122px;margin:-61px 0 0 -61px;
  border-radius:50%;display:grid;place-content:center;text-align:center;
  background:rgba(32,30,29,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:var(--on);opacity:0;transform:scale(.72);
  transition:opacity 1100ms ease 2300ms,transform 1600ms cubic-bezier(.16,1,.3,1) 2300ms}
.on .core{opacity:1;transform:scale(1)}
.core b{display:block;font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums}
.core span{display:block;font-size:9px;opacity:.8;margin-top:4px}

/* ── 목록 ── */
.list{list-style:none}
.list li{display:grid;grid-template-columns:70px 1fr;gap:13px;padding:13px 0;
  border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .d{font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px}
.list .ti{font-size:13px;line-height:1.5}
.list .by{font-size:9px;color:var(--faint);display:block;margin-top:3px}

.nt{font-size:9px;color:var(--faint);line-height:1.75;margin-top:13px}
.foot{margin-top:55px;padding-top:13px;border-top:1px solid var(--line);font-size:9px;
  color:var(--faint);line-height:1.85}
.foot .warn{color:var(--accent-ink)}

/* ── 도구 구역 (애플 스타일) + 포커스 스크림 ── */
.tool{position:relative;z-index:41;display:flex;gap:10px;align-items:flex-end;
  margin:21px -14px 0;padding:14px;border-radius:16px;background:transparent;
  transition:background 480ms ease,box-shadow 480ms ease}
.tool.lit{background:var(--paper);box-shadow:0 22px 70px rgba(32,30,29,.22)}
.tf{width:148px;flex:none}.tf.grow{flex:1;width:auto}
.tl{display:block;font-size:9px;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:7px}
.tool input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid transparent;border-radius:12px;padding:11px 14px;outline:none;
  transition:background 300ms ease,border-color 300ms ease,box-shadow 300ms ease}
.tool input::placeholder{color:#B4B4B9}
.tool input:hover{background:#EDEDF0}
.tool input:focus{background:var(--paper);border-color:rgba(32,30,29,.16);
  box-shadow:0 0 0 4px rgba(236,48,19,.13)}
.tbtn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:12px;padding:12px 22px;
  background:var(--ink);color:#fff;cursor:pointer;
  transition:transform 260ms cubic-bezier(.2,.8,.2,1),background 260ms ease}
.tbtn:hover{background:#000;transform:translateY(-2px)}
#scrim{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;
  background:rgba(32,30,29,.19);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:opacity 560ms cubic-bezier(.16,1,.3,1)}
#scrim.on{opacity:1}
.bgw{will-change:transform}
.bar-ui{position:fixed;right:21px;bottom:21px;z-index:9;display:flex;gap:8px;
  background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:12px;padding:8px}
.bar-ui button{font:inherit;font-size:12px;font-weight:600;border:0;border-radius:8px;
  padding:9px 14px;background:var(--ink);color:#fff;cursor:pointer}
.bar-ui button.g{background:var(--panel);color:var(--ink)}

@media screen{ .sec{overflow:hidden} }
@media (max-width:660px){
  :root{--W:100%;--pitch:33.3%}
  .tool{flex-wrap:wrap;margin:16px 0 0;padding:0}
  .tf{width:100%}.tbtn{width:100%}
  .page{padding:34px 16px 55px}
  .bgw{display:none}
  .hero .nm{font-size:44px}
  .kpi .v{font-size:46px}
  .bars{column-gap:16px}
  .bars.n4{grid-template-columns:repeat(4,1fr)}
  .bars.n3{grid-template-columns:repeat(3,1fr)}
}

@media print{
  @page{size:A4;margin:27mm}
  .bar-ui,.tool,#scrim{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page{width:100%;padding:0;background-position:75% 0}
  .sec{overflow:visible}
  .kpis,.find,.bars,.rosewrap,.list{break-inside:avoid;page-break-inside:avoid}
  .foot{margin-top:26px}
  .rose{width:84%}
  .sec>.hd{break-after:avoid;page-break-after:avoid}
  .sec{margin-top:38px}
  .chap .dig{font-size:70px}
  .chap h2{left:24px;font-size:17px}
  .sec>.hd{padding-top:13px;margin-bottom:14px}
  .hero .nm{font-size:64px}
  .kpis{margin-top:34px}
  .kpi .v{font-size:54px}
  .find{margin-top:34px}
  .find .lead{font-size:23px}
  .bgw{color:#F7F7F7}
  .chap .dig{color:#CECECE}
  .bar .col{transform:scaleY(1)!important;transition:none}
  .bar .n,.lbl,.core{opacity:1!important;transform:none!important;transition:none}
  .bgw{transform:none!important}
  .wedge{transform:scale(1)!important;opacity:1!important;transition:none}
  .lead-l{opacity:1!important;stroke:#A4A4A8}
  .arule{transform:none!important;transition:none}
  .core{background:#2A2827;-webkit-backdrop-filter:none;backdrop-filter:none}
  a{color:var(--ink);text-decoration:none}
}
@media (prefers-reduced-motion:reduce){
  .bar .col,.bar .n,.wedge,.lead-l,.lbl,.core,.arule{transition:none!important}
  .arule{transform:none!important}
  .bgw{transform:none!important}
}

fieldset{border:0;margin:0;padding:0;min-width:0}

/* ══ 도구 구역 추가 ══ */
.trow{display:flex;gap:10px;align-items:flex-end}
.trow+.trow{margin-top:12px}
.trow[aria-disabled="true"]{opacity:.42;pointer-events:none}
.tf.w96{width:96px;flex:none}
.tool select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none;appearance:none;
  transition:background 300ms ease,border-color 300ms ease,box-shadow 300ms ease}
.tool select:hover{background:#EDEDF0}
.tool select:focus{background:var(--paper);border-color:rgba(32,30,29,.16);box-shadow:0 0 0 4px rgba(236,48,19,.13)}
.msg{font-size:11px;color:var(--sub);margin:12px 0 0;line-height:1.7}
.msg.err{color:var(--accent-ink);font-weight:600}
.msg.warn{color:var(--ink);font-weight:600}
.msg.ok{color:var(--sub)}
.msg:empty{display:none}

/* 키 상태 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chips:empty{display:none}
.chip{font-size:9px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.chip.off{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 후보 목록 */
.cands{list-style:none;margin:21px 0 0;padding:0}
.cands:empty{display:none}
.cand{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:16px 0;border-bottom:1px solid var(--line)}
.cand .nm{font-size:17px;font-weight:700;letter-spacing:-.015em}
.cand .meta{font-size:11px;color:var(--faint);margin-top:4px}
.cand .pick{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);border-radius:10px;padding:9px 15px;cursor:pointer;white-space:nowrap;
  transition:background 240ms ease,border-color 240ms ease,transform 240ms cubic-bezier(.2,.8,.2,1)}
.cand .pick:hover{background:var(--ink);border-color:var(--ink);color:#fff;transform:translateY(-2px)}

/* 진행 */
.prog{display:flex;align-items:center;gap:12px;margin-top:21px;font-size:12px;color:var(--sub)}
.prog[hidden]{display:none}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);
  animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ 흑백 배지 (색 대신 명도로 상태를 나눈다) ══ */
.bdg{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.03em;
  padding:2px 7px;border-radius:4px;vertical-align:1px}
.bdg.fail{background:var(--ink);color:#fff}            /* 수집 실패 */
.bdg.warn{background:#6E6E73;color:#fff}               /* 확인 필요 */
.bdg.info{background:#E9E9EC;color:var(--ink)}         /* 참고·보조 */

/* ══ 극단적 스케일 대비 (데이터가 디자인) ══ */
.lead-n{font-size:112px;font-weight:800;letter-spacing:-.05em;line-height:.92;margin-top:6px;
  font-variant-numeric:tabular-nums}
.lead-read{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.45;margin-top:11px}
.lead-ref{font-size:11px;color:var(--faint);margin-top:8px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:26px;padding-top:21px;border-top:1px solid var(--line)}
.two .v{font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums}
.rest{font-size:11px;color:var(--sub);margin-top:26px;padding-top:11px;border-top:1px solid var(--line);
  font-variant-numeric:tabular-nums;line-height:1.95}
.src9{font-size:9px;color:var(--faint);margin-top:7px;line-height:1.7}

/* ══ 표 ══ */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{width:30%;color:var(--sub);font-weight:500}
.tbl td{font-variant-numeric:tabular-nums}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl .tiny{font-size:9px;color:var(--faint)}

/* ══ 아코디언 ══ */
.acc{border-bottom:1px solid var(--line)}
.acc>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:21px 0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .cnt{font-size:9px;color:var(--faint);font-weight:500;letter-spacing:.04em}
.acc .ico{flex:none;width:17px;height:17px;position:relative;
  transition:transform 380ms cubic-bezier(.4,0,.2,1)}
.acc .ico::before,.acc .ico::after{content:'';position:absolute;left:0;top:8px;width:17px;height:1.5px;background:var(--ink)}
.acc .ico::after{transform:rotate(90deg);transition:opacity 380ms cubic-bezier(.4,0,.2,1)}
.acc[open] .ico{transform:rotate(45deg)}
.acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows 520ms cubic-bezier(.4,0,.2,1)}
.acc[open] .body{grid-template-rows:1fr}
.acc .body>div{overflow:hidden;opacity:0;transition:opacity 300ms ease 180ms}
.acc[open] .body>div{opacity:1}
.acc .body .inner{padding-bottom:21px}

/* 지원 제도 목록 */
.sup{list-style:none;margin:0;padding:0}
.sup li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;
  border-bottom:1px solid var(--line)}
.sup li:last-child{border-bottom:0}
.sup .what{font-size:13px;font-weight:600}
.sup .why{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.6}
.sup a{font-size:11px;color:var(--sub);white-space:nowrap}
.ask{margin:0;padding-left:17px;font-size:13px;line-height:1.9}

/* 목록 공통 */
.recent{list-style:none;margin:0;padding:0;font-size:13px}
.recent li{display:grid;grid-template-columns:70px 1fr;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.recent li:last-child{border-bottom:0}
.recent .d{font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px}
.recent .by{display:block;font-size:9px;color:var(--faint);margin-top:3px}
.errs{margin:0;padding-left:17px;font-size:11px;color:var(--sub);line-height:1.85}

/* 결과 동작 버튼 */
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:34px}
.acts[hidden]{display:none}
.abtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);border-radius:11px;padding:11px 17px;cursor:pointer;
  transition:background 240ms ease,border-color 240ms ease,transform 240ms cubic-bezier(.2,.8,.2,1)}
.abtn:hover{border-color:#B9B9BE;transform:translateY(-2px)}
.abtn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.abtn.primary:hover{background:#000}

/* ══ 빠름 모드 ══ */
[data-motion="fast"] .arule,[data-motion="fast"] .bar .col,[data-motion="fast"] .bar .n,
[data-motion="fast"] .wedge,[data-motion="fast"] .lead-l,[data-motion="fast"] .lbl,[data-motion="fast"] .core
  {transition-duration:400ms!important;transition-delay:0ms!important}
[data-motion="fast"] .bgw{transform:none!important}

/* 늦게 도착한 섹션은 연출 없이 바로 */
.sec.static .arule{transform:none!important;transition:none}
.sec.static .bar .col,.sec.static .bar .n,.sec.static .wedge,
.sec.static .lead-l,.sec.static .lbl,.sec.static .core{transition:none!important}
.sec.static .bgw{display:none}

@media print{
  .tool,.chips,.cands,.prog,.acts,.msg,#scrim{display:none!important}
  .acc:not([open]){display:none!important}          /* 접힌 건 인쇄하지 않는다 */
  .acc>summary .ico{display:none}
  .acc[open]>.body{grid-template-rows:1fr}
  .acc[open]>.body>div{opacity:1}
}
@media (max-width:660px){
  .trow{flex-wrap:wrap}.trow .tf,.trow .tbtn{width:100%}
  .two{grid-template-columns:1fr;gap:26px}
  .lead-n{font-size:72px}
}

/* 리포트 안 링크는 먹색 밑줄 */
#report a{color:var(--ink);text-decoration:underline;text-decoration-color:#C7C7CC;text-underline-offset:3px}
#report a:hover{text-decoration-color:var(--accent)}
.nm{white-space:nowrap}

/* ══ 로그인 팝업 ══ */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:rgba(32,30,29,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:opacity 480ms cubic-bezier(.16,1,.3,1),visibility 480ms}
.modal.done{opacity:0;visibility:hidden;pointer-events:none}
.mcard{width:min(420px,calc(100vw - 32px));background:var(--paper);border-radius:20px;padding:34px 30px 26px;
  box-shadow:0 30px 90px rgba(32,30,29,.26);transform:scale(1);
  transition:transform 480ms cubic-bezier(.16,1,.3,1)}
.modal.done .mcard{transform:scale(.94)}
.mcard .mname{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mcard .mtag{font-size:11px;color:var(--faint);margin-top:6px}
.mcard .mtag .en{color:var(--accent);font-weight:700;letter-spacing:.08em;margin-right:7px}
.mcard .mtag em{font-style:normal;color:var(--accent);font-weight:700}
.mform{display:flex;gap:9px;margin-top:26px}
.mform input{flex:1;font:inherit;font-size:15px;color:var(--ink);background:var(--panel);
  border:1px solid transparent;border-radius:12px;padding:12px 15px;outline:none;
  transition:background 300ms ease,border-color 300ms ease,box-shadow 300ms ease}
.mform input:focus{background:var(--paper);border-color:rgba(32,30,29,.16);box-shadow:0 0 0 4px rgba(236,48,19,.13)}
.mcard .msg{margin-top:14px}
.mcard .chips{margin-top:13px}

/* ══ 리뷰·차트 부속 ══ */
.rvbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px}
.rvbar input{flex:1;min-width:220px;font:inherit;font-size:13px;color:var(--ink);background:var(--panel);
  border:1px solid transparent;border-radius:11px;padding:10px 13px;outline:none}
.rvbar input:focus{background:var(--paper);border-color:rgba(32,30,29,.16)}
.rvopts{display:flex;flex-direction:column;gap:7px;margin-top:13px;font-size:11px;color:var(--sub)}
.rvopts label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.rvopts input{accent-color:var(--accent)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw span{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--panel);color:var(--sub)}
.cmp{list-style:none;margin:13px 0 0;padding:0}
.cmp li{padding:16px 0;border-bottom:1px solid var(--line)}
.cmp li:last-child{border-bottom:0}
.cmp .top{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:11px}
.cmp .sn{font-size:13px;line-height:1.6;margin-top:8px}
.cmp .fx{font-size:11px;color:var(--accent-ink);font-weight:600;margin-top:6px}
.flag2{position:relative;margin-top:26px;padding:3px 0 3px 21px;border-left:3px solid var(--accent)}
.flag2 .eyebrow{font-size:9px;letter-spacing:.16em;font-weight:700;color:var(--accent)}
.flag2 .lead-read{margin-top:8px;font-size:16px}
svg.trend{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
svg.trend .g{stroke:var(--line);stroke-width:1}
svg.trend .yl{fill:var(--faint);font-size:9px;text-anchor:end}
svg.trend .xl{fill:var(--faint);font-size:9px;text-anchor:middle}
svg.trend path{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.trend path.now{stroke-dasharray:4 4;stroke-width:1.5}
svg.trend circle.now{fill:var(--paper);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11px;color:var(--sub)}
.legend .lg{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.legend .lg i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend .lg small{font-weight:400;color:var(--faint)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;list-style:none;margin:13px 0 0;padding:0}
.thumbs a{display:block;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--panel)}
.thumbs img{width:100%;height:100%;object-fit:contain;display:block}
/* ══ 거리별 밀도 · 주변 업종 구성 (3장) ══ */
.dist{list-style:none;margin:13px 0 0;padding:0}
.dist li{display:flex;align-items:center;gap:13px;padding:7px 0}
.dist .dl{width:76px;flex:none;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.dist .db{flex:1;height:10px;background:var(--panel);border-radius:2px;overflow:hidden}
.dist .db i{display:block;height:100%;background:#6E6E73;
  transform-origin:left center;transform:scaleX(0);transition:transform 900ms cubic-bezier(.2,.8,.2,1)}
.on .dist .db i{transform:scaleX(1)}
.dist li.hot .db i{background:var(--accent)}
.dist li.hot .dn{color:var(--accent-ink);font-weight:700}
.dist .dn{width:56px;flex:none;text-align:right;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums}
.mixbar{display:flex;height:21px;border-radius:3px;overflow:hidden;margin-top:13px;background:var(--panel)}
.mixbar i{display:block;height:100%}
.mixleg{list-style:none;display:flex;flex-wrap:wrap;gap:9px 26px;margin:16px 0 0;padding:0;font-size:11px;color:var(--sub)}
.mixleg li{display:inline-flex;align-items:baseline;gap:7px}
.mixleg li .src9{font-size:11px;color:var(--faint)}
.mixleg i{width:10px;height:10px;border-radius:3px;flex:none}
.mixleg b{color:var(--ink);font-weight:700}

/* ══ 부정 표현 — 빨강은 절제하기로 했으니 본문에는 진한 쪽(#AE1800)을 쓴다 ══ */
.cmp .sn em.neg{font-style:normal;font-weight:700;color:var(--accent-ink)}
/* 빨간 '글씨'는 문제(부정 표현)에만, 우리 해결책은 빨간 '선'으로 — 둘이 안 섞이게 */
.cmp .fx{color:var(--ink);font-weight:600;border-left:2px solid var(--accent);padding-left:9px}
/* 안내 목록 */
.tips{list-style:none;margin:13px 0 0;padding:0;font-size:12px;color:var(--sub)}
.tips li{padding:8px 0;border-bottom:1px solid var(--line);line-height:1.65}
.tips li:last-child{border-bottom:0}
.tips b{color:var(--ink);font-weight:700}

/* ══ 키워드 후보 ══ */
.kwtop{list-style:none;margin:13px 0 0;padding:0 0 13px}
.kwtop li{display:flex;align-items:baseline;gap:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.kwtop li:last-child{border-bottom:0}
.kwtop .kt{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.kwtop li:first-child .kt{color:var(--accent-ink)}
.kwtop .kw9{margin-left:auto;font-size:9px;color:var(--faint);text-align:right;white-space:nowrap}

/* ══ 큰 화면 — 종이 한 장으로 읽히게 ══
   본문 590px은 인쇄 폭(156mm)이라 늘릴 수 없다. 대신 A4 한 장을 통째로 그리고
   배율로 키운다. 인쇄에는 zoom:1이 걸려 있어 출력물은 배율과 무관하다. */
@media screen and (min-width:900px){
  body{background:#E6E6E9}
  .page{width:794px;padding:102px 102px 89px;   /* 794 = A4 폭, 102 = 27mm 여백 */
    background-color:var(--paper);background-origin:content-box;
    box-shadow:0 1px 3px rgba(32,30,29,.10),0 18px 56px rgba(32,30,29,.16);
    zoom:var(--zoom,1)}
  .modal,.zoomui{zoom:var(--zoom,1)}
}
/* 배율 조절 — 우하단 */
.zoomui{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;align-items:center;gap:2px;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;
  box-shadow:0 2px 10px rgba(32,30,29,.10);font-size:11px;color:var(--sub)}
.zoomui button{font:inherit;font-size:14px;line-height:1;border:0;background:none;color:var(--ink);
  width:26px;height:24px;border-radius:7px;cursor:pointer}
.zoomui button:hover{background:var(--panel)}
.zoomui span{min-width:38px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
@media screen and (max-width:899px){ .zoomui{display:none} }

/* ══ 막대 묶음 — 개수에 맞춰 폭·간격이 정해진다 ══ */
.bars{grid-template-columns:repeat(var(--bn,3),var(--bw,88px));column-gap:var(--bgap,59.5px)}

@media print{
  .modal,.rvbar,.rvopts,#sec-images,.zoomui{display:none!important}
  .page{zoom:1!important;box-shadow:none!important}
  .sec.screen-only{display:none!important}
  .core span{opacity:1;color:#D4D4D4}     /* 흰색 80%를 #2A2827 위에 합성한 값 */
  /* 마우스가 차트 위에 있는 채로 인쇄하면 나머지가 흐리게 찍힌다 — 호버 효과를 끈다 */
  /* 낱장 조각이 나지 않게 — 한 덩어리는 한 쪽 안에서 끝낸다 */
  .cmp li,.recent li,.sup li,.tips li,.two,.rest,.flag2,.acts,.tbl tr,.kpi,.bar,.kwtop li,
  .dist,.dist li,.mixbar,.mixleg,.barswrap,.rosewrap
    {break-inside:avoid;page-break-inside:avoid}
  .k,.eyebrow,.legend{break-after:avoid;page-break-after:avoid}
  .bars *,.rosewrap *{filter:none!important;translate:none!important}
  .bars:hover .bar,.bars .bar:hover,.rosewrap:hover .wedge,.rosewrap .wedge:hover
    {opacity:1!important;scale:1!important}
  .bars .bar:hover .n,.lbl.lit .n{scale:1!important}
  /* 전환(transition)은 !important보다 우선한다 — 지연 구간에 갇히지 않게 아예 끈다 */
  .wedge,.lead-l,.lbl,.lbl .n,.lbl .t,.bar,.bar .col,.bar .n,.core,.arule,.bgw,.dist .db i
    {transition:none!important}
  .dist .db i{transform:scaleX(1)!important}
  .wedge,.lead-l,.lbl,.bar .col,.bar .n{opacity:1!important}
  .bars{grid-template-columns:repeat(var(--bn,3),1fr)}
}
</style></head>
<body>
<div class="modal" id="login">
  <div class="mcard">
    <div class="mname">밑그림</div>
    <div class="mtag"><span class="en">SKETCH</span><em>밑</em>천이 되는 <em>그림</em></div>
    <form class="mform" id="authForm" autocomplete="off">
      <input id="pass" type="password" placeholder="팀 비밀번호" aria-label="팀 비밀번호" required autofocus>
      <button class="tbtn" id="authBtn" type="submit">연결</button>
    </form>
    <p class="msg" id="authMsg" role="status" aria-live="polite"></p>
    <div class="chips" id="keyChips" aria-label="중계 서버 키 상태"></div>
  </div>
</div>

<main class="page">
  <div id="scrim"></div>

  <div class="mast">
    <div>
      <div class="name">밑그림</div>
      <div class="tag"><span class="en">SKETCH</span><em>밑</em>천이 되는 <em>그림</em></div>
    </div>
    <div class="ver">v2.40</div>
  </div>

  <section class="tool" id="tool" aria-label="수집 도구">
    <fieldset id="searchSet" disabled>
      <form class="trow" id="searchForm" autocomplete="off">
        <div class="tf grow"><span class="tl">매장 찾기</span>
          <input id="q" type="search" maxlength="60" placeholder="상호와 동네 — 예: 우대포 명동" aria-label="상호와 동네" required></div>
        <div class="tf w96"><span class="tl">반경</span>
          <select id="radius" aria-label="조사 반경">
            <option value="300">300m</option><option value="500" selected>500m</option><option value="1000">1km</option>
          </select></div>
        <button class="tbtn" id="searchBtn" type="submit">검색</button>
      </form>
      <div class="trow">
        <div class="tf grow"><span class="tl">대표 메뉴 <span style="color:#B4B4B9">선택</span></span>
          <input id="keywords" type="text" maxlength="80" placeholder="비우면 업종에서 자동으로 고릅니다" aria-label="대표 메뉴 키워드"></div>
      </div>
    </fieldset>
  </section>

  <p class="msg" id="connMsg"></p>
  <p class="msg" id="searchMsg" role="status" aria-live="polite"></p>
  <ul class="cands" id="cands"></ul>
  <div class="prog" id="prog" role="status" aria-live="polite" hidden>
    <span class="spin" aria-hidden="true"></span><span id="progText">수집 중</span></div>

  <div id="report"></div>

  <div class="acts" id="acts" hidden>
    <button class="abtn primary" id="copyBtn" type="button">코파일럿용 복사</button>
    <button class="abtn" id="txtBtn" type="button">묶음 파일 저장 (.txt)</button>
    <button class="abtn" id="jsonBtn" type="button">JSON 저장</button>
    <button class="abtn" id="printBtn" type="button">인쇄</button>
  </div>
  <p class="msg" id="copyMsg" role="status" aria-live="polite"></p>
</main>

<script>
(() => {
  'use strict';

  // ▼ 배포 후 Cloudflare Worker 주소로 바꾸세요 (끝에 / 없이)
  const API_BASE = 'https://kt.roi0925003.workers.dev';
  const PAGE_VERSION = 'v2.40';
  // 'show' = 발표 모드(느리고 우아한 연출) / 'fast' = 업무 모드(0.4초, 카운트업 없음)
  const MOTION = 'show';
  document.documentElement.dataset.motion = MOTION;

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const el = {
    tool: $('#tool'), scrim: $('#scrim'),
    authForm: $('#authForm'), pass: $('#pass'), authBtn: $('#authBtn'), authMsg: $('#authMsg'), chips: $('#keyChips'),
    searchSet: $('#searchSet'), searchForm: $('#searchForm'), q: $('#q'), radius: $('#radius'),
    keywords: $('#keywords'), searchMsg: $('#searchMsg'), cands: $('#cands'),
    prog: $('#prog'), progText: $('#progText'), result: $('#report'),
    login: $('#login'), connMsg: $('#connMsg'),
    acts: $('#acts'), copyBtn: $('#copyBtn'), txtBtn: $('#txtBtn'), jsonBtn: $('#jsonBtn'),
    printBtn: $('#printBtn'), copyMsg: $('#copyMsg'),
  };
  const state = { pass:'', search:null, bundle:null, busy:false, reviews:null, apifyUsage:null,
    reviewOpts:{ kakao:false, google:false } };

  const RV_LABEL = { naver:'네이버', kakao:'카카오', google:'구글' };
  const KEY_LABEL = { kakao:'카카오', naver:'네이버', dataGoKr:'공공데이터포털', sgis:'SGIS',
    bizinfo:'기업마당', bizinfoEvent:'기업마당 행사', apify:'플레이스 리뷰' };
  const LABEL = { region:'행정구역', nearby:'주변 시설', competition:'같은 업종 점포', population:'동네 인구·사업체',
    online:'온라인 언급', news:'뉴스', images:'메뉴판 사진', trend:'메뉴 검색 추이',
    notices:'지원사업 공고', events:'교육·행사' };
  const NEWS_LABEL = { brand:'상호', area:'동네 상권' };
  const POP_ROWS = [['population','인구','명'],['avgAge','평균 나이','세'],['households','가구','가구'],
    ['avgHouseholdSize','평균 가구원','명'],['houses','주택','호'],['businesses','사업체','곳'],['workers','종사자','명']];
  const TABLE_ORDER_WORDS = /태블릿|테이블\s?오더|티오더|키오스크|메뉴잇|포스오더|셀프\s?주문|무인\s?주문|테이블\s?주문|QR\s?주문|큐알\s?주문|tablet order|kiosk/i;
  const configured = !/YOUR-WORKER/.test(API_BASE);

  /* ── 작은 도구 ── */
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const has = (v) => v !== null && v !== undefined && v !== '' && !Number.isNaN(Number(v));
  const num = (v, unit = '') => (has(v) ? Number(v).toLocaleString('ko-KR') + unit : '—');
  const dist = (m) => {
    if (!has(m)) return '—';
    const v = Number(m);
    if (v < 1000) return `${v}m`;
    return `${(v / 1000).toFixed(v % 1000 === 0 ? 0 : 1)}km`;
  };
  const ym = (s) => (/^\d{6}$/.test(String(s || '')) ? `${String(s).slice(0, 4)}-${String(s).slice(4)}` : String(s || '—'));
  const safeHref = (u) => (/^https?:\/\//i.test(String(u || '')) ? String(u) : '');
  const md = (v) => String(v ?? '—').replace(/\|/g, '\\|').replace(/\s*\n\s*/g, ' ');
  const setMsg = (node, text, kind) => { node.textContent = text || ''; node.className = 'msg' + (kind ? ` ${kind}` : ''); };
  const mod = (b, k) => (b && b.modules && b.modules[k]) || { ok: false, error: '중계 서버 응답에 이 항목이 없습니다. worker.js를 이 페이지와 같은 버전으로 바꿨는지 확인하세요.', source: { name: '' } };
  // 중계 서버 v1.00은 블로그 값만 평평하게 보낸다. 페이지만 먼저 바꿔도 화면이 깨지지 않게 맞춘다.
  const onlineParts = (od) => {
    if (!od) return null;
    if (od.blog || od.cafe || od.waiting) return od;
    return {
      query: od.query,
      blog: { total: od.total, recent: od.recent || [] },
      waiting: { query: od.waitingQuery, total: od.waitingTotal },
      cafe: { error: '중계 서버 v1.00은 카페 글을 모으지 않습니다' },
    };
  };
  const part = (p) => (p && p.error ? null : p || null);
  // 응답에 빠진 항목도 실패로 센다 (중계 서버가 옛 버전일 때)
  const failedModules = (b) => {
    const keys = [...new Set(Object.keys(LABEL).concat(Object.keys((b && b.modules) || {})))];
    return keys.map((k) => [k, mod(b, k)]).filter(([, m]) => !m.ok);
  };
  const srcText = (m) => (m && m.source ? `${m.source.name}${m.fetchedAt ? ` · ${m.fetchedAt}` : ''}` : '');
  const cat = (b, code) => {
    const m = mod(b, 'nearby');
    return m.ok ? (m.data.categories || []).find((c) => c.code === code) || null : null;
  };

  function setBusy(on) {
    state.busy = on;

      res = await fetch(API_BASE + path, {
        method,
        headers: Object.assign({ 'X-Team-Pass': state.pass }, body ? { 'Content-Type': 'application/json' } : {}),
        body: body ? JSON.stringify(body) : undefined,
        signal: ctrl.signal,
        cache: 'no-store',
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw new Error('응답이 너무 늦습니다. 잠시 뒤 다시 시도해 주세요.');
      throw new Error('중계 서버에 연결하지 못했습니다. 회사 PC에서 주소가 막혔거나, 페이지의 중계 서버 주소가 틀렸을 수 있습니다.');
    } finally {
      clearTimeout(timer);
    }
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) {
      // 중계 서버가 보내는 상세 사유까지 보여 준다 (이게 없으면 원인을 알 수 없다)
      const base = (data && data.error) || `중계 서버 오류 (HTTP ${res.status})`;
      const detail = data && data.detail ? ` — ${data.detail}` : '';
      const err = new Error(`${base}${detail}`);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  /* 로즈 — 각도는 균등, 값은 반지름. 1위만 기준의 120%, 나머지는 95~105% */
  function roseSVG(data, totalLabel){
    const cx=295, cy=214, RB=136, rMax=RB*1.2, GAP=1.6*Math.PI/180;
    const tot = data.reduce((a,b) => a+b.v, 0);
    if (!tot) return '';
    const sorted = [...data].sort((a,b) => b.v-a.v);
    const rest = sorted.slice(1).map(d=>d.v);
    const lo = rest.length ? Math.min(...rest) : 0, hi = rest.length ? Math.max(...rest) : 1;
    const radius = (d,i) => i===0 ? RB*1.20 : RB*(0.95 + 0.10*((d.v-lo)/((hi-lo)||1)));
    const step = 2*Math.PI/sorted.length;
    let a = -Math.PI/2, wed='', marks=[];
    sorted.forEach((d,i) => {
      const r = radius(d,i), a0=a+GAP/2, a1=a+step-GAP/2, mid=a+step/2;
      const P = (g,rr) => [(cx+rr*Math.cos(g)).toFixed(2), (cy+rr*Math.sin(g)).toFixed(2)];
      const [x0,y0]=P(a0,r), [x1,y1]=P(a1,r);
      wed += `<path class="wedge" data-i="${i}" style="--wd:${i*190}ms;--ox:${(11*Math.cos(mid)).toFixed(1)}px;--oy:${(11*Math.sin(mid)).toFixed(1)}px"
        fill="${d.c||RAMP[i%RAMP.length]}" d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z"/>`;
      marks.push({...d, i, mid, r, pct:d.v/tot*100}); a += step;
    });
    marks.forEach((m) => {
      m.ax=cx+(m.r+7)*Math.cos(m.mid); m.ay=cy+(m.r+7)*Math.sin(m.mid);
      m.bx=cx+(rMax+16)*Math.cos(m.mid); m.by=cy+(rMax+16)*Math.sin(m.mid);
      m.right=Math.cos(m.mid)>=-0.02;
      m.lx=m.right?cx+rMax+28:cx-rMax-28; m.ly=m.by;
    });
    [true,false].forEach((side) => {
      const g = marks.filter(m=>m.right===side).sort((p,q)=>p.ly-q.ly);
      for (let i=1;i<g.length;i++) if (g[i].ly-g[i-1].ly<42) g[i].ly=g[i-1].ly+42;
      const over = g.length ? g[g.length-1].ly-426 : 0;
      if (over>0) g.forEach(m => { m.ly -= over; });
      g.forEach(m => { if (m.ly<22) m.ly=22; });
    });
    let ln='', lb='';
    marks.forEach((m) => {
      const ex = m.right ? m.lx-7 : m.lx+7;
      ln += `<path class="lead-l" style="--wd:${m.i*190}ms" d="M${m.ax.toFixed(1)},${m.ay.toFixed(1)} L${m.bx.toFixed(1)},${m.by.toFixed(1)} L${(ex+(m.right?-14:14)).toFixed(1)},${m.ly.toFixed(1)} L${ex.toFixed(1)},${m.ly.toFixed(1)}"/>`;
      lb += `<g class="lbl ${m.hot?'hot':''}" data-i="${m.i}" style="--wd:${m.i*190}ms" text-anchor="${m.right?'start':'end'}">
        <text class="n" x="${m.lx}" y="${(m.ly+2).toFixed(1)}">${esc(m.v)}</text>
        <text class="t" x="${m.lx}" y="${(m.ly+15).toFixed(1)}">${esc(m.nm)} · ${m.pct.toFixed(1)}%</text></g>`;
    });
    return `<div class="rosewrap" data-rule="vc,ht,hb">
      <svg class="rose" viewBox="0 0 590 450" aria-label="구성 비율"><g>${wed}</g>${ln}${lb}</svg>
      <div class="core"><b>${esc(Number(tot).toLocaleString('ko-KR'))}</b><span>${esc(totalLabel||'')}</span></div></div>`;
  }

  const TREND_COLORS = ['#201E1D','#EC3013','#6E6E73','#A1A1A6','#C7C7CC'];
  function trendChart(td){
    const series = (td.series||[]).filter(s => (s.points||[]).length);
    if (!series.length) return '';
    const months = series.reduce((a,s) => (s.points.length>a.length ? s.points.map(p=>p.month) : a), []);
    const n = months.length, W=590, H=250, L=32, R=14, T=20, B=28;
    const iw = W-L-R, ih = H-T-B;
    const x = (i) => L + (n>1 ? (i*iw)/(n-1) : iw/2);
    const y = (v) => T + ih - (Math.max(0, Math.min(100, Number(v)))/100)*ih;
    const f = (v) => v.toFixed(1);
    const grid = [0,50,100].map(v => `<line class="g" x1="${L}" x2="${W-R}" y1="${f(y(v))}" y2="${f(y(v))}"/><text class="yl" x="${L-6}" y="${f(y(v)+4)}">${v}</text>`).join('');
    const step = n<=13 ? 1 : n<=26 ? 2 : 3;
    const xl = months.map((m,i) => (i%step===0||i===n-1) ? `<text class="xl" x="${f(x(i))}" y="${H-8}">${esc(String(m).slice(2))}</text>` : '').join('');
    const lines = series.map((s,si) => {
      const c = TREND_COLORS[si%TREND_COLORS.length];
      const pts = s.points.map((p,i) => ({...p, i: months.indexOf(p.month)>=0 ? months.indexOf(p.month) : i}));
      const full = pts.filter(p => has(p.ratio) && p.month !== td.endMonth);
      const now = pts.find(p => has(p.ratio) && p.month === td.endMonth);
      const d = full.map((p,k) => `${k===0?'M':'L'}${f(x(p.i))},${f(y(p.ratio))}`).join(' ');
      const last = full[full.length-1];
      const nowPath = now && last ? `<path class="now" stroke="${c}" d="M${f(x(last.i))},${f(y(last.ratio))} L${f(x(now.i))},${f(y(now.ratio))}"/>` : '';
      const dots = pts.filter(p => has(p.ratio)).map(p => `<circle${p.month===td.endMonth?' class="now"':''} cx="${f(x(p.i))}" cy="${f(y(p.ratio))}" r="3" fill="${c}" stroke="${c}"><title>${esc(s.keyword)} ${esc(p.month)}: ${esc(p.ratio)}</title></circle>`).join('');
      return `<g>${d?`<path stroke="${c}" d="${d}"/>`:''}${nowPath}${dots}</g>`;
    }).join('');
    const legend = series.map((s,si) => `<span class="lg"><i style="background:${TREND_COLORS[si%TREND_COLORS.length]}"></i>${esc(s.keyword)}<small>최고 ${esc(s.peak?`${s.peak.month} (${s.peak.ratio})`:'—')}</small></span>`).join('');
    return `<div class="legend">${legend}</div>
      <svg class="trend" viewBox="0 0 ${W} ${H}" data-rule="ht,hb" role="img" aria-label="메뉴 검색 추이">${grid}${xl}${lines}</svg>`;
  }


  /* ══════════ 섹션 렌더러 ══════════
     각 렌더러는 { html, meta } 를 돌려주거나, 쓸 데이터가 없으면 null 을 돌려준다.
     null 이면 그 섹션은 통째로 그려지지 않고 장번호도 건너뛴다.
     "수집은 됐는데 0건"은 정보이므로 null 이 아니다 — 실패만 null 이다. */

  const badge = (kind, text) => `<span class="bdg ${kind}">${esc(text)}</span>`;
  const failNote = (m) => `<p class="src9">${badge('fail','수집 안 됨')} ${esc(errLine(m))}</p>`;
  function errLine(m){
    const show = m && has(m.seconds) && (isSlow(m) || Number(m.seconds) >= 1);
    return `${(m && m.error) || '수집하지 못했습니다'}${show ? ` (${m.seconds}초)` : ''}`;
  }
  const isSlow = (m) => /시간 초과|끊겼|연결 실패/.test(String((m && m.error) || ''));
  function tbl(pairs){
    return `<table class="tbl">${pairs.map(([k,v]) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join('')}</table>`;
  }
  function linkText(link, title){
    const t = esc(title || '(제목 없음)');
    const u = safeHref(link);
    return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t}</a>` : t;
  }

  /* ── 01 매장 ── */
  function renderStore(b){
    const s = b.store || {};
    const R = (b.options && b.options.radius) || 500;
    const region = mod(b,'region'), comp = mod(b,'competition'), pop = mod(b,'population');
    const online = mod(b,'online'), notices = mod(b,'notices');
    const admin = region.ok && region.data.admin;
    const cd = comp.ok ? comp.data : null;
    const pd = pop.ok ? pop.data : null;
    const od = online.ok ? onlineParts(online.data) : null;
    const blog = od && part(od.blog), cafe = od && part(od.cafe);

    const kpi = (k,v,sub) => `<div class="kpi"><div class="k">${esc(k)}</div>
      <div class="v">${esc(v)}</div><div class="s">${esc(sub)}</div></div>`;
    const kpis = '<div class="kpis" data-rule="ht,vc">' + [
      kpi(`같은 업종 (반경 ${dist(R)})`, cd && cd.matched ? num(cd.sameSmall.count) : '—',
        cd && cd.matched ? `소분류 ‘${cd.industry.small}’, 이 매장 제외` : comp.ok ? '상가정보에서 매장을 못 찾음' : '수집 안 됨'),
      kpi('종사자 ÷ 인구', pd && has(pd.workerPerResident) ? String(pd.workerPerResident) : '—',
        pd ? `${pd.admName} · ${pd.year}년` : '수집 안 됨'),
      kpi('블로그 · 카페 언급', od ? `${num(blog && blog.total)} · ${num(cafe && cafe.total)}` : '—',
        od ? '검색 결과 수라 다른 매장 글이 섞일 수 있습니다' : '수집 안 됨'),
      kpi('지금 되는 지원사업', notices.ok ? num((notices.data.items||[]).length) : '—',
        notices.ok ? `${notices.data.sido} 기준 · 접수 중` : '수집 안 됨'),
    ].join('') + '</div>';

    const links = [
      safeHref(s.placeUrl) ? `<a href="${esc(s.placeUrl)}" target="_blank" rel="noopener">카카오맵</a>` : '',
      safeHref(s.naverLink) ? `<a href="${esc(s.naverLink)}" target="_blank" rel="noopener">네이버 등록</a>` : '',
    ].filter(Boolean).join(' · ');

    const lic = licence(b), P = placeInfo(b);
    const ld = mod(b,'localdata');
    const rows = [
      ['업종 (카카오)', esc(s.category || '—')],
      ['업종 (네이버)', esc(s.naverCategory || '—')],
      ['도로명 주소', esc(s.roadAddress || '—')],
      ['지번 주소', esc(s.address || '—')],
      ['전화', esc(s.phone || '—')],
      ['행정동', region.ok ? esc(admin ? `${admin.name} (코드 ${admin.code})` : '—') : badge('fail','수집 안 됨')],
      ['링크', links || '—'],
    ];
    if (P && hoursText(P)) rows.push(['영업일 · 시간', esc(hoursText(P))]);
    if (P && parkText(P))  rows.push(['주차', esc(parkText(P))]);
    const amen = P ? P.amenities.filter(x => !/^주차/.test(x)) : [];
    if (amen.length) rows.push(['편의시설', esc(amen.join(' · '))]);
    if (P && P.seats) rows.push(['좌석 · 공간', esc(P.seats)]);
    if (lic) rows.push(['인허가일 (업력)', esc(`${lic.ymd} · ${ageText(lic)}`) +
      (lic.state ? ` <span class="src9">${esc(lic.state)}</span>` : '') +
      (lic.exact ? '' : ' <span class="src9">상호가 비슷한 곳을 골랐습니다 — 확인하세요</span>')]);
    else if (ld.ok === false && ld.error) rows.push(['인허가일 (업력)',
      badge('fail','수집 안 됨') + ` <span class="src9">${esc(ld.error)}</span>`]);
    const info = tbl(rows);

    const html = `<div class="eyebrow">STORE</div>
      <div class="nm" data-rule="ht,hb,vr">${esc(s.name || '매장')}</div>
      <div class="meta2">${esc([s.category, s.roadAddress || s.address].filter(Boolean).join(' · ') || '—')}</div>
      ${kpis}${info}
      ${(b.notes||[]).map(t => `<p class="src9">${esc(t)}</p>`).join('')}
      <p class="src9">좌표 ${has(s.x) ? esc(`${Number(s.y).toFixed(6)}, ${Number(s.x).toFixed(6)}`) : '—'}</p>`;
    return { html, meta: (s.sources||[]).join(' · ').toUpperCase() || 'KAKAO · NAVER' };
  }

  /* ── 동네 인구·사업체 — 극단적 스케일 대비 ── */
  function renderPop(b){
    const pop = mod(b,'population');
    if (!pop.ok) return null;                         // 수집 실패 → 섹션 자체를 빼고 푸터에 기록
    const pd = pop.data, cmp = pd.compare || {};
    const sido = cmp.sido, nation = cmp.nation;
    const comp = mod(b,'competition');
    const cd = comp.ok ? comp.data : null;

    const r = has(pd.workerPerResident) ? Number(pd.workerPerResident) : null;
    let read = '이 동네의 성격을 판단할 값이 없습니다.';
    if (r !== null) {
      /* 인구 비율은 '동네 성격'까지만 말한다. 언제 손님이 오는지는 매장 영업일이 정한다 —
         토·일 휴무인 가게에 "주말에 몰린다"고 적으면 그 자리에서 신뢰를 잃는다. */
      const P2 = placeInfo(b);
      const kind = r >= 1
        ? `사는 사람보다 일하러 오는 사람이 많은 <b>직장가</b>입니다.`
        : `일하러 오는 사람보다 사는 사람이 ${(1/r).toFixed(1)}배 많은 <b>주거지</b>입니다.`;
      let when;
      if (P2 && P2.weekendOff){
        when = `이런 동네는 보통 저녁·주말이 큰데, 이 매장은 <b>${esc(P2.closed.join('·'))} 휴무</b>라 그 수요를 받지 못합니다. 평일 수요로 읽으세요.`;
      } else if (P2 && P2.openDays.length === 7){
        when = r >= 1 ? `주 7일 영업이라 평일 점심이 가장 큽니다.` : `주 7일 영업이라 저녁과 주말을 그대로 받습니다.`;
      } else {
        when = r >= 1 ? `평일 점심이 클 가능성이 높습니다 — 영업시간으로 확인하세요.`
                      : `저녁·주말이 클 가능성이 높습니다 — 영업일·휴무를 먼저 확인하세요.`;
      }
      read = `${kind} ${when}`;
    }
    const refLine = [
      sido && has(sido.workerPerResident) ? `${sido.name} ${sido.workerPerResident}` : '',
      nation && has(nation.workerPerResident) ? `전국 ${nation.workerPerResident}` : '',
    ].filter(Boolean).join(' · ');

    // 인구를 분모로 돌려 쓸 수 있는 파생 지표 — 단독 인구수보다 영업에 쓰인다
    let perStore = null;
    if (cd && cd.matched && has(cd.sameSmall.count) && has(pd.population) && Number(cd.sameSmall.count) > 0) {
      perStore = Math.round(Number(pd.population) / (Number(cd.sameSmall.count) + 1));
    }

    const two = `<div class="two">
      <div><div class="k">인구 ${perStore ? '몇 명당 같은 업종 1곳' : ''}</div>
        <div class="v">${perStore ? num(perStore) : num(pd.population)}</div>
        <div class="lead-ref">${perStore ? `명당 1곳 · 인구 ${num(pd.population,'명')} · 같은 업종 ${num(cd.sameSmall.count,'곳')}`
          : `명 · ${sido ? `${esc(sido.name)} ${num(sido.population,'명')}` : ''}`}</div></div>
      <div><div class="k">평균 나이</div>
        <div class="v">${has(pd.avgAge) ? esc(pd.avgAge) : '—'}</div>
        <div class="lead-ref">세 · ${[sido && has(sido.avgAge) ? `${esc(sido.name)} ${sido.avgAge}` : '',
          nation && has(nation.avgAge) ? `전국 ${nation.avgAge}` : ''].filter(Boolean).join(' · ') || '비교값 없음'}</div></div>
    </div>`;

    const restKeys = [['population','인구','명'],['avgHouseholdSize','평균 가구원','명'],
      ['businesses','사업체','곳'],['workers','종사자','명']];
    const rest = restKeys.map(([k,label,unit]) => `${label} ${num(pd[k],unit)}`).join(' · ');

    const html = `<div class="k">종사자 ÷ 인구</div>
      <div class="lead-n" data-rule="hb,vr">${r !== null ? esc(pd.workerPerResident) : '—'}</div>
      <div class="lead-read">${read}</div>
      <div class="lead-ref">${refLine ? esc(refLine) + ' &nbsp;|&nbsp; ' : ''}1보다 크면 직장가</div>
      ${two}
      <div class="rest">${rest}</div>
      <div class="src9">${esc(pd.admName)} (SGIS 코드 ${esc(pd.admCd)}) · ${esc(pd.year)}년 기준${
        pd.compareError ? ` · ${badge('warn','비교값 없음')} ${esc(pd.compareError)}` : ''}</div>`;
    return { html, meta: srcText(pop).toUpperCase() };
  }

  /* ── 섹션 목록 ── */
  const SECTIONS = [
    { id:'store',   title:'매장',                    bg:'매장', cls:'hero', render:renderStore },
    { id:'nearby',  title:'주변 시설 구성',            bg:'주변', render:renderNearby },
    { id:'comp',    title:'같은 업종 점포',            bg:'업종', render:renderComp },
    { id:'pop',     title:'동네 인구·사업체',          bg:'동네', render:renderPop },
    { id:'reviews', title:'손님 불편 신호',            bg:'리뷰', render:renderReviewSection },
    { id:'online',  title:'온라인 언급',               bg:'언급', render:renderOnline },
    { id:'news',    title:'뉴스',                     bg:'뉴스', render:renderNews },
    { id:'trend',   title:'메뉴 검색 추이',            bg:'추이', render:renderTrend },
    { id:'keyword', title:'플레이스 노출 키워드 후보',   bg:'검색', render:renderKeyword },
    { id:'support', title:'사장님께 알려드릴 지원사업·교육', bg:'지원', render:renderSupport },
    { id:'manual',  title:'사람이 채울 것',            bg:'현장', render:renderManual },
    { id:'images',  title:'메뉴판 사진',               bg:'메뉴', render:renderImages },
  ];

  /* ── 푸터 ── */
  function renderFoot(b){
    const failed = failedModules(b);
    const fails = failed.map(([k,m]) => `<li>${esc(LABEL[k]||k)} — ${esc(errLine(m))}</li>`);
    const nearby = mod(b,'nearby'), online = mod(b,'online'), news = mod(b,'news');
    const partial = nearby.ok ? (nearby.data.categories||[]).filter(c=>c.error)
      .map(c => `<li>주변 시설 ${esc(c.label)} — ${esc(c.error)}</li>`) : [];
    const od = online.ok ? onlineParts(online.data) : null;
    if (od) [['blog','블로그'],['waiting','‘웨이팅’ 블로그'],['cafe','카페']].forEach(([k,n]) => {
      if (od[k] && od[k].error) partial.push(`<li>온라인 언급 ${esc(n)} — ${esc(od[k].error)}</li>`); });
    if (news.ok) (news.data.queries||[]).filter(x=>x.error)
      .forEach(x => partial.push(`<li>뉴스 ‘${esc(x.q)}’ — ${esc(x.error)}</li>`));
    const list = fails.concat(partial);
    const slow = failed.some(([,m]) => isSlow(m))
      ? '<p class="src9">서버가 느리거나 연결이 끊겨 못 가져온 항목이 있습니다. 한 번 더 수집하면 대개 채워집니다.</p>' : '';
    return `<footer class="foot">
      ${list.length ? `<div style="margin-bottom:13px"><b style="color:var(--ink)">수집하지 못한 항목</b>
        <ul class="errs" style="margin-top:6px">${list.join('')}</ul>${slow}</div>` : ''}
      모든 숫자에는 출처와 조회 시각이 붙습니다. 공개 데이터와 추정치이므로 리포트에 쓰기 전에 원본과 한 번 대조해 주세요.<br>
      수집 ${esc(b.collectedAt||'')} · 반경 ${dist((b.options&&b.options.radius)||500)} · 수집기 ${esc(b.version||'')} / 페이지 ${PAGE_VERSION}
    </footer>`;
  }

  /* 배경 타이포 — 글자 폭을 역산해 마지막 글자의 24%만 칼럼 밖으로 나가게 둔다 */
  function bgWord(word, no){
    const F = 250 + ((no*29)%60);                 // 250~309px
    const w = F * 0.95 * word.length;             // 한글 글자 폭 ≈ 0.95em
    const left = Math.round(590 + 0.24*F - w);
    const top = -Math.round(16 + ((no*37)%52));
    return `<div class="bgw" style="left:${left}px;top:${top}px;font-size:${F}px">${esc(word)}</div>`;
  }

  /* ── 리포트 조립 — 장번호는 실제로 그려진 섹션에만 순서대로 매긴다 ── */
  function renderReport(b){
    let no = 0;
    const parts = SECTIONS.map((sd) => {
      let r = null;
      try { r = sd.render(b); } catch (e) { console.error(sd.id, e); r = null; }
      if (!r) return '';
      no += 1;
      return `<section class="sec ${sd.cls||''}${r.static?' static':''}${r.screenOnly?' screen-only':''}" id="sec-${sd.id}">
        ${sd.bg ? bgWord(sd.bg, no) : ''}
        <div class="hd">
          <div class="chap" data-rule="hb,vr"><span class="dig">${no}</span><h2>${esc(sd.title)}</h2></div>
          <span class="meta">${esc(r.meta||'')}</span>
        </div>
        ${r.html}
      </section>`;
    });
    return parts.join('') + renderFoot(b);
  }


  /* ── 주변 시설 (로즈) ── */
  function renderNearby(b){
    const m = mod(b,'nearby');
    if (!m.ok) return null;
    const R = (b.options && b.options.radius) || 500;
    const cats = (m.data.categories||[]).filter(c => !c.error && has(c.count) && Number(c.count) > 0);
    const uni = m.data.universities || { list: [] };
    const data = cats.map(c => ({ nm:c.label, v:Number(c.count) }));
    if (!uni.error && (uni.list||[]).length) data.push({ nm:'대학교', v:(uni.list||[]).length });
    if (!data.length) return null;                       // 반경 안에 아무것도 없음 → 섹션 생략
    // 숙박이 있으면 관광 상권 신호라 빨강 하나를 여기에 준다
    const hotIdx = data.findIndex(d => /숙박/.test(d.nm));
    if (hotIdx >= 0){ data[hotIdx].c = '#EC3013'; data[hotIdx].hot = 1; }
    const near = cats.filter(c => (c.nearest||[]).length)
      .map(c => `${esc(c.label)} ${(c.nearest||[]).map(x => `${esc(x.name)} ${esc(dist(x.distance))}`).join(', ')}`).join(' · ');
    const lodge = data.find(d => /숙박/.test(d.nm));
    const tot = data.reduce((a,d)=>a+d.v,0);
    const read = lodge && lodge.v/tot >= 0.08
      ? `숙박 ${lodge.v}곳이 전체의 ${(lodge.v/tot*100).toFixed(1)}%입니다 — 밖에서 오는 손님이 섞이는 상권으로 읽습니다.`
      : '가까운 시설이 손님이 어디서 오는지를 말해 줍니다.';
    return { html: roseSVG(data, '곳') +
      `<p class="lead-read" style="font-size:15px;margin-top:8px">${read}</p>
       <p class="src9">조각은 같은 각도를 나눠 갖고 개수는 반지름으로 읽습니다. 정확한 값은 옆의 숫자가 책임집니다.
       ${near ? `<br>가까운 곳 — ${near}` : ''}
       ${(m.data.notes||[]).map(t=>`<br>${esc(t)}`).join('')}</p>`,
      meta: `${srcText(m).toUpperCase()} · 반경 ${dist(R)}` };
  }

  /* ── 같은 업종 점포 (세로 막대) ── */
  function renderComp(b){
    const m = mod(b,'competition');
    if (!m.ok) return null;
    const R = (b.options && b.options.radius) || 500;
    const cd = m.data;
    if (!cd.matched){
      const nb = cd.nearby || {};
      const list = (nb.list||[]).slice(0,10).map(x => `${esc(x.name)}<span class="src9"> ${esc([x.small||x.large, x.floor?`${x.floor}층`:''].filter(Boolean).join(' '))}</span>`).join(' · ');
      return { html: `<p class="lead-read" style="font-size:15px">${badge('warn','매장 못 찾음')} ${esc(cd.note||'상가정보에서 이 매장을 찾지 못했습니다.')}</p>
        ${list ? `<p class="src9">${esc(nb.from||'주변')}에 등록된 상가 (매장 확인용이지 경쟁 수치가 아닙니다)<br>${list}</p>` : ''}`,
        meta: srcText(m).toUpperCase() };
    }
    const data = [
      { nm:cd.industry.large||'대분류', v:Number(cd.sameLarge.count||0), sub:'대분류', c:'#C7C7CC' },
      { nm:cd.industry.middle||'중분류', v:Number(cd.sameMiddle.count||0), sub:`중분류 · ${cd.sameLarge.count?((cd.sameMiddle.count/cd.sameLarge.count)*100).toFixed(1):'—'}%`, c:'#6E6E73' },
      { nm:cd.industry.small||'소분류', v:Number(cd.sameSmall.count||0), sub:`소분류 · ${cd.sameLarge.count?((cd.sameSmall.count/cd.sameLarge.count)*100).toFixed(1):'—'}%`, c:'#EC3013', hot:1 },
    ];
    /* 상가정보는 점포 목록을 통째로 주는 API다. 개수로 접어 두면 아까운 것 셋을 더 편다. */
    const bands = (cd.sameSmall.bands || []);
    const near  = (cd.neighbors || []).filter(x => x && x.name);
    const mix   = (cd.mix || []).filter(x => x && x.small && x.count);

    return { html: barsHTML(data) +
      `<p class="lead-read" style="font-size:15px;margin-top:21px">반경 ${dist(R)} 안 ${esc(cd.industry.large||'음식')} ${esc(num(cd.sameLarge.count,'곳'))} 가운데
        ${esc(cd.industry.middle)} ${esc(num(cd.sameMiddle.count,'곳'))}, 그중 <b>${esc(cd.industry.small)} ${esc(num(cd.sameSmall.count,'곳'))}</b>입니다.</p>`
      + distHTML(bands, cd.industry.small, R, Number(cd.sameSmall.count)||0)
      + nearHTML(near)
      + mixHTML(mix, cd.mixTotal, R)
      + hoodHTML(licence(b), R)
      + `<p class="src9">상가정보 등록 상호 ‘${esc(cd.matchedName)}’ (좌표 차이 ${esc(dist(cd.matchedDistance))}${cd.floor?`, ${esc(cd.floor)}층`:''})${cd.how?` · ${esc(cd.how)}에서 찾음`:''} · 자료 기준월 ${esc(ym(cd.stdrYm))}${bands.length?'':` · 거리별 — ${esc(bandText(bands,' · '))}`}</p>`,
      meta: `${srcText(m).toUpperCase()} · 반경 ${dist(R)}` };
  }

  /* 거리별 밀도 — 가까울수록 위협이다. 세로 막대를 또 쓰면 지루하니 가로 띠로 */
  function distHTML(bands, small, R, total){
    if (!bands.length) return '';
    const mx = Math.max(...bands.map(x => Number(x.count)||0), 1);
    const lab = (x) => `${x.from ? `${x.from}~` : ''}${x.to}m`;
    const closest = bands[0];
    return `<p class="k" style="margin-top:34px">거리별 ${esc(small||'같은 업종')} — 가까울수록 같은 손님을 나눕니다</p>
      <ul class="dist" data-rule="vl,vr">${bands.map((x,i) => {
        const v = Number(x.count)||0, w = Math.max(v/mx*100, 1.5);
        return `<li${i===0?' class="hot"':''}><span class="dl">${esc(lab(x))}</span>
          <span class="db"><i style="width:${w.toFixed(1)}%"></i></span>
          <span class="dn">${esc(num(v,'곳'))}</span></li>`;
      }).join('')}</ul>
      ${densLine(closest, R, total)}`;
  }
  /* 개수만 보면 먼 구간이 늘 커 보인다 — 땅 넓이로 나눠야 '촘촘함'이 보인다 */
  function densLine(c, R, total){
    if (!c || !Number(c.count) || !R || !total) return '';
    const ring = Math.PI * (Math.pow(Number(c.to),2) - Math.pow(Number(c.from)||0, 2));
    const all  = Math.PI * Math.pow(Number(R), 2);
    if (!(ring > 0) || !(all > 0)) return '';
    const k = (all/total) / (ring/Number(c.count));
    const lab = `${c.from ? `${c.from}~` : ''}${c.to}m`;
    return `<p class="src9">가장 가까운 ${esc(lab)} 안에 ${esc(num(c.count,'곳'))} — 땅 넓이로 따지면
      반경 ${dist(R)} 평균보다 <b>${k.toFixed(1)}배 촘촘</b>합니다. 이 구간이 실제 경쟁입니다.</p>`;
  }

  /* 바로 옆 경쟁점 — 방문 전에 눈으로 훑을 수 있게 */
  function nearHTML(near){
    if (!near.length) return '';
    return `<p class="k" style="margin-top:34px">바로 옆 ${esc(num(near.length,'곳'))} — 방문 전에 한 번 보고 가세요</p>
      <table class="tbl">${near.slice(0,6).map(x =>
        `<tr><th>${esc(dist(x.distance))}</th><td>${esc(x.name)}${x.small?` <span class="src9">${esc(x.small)}</span>`:''}</td></tr>`).join('')}</table>`;
  }

  /* 동네 업력 — 인허가 자료로만 나오는 숫자. 새로 여는 곳과 닫은 곳이 경쟁 압력이다 */
  function hoodHTML(L, R){
    const h = L && L.hood;
    if (!h || !has(h.active)) return '';
    const pc = h.active ? (h.newly / h.active * 100) : 0;
    return `<p class="k" style="margin-top:34px">${esc(h.where)} 일반음식점 — 얼마나 자주 바뀌는 동네인가</p>
      <div class="two" style="margin-top:13px">
        <div><div class="k">최근 ${esc(h.years)}년 새로 연 곳</div>
          <div class="v" style="font-size:54px">${esc(num(h.newly))}</div>
          <div class="lead-ref">곳 · 영업 중 ${esc(num(h.active,'곳'))}의 ${pc.toFixed(1)}%</div></div>
        <div><div class="k">폐업으로 기록된 곳</div>
          <div class="v" style="font-size:54px">${esc(num(h.closed))}</div>
          <div class="lead-ref">곳 · 자료에 쌓인 누계입니다</div></div>
      </div>
      <p class="src9">행정동이 아니라 <b>주소에 ‘${esc(h.where)}’가 들어간 곳</b>을 센 값이라, 위의 반경 ${dist(R)} 숫자와 기준이 다릅니다. 같이 놓고 비교하지 마세요.</p>`;
  }

  /* 주변 업종 구성 — 이 골목이 무슨 골목인지 */
  function mixHTML(mix, total, R){
    if (mix.length < 2) return '';
    const tot = Number(total) || mix.reduce((a,x) => a + Number(x.count||0), 0);
    if (!tot) return '';
    const top = mix.slice(0,5);
    const rest = tot - top.reduce((a,x) => a + Number(x.count), 0);
    const pc = (v) => (v/tot*100);
    return `<p class="k" style="margin-top:34px">반경 ${dist(R)} 음식점 ${esc(num(tot,'곳'))}은 무슨 골목인가</p>
      <div class="mixbar" data-rule="hb">${top.map((x,i) =>
        `<i style="width:${pc(x.count).toFixed(2)}%;background:${['#201E1D','#4A4846','#6E6E73','#A1A1A6','#C7C7CC'][i]}"></i>`).join('')}${
        rest > 0 ? `<i style="width:${pc(rest).toFixed(2)}%;background:#E5E5E7"></i>` : ''}</div>
      <ul class="mixleg">${top.map((x,i) =>
        `<li><i style="background:${['#201E1D','#4A4846','#6E6E73','#A1A1A6','#C7C7CC'][i]}"></i>${esc(x.small)}
          <b>${esc(num(x.count,'곳'))}</b><span class="src9">${pc(x.count).toFixed(1)}%</span></li>`).join('')}${
        rest > 0 ? `<li><i style="background:#E5E5E7"></i>그 밖<b>${esc(num(rest,'곳'))}</b><span class="src9">${pc(rest).toFixed(1)}%</span></li>` : ''}</ul>`;
  }

  /* ── 손님 불편 신호 (늦게 도착 · 연출 없음) ── */
  function renderReviewSection(b){

  /* ── 온라인 언급 ── */

      <p class="src9">검색 결과 수라서 다른 매장 글이 섞일 수 있습니다. 많고 적음을 보는 참고치로만 씁니다.
        ${others.length?`<br>${badge('warn','주의')} 최근 블로그 글 ${(blog.recent||[]).length}건 중 ${others.length}건이 같은 브랜드의 다른 지점(${esc([...new Set(others.map(r=>r.otherBranch))].join(', '))}) 글입니다.`:''}</p>
      ${row(blog&&blog.recent,true) ? `<p class="k" style="margin-top:26px">최근 블로그 글</p><ul class="recent" data-rule="ht">${row(blog.recent,true)}</ul>` : ''}

      meta: srcText(m).toUpperCase() };

      meta: srcText(m).toUpperCase() };

  /* ── 지원사업·교육 (3단 아코디언) ── */
  const SUP_T1 = ['인천 소상공인 경영환경 개선 지원','인천신용보증재단 특례보증','인천 소상공인·서민금융 상담 창구','소상공인 지식배움터','기업마당 지원사업 검색'];
  const SUP_T2 = ['스마트상점·디지털 전환 지원','소상공인 정책자금 (융자)','지역신용보증재단 보증서'];
  function supList(items){
    return `<ul class="sup">${items.map(x => `<li><div><div class="what">${badge('info', x.scope==='가구'?'사장님 가구':x.scope)} ${esc(x.what)}</div>
      <div class="why">${esc(x.why)} · ${esc(x.where)}</div></div>
      <a href="${esc(x.href)}" target="_blank" rel="noopener noreferrer">열기</a></li>`).join('')}</ul>`;
  }
  function acc(title, count, inner, open){
    return `<details class="acc"${open?' open':''}><summary>${esc(title)}<span class="cnt">${esc(count)}</span><i class="ico" aria-hidden="true"></i></summary>
      <div class="body"><div><div class="inner">${inner}</div></div></div></details>`;
  }
  function renderSupport(b){
    const notices = mod(b,'notices'), events = mod(b,'events'), region = mod(b,'region');
    const admin = region.ok && region.data.admin;
    const sido = admin ? admin.sido : '';
    const inIncheon = /인천/.test(String(sido||''));
    const list = SUPPORT.filter(x => x.scope !== '인천' || inIncheon);

    const t2 = list.filter(x => SUP_T2.includes(x.what));
    const t3 = list.filter(x => !SUP_T1.includes(x.what) && !SUP_T2.includes(x.what));

    let live = '';
    if (notices.ok){
      const items = notices.data.items || [];
      live += `<p class="k" style="margin-top:8px">지금 접수 중인 공고 · ${esc(num(items.length,'건'))}</p>
        <ul class="recent">${items.length ? items.map(x => `<li><span class="d"></span><span>${linkText(x.link,x.title)}<span class="by">${esc([x.org,x.target?`대상 ${x.target}`:'',x.period,x.contact].filter(Boolean).join(' · '))}</span></span></li>`).join('')
          : '<li><span class="d"></span><span style="color:var(--faint)">해당되는 공고가 없습니다</span></li>'}</ul>`;
    }
    if (events.ok){
      const items = events.data.items || [];
      live += `<p class="k" style="margin-top:21px">갈 만한 교육·행사 · ${esc(num(items.length,'건'))}</p>
        <ul class="recent">${items.length ? items.map(x => `<li><span class="d"></span><span>${linkText(x.link,x.title)}<span class="by">${esc([x.kind,x.org,x.period?`행사 ${x.period}`:'',x.apply?`접수 ${x.apply}`:''].filter(Boolean).join(' · '))}</span></span></li>`).join('')
          : '<li><span class="d"></span><span style="color:var(--faint)">지금은 이 지역에 해당되는 행사가 없습니다</span></li>'}</ul>`;

    const html = `<p class="lead-read" style="font-size:15px">주소와 업종으로 <b>확정되는 것</b>만 펼쳐 두었습니다. 나머지는 사장님 사정에 따라 갈립니다.</p>
      <p class="src9">안내만 하고 신청은 사장님이 직접 하십니다. 대신 신청하거나 수수료를 받는 일은 하지 마세요.
        정부지원금을 미끼로 접근하는 사칭 업체가 있으니 공식 누리집에서만 신청하시라고 함께 알려 드리세요.
        아래 제도 목록은 ${esc(SUPPORT_CHECKED)} 기준이라 금액과 마감은 반드시 원문에서 다시 확인해야 합니다.</p>
      <div style="margin-top:21px" data-rule="ht">

      </div>
      <p class="k" style="margin-top:26px">사장님께 여쭤볼 것</p>
      <p class="src9" style="margin-top:2px">대답에 따라 위 제도 해당 여부가 갈립니다. 이 목록은 현장에서 쓰는 것이라 인쇄물에 항상 남습니다.</p>
      <ul class="ask" style="margin-top:11px">${ASK_OWNER.map(q => `<li>${esc(q)}</li>`).join('')}</ul>
      ${inIncheon ? '' : '<p class="src9">이 매장은 인천이 아니어서 인천시 사업은 숨겼습니다. 기업마당에서 해당 지역으로 검색하세요.</p>'}`;
    return { html, meta: (notices.ok ? srcText(notices).toUpperCase() : '기업마당') };
  }

  /* ── 사람이 채울 것 ── */

  /* ── 메뉴판 사진 (화면 전용) ── */
  function renderImages(b){
    const m = mod(b,'images');
    if (!m.ok) return null;
    const d = m.data || {};
    const items = (d.items||[]).filter(it => safeHref(it.thumbnail));
    if (!items.length) return null;
    const search = safeHref(d.searchUrl);
    return { html: `<p class="src9">참고용입니다. 사진이 올라간 게시글 주소를 받을 수 없어 출처를 밝힐 수 없으므로 리포트·코파일럿 묶음·JSON에는 넣지 않습니다.
        사진 속 가격은 언제 찍었는지 알 수 없으니 매장에서 확인하세요. <b>인쇄물에는 나오지 않습니다.</b></p>
      <ul class="thumbs">${items.map((it,i) => `<li><a href="${esc(safeHref(it.image)||search)}" target="_blank" rel="noopener noreferrer">
        <img src="${esc(it.thumbnail)}" alt="${esc(it.title||`메뉴판 사진 ${i+1}`)}" loading="lazy" decoding="async" referrerpolicy="no-referrer"></a></li>`).join('')}</ul>
      ${search ? `<p class="src9"><a href="${esc(search)}" target="_blank" rel="noopener noreferrer">네이버 이미지 검색에서 더 보기</a> · ‘${esc(d.query)}’ ${esc(num(d.total,'장'))} 중 ${items.length}장</p>` : ''}`,
      meta:'NAVER IMAGE · 화면 전용', screenOnly:true };
  }

  /* ══════════ 플레이스 노출 키워드 후보 ══════════
     네이버는 키워드를 넣어 두기만 하면 올려 주지 않는다. 사장님이 직접 넣는 칸은
     대표키워드 5개뿐이고, 나머지는 상호·메뉴·소개글·편의시설·리뷰에서 자동으로 뽑힌다.
     여기서는 이미 가진 자료로 후보를 조합만 한다 — 검색량 검증은 다음 단계. */

  const KW_OCC = [
    { w:'회식',   adj:'회식',     place:true  },
    { w:'모임',   adj:'모임',     place:true  },
    { w:'단체',   adj:'단체',     place:true  },
    { w:'가족',   adj:'가족',     place:true  },
    { w:'돌잔치', adj:'돌잔치',   place:true  },
    { w:'상견례', adj:'상견례',   place:true  },
    { w:'데이트', adj:'데이트',   place:true  },
    { w:'점심',   adj:'점심',     place:false },
    { w:'혼밥',   adj:'혼밥',     place:false },
    { w:'룸',     adj:'룸 있는',  place:false, ask:'룸이 실제로 있는지' },
    { w:'주차',   adj:'주차되는', place:false, ask:'매장 주차가 되는지' },
    { w:'포장',   adj:'포장되는', place:false, ask:'포장을 받는지' },
  ];
  const KW_KIND = [
    [/육류|고기|구이|갈비|삼겹|막창|곱창/, '고깃집'],
    [/횟집|물회|막회|생선|수산|해물/,      '횟집'],
    [/치킨|닭강정/,                        '치킨집'],
    [/중식|중국|짜장|짬뽕/,                '중국집'],
    [/일식|초밥|스시|돈카츠|돈까스/,        '일식당'],
    [/분식|떡볶이|김밥/,                   '분식집'],
    [/주점|술집|호프|포차|이자카야/,        '술집'],
    [/카페|커피|디저트|베이커리/,           '카페'],
    [/한식|백반|국밥|찌개/,                '한식당'],
  ];
  const KW_FOOD = ['숯불갈비','생갈비','양념갈비','소갈비','돼지갈비','갈비','삼겹살','목살','오겹살','막창','곱창',
    '불고기','한우','냉면','칼국수','보쌈','족발','감자탕','부대찌개','해물탕','물회','막회','회','초밥','돈까스',
    '치킨','피자','파스타','국밥','설렁탕','삼계탕','떡볶이','짜장면','짬뽕','곰탕','추어탕','아구찜','장어'];

  /* 지역어 — 행정동, 시군구, 가까운 지하철역 */
  function kwPlaces(b){
    const region = mod(b,'region'), nb = mod(b,'nearby'), out = [];
    const ad = region.ok && region.data.admin;
    if (ad){
      if (ad.dong) out.push({ t:String(ad.dong).replace(/\d+동$/,'동'), why:'행정동', s:3 });
      const tk = String(ad.name||'').split(/\s+/).filter(Boolean);
      const gu = tk.slice(1,-1).filter(x => /[시군구]$/.test(x)).pop();
      if (gu) out.push({ t:gu, why:'시·군·구', s:2 });
    }
    if (nb.ok){
      const c = (nb.data.categories||[]).find(c => c.label==='지하철역');
      const st = c && (c.nearest||[])[0];
      /* 카카오는 '인천터미널역 인천1호선'처럼 노선명을 붙여 준다 — 첫 '역'까지만 쓴다.
         그리고 800m가 넘으면 도보 10분 밖이라 역 이름으로 찾아오지 않는다. */
      const nm = st && st.name ? (/^(.+?역)/.exec(String(st.name)) || [])[1] : '';
      if (nm && (!has(st.distance) || Number(st.distance) <= 800))
        out.push({ t:nm, why:`가까운 역 ${dist(st.distance)}`, s:3 });
    }
    return out;
  }

  /* 업종어 — 상호에 박힌 음식 이름이 제일 세다 */
  function kwKinds(b){
    const s = b.store || {}, comp = mod(b,'competition'), out = [];
    const nm = String(s.name||'');
    const P = placeInfo(b);
    const hay = [nm, s.category, s.naverCategory, P && P.intro,
      comp.ok && comp.data.industry && comp.data.industry.small].filter(Boolean).join(' ');
    KW_FOOD.forEach(f => {                       // 뒤에 한글이 이어지면 다른 낱말이다 ('한우리'의 '한우')
      if (new RegExp(f + '(?![가-힣])').test(nm) && !out.some(o=>o.t===f)) out.push({ t:f, why:'상호', s:3 });
    });
    for (let i=out.length-1; i>=0; i--){          // '숯불갈비'가 있으면 '갈비'는 군더더기
      if (out.some((o,j) => j!==i && o.t.includes(out[i].t) && o.t.length>out[i].t.length)) out.splice(i,1);
    }
    ((b.options && b.options.keywords) || []).forEach(k => {
      k = String(k).trim(); if (k && !out.some(o=>o.t===k)) out.push({ t:k, why:'대표 메뉴', s:2 });
    });
    for (const [re, label] of KW_KIND){
      if (re.test(hay)){ if(!out.some(o=>o.t===label)) out.push({ t:label, why:'업종', s:2 }); break; }
    }
    return out.slice(0,4);
  }

  /* 상황어 — 동네 사람들이 실제로 쓴 말에서만 고른다 */
  function kwOccs(b){
    const online = mod(b,'online'), news = mod(b,'news'), nb = mod(b,'nearby'), texts = [];
    const P = placeInfo(b);
    if (P && P.intro) texts.push(P.intro);            // 사장님이 직접 쓴 말이 제일 세다
    if (online.ok){
      const d = online.data;
      ((d.blog && d.blog.recent) || []).forEach(x => texts.push(x.title));
      ((d.cafe && d.cafe.recent) || []).forEach(x => texts.push(x.title));
    }
    if (news.ok) (news.data.queries || []).forEach(q => (q.recent||[]).forEach(x => texts.push(x.title)));
    const hay = texts.filter(Boolean).join(' ');
    const out = [];
    const why0 = (w) => (P && P.intro && P.intro.includes(w)) ? '매장 소개글에 있는 말' : '동네 글에 나온 말';
    KW_OCC.forEach(o => { if (hay.includes(o.w)) out.push(Object.assign({ why:why0(o.w), s:2 }, o)); });
    /* 편의시설이 들어오면 추측을 확정으로 바꾸고 ASK를 뗀다 */
    if (P){
      const amen = (P.amenities||[]).join(' ');
      const conf = (w, ok, why) => {
        if (!ok) return;
        const d = KW_OCC.find(x => x.w === w); if (!d) return;
        const i = out.findIndex(o => o.w === w);
        const row = Object.assign({}, d, { why, s:3, ask:'' });
        if (i >= 0) out[i] = row; else out.push(row);
      };
      conf('주차', P.parking && P.parking.available !== false, `플레이스에 주차 가능${P.parking && P.parking.paid ? '(유료)' : ''}`);
      conf('포장', /포장/.test(amen), '플레이스 편의시설에 포장');
      conf('단체', /단체/.test(amen), '플레이스 편의시설에 단체석');
    }
    if (nb.ok){
      const g = (L) => { const c=(nb.data.categories||[]).find(c=>c.label===L); return c ? c.count : 0; };
      const add = (w, why) => { const d = KW_OCC.find(x=>x.w===w);
        if (d && !out.some(o=>o.w===w)) out.push(Object.assign({ why, s:1 }, d)); };
      if (g('숙박') >= 5) add('회식', `주변 숙박 ${g('숙박')}곳 — 밖에서 오는 손님`);
      if (g('주차장') >= 5) add('주차', `주변 주차장 ${g('주차장')}곳`);
      if (g('관광명소') >= 3) add('가족', `주변 관광명소 ${g('관광명소')}곳`);
    }
    return out.slice(0,5);
  }

  /* 후보 조합 — 지역 × 업종이 뼈대, 상황은 덧붙임 */
  function kwBuild(b){
    const places = kwPlaces(b), kinds = kwKinds(b), occs = kwOccs(b);
    if (!places.length || !kinds.length) return null;
    const list = [];
    const push = (t, why, s, ask) => {
      t = t.replace(/\s+/g,' ').trim();
      if (t.length > 22) return;
      if (!list.some(c => c.t === t)) list.push({ t, why, s, ask: ask||'' });
    };
    places.forEach(p => kinds.forEach(k => {
      push(`${p.t} ${k.t}`, `${p.why} × ${k.why}`, p.s + k.s);
      const c = list[list.length-1]; if (c) c.basic = true;
    }));
    places.slice(0,2).forEach(p => occs.forEach(o => {
      kinds.slice(0,2).forEach(k => push(`${p.t} ${o.adj} ${k.t}`, o.why, p.s + k.s + o.s - 1, o.ask));
      if (o.place) push(`${p.t} ${o.w} 장소`, o.why, p.s + o.s, o.ask);
    }));
    list.sort((a,c) => c.s - a.s);
    const top = [], useP = {}, useK = {};          // 한 지역·한 업종이 다섯 칸을 다 먹지 않게
    const take = (c) => {
      if (top.length >= 5 || top.indexOf(c) >= 0) return;
      const pl = (places.find(p => c.t.indexOf(p.t) === 0) || {}).t || '';
      const kd = (kinds.find(k => c.t.slice(-k.t.length) === k.t) || {}).t || '';
      if ((useP[pl]||0) >= 3 || (useK[kd]||0) >= 3) return;
      useP[pl] = (useP[pl]||0) + 1; useK[kd] = (useK[kd]||0) + 1; top.push(c);
    };
    list.filter(c => c.basic).slice(0,2).forEach(take);   // 기본형 두 자리는 먼저 잡아 둔다
    list.forEach(take);
    const rest = list.filter(c => top.indexOf(c) < 0).slice(0,12);
    return { top, rest, places, kinds, occs, total: list.length };
  }

  function renderKeyword(b){
    const K = kwBuild(b);
    if (!K) return null;
    const asks = K.top.concat(K.rest).filter(c => c.ask);
    const seen = [];
    asks.forEach(c => { if (!seen.includes(c.ask)) seen.push(c.ask); });

    const html =
      `<p class="k">스마트플레이스 대표키워드 5칸에 넣을 후보</p>
       <ol class="kwtop" data-rule="vl,hb">${K.top.map(c =>
         `<li><span class="kt">${esc(c.t)}</span><span class="kw9">${esc(c.why)}</span></li>`).join('')}</ol>
       <p class="src9">지역 이름과 세부 업종을 붙인 형태입니다. ‘맛집’·‘추천’처럼 누구나 쓰는 말은 뺐습니다.
         검색량은 아직 확인하지 않았습니다 — 다섯 개를 그대로 넣기 전에 사장님과 한 번 읽어 보세요.</p>` +

      (K.rest.length ? `<p class="k" style="margin-top:26px">소개글·메뉴명·블로그에 섞어 쓸 후보 ${esc(num(K.rest.length,'개'))}</p>` +
        tbl(K.rest.map(c => [c.t, `<span class="src9">${esc(c.why)}</span>`])) : '') +

      (seen.length ? `<div class="flag2"><div class="eyebrow">ASK</div>
        <div class="lead-read">사장님께 먼저 여쭐 것 — ${esc(seen.join(' / '))}</div>
        <p class="src9">주변에 주차장이 많다고 우리 가게에 주차가 되는 것은 아닙니다. 확인 못 한 말을 넣으면 손님이 헛걸음합니다.</p></div>` : '') +

      `<p class="k" style="margin-top:26px">키워드만으로는 안 오릅니다</p>
       <ul class="tips">
         <li><b>편의시설 체크</b>가 따로 잡습니다 — 주차·단체석·예약은 키워드가 아니라 스마트플레이스 편의시설에서 켜세요.</li>
         <li><b>영수증 리뷰</b>가 일반 리뷰보다 무겁게 셉니다 — 실제 방문 증거라서 그렇습니다.</li>
         <li><b>문장형은 검색어가 아닙니다</b> — ‘주차장이 있는 식당’이 아니라 ‘${esc(K.places[0].t)} 주차되는 ${esc(K.kinds[0].t)}’처럼 씁니다.</li>
         <li>소식·사진을 손대지 않으면 키워드를 바꿔도 순위가 잘 움직이지 않습니다.</li>
       </ul>`;

    return { html, meta: `조합 규칙 · 후보 ${K.total}개 · 검색량 미검증` };
  }

  /* ── 불만 리뷰 안의 부정 표현만 빨갛게 ──
     이미 '불만'으로 분류된 리뷰 안에서만 칠하므로 오검출 비용이 낮다. */
  const NEG_WORDS = [
    '기다렸','기다리','기다려','한참','오래 걸','오래걸','늦게 나','늦어','늦었','지연','밀려서','밀렸',
    '안 나와','안나와','느리','느려','느렸','하세월','계속 불러','불러야','부르느라','호출이',
    '불친절','무뚝뚝','퉁명','성의 없','성의없','무시당','무시하','짜증','쌀쌀맞','불쾌',
    '불편','불만','실망','아쉬','별로','최악','다시는','다신 안','후회','기분 나','기분나','언짢','화가 났',
    '더럽','지저분','불결','머리카락','벌레','냄새가','비린내','위생이',
    '시들','질기','질겼','싱거','눅눅','식었','식어서','차갑','딱딱','맛없','맛이 없','비려','탄 맛',
    '비싸','비쌌','바가지','양이 적','양 적','돈 아까','돈아까',
    '좁아','좁고','좁은','시끄','소란','붐벼','자리가 없','주차가 힘','웨이팅',
    '안 돼','안돼','안 됨','못했','못 했','없어서','없었','아쉽'
  ];
  const NEG_RE = new RegExp('(' + NEG_WORDS.slice().sort((a,b)=>b.length-a.length)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')','g');
  function negHTML(t){
    t = String(t || ''); NEG_RE.lastIndex = 0;
    let out = '', last = 0, m;
    while ((m = NEG_RE.exec(t))){
      if (!m[0].length){ NEG_RE.lastIndex++; continue; }
      out += esc(t.slice(last, m.index)) + '<em class="neg">' + esc(m[0]) + '</em>';
      last = m.index + m[0].length;
    }
    return out + esc(t.slice(last));
  }


  /* ══════════ 손님 불편 신호 (플레이스 리뷰) ══════════ */
  const RV_POLL_MS = 5000;
  const RV_TRIES = 40;                       // 5초 × 40 = 3분 20초까지 기다린다
  const RV_LINK = { 네이버:'플레이스에서 확인', 카카오:'카카오맵에서 확인', 구글:'구글 리뷰 열기' };

  function usageLine(){
    const u = state.apifyUsage;
    if (!u || !has(u.used) || !has(u.limit)) return '';
    const ratio = u.limit > 0 ? u.used/u.limit : 0;
    const left = ratio >= 0.9 ? ' · 거의 소진되어 이번 기간에는 더 가져오지 못합니다' : '';
    return `<span class="src9" style="display:block;margin-top:7px">${ratio>=0.9?badge('warn','한도 임박')+' ':''}이번 달 리뷰 수집 비용 $${Number(u.used).toFixed(2)} / $${Number(u.limit).toFixed(2)}${u.cycleEnd?` · ${esc(u.cycleEnd)} 갱신`:''}${esc(left)}</span>`;
  }
  const usageBlocked = () => { const u = state.apifyUsage;
    return Boolean(u && has(u.used) && has(u.limit) && u.limit>0 && u.used/u.limit>=0.9); };

  function renderReviews(){
    const rv = state.reviews;
    const ready = state.bundle && configured;
    const blocked = usageBlocked();
    const hasKakao = Boolean(state.bundle && state.bundle.store && /place\.map\.kakao\.com\/\d+/.test(String(state.bundle.store.placeUrl||'')));
    const opts = `<div class="rvopts">
      <label><input type="checkbox" id="rvKakao"${state.reviewOpts.kakao?' checked':''}${hasKakao?'':' disabled'}> 카카오맵 리뷰도 (최신 100건 · 별점 있음${hasKakao?'':' · 카카오 후보로 수집한 매장만'})</label>
      <label><input type="checkbox" id="rvGoogle"${state.reviewOpts.google?' checked':''}> 구글 지도 리뷰도 (최신 50건 · 외국인 손님 매장)</label></div>
      <p class="src9">기본은 네이버만 · 매장당 약 $0.10, 셋 다 켜면 약 $0.40</p>`;
    const btn = (label) => `<div class="rvbar"><button type="button" class="abtn primary" id="rvBtn"${(rv&&rv.running)||blocked?' disabled':''}>${esc(label)}</button>
      <span class="src9">네이버 플레이스 방문자 리뷰 최신 100건 · 1~3분 걸립니다</span></div>${usageLine()}${opts}`;

    if (!ready) return '<p class="src9">먼저 매장을 수집해 주세요.</p>';
    if (!rv) return `<p class="lead-read" style="font-size:15px">아직 가져오지 않았습니다. 리뷰에는 블로그·카페에 올라오지 않는 진짜 불만이 담겨 있습니다.</p>${btn('플레이스 리뷰 가져오기')}`;
    if (rv.running) return `<div class="prog"><span class="spin" aria-hidden="true"></span><span>${esc(rv.message||'리뷰를 모으는 중입니다')}</span></div>${btn('가져오는 중')}`;
    if (rv.error) return `<p class="lead-read" style="font-size:15px">${badge('fail','실패')} ${esc(rv.error)}</p>${btn('다시 가져오기')}`;

    const d = rv.data || {}, place = d.place || {}, out = [];

      if (has(d.unrated)) out.push(`<p class="src9">별점이 있는 리뷰 ${esc(num(d.rated,'건'))}${has(d.ratingAvg)?` (평균 ${esc(d.ratingAvg)})`:''} · 별점 없는 리뷰 ${esc(num(d.unrated,'건'))} — 네이버는 2021년부터 별점 대신 키워드로 평가합니다. 위 막대는 별점이 있는 것만 센 값입니다.</p>`);

    const to = tableOrderSignals(d);

      <p class="src9">리포트는 ‘주문 불편 해소’가 아니라 ‘지금 태블릿으로 되는 것 / 하이오더로만 되는 것’ 비교(전환형)로 쓰고, 방문 때 어떤 기기인지 확인하세요.
      ${to.hits.map(h=>`<br>${esc(h.source)} · ${esc(h.date||'—')} · “${esc(h.text)}”`).join('')}</p></div>`);

    const items = d.complaints || [];
    if (!items.length){
      out.push(`<p class="lead-read" style="font-size:15px;margin-top:26px">분석한 ${esc(num(total,'건'))} 가운데 불만이 적힌 리뷰를 찾지 못했습니다. 리뷰가 고르게 긍정적인 매장입니다 — 이건 그대로 리포트의 강점으로 쓰세요.</p>`);

      out.push(`<p class="k" style="margin-top:26px">불만이 적힌 리뷰 ${esc(num(items.length,'건'))} 중 ${esc(num(d.hiorderCount,'건'))}은 하이오더로 손볼 수 있습니다</p>
        <p class="src9">리포트에 쓸 때는 작성 시점을 함께 적으세요. 맛·위생·가격 불만은 하이오더로 해결되지 않으니 그 말은 쓰지 마세요.</p>`);
      out.push(`<ul class="cmp">${items.map((x) => {
        const c = x.category;

        return `<li><div class="top">${x.source?badge('info',x.source)+' ':''}${tag} ${x.link?linkText(x.link, RV_LINK[x.source]||'원문 확인'):'<span class="src9">링크 없음</span>'}</div>

      <button type="button" class="abtn" id="rvBtn"${blocked?' disabled':''}>이 주소로 다시</button></div>${usageLine()}${opts}`);
    return out.join('');
