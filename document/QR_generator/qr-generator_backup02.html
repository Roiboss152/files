<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KT Synergy - Ultimate QR Showcase</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-deep: #050507;
            --accent-cyan: #00f0ff;
            --accent-blue: #0057ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed; width: 60vw; height: 60vw; border-radius: 50%;
            filter: blur(150px); opacity: 0.15; z-index: -1; pointer-events: none;
            animation: orbFloat 15s infinite alternate ease-in-out;
        }
        .glow-1 { top: -20%; left: -10%; background: var(--accent-cyan); }
        .glow-2 { bottom: -20%; right: -10%; background: var(--accent-blue); animation-delay: -7s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 80px) scale(1.2); }
        }

        /* Scroll Reveal Utility Classes */
        .reveal { opacity: 0; transform: translateY(50px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.2s; }
        .delay-2 { transition-delay: 0.4s; }

        /* Hero Section */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; position: relative;
        }
        .hero-badge {
            padding: 8px 16px; background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 50px; color: var(--accent-cyan); font-size: 0.8rem; font-weight: 700; letter-spacing: 2px;
            margin-bottom: 20px; text-transform: uppercase;
        }
        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem); font-weight: 800; line-height: 1.1; letter-spacing: -2px;
            background: linear-gradient(180deg, #FFFFFF 0%, #666666 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px;
        }
        .scroll-indicator {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; opacity: 0.5; animation: bounce 2s infinite;
        }
        .scroll-line { width: 1px; height: 40px; background: linear-gradient(to bottom, #fff, transparent); margin-top: 10px; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); } 40% { transform: translateY(-10px) translateX(-50%); } }

        /* Section Layout */
        .section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 100px 20px; max-width: 1000px; margin: 0 auto; }
        .sec-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 50px; letter-spacing: -1px; }
        
        /* Grid Cards (Step 1) */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .type-card {
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 40px 30px; text-align: center; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden;
        }
        .type-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); transition: 0.5s;
        }
        .type-card:hover { transform: translateY(-10px); border-color: var(--accent-cyan); box-shadow: 0 20px 40px rgba(0, 240, 255, 0.1); }
        .type-card:hover::before { left: 100%; }
        .card-icon { font-size: 2rem; margin-bottom: 20px; color: var(--accent-cyan); }
        .card-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }

        /* Modal (Pop-up) Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; display: flex; justify-content: center; align-items: center;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: rgba(15, 15, 20, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            width: 100%; max-width: 600px; padding: 50px 40px; position: relative;
            transform: translateY(50px) scale(0.95); opacity: 0; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0, 240, 255, 0.1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); opacity: 1; }
        
        .btn-close {
            position: absolute; top: 20px; right: 25px; background: none; border: none; color: #fff;
            font-size: 1.5rem; cursor: pointer; opacity: 0.5; transition: opacity 0.2s;
        }
        .btn-close:hover { opacity: 1; }

        /* Form Inputs inside Modal */
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--accent-cyan); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 16px 20px; color: #fff; font-size: 1.1rem; outline: none; transition: all 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); background: rgba(0,0,0,0.6); }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .dynamic-form { display: none; }
        .dynamic-form.active { display: block; animation: modalFadeIn 0.5s; }
        @keyframes modalFadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        .btn-save {
            width: 100%; padding: 18px; margin-top: 10px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 100%);
            color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s;
        }
        .btn-save:hover { box-shadow: 0 10px 30px rgba(0, 240, 255, 0.4); transform: translateY(-2px); }

        /* Step 3 & 4 (Logo & Design) */
        .option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .option-label input { display: none; }
        .option-card {
            padding: 20px; border: 1px solid var(--glass-border); border-radius: 16px; text-align: center;
            background: rgba(255,255,255,0.02); cursor: pointer; transition: all 0.3s; color: var(--text-muted); font-weight: 600;
        }
        .option-label input:checked ~ .option-card { border-color: #fff; color: #fff; background: rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(255,255,255,0.1); }

        .color-picker-wrap { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; padding: 20px; background: var(--glass-bg); border-radius: 16px; border: 1px solid var(--glass-border); }
        .preset-color { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .preset-color:hover { transform: scale(1.1); }
        .preset-color.active { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.5); }

        .template-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .template-card { border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; cursor: pointer; position: relative; }
        .template-img { width: 100%; height: 250px; object-fit: cover; opacity: 0.6; transition: 0.5s; }
        .template-label input:checked ~ .template-card { border-color: var(--accent-cyan); box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); }
        .template-label input:checked ~ .template-card .template-img { opacity: 1; transform: scale(1.05); }
        .template-name { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-weight: 700; font-size: 1.1rem; }

        /* Output Area */
        .btn-epic {
            display: block; width: 100%; padding: 25px; margin: 80px 0; border: none; border-radius: 20px;
            background: #fff; color: #000; font-size: 1.5rem; font-weight: 800; cursor: pointer;
            transition: all 0.4s; position: relative; overflow: hidden;
        }
        .btn-epic:hover { transform: scale(1.02); box-shadow: 0 20px 50px rgba(255,255,255,0.2); }

        .result-area { display: none; text-align: center; padding: 60px 0; }
        .result-area.active { display: block; animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes revealUp { from { opacity: 0; transform: translateY(100px); } to { opacity: 1; transform: translateY(0); } }
        #finalCanvas { max-width: 100%; border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        #qr-hidden { display: none; }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <header class="hero">
        <div class="hero-badge reveal">KT Synergy Sales Team</div>
        <h1 class="hero-title reveal delay-1">The Ultimate<br>QR Generator</h1>
        <p class="reveal delay-2" style="font-size: 1.2rem; color: var(--text-muted);">디지털 명함부터 마케팅 템플릿까지 완벽한 통합</p>
        <div class="scroll-indicator">
            <span style="font-size: 0.8rem; letter-spacing: 2px;">SCROLL</span>
            <div class="scroll-line"></div>
        </div>
    </header>

    <section class="section">
        <h2 class="sec-title reveal">01. Select Type</h2>
        <div class="card-grid">
            <div class="type-card reveal" onclick="openModal('wifi')">
                <div class="card-icon">📶</div><div class="card-title">Wi-Fi</div><div style="color:var(--text-muted); font-size:0.9rem;">스캔 즉시 네트워크 접속</div>
            </div>
            <div class="type-card reveal delay-1" onclick="openModal('url')">
                <div class="card-icon">🔗</div><div class="card-title">URL Link</div><div style="color:var(--text-muted); font-size:0.9rem;">지정된 웹사이트로 랜딩</div>
            </div>
            <div class="type-card reveal delay-2" onclick="openModal('vcard')">
                <div class="card-icon">🪪</div><div class="card-title">Digital vCard</div><div style="color:var(--text-muted); font-size:0.9rem;">연락처 자동 저장 시스템</div>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="inputModal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModal()">✕</button>
            <h3 style="font-size: 2rem; font-weight: 700; margin-bottom: 30px;" id="modalTitle">정보 입력</h3>
            
            <input type="hidden" id="selectedType" value="">

            <div id="form-wifi" class="dynamic-form">
                <div class="form-group"><label>SSID</label><input type="text" id="wifi-ssid" placeholder="예: KT_GiGA_5G"></div>
                <div class="input-row">
                    <div class="form-group"><label>Password</label><input type="text" id="wifi-pw" placeholder="비밀번호 입력"></div>
                    <div class="form-group"><label>Security</label><select id="wifi-type"><option value="WPA">WPA/WPA2</option><option value="nopass">없음</option></select></div>
                </div>
            </div>

            <div id="form-url" class="dynamic-form">
                <div class="form-group">
                    <label>Landing URL</label>
                    <input type="text" id="url-input" placeholder="https://kt.com">
                </div>
            </div>

            <div id="form-vcard" class="dynamic-form">
                <div class="input-row">
                    <div class="form-group"><label>Name</label><input type="text" id="vc-name" placeholder="예: 이대희"></div>
                    <div class="form-group"><label>Phone</label><input type="tel" id="vc-phone" placeholder="예: 010-1234-5678"></div>
                </div>
                <div class="input-row">
                    <div class="form-group"><label>Company</label><input type="text" id="vc-company" placeholder="예: KT"></div>
                    <div class="form-group"><label>Department</label><input type="text" id="vc-dept" placeholder="예: 시너지영업3팀"></div>
                </div>
                <div class="input-row">
                    <div class="form-group"><label>Position</label><input type="text" id="vc-title" placeholder="예: 과장"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="vc-email" placeholder="예: daehee.lee@kt.com"></div>
                </div>
            </div>

            <button class="btn-save" onclick="saveAndScrollToNext()">Confirm & Continue</button>
        </div>
    </div>

    <section class="section" id="section-design">
        <h2 class="sec-title reveal">02. Aesthetics</h2>
        
        <h3 class="reveal" style="margin-bottom: 20px; color: var(--text-muted);">Center Logo</h3>
        <div class="option-grid reveal delay-1">
            <label class="option-label"><input type="radio" name="logoType" value="none" checked><div class="option-card">미사용</div></label>
            <label class="option-label"><input type="radio" name="logoType" value="kt"><div class="option-card">KT BI 로고</div></label>
        </div>

        <h3 class="reveal" style="margin-bottom: 20px; color: var(--text-muted);">QR Pattern Color</h3>
        <div class="color-picker-wrap reveal delay-2">
            <input type="hidden" id="qr-color" value="#000000">
            <div class="preset-color active" style="background: #ffffff;" onclick="setQRColor(this, '#ffffff')"></div>
            <div class="preset-color" style="background: #00d2ff;" onclick="setQRColor(this, '#00d2ff')"></div>
            <div class="preset-color" style="background: #000000;" onclick="setQRColor(this, '#000000')"></div>
            <div class="preset-color" style="background: #ff004f;" onclick="setQRColor(this, '#ff004f')"></div>
        </div>
    </section>

    <section class="section" id="section-template">
        <h2 class="sec-title reveal">03. Synthesis Template</h2>
        <div class="template-grid">
            <label class="template-label reveal">
                <input type="radio" name="bgTemplate" value="none" checked>
                <div class="template-card" style="display: flex; align-items: center; justify-content: center; height: 250px; border: 1px dashed var(--glass-border);">
                    <div style="font-size: 1.5rem; font-weight: 700; color: #fff;">투명 배경 (QR만 추출)</div>
                </div>
            </label>
            <label class="template-label reveal delay-1">
                <input type="radio" name="bgTemplate" value="t2">
                <div class="template-card">
                    <img src="https://kt-synergy.com/assets/image/qr_templates/qr_template_02_sample.png" class="template-img" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSIxNCIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPlRlbXBsYXRlIDI8L3RleHQ+PC9zdmc+'">
                    <div class="template-name">Forest Template</div>
                </div>
            </label>
            <label class="template-label reveal delay-2">
                <input type="radio" name="bgTemplate" value="t3">
                <div class="template-card">
                    <img src="https://kt-synergy.com/assets/image/qr_templates/qr_template_03_sample.png" class="template-img" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSIxNCIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPlRlbXBsYXRlIDM8L3RleHQ+PC9zdmc+'">
                    <div class="template-name">Cityscape Template</div>
                </div>
            </label>
        </div>

        <button class="btn-epic reveal" onclick="generateComposite()">RENDER FINAL ASSET</button>

        <div id="result-area" class="result-area">
            <h2 style="font-size: 3rem; font-weight: 800; margin-bottom: 40px; color: var(--accent-cyan);">Ready to Deploy.</h2>
            <div id="qr-hidden"></div>
            <canvas id="finalCanvas"></canvas>
            <br>
            <a id="download-link" class="btn-epic" style="margin-top: 40px; background: var(--accent-cyan); color: #000;" download="kt_synergy_asset.png">DOWNLOAD HIGH-RES IMAGE</a>
        </div>
    </section>

    <script>
        // Scroll Reveal Observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

        // Modal Logic
        const modal = document.getElementById('inputModal');
        
        function openModal(type) {
            document.getElementById('selectedType').value = type;
            document.querySelectorAll('.dynamic-form').forEach(el => el.classList.remove('active'));
            document.getElementById('form-' + type).classList.add('active');
            
            const titles = { 'wifi': 'Wi-Fi Configuration', 'url': 'Landing URL', 'vcard': 'Digital vCard Data' };
            document.getElementById('modalTitle').innerText = titles[type];
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function saveAndScrollToNext() {
            closeModal();
            // Smooth scroll to next section
            document.getElementById('section-design').scrollIntoView({ behavior: 'smooth' });
        }

        // Color Picker
        function setQRColor(element, hex) {
            document.querySelectorAll('.preset-color').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('qr-color').value = hex;
        }

        // Core Generation Logic (Combined from previous robust version)
        async function generateComposite() {
            const type = document.getElementById('selectedType').value;
            if(!type) { alert("먼저 상단에서 QR 종류를 선택하고 정보를 입력해 주세요."); window.scrollTo({top:0, behavior:'smooth'}); return; }
            
            const color = document.getElementById('qr-color').value;
            const templateMode = document.querySelector('input[name="bgTemplate"]:checked').value;
            const logoType = document.querySelector('input[name="logoType"]:checked').value;
            
            let qrData = "";
            if (type === 'wifi') {
                const ssid = document.getElementById('wifi-ssid').value;
                const pw = document.getElementById('wifi-pw').value;
                const sec = document.getElementById('wifi-type').value;
                qrData = `WIFI:T:${sec};S:${ssid};P:${pw};H:false;;`;
            } else if (type === 'url') {
                qrData = document.getElementById('url-input').value;
            } else if (type === 'vcard') {
                const n = document.getElementById('vc-name').value;
                const p = document.getElementById('vc-phone').value;
                const c = document.getElementById('vc-company').value;
                const d = document.getElementById('vc-dept').value;
                const t = document.getElementById('vc-title').value;
                const e = document.getElementById('vc-email').value;
                qrData = `BEGIN:VCARD\nVERSION:3.0\nN:${n}\nORG:${c};${d}\nTITLE:${t}\nTEL:${p}\nEMAIL:${e}\nEND:VCARD`;
            }

            const qrHidden = document.getElementById('qr-hidden');
            qrHidden.innerHTML = '';
            
            // Generate QR
            new QRCode(qrHidden, {
                text: qrData, width: 600, height: 600, colorDark : color,
                colorLight : templateMode === 'none' && color === '#ffffff' ? '#000000' : (templateMode !== 'none' ? "#ffffff" : "#ffffff"), 
                correctLevel : QRCode.CorrectLevel.H
            });

            setTimeout(async () => {
                const qrImageURL = qrHidden.querySelector('canvas').toDataURL("image/png");
                const canvas = document.getElementById('finalCanvas');
                const ctx = canvas.getContext('2d');
                
                let bgLoaded = new Promise((resolve) => {
                    if (templateMode === 'none') {
                        canvas.width = 600; canvas.height = 600;
                        ctx.fillStyle = "rgba(0,0,0,0)";
                        if(color === '#ffffff') ctx.fillStyle = "#111";
                        ctx.fillRect(0,0,600,600); resolve(null);
                    } else {
                        let bgImg = new Image(); bgImg.crossOrigin = "Anonymous";
                        bgImg.src = templateMode === 't2' ? "https://kt-synergy.com/assets/image/qr_templates/qr_template_02.png" : "https://kt-synergy.com/assets/image/qr_templates/qr_template_03.png";
                        bgImg.onload = () => { canvas.width = 1080; canvas.height = 1920; ctx.drawImage(bgImg, 0, 0, 1080, 1920); resolve(bgImg); };
                        bgImg.onerror = () => { canvas.width = 1080; canvas.height = 1920; ctx.fillStyle = "#111"; ctx.fillRect(0,0,1080,1920); resolve(null); };
                    }
                });

                await bgLoaded;

                const baseQRImg = new Image();
                baseQRImg.onload = async () => {
                    let qrX = 0, qrY = 0, qrSize = 600;
                    if(templateMode !== 'none') {
                        qrSize = 600; qrX = (1080 - qrSize) / 2; qrY = templateMode === 't2' ? 300 : 250;
                        ctx.fillStyle = "#ffffff"; ctx.fillRect(qrX - 20, qrY - 20, qrSize + 40, qrSize + 40);
                    }
                    ctx.drawImage(baseQRImg, qrX, qrY, qrSize, qrSize);

                    if (logoType === 'kt') {
                        let logoImg = new Image(); logoImg.crossOrigin = "Anonymous";
                        let loadLogo = new Promise((res) => { logoImg.onload = res; logoImg.onerror = res; logoImg.src = "https://kt-synergy.com/assets/image/CI_BI/kt_icon02.png"; });
                        await loadLogo;
                        if (logoImg.src) { const lSize = qrSize * 0.28; ctx.drawImage(logoImg, qrX + (qrSize-lSize)/2, qrY + (qrSize-lSize)/2, lSize, lSize); }
                    }

                    if (templateMode !== 'none') {
                        ctx.fillStyle = "#222"; ctx.textAlign = "center";
                        let textY = qrY + qrSize + 120;
                        
                        if (type === 'vcard') {
                            ctx.font = "40px Pretendard, sans-serif"; ctx.fillText(`${document.getElementById('vc-company').value} ${document.getElementById('vc-dept').value}`, 540, textY);
                            ctx.font = "bold 60px Pretendard, sans-serif"; ctx.fillText(`${document.getElementById('vc-name').value} ${document.getElementById('vc-title').value}`, 540, textY + 80);
                            ctx.font = "40px Pretendard, sans-serif"; ctx.fillText(document.getElementById('vc-phone').value, 540, textY + 160);
                            ctx.fillText(document.getElementById('vc-email').value, 540, textY + 230);
                        } else {
                            ctx.font = "bold 60px Pretendard, sans-serif"; ctx.fillText("KT Synergy Sales", 540, textY);
                        }
                    }

                    document.getElementById('result-area').classList.add('active');
                    document.getElementById('download-link').href = canvas.toDataURL("image/png");
                    setTimeout(() => document.getElementById('result-area').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                };
                baseQRImg.src = qrImageURL;
            }, 100);
        }
    </script>
</body>
</html>
