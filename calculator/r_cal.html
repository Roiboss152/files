  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

dding:14px 18px;box-shadow:0 16px 50px rgba(0,0,0,0.6),0 0 30px rgba(79,172,254,0.15),0 1px 0 rgba(255,255,255,0.12) inset;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;\">\n      <div style=\"min-width:0;\">\n        <div style=\"font-size:13.2px;font-weight:700;color:#9fc9ee;\">선택한 로봇<\u002Fdiv>\n        <div style=\"font-size:18px;font-weight:800;line-height:1.3;white-space:nowrap;color:#fff;\">B2 {{b2Qty}} · T9 {{t9Qty}}<\u002Fdiv>\n        <div style=\"font-size:13.8px;color:#8b93a1;margin-top:1px;white-space:nowrap;\">{{mobileLumpNote}}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex-shrink:0;text-align:right;\">\n        <div style=\"font-size:13.2px;font-weight:700;color:#9fc9ee;\">월 납부액 · VAT별도<\u002Fdiv>\n        <div style=\"font-size:28.8px;font-weight:800;letter-spacing:-0.02em;line-height:1.15;color:#7cc4ff;white-space:nowrap;text-shadow:0 0 18px rgba(79,172,254,0.4);\">{{totalMonthlyAnim}}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;ember&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;배경&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    b2Qty: 0, t9Qty: 0, b2Pay: 'installment', t9Pay: 'installment', ura: false,\n    isMobile: false, activeSection: 'sec-robots', dlStatus: ''\n  };\n\n  PRICE = {\n    b2: { installment_device: 290000, installment_service: 350000, lump_device: 10440000, lump_service: 350000 },\n    t9: { installment_device: 190000, installment_service: 309000, lump_device: 6840000, lump_service: 309000, service_original: 350000 },\n    uraDiscount: 30000\n  };\n\n  won(n){ return Math.round(n).toLocaleString('ko-KR') + '원'; }\n  today(){ const d = new Date(); return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0'); }\n\n  num(value, fmt){\n    if (!this._Num){\n      class Num extends React.Component {\n        constructor(p){ super(p); this.state = { v: p.value }; }\n        componentDidUpdate(prev){\n          if (prev.value !== this.props.value){\n            if (this._raf) cancelAnimationFrame(this._raf);\n            const from = this.state.v, to = this.props.value, t0 = performance.now(), dur = 700;\n            const step = t => {\n              const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);\n              this.setState({ v: from + (to - from) * e });\n              if (k < 1) this._raf = requestAnimationFrame(step);\n            };\n            this._raf = requestAnimationFrame(step);\n          }\n        }\n        componentWillUnmount(){ if (this._raf) cancelAnimationFrame(this._raf); }\n        render(){ return React.createElement('span', null, this.props.fmt(this.state.v)); }\n      }\n      this._Num = Num;\n    }\n    return React.createElement(this._Num, { value, fmt });\n  }\n\n  flip(key, val){\n    if (this['_lv_' + key] !== val){ this['_lv_' + key] = val; this['_fl_' + key] = !this['_fl_' + key]; }\n    return (this['_fl_' + key] ? 'numPopA' : 'numPopB') + ' .5s cubic-bezier(.34,1.56,.64,1)';\n  }\n\n  componentDidMount(){\n    this.mq = window.matchMedia('(max-width: 1180px)');\n    const apply = () => this.setState({ isMobile: this.mq.matches });\n    this.mq.addEventListener('change', apply); apply();\n    this.sectionIds = ['sec-robots','sec-discount','sec-summary','sec-doc'];\n    this.onScroll = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => {\n        this._raf = null;\n        const mark = window.scrollY + window.innerHeight * 0.35;\n        let cur = this.sectionIds[0];\n        for (const id of this.sectionIds){\n          const el = document.getElementById(id);\n          if (el && el.offsetTop <= mark) cur = id;\n        }\n        if (cur !== this.state.activeSection) this.setState({ activeSection: cur });\n      });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches){\n      requestAnimationFrame(() => {\n        const io = new IntersectionObserver((ents) => {\n          ents.forEach(en => {\n            if (!en.isIntersecting) return;\n            const el = en.target;\n            el.style.opacity = '1'; el.style.transform = 'none'; el.style.filter = 'none';\n            io.unobserve(el);\n          });\n        }, { threshold: 0.06, rootMargin: '0px 0px -40px 0px' });\n        this.sectionIds.forEach(id => {\n          const el = document.getElementById(id);\n          if (!el) return;\n          if (el.getBoundingClientRect().top < window.innerHeight * 0.85) return;\n          el.style.transition = 'opacity 1s cubic-bezier(0.22,1,0.36,1), transform 1s cubic-bezier(0.22,1,0.36,1), filter 1s cubic-bezier(0.22,1,0.36,1)';\n          el.style.opacity = '0'; el.style.transform = 'translateY(30px)'; el.style.filter = 'blur(10px)';\n          io.observe(el);\n        });\n        this._io = io;\n      });\n    }\n  }\n  componentWillUnmount(){\n    window.removeEventListener('scroll', this.onScroll);\n    if (this._io) this._io.disconnect();\n  }\n\n  computeModel(key){\n    const qty = this.state[key + 'Qty'], pay = this.state[key + 'Pay'], p = this.PRICE[key];\n    if (qty <= 0) return null;\n    const discount = this.state.ura ? this.PRICE.uraDiscount : 0;\n    if (pay === 'installment'){\n      const service_per = p.installment_service - discount;\n      const monthly_per = p.installment_device + service_per;\n      return { payment: 'installment', qty, device_per: p.installment_device, service_per, discount,\n        monthly_total: monthly_per * qty, lump_total: 0, tco_36: monthly_per * qty * 36,\n        service_original: key === 't9' ? p.service_original : null };\n    }\n    const service_per = p.lump_service - discount;\n    return { payment: 'lump', qty, device_lump: p.lump_device, service_per, discount,\n      monthly_total: service_per * qty, lump_total: p.lump_device * qty,\n      tco_36: p.lump_device * qty + service_per * qty * 36,\n      service_original: key === 't9' ? p.service_original : null };\n  }\n\n  goTo(id){\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.offsetTop - 24, behavior: 'smooth' });\n  }\n\n  async download(elId, name){\n    const el = document.getElementById(elId);\n    if (!el || !window.html2canvas) return;\n    this.setState({ dlStatus: '이미지 생성 중…' });\n    try {\n      const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });\n      const link = document.createElement('a');\n      link.download = name; link.href = canvas.toDataURL('image/png'); link.click();\n      this.setState({ dlStatus: '다운로드 완료 ✓' });\n    } catch(e){ this.setState({ dlStatus: '생성 실패 — 다시 시도해 주세요' }); }\n  }\n\n  buildRows(key, r){\n    const rows = [];\n    const push = (l, v, cls) => rows.push({\n      l, v,\n      c: cls === 'discount' ? '#4ade80' : cls === 'strike' ? '#5a6270' : '#fff',\n      docC: cls === 'discount' ? '#1a9e56' : cls === 'strike' ? '#9aa1ab' : '#15181d',\n      td: cls === 'strike' ? 'line-through' : 'none'\n    });\n    const svcLabel = key === 't9' ? '서비스 이용료 (프로모션, 월, 대당)' : '서비스 이용료 (월, 대당)';\n    if (r.payment === 'installment'){\n      push('단말 할부금 (월, 대당)', this.won(r.device_per));\n      if (r.service_original) push('서비스 이용료 (정가, 월, 대당)', this.won(r.service_original), 'strike');\n      push(svcLabel, this.won(r.service_per + r.discount));\n      if (r.discount > 0) push('으랏차차 결합할인 (대당)', '−' + this.won(r.discount), 'discount');\n    } else {\n      push('단말 금액 (일시불, 대당)', this.won(this.PRICE[key].lump_device));\n      if (r.service_original) push('서비스 이용료 (정가, 월, 대당)', this.won(r.service_original), 'strike');\n      push(svcLabel, this.won(r.service_per + r.discount));\n      if (r.discount > 0) push('으랏차차 결합할인 (대당)', '−' + this.won(r.discount), 'discount');\n    }\n    return rows;\n  }\n\n  renderVals(){\n    const s = this.state;\n    const step = (key, d) => () => this.setState(st => ({ [key]: Math.min(99, Math.max(0, st[key] + d)) }));\n    const b2 = this.computeModel('b2'), t9 = this.computeModel('t9');\n    const hasSelection = !!(b2 || t9);\n    const totalMonthly = (b2 ? b2.monthly_total : 0) + (t9 ? t9.monthly_total : 0);\n    const totalLump = (b2 ? b2.lump_total : 0) + (t9 ? t9.lump_total : 0);\n    const totalTco = (b2 ? b2.tco_36 : 0) + (t9 ? t9.tco_36 : 0);\n\n    const modelDef = [\n      { key: 'b2', name: 'B2', promo: false, img: (window.__resources || {}).b2Img || 'https://kt-synergy.com/assets/image/robot/%EB%B2%A0%EC%96%B4.png',\n        specs: [{k:'사이즈',v:'535 × 590 × 1230 mm'},{k:'적재',v:'40kg (10kg × 4)'},{k:'통과너비',v:'최소 80cm'},{k:'스크린',v:'10.4 inch'},{k:'완충/작동',v:'5시간 / 8~12시간'}] },\n      { key: 't9', name: 'T9', promo: true, img: (window.__resources || {}).t9Img || 'https://kt-synergy.com/assets/image/robot/%ED%82%A4%EB%85%BC.png',\n        specs: [{k:'사이즈',v:'500 × 527 × 1266 mm'},{k:'적재',v:'40kg (10kg × 4)'},{k:'통과너비',v:'최소 70cm'},{k:'스크린',v:'11.6 inch'},{k:'완충/작동',v:'4~5시간 / 13~18시간'}] }\n    ];\n    const models = modelDef.map(md => {\n      const qty = s[md.key + 'Qty'], pay = s[md.key + 'Pay'];\n      return {\n        name: md.name, promo: md.promo, img: md.img, specs: md.specs, qty,\n        bd: qty > 0 ? 'rgba(79,172,254,0.5)' : 'rgba(79,172,254,0.16)',\n        pop: this.flip(md.key, qty),\n        inc: step(md.key + 'Qty', 1), dec: step(md.key + 'Qty', -1),\n        onQty: e => { const d = e.target.value.replace(/[^0-9]/g, ''); this.setState({ [md.key + 'Qty']: Math.min(99, d ? +d : 0) }); },\n        payIdx: pay === 'installment' ? 0 : 1,\n        payOpts: [{label:'36개월 할부',value:'installment'},{label:'일시불',value:'lump'}].map(o => ({\n          label: o.label, fg: pay === o.value ? '#fff' : '#8b93a1',\n          sel: () => this.setState({ [md.key + 'Pay']: o.value })\n        }))\n      };\n    });\n\n    const summaryBlocks = [];\n    const addBlock = (key, name, r) => {\n      if (!r) return;\n      summaryBlocks.push({\n        name, qty: r.qty,\n        type: (r.payment === 'installment' ? '36개월 할부' : '일시불') + (key === 't9' ? ' · 프로모션' : ''),\n        rows: this.buildRows(key, r),\n        subAnim: this.num(r.monthly_total, v => this.won(v)),\n        subText: this.won(r.monthly_total),\n        hasLump: r.lump_total > 0, lumpText: this.won(r.lump_total)\n      });\n    };\n    addBlock('b2', 'B2', b2); addBlock('t9', 'T9', t9);\n\n    const sections = [\n      { id: 'sec-robots', label: '로봇 선택' }, { id: 'sec-discount', label: '결합 할인' },\n      { id: 'sec-summary', label: '견적 요약' }, { id: 'sec-doc', label: '견적서' }\n    ];\n    const activeIdx = Math.max(0, sections.findIndex(sec => sec.id === s.activeSection));\n    const railGapPx = s.isMobile ? 39 : 57;\n    const railItems = sections.map((sec, i) => {\n      const act = i === activeIdx, passed = i < activeIdx;\n      return {\n        label: sec.label,\n        dotBg: act ? '#4facfe' : (passed ? '#2f5f96' : '#0b1017'),\n        dotBd: act ? '3px solid #ffffff' : '2px solid ' + (passed ? 'rgba(124,196,255,0.75)' : 'rgba(255,255,255,0.3)'),\n        dotGlow: act ? '0 0 16px rgba(79,172,254,0.85)' : 'none',\n        sc: act ? 1.28 : 1,\n        go: () => this.goTo(sec.id)\n      };\n    });\n\n    const copyText = () => {\n      const lines = ['[KT 서빙로봇 견적] ' + this.today(), ''];\n      summaryBlocks.forEach(sb => {\n        lines.push(`${sb.name} × ${sb.qty}대 (${sb.type})`);\n        sb.rows.forEach(rw => lines.push(`  - ${rw.l}: ${rw.v}`));\n        lines.push(`  ${sb.name} 월 납부액: ${sb.subText}`);\n        if (sb.hasLump) lines.push(`  단말 일시불: ${sb.lumpText}`);\n        lines.push('');\n      });\n      lines.push(`총 월 납부액: ${this.won(totalMonthly)}`);\n      if (totalLump > 0) lines.push(`단말 일시불 총액: ${this.won(totalLump)}`);\n      lines.push(`36개월 총 소유비용: ${this.won(totalTco)}`);\n      lines.push('※ 모든 금액 VAT 별도');\n      navigator.clipboard.writeText(lines.join('\\n'))\n        .then(() => this.setState({ dlStatus: '견적 텍스트가 복사되었습니다 ✓' }))\n        .catch(() => this.setState({ dlStatus: '복사 실패 — 다시 시도해 주세요' }));\n    };\n\n    return {\n      ember: this.props.ember ?? true,\n      isDesktop: !s.isMobile, isMobile: s.isMobile,\n      railRight: s.isMobile ? '10px' : '24px',\n      railItems, railGap: railGapPx + 'px',\n      railFill: (activeIdx * (18 + railGapPx)) + 'px',\n      models,\n      b2Qty: s.b2Qty, t9Qty: s.t9Qty,\n      tglUra: () => this.setState({ ura: !s.ura }),\n      uraBd: s.ura ? 'rgba(79,172,254,0.45)' : 'rgba(255,255,255,0.1)',\n      uraBg: s.ura ? 'rgba(79,172,254,0.08)' : 'rgba(255,255,255,0.02)',\n      uraBoxBg: s.ura ? 'linear-gradient(180deg,#7cc4ff 0%,#4facfe 48%,#2f7fd6 100%)' : 'rgba(255,255,255,0.08)',\n      uraBoxGlow: s.ura ? '0 4px 12px rgba(79,172,254,0.4)' : 'none',\n      uraPill: s.ura && hasSelection ? '대당 월 −30,000원 적용 중' : '',\n      noSelection: !hasSelection, hasSelection,\n      summaryBlocks,\n      totalMonthlyAnim: this.num(totalMonthly, v => this.won(v)),\n      totalLumpAnim: this.num(totalLump, v => this.won(v)),\n      totalTcoAnim: this.num(totalTco, v => this.won(v)),\n      totalMonthlyText: this.won(totalMonthly),\n      totalLumpText: this.won(totalLump),\n      totalTcoText: this.won(totalTco),\n      hasLumpTotal: totalLump > 0,\n      mobileLumpNote: totalLump > 0 ? '일시불 총액 ' + this.won(totalLump) : '36개월 총비용 ' + this.won(totalTco),\n      docChips: [\n        { label: 'B2', val: s.b2Qty > 0 ? s.b2Qty + '대 · ' + (s.b2Pay === 'installment' ? '할부' : '일시불') : '미선택' },\n        { label: 'T9', val: s.t9Qty > 0 ? s.t9Qty + '대 · ' + (s.t9Pay === 'installment' ? '할부' : '일시불') : '미선택' },\n        { label: '으랏차차 결합', val: s.ura ? '적용 (대당 월 −30,000원)' : '미적용' },\n        { label: '약정', val: '판매형 · 36개월' }\n      ],\n      today: this.today(),\n      dlDoc: () => this.download('quoteDocRobot', `서빙로봇견적_${this.today()}.png`),\n      copyQuote: copyText,\n      dlStatus: s.dlStatus,\n      goDoc: () => this.goTo('sec-doc')\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
