  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <!-- 안드로이드 크롬/삼성 인터넷의 강제 다크 모드가 그라데이션 텍스트를 반전시켜 어둡게 만드는 문제 방지 -->\n    <meta name=\"color-scheme\" content=\"dark\">\n    <meta name=\"theme-color\" content=\"#020202\">\n    <title>The Foundation of Your DX Business<\u002Ftitle>\n    <script src=\"b56f7826-7bf9-4186-9f8e-e6f24787db63\"><\u002Fscript>\n    <style>\n        /* 강제 다크 모드(안드로이드 크롬 Auto Dark Theme) 방어:\n           color-scheme으로 이 사이트가 이미 다크임을 브라우저에 명시. */\n        :root { color-scheme: dark; }\n        body, html {\n            margin: 0; padding: 0;\n            background-color: #020202; color: #fff;\n            font-family: 'Pretendard', -apple-system, sans-serif;\n            overflow-x: hidden; scroll-behavior: smooth;\n            color-scheme: dark;\n        }\n\n        body.locked { overflow: hidden; }\n        /* [v1.33] 도착 프리즈: 마지막 페이지 도달 시 1초간 완전 고정.\n           v1.32의 overflow:hidden은 html에 overflow-x:hidden이 있으면\n           body의 overflow가 뷰포트로 전파되지 않아(CSS 명세) 무력했음.\n           body를 position:fixed로 문서 흐름에서 떼어내면 스크롤 범위\n           자체가 0이 되어 휠·터치·진행 중인 관성까지 물리적으로 차단됨.\n           착지점이 항상 문서 최상단이라 top 오프셋 보정도 불필요. */\n        body.arrival-freeze {\n            position: fixed;\n            top: 0; left: 0; right: 0;\n            overflow: hidden;\n        }\n        /* [v1.32] overflow 토글로 스크롤바가 사라질 때 가로 폭이 들썩이지\n           않도록 스크롤바 자리를 상시 확보 (오버레이 스크롤바 환경은 무영향) */\n        html { scrollbar-gutter: stable; }\n\n        .timeline-space {\n            position: relative;\n            height: 500vh; \n            width: 100%;\n            background-color: #020202;\n            touch-action: pan-y; /* [v1.42] 가로 스와이프는 궤도 회전용으로 JS가 사용 */\n        }\n\n        #webgl-canvas {\n            position: fixed; top: 0; left: 0;\n            width: 100vw; height: 100vh;\n            z-index: 0; pointer-events: none;\n            will-change: opacity;\n        }\n\n        .ui-layer {\n            position: fixed; top: 0; left: 0;\n            width: 100vw; height: 100vh;\n            z-index: 10; pointer-events: none;\n            will-change: opacity;\n        }\n\n        .intro {\n            /* [v1.38b] 블록을 위로 올려 서브타이틀(KT인천지사…)이 상단 1/3 선에 걸리도록:\n               블록 하단(≈서브타이틀)을 33vh에 정렬 */\n            position: fixed; top: 33vh; left: 33vw; transform: translate(-50%, -100%);\n            text-align: center; z-index: 5; width: auto;\n            display: flex; flex-direction: column; align-items: center; justify-content: center;\n            transition: opacity 0.6s ease;\n        }\n        /* [v1.38] 타이틀을 황금 3분할(상단 1/3 × 좌측 1/3) 교차점에 배치.\n           좁은 화면에서는 잘림 방지를 위해 중앙 정렬로 복귀 */\n        @media (max-width: 1100px) {\n            .intro { top: 13vh; left: 50%; transform: translateX(-50%); width: 100%; } /* [v1.39] 위성과 안 겹치게 상단으로 */\n        }\n        \n        .main-title {\n            font-size: 3.2rem; font-weight: 900; margin: 0 0 20px 0;\n            letter-spacing: 16px; filter: blur(25px); opacity: 0;\n            color: #ffffff; /* 강제 다크모드/그라데이션 미지원 브라우저용 fallback */\n            background: linear-gradient(to bottom, #ffffff, #d4d4d8);\n            -webkit-background-clip: text; -webkit-text-fill-color: transparent;\n            background-clip: text;\n            padding: 0 20px; white-space: nowrap; \n            will-change: filter, letter-spacing, opacity;\n        }\n\n        .sub-title {\n            font-size: 1.5rem; font-weight: 500; margin: 0; color: #a1a1aa;\n            filter: blur(15px); transform: translateY(30px); opacity: 0;\n            letter-spacing: -0.5px;\n            will-change: filter, transform, opacity;\n        }\n\n        .checkpoint-wrapper {\n            position: absolute; top: 0; left: 0; width: 0; height: 0;\n            will-change: transform, opacity; display: none; \n        }\n\n        .step-num {\n            position: absolute; top: -22px; left: -22px; \n            width: 45px; height: 45px; background: #222; \n            border: 2px solid #555; border-radius: 50%;\n            display: flex; align-items: center; justify-content: center;\n            font-weight: bold; font-size: 1.2rem; color: #999;\n            z-index: 2; transition: all 0.4s;\n        }\n\n        .step-num::after {\n            content: ''; position: absolute; top: 50%; left: 50%;\n            width: 100%; height: 100%; transform: translate(-50%, -50%) scale(1);\n            border-radius: 50%; background: rgba(79, 172, 254, 0); pointer-events: none; z-index: -1;\n        }\n\n        .checkpoint-wrapper.active .step-num {\n            background: #4facfe; border-color: #4facfe; color: #111; \n            box-shadow: 0 0 30px rgba(79, 172, 254, 1), 0 0 60px rgba(79, 172, 254, 0.5);\n        }\n\n        @keyframes energyRipple {\n            0% { transform: translate(-50%, -50%) scale(1); background: rgba(79, 172, 254, 1); }\n            70% { transform: translate(-50%, -50%) scale(5); background: rgba(79, 172, 254, 0.2); }\n            100% { transform: translate(-50%, -50%) scale(6); background: rgba(79, 172, 254, 0); }\n        }\n\n        .checkpoint-wrapper.active .step-num::after {\n            animation: energyRipple 0.8s cubic-bezier(0.1, 1.0, 0.3, 1.0) forwards;\n        }\n\n        .checkpoint-inner {\n            position: absolute; width: 400px; padding: 30px;\n            background: rgba(25, 25, 25, 0.65); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; backdrop-filter: blur(10px);\n            transform: translate(var(--shift-x, 0px), var(--shift-y, -30px));\n            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.4s, border-color 0.4s, box-shadow 0.4s;\n        }\n\n        .checkpoint-inner h2 { color: #ddd; margin-top: 0; font-size: 1.5rem; transition: color 0.4s; }\n        .checkpoint-inner p { color: #aaa; line-height: 1.6; font-size: 1rem; margin-bottom: 0; transition: color 0.4s;}\n\n        .checkpoint-wrapper.active .checkpoint-inner {\n            transform: translate(var(--shift-x, 0px), calc(var(--shift-y, -30px) - 10px)) scale(1.03); \n            background: rgba(30, 30, 30, 0.98); border-color: rgba(79, 172, 254, 1); \n            box-shadow: 0 10px 40px rgba(79, 172, 254, 0.4), 0 0 100px rgba(79, 172, 254, 0.1);\n        }\n        .checkpoint-wrapper.active h2 { color: #4facfe; }\n        .checkpoint-wrapper.active p { color: #eee; } \n\n        /* 하단 페이지 및 네비게이션 헤더 */\n        .next-page-section {\n            position: relative; z-index: 20; background-color: #09090b;\n            overflow-x: clip; /* [v1.21] 궤도 글자의 좌우 화면 이탈(가로 스크롤 유발) 방지 */\n            padding: 160px 40px 140px 40px; min-height: 100vh; box-sizing: border-box;\n            display: flex; justify-content: center; align-items: center;\n            border-top: 1px solid rgba(79, 172, 254, 0.2);\n            box-shadow: 0 -30px 60px rgba(0,0,0, 0.9);\n        }\n\n        .next-page-header {\n            position: absolute; top: 0; left: 0; width: 100%;\n            padding: 30px 60px; box-sizing: border-box;\n            display: flex; justify-content: space-between; align-items: center;\n            border-bottom: 1px solid rgba(255, 255, 255, 0.05);\n        }\n        \n        .header-logo {\n            font-size: 1.2rem; font-weight: 800; letter-spacing: 1px;\n            color: #fff; text-decoration: none;\n            display: inline-flex; align-items: center;\n        }\n        /* [v1.30] 텍스트 로고 → KT CI 이미지 교체\n           (위 폰트 스타일은 이미지 로드 실패 시 alt 텍스트 폴백용으로 유지) */\n        .header-logo-img {\n            height: 30px; width: auto; display: block;\n            transition: opacity 0.3s;\n        }\n        .header-logo:hover .header-logo-img { opacity: 0.8; }\n        \n        .header-nav { display: flex; gap: 40px; align-items: center; }\n        \n        .header-nav a {\n            color: #a1a1aa; text-decoration: none; font-size: 0.95rem; font-weight: 500;\n            transition: color 0.3s, text-shadow 0.3s;\n        }\n        \n        .header-nav a:hover, .dropdown:hover .dropbtn, .dropdown.open .dropbtn {\n            color: #4facfe; text-shadow: 0 0 12px rgba(79, 172, 254, 0.6);\n        }\n\n        /* 드롭다운 메뉴 스타일 */\n        .dropdown { position: relative; display: inline-block; cursor: pointer; padding-bottom: 10px; margin-bottom: -10px; }\n        \n        .dropdown-content {\n            display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);\n            background-color: rgba(20, 20, 22, 0.95); min-width: 180px;\n            box-shadow: 0px 12px 24px 0px rgba(0,0,0,0.6); z-index: 100;\n            border: 1px solid rgba(79, 172, 254, 0.2); border-radius: 12px;\n            padding: 8px 0; backdrop-filter: blur(10px);\n        }\n        \n        .dropdown-content a {\n            color: #a1a1aa; padding: 12px 20px; text-decoration: none; display: block;\n            font-size: 0.9rem; text-align: center; transition: all 0.3s;\n        }\n        \n        .dropdown-content a:hover {\n            color: #fff; background-color: rgba(79, 172, 254, 0.15);\n            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);\n        }\n        \n        /* hover 지원 기기(데스크톱)에서만 hover로 열림 */\n        @media (hover: hover) {\n            .dropdown:hover .dropdown-content { display: block; animation: dropFade 0.3s ease; }\n        }\n        /* 터치 기기(아이폰 등)는 탭 토글(.open)로 열림 — iOS는 hover가 없어 JS로 제어 */\n        .dropdown.open .dropdown-content { display: block; animation: dropFade 0.3s ease; }\n\n        @keyframes dropFade {\n            from { opacity: 0; transform: translate(-50%, -10px); }\n            to { opacity: 1; transform: translate(-50%, 0); }\n        }\n\n        /* 하단 본문 콘텐츠 */\n        .next-content { max-width: 1200px; width: 100%; }\n        .next-content h2 { \n            font-size: 3.5rem; margin-bottom: 24px; letter-spacing: -1px;\n            /* [v1.35] gradient text(background-clip:text) 제거 — Edge 글리프 겹침/깨짐 수정.\n               background-clip:text는 h2 서브트리 '전체 글리프'를 마스크로 래스터하는\n               특수 페인트 컨텍스트를 만드는데, 그 안에서 ① orbit-char 50여 개의\n               매 프레임 transform + z-index(1↔3) 전환, ② .reveal(h2 자신)과\n               .split-word의 blur 필터 전환 레이어가 계속 무효화되면 Edge가\n               이전 프레임 글리프 위에 새 글리프를 겹쳐 그리는 문제 발생\n               (같은 Chromium이라도 Edge는 컴포지팅/텍스트 파이프라인 설정이 달라\n               Chrome에서는 통과하는 조합이 Edge에서만 깨질 수 있음).\n               가시 글리프는 전부 자체 색을 강제하므로(split-word #fff /\n               orbit-char #4facfe / page-ver #aaa) 이 그라데이션은 실제로\n               어디에도 표시되지 않던 컨텍스트였음 → 제거해도 시각 변화 없음. */\n            color: #ffffff;\n        }\n        .next-content > p { color: #71717a; font-size: 1.25rem; margin-bottom: 80px; margin-top: 0; }\n        \n        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 48px; grid-auto-rows: 1fr; } /* [v1.20] PC 카드 간격 30→48 */\n        .grid-card {\n            background: #141416; border: 1px solid #232326; padding: 45px; border-radius: 24px;\n            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.4s;\n        }\n        .grid-card:hover { transform: translateY(-8px); border-color: rgba(79, 172, 254, 0.4); }\n        .grid-card h3 { color: #4facfe; font-size: 1.6rem; margin-top: 0; margin-bottom: 15px; }\n        .grid-card p { color: #a1a1aa; font-size: 1.05rem; line-height: 1.7; margin: 0; }\n\n        @media (max-width: 768px) {\n            .main-title { font-size: 1.8rem; } \n            .sub-title { font-size: 1.1rem; }\n            .checkpoint-inner { width: 260px; padding: 20px; }\n            .checkpoint-inner h2 { font-size: 1.2rem; }\n            .checkpoint-inner p { font-size: 0.85rem; }\n            .step-num { width: 35px; height: 35px; top: -17px; left: -17px; font-size: 1rem; }\n            \n            .next-page-section { padding: 200px 20px 80px 20px; }\n            .next-page-header { padding: 20px; flex-direction: column; gap: 20px; }\n            .header-nav { gap: 15px; flex-wrap: wrap; justify-content: center; }\n            .dropdown { padding-bottom: 0; margin-bottom: 0; }\n            \n            .next-content h2 { font-size: 2.5rem; }\n            .next-content > p { font-size: 1.1rem; margin-bottom: 50px; }\n            .grid-card { padding: 30px; }\n            .grid-container { gap: 30px; } /* [v1.20] 모바일은 기존 간격 유지 */\n        }\n    \n        /* ── 카드 래퍼 & 배경 숫자 ── */\n        .card-wrap {\n            position: relative;\n            padding-top: 110px;\n            display: flex;\n            flex-direction: column;\n        }\n        .card-num {\n            position: absolute;\n            top: 0px;\n            left: 20px;\n            font-size: 9.5rem;\n            font-weight: 900;\n            line-height: 1;\n            letter-spacing: -4px;\n            background: linear-gradient(to right, rgba(79,172,254,0.18) 0%, #4facfe 100%);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            background-clip: text;\n            user-select: none;\n            pointer-events: none;\n            z-index: 0;\n        }\n        .grid-card {\n            position: relative !important;\n            z-index: 1;\n            display: flex !important;\n            flex-direction: column !important;\n            flex: 1;\n        }\n        .grid-card p { flex: 1; }\n\n        /* ── 카드 버튼 ── */\n        .card-btns {\n            display: flex;\n            flex-direction: column;   /* 카드 03처럼 버튼 여러개 있을 때 세로 스택 */\n            gap: 10px;\n            margin-top: 26px;\n        }\n        .card-btn {\n            display: inline-flex; align-items: center; justify-content: center; gap: 7px;\n            width: 100%;              /* 카드 내부 폭 100% → 모든 카드 버튼 폭 동일 */\n            box-sizing: border-box;\n            padding: 11px 17px;\n            background: rgba(79,172,254,0.08); color: #4facfe;\n            border: 1px solid rgba(79,172,254,0.28); border-radius: 12px;\n            font-size: 0.82rem; font-weight: 700; text-decoration: none; white-space: nowrap;\n            overflow: hidden; text-overflow: ellipsis;\n            transition: background 0.25s, border-color 0.25s, color 0.25s, transform 0.2s;\n        }\n        .card-btn:hover {\n            background: rgba(79,172,254,0.18); border-color: rgba(79,172,254,0.65);\n            color: #fff; transform: translateY(-2px);\n        }\n        .card-btn svg { flex-shrink: 0; }\n\n        /* ═══ [v1.25] 물빛 출렁임(liquid glossy) 버튼 ═══\n           glossy_button_10s_pattern 프로토타입 이식 (KT Blue 톤앤매너 적용).\n           구조: JS(initLiquidButtons)가 대상 버튼에 .liquid-btn 클래스와\n           .liquid-fx(그라데이션+블롭 6개+상단 광택) 레이어를 주입.\n           .liquid-fx는 z-index:-1 + isolation으로 버튼 텍스트 아래에 깔림.\n           성능: 블롭 애니메이션은 뷰포트에 보일 때(.fx-live)만 구동,\n           터치 기기는 blur 축소·블롭 4개로 경량화(갤럭시 GPU 보호). */\n        .liquid-btn.liquid-btn {\n            position: relative;\n            isolation: isolate;\n            background: transparent;\n            color: #ffffff;\n            border-color: rgba(255,255,255,0.30);\n            backdrop-filter: none; -webkit-backdrop-filter: none;\n            box-shadow: 0 8px 20px rgba(31, 102, 229, 0.35);\n        }\n        .liquid-btn.liquid-btn:hover {\n            background: transparent;\n            color: #ffffff;\n            border-color: rgba(255,255,255,0.55);\n            transform: translateY(-2px);\n        }\n        .liquid-fx {\n            position: absolute;\n            inset: 0;\n            z-index: -1;\n            border-radius: inherit;\n            overflow: hidden;\n            pointer-events: none;\n            background: linear-gradient(135deg, #4facfe 0%, #2668d8 45%, #123e93 100%); /* [v1.26] 심부 어둡게 → 블롭 대비↑ */\n            box-shadow:\n                inset 0 1px 1px rgba(255,255,255,0.45),\n                inset 0 -6px 12px rgba(0,0,0,0.30);\n        }\n        .liquid-fx .flow-blob {\n            position: absolute;\n            aspect-ratio: 1;\n            border-radius: 50%;\n            filter: blur(16px);\n            mix-blend-mode: screen;\n            will-change: transform, opacity;\n            animation-play-state: paused; /* 기본 정지 → 뷰포트 진입 시 구동 */\n        }\n        /* 프로토타입(320×70px 기준) px 좌표를 %로 변환해 버튼 크기에 무관하게 동작 */\n        .liquid-fx .b1 { width: 47%; top: -43%; left: -6%;  background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 70%); animation: flow1 6s ease-in-out -0.8s infinite; }\n        .liquid-fx .b2 { width: 38%; top: 21%;  left: 47%;  background: radial-gradient(circle, rgba(102,224,255,0.90) 0%, rgba(102,224,255,0) 70%); animation: flow2 7s ease-in-out -2.4s infinite; }\n        .liquid-fx .b3 { width: 31%; top: 50%;  left: 13%;  background: radial-gradient(circle, rgba(190,230,255,0.80) 0%, rgba(190,230,255,0) 70%); animation: flow3 5.5s ease-in-out -1.5s infinite; }\n        .liquid-fx .b4 { width: 28%; top: -21%; left: 72%;  background: radial-gradient(circle, rgba(124,107,255,0.72) 0%, rgba(124,107,255,0) 70%); animation: flow4 6.5s ease-in-out -3.1s infinite; }\n        .liquid-fx .b5 { width: 22%; top: 36%;  left: 31%;  background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 70%); animation: flow5 5s ease-in-out -0.4s infinite; }\n        .liquid-fx .b6 { width: 19%; top: -7%;  left: 19%;  background: radial-gradient(circle, rgba(90,160,255,0.65) 0%, rgba(90,160,255,0) 70%); animation: flow6 7.5s ease-in-out -2s infinite; }\n        .liquid-btn.fx-live .flow-blob { animation-play-state: running; }\n        /* [v1.29] 주기적 광택 스윕(sheen-sweep) 제거 — 5.2초마다 좌→우로\n           버튼을 가로지르던 빛 반사 효과 삭제. 정적 상단 광택(top-sheen)·\n           블롭 출렁임·호버 발광·클릭 리플은 그대로 유지. */\n        /* [v1.26] 호버 발광 증폭 */\n        .liquid-fx { transition: filter 0.25s ease; }\n        .liquid-btn.liquid-btn:hover .liquid-fx { filter: brightness(1.13) saturate(1.15); }\n        /* [v1.26] 클릭 지점 물결 리플 */\n        .liquid-fx .btn-ripple {\n            position: absolute;\n            border-radius: 50%;\n            mix-blend-mode: screen;\n            background: radial-gradient(circle,\n                rgba(255,255,255,0.70) 0%,\n                rgba(160,215,255,0.30) 40%,\n                rgba(255,255,255,0) 70%);\n            transform: translate(-50%, -50%) scale(0);\n            animation: btnRipple 0.65s ease-out forwards;\n        }\n        @keyframes btnRipple {\n            0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.9; }\n            100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }\n        }\n        .liquid-fx .top-sheen {\n            position: absolute;\n            top: -40%; left: -20%;\n            width: 140%; height: 100%;\n            background: linear-gradient(120deg,\n                rgba(255,255,255,0.22) 0%,\n                rgba(255,255,255,0.05) 35%,\n                rgba(255,255,255,0) 60%);\n            transform: rotate(-8deg);\n        }\n        /* 터치 기기 경량화: blur 축소 + 소형 블롭 2개 제거 (레이어 수 6→4) */\n        @media (hover: none) and (pointer: coarse) {\n            .liquid-fx .flow-blob { filter: blur(10px); }\n            .liquid-fx .b5, .liquid-fx .b6 { display: none; }\n        }\n        @keyframes flow1 {\n            0%   { transform: translate(0,0) scale(1); opacity: 0.59; }\n            10%  { transform: translate(47px,34px) scale(1.29); opacity: 0.93; }\n            22%  { transform: translate(-27px,14px) scale(0.83); opacity: 0.42; }\n            35%  { transform: translate(38px,-30px) scale(1.17); opacity: 0.84; }\n            48%  { transform: translate(-40px,-11px) scale(0.89); opacity: 0.5; }\n            60%  { transform: translate(20px,27px) scale(1.34); opacity: 0.76; }\n            75%  { transform: translate(-24px,24px) scale(0.94); opacity: 0.42; }\n            88%  { transform: translate(30px,-14px) scale(1.11); opacity: 0.67; }\n            100% { transform: translate(0,0) scale(1); opacity: 0.59; }\n        }\n        @keyframes flow2 {\n            0%   { transform: translate(0,0) scale(1); opacity: 0.5; }\n            12%  { transform: translate(-40px,24px) scale(0.77); opacity: 0.84; }\n            26%  { transform: translate(30px,-20px) scale(1.23); opacity: 0.33; }\n            40%  { transform: translate(-20px,-27px) scale(1.06); opacity: 0.76; }\n            55%  { transform: translate(40px,14px) scale(0.83); opacity: 0.5; }\n            70%  { transform: translate(-30px,27px) scale(1.17); opacity: 0.67; }\n            85%  { transform: translate(24px,-24px) scale(0.89); opacity: 0.42; }\n            100% { transform: translate(0,0) scale(1); opacity: 0.5; }\n        }\n        @keyframes flow3 {\n            0%   { transform: translate(0,0) scale(1); opacity: 0.42; }\n            15%  { transform: translate(34px,-27px) scale(1.34); opacity: 0.76; }\n            30%  { transform: translate(-27px,20px) scale(0.89); opacity: 0.33; }\n            45%  { transform: translate(24px,30px) scale(1.23); opacity: 0.67; }\n            60%  { transform: translate(-38px,-16px) scale(0.83); opacity: 0.5; }\n            78%  { transform: translate(27px,-11px) scale(1.11); opacity: 0.59; }\n            100% { transform: translate(0,0) scale(1); opacity: 0.42; }\n        }\n        @keyframes flow4 {\n            0%   { transform: translate(0,0) scale(1); opacity: 0.33; }\n            18%  { transform: translate(-30px,-22px) scale(1.34); opacity: 0.67; }\n            33%  { transform: translate(34px,16px) scale(0.89); opacity: 0.42; }\n            50%  { transform: translate(-20px,27px) scale(1.17); opacity: 0.59; }\n            68%  { transform: translate(38px,-24px) scale(0.94); opacity: 0.5; }\n            85%  { transform: translate(-24px,14px) scale(1.11); opacity: 0.42; }\n            100% { transform: translate(0,0) scale(1); opacity: 0.33; }\n        }\n        @keyframes flow5 {\n            0%   { transform: translate(0,0) scale(1); opacity: 0.24; }\n            20%  { transform: translate(24px,19px) scale(1.46); opacity: 0.67; }\n            38%  { transform: translate(-30px,-24px) scale(0.83); opacity: 0.33; }\n            55%  { transform: translate(20px,-27px) scale(1.29); opacity: 0.59; }\n            72%  { transform: translate(-24px,22px) scale(0.89); opacity: 0.42; }\n            88%  { transform: translate(27px,14px) scale(1.17); opacity: 0.5; }\n            100% { transform: translate(0,0) scale(1); opacity: 0.24; }\n        }\n        @keyframes flow6 {\n            0%   { transform: translate(0,0) scale(1); opacity: 0.33; }\n            16%  { transform: translate(-22px,16px) scale(1.29); opacity: 0.59; }\n            32%  { transform: translate(27px,-20px) scale(0.89); opacity: 0.33; }\n            50%  { transform: translate(-34px,-14px) scale(1.23); opacity: 0.5; }\n            66%  { transform: translate(24px,24px) scale(0.83); opacity: 0.42; }\n            82%  { transform: translate(-19px,-22px) scale(1.11); opacity: 0.5; }\n            100% { transform: translate(0,0) scale(1); opacity: 0.33; }\n        }\n\n        /* ── Skip 버튼 ── */\n        @keyframes floatUpDown {\n            0%, 100% { transform: translateY(0); }\n            50%       { transform: translateY(-10px); }\n        }\n        @keyframes fadeInSkip {\n            from { opacity: 0; transform: translateY(14px); }\n            to   { opacity: 1; transform: translateY(0); }\n        }\n        .skip-btn {\n            display: inline-flex; align-items: center; gap: 8px;\n            margin-top: 34px; padding: 12px 30px;\n            background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.70);\n            border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;\n            font-size: 0.85rem; font-weight: 600; letter-spacing: 2px;\n            text-transform: uppercase; cursor: pointer;\n            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);\n            opacity: 0;\n            animation: fadeInSkip 1s ease 2.5s forwards, floatUpDown 3s ease-in-out 3.5s infinite;\n            transition: background 0.25s, color 0.25s, border-color 0.25s;\n        }\n        .skip-btn:hover {\n            background: rgba(74,172,254,0.18); color: #fff;\n            border-color: rgba(74,172,254,0.5); box-shadow: 0 0 24px rgba(74,172,254,0.2);\n        }\n\n        /* ── 페이지 버전 표기 ── */\n        .page-ver {\n            display: inline-block;\n            margin-left: 12px;\n            font-size: 11px;\n            color: #aaa;\n            font-weight: 400;\n            letter-spacing: 0;\n            vertical-align: middle;\n            -webkit-text-fill-color: #aaa;\n            background: none;\n        }\n\n        /* ── [궤도 타이틀] 제목 주위를 도는 3D 텍스트 링 (v1.20) ──\n           orbit_title_final 프로토타입 파라미터 이식:\n           tiltX 10° / tiltZ -30°, 깊이별 가변 반경(0.48~1.25배)·크기(0.55~1.32배)·\n           투명도(0.5~1.0) + perspective 1000px 원근 투영.\n           깊이(z)에 따라 z-index를 1↔3으로 전환해 제목(z-index 2) 뒤/앞을\n           통과하는 3D 효과를 구현. preserve-3d 대신 2D 수식 배치를 사용해\n           h2의 gradient text·split-word blur 필터와의 충돌을 원천 차단. */\n        .orbit-stage {\n            position: relative;\n            display: inline-block;\n            /* [v1.35] 궤도 글자의 z-index 1↔3 전환을 스테이지 자체 스태킹\n               컨텍스트 안으로 격리 — 매 프레임 레이어 재정렬이 h2/히어로\n               전체로 번지지 않게 차단(Edge 렌더링 안정화). 제목 코어(z-index 2)도\n               스테이지 내부에 있으므로 앞/뒤 통과 3D 효과는 그대로 동작. */\n            isolation: isolate;\n        }\n        .orbit-scene {\n            position: absolute;\n            top: 50%;\n            left: 50%;\n            width: 1px;\n            height: 1px;\n            pointer-events: none;\n        }\n        .orbit-title-core {\n            position: relative;\n            z-index: 2;\n        }\n        .orbit-char {\n            position: absolute;\n            top: 0;\n            left: 0;\n            font-size: 1em; /* [v1.20] 씬 폰트 크기(JS가 반경 비례로 설정)를 상속 */\n            font-weight: 800;\n            letter-spacing: 0;\n            line-height: 1;\n            white-space: pre;\n            /* 홈페이지 톤앤매너 KT Blue */\n            color: #4facfe;\n            -webkit-text-fill-color: #4facfe; /* h2 gradient text 상속 차단 */\n            background: none;\n            /* [v1.23] 네온 발광 강화: 코어(6px)/미드(14px)/아우터(28px) 3중 + 원거리 번짐(48px) */\n            text-shadow:\n                0 0 6px rgba(79, 172, 254, 0.95),\n                0 0 14px rgba(79, 172, 254, 0.75),\n                0 0 28px rgba(79, 172, 254, 0.50),\n                0 0 48px rgba(79, 172, 254, 0.28);\n            will-change: transform, opacity; /* [v1.24] opacity도 컴포지터 처리 명시 */\n        }\n        /* [v1.24] 터치 기기(갤럭시 등) 글로우 경량화\n           글리프 59개가 각각 GPU 레이어인데, 48px 외곽 번짐이 레이어 텍스처를\n           사방 48px씩 부풀림(고DPR 기기에서 글자당 ~400×400px). 일부 안드로이드\n           GPU가 이 래스터를 드롭하면 해당 글자만 비어 보이는 '이 빠짐' 발생\n           (화면 껐다 켜면 전체 재래스터로 복구되는 증상과 일치).\n           외곽 번짐을 24px로 줄여 텍스처 면적을 약 1/3로 낮춤. 데스크톱은 유지. */\n        @media (hover: none) and (pointer: coarse) {\n            .orbit-char {\n                text-shadow:\n                    0 0 5px rgba(79, 172, 254, 0.95),\n                    0 0 12px rgba(79, 172, 254, 0.80),\n                    0 0 24px rgba(79, 172, 254, 0.45);\n            }\n        }\n        /* [v1.20] 모바일 고정 크기 제거: 반경 비례 자동 축소로 대체 */\n\n        /* ── 이미지 모달 (팝업) ── */\n        .img-modal {\n            display: none;\n            position: fixed; top: 0; left: 0;\n            width: 100vw; height: 100vh;\n            z-index: 9999;\n            justify-content: center; align-items: center;\n        }\n        .img-modal.open { display: flex; animation: modalFadeIn 0.25s ease; }\n        @keyframes modalFadeIn {\n            from { opacity: 0; }\n            to   { opacity: 1; }\n        }\n        .img-modal-backdrop {\n            position: absolute; top: 0; left: 0;\n            width: 100%; height: 100%;\n            background: rgba(0,0,0,0.85);\n            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);\n        }\n        .img-modal-body {\n            position: relative; z-index: 1;\n            max-width: 90vw; max-height: 90vh;\n            display: flex; flex-direction: column; align-items: center;\n        }\n        .img-modal-img-wrap {\n            position: relative;\n            max-width: 90vw; max-height: 85vh;\n            display: inline-block;\n        }\n        .img-modal-img-wrap img {\n            display: block;\n            max-width: 90vw; max-height: 85vh;\n            border-radius: 12px;\n            box-shadow: 0 20px 60px rgba(0,0,0,0.6);\n        }\n        .img-modal-overlay-text {\n            position: absolute; top: 50%; left: 50%;\n            transform: translate(-50%, -50%) rotate(-8deg);\n            font-size: clamp(2.5rem, 8vw, 6rem);\n            font-weight: 900;\n            color: #fff;\n            letter-spacing: 4px;\n            text-shadow: 0 4px 24px rgba(0,0,0,0.9), 0 0 40px rgba(79,172,254,0.6);\n            background: rgba(79,172,254,0.85);\n            padding: 14px 40px;\n            border-radius: 12px;\n            border: 3px solid rgba(255,255,255,0.9);\n            white-space: nowrap;\n            pointer-events: none;\n        }\n        .img-modal-close {\n            position: absolute; top: -50px; right: 0;\n            width: 40px; height: 40px;\n            background: rgba(255,255,255,0.1);\n            border: 1px solid rgba(255,255,255,0.3);\n            border-radius: 50%;\n            color: #fff;\n            font-size: 1.6rem;\n            line-height: 1;\n            cursor: pointer;\n            display: flex; align-items: center; justify-content: center;\n            transition: background 0.25s;\n        }\n        .img-modal-close:hover { background: rgba(255,255,255,0.25); }\n\n        /* ── DX 에셋 CTA (비활성) ── */\n        .cta-wrap {\n            margin-top: 60px;\n            display: flex;\n            justify-content: center;\n        }\n        .card-btn.disabled {\n            width: auto;              /* 하단 CTA 는 카드 내부가 아니므로 폭 100% 규칙 제외 */\n            padding: 18px 40px;\n            font-size: 1rem;\n            letter-spacing: 1px;\n            background: rgba(255,255,255,0.04);\n            color: #71717a;\n            border: 1px dashed rgba(255,255,255,0.15);\n            cursor: not-allowed;\n            position: relative;\n        }\n        .card-btn.disabled:hover {\n            background: rgba(255,255,255,0.04);\n            color: #71717a;\n            border-color: rgba(255,255,255,0.15);\n            transform: none;\n        }\n        .card-btn.disabled .badge {\n            margin-left: 10px;\n            font-size: 0.7rem;\n            padding: 3px 8px;\n            border-radius: 999px;\n            background: rgba(255,255,255,0.08);\n            color: #a1a1aa;\n            letter-spacing: 0;\n        }\n\n        /* ═══════════════════════════════════════════\n           지표 스트립 (카드 그리드 앞)\n           ═══════════════════════════════════════════ */\n        .metrics-strip {\n            display: flex;\n            gap: 40px;\n            padding: 28px 40px;\n            margin: 120px 0 120px 0; /* [v1.20] 상단: 궤도 글자 겹침 방지 확장(40→120), 하단: 다음 카드 간격 2배(60→120) */\n            background: linear-gradient(90deg, rgba(79,172,254,0.06) 0%, rgba(79,172,254,0.02) 100%);\n            border: 1px solid rgba(79,172,254,0.15);\n            border-radius: 16px;\n            flex-wrap: wrap;\n            justify-content: space-around;\n        }\n        .metric-item {\n            display: flex;\n            flex-direction: column;\n            gap: 6px;\n            min-width: 140px;\n        }\n        .metric-num {\n            font-size: 2.8rem;\n            font-weight: 900;\n            line-height: 1;\n            color: #4facfe;\n            letter-spacing: -1px;\n            font-variant-numeric: tabular-nums;\n        }\n        .metric-num .unit {\n            font-size: 1.2rem;\n            font-weight: 700;\n            color: #a1a1aa;\n            margin-left: 4px;\n        }\n        .metric-label {\n            font-size: 0.9rem;\n            color: #a1a1aa;\n            letter-spacing: 0.3px;\n            line-height: 1.4;\n        }\n\n        /* ═══════════════════════════════════════════\n           워크플로 섹션 (카드 그리드 뒤)\n           ═══════════════════════════════════════════ */\n        .workflow-section {\n            margin-top: 140px;\n            padding-top: 80px;\n            border-top: 1px solid rgba(255,255,255,0.06);\n        }\n        .workflow-section-header {\n            margin-bottom: 60px;\n        }\n        .workflow-section-eyebrow {\n            display: inline-block;\n            font-size: 0.75rem;\n            font-weight: 700;\n            letter-spacing: 3px;\n            color: #4facfe;\n            padding: 6px 14px;\n            border: 1px solid rgba(79,172,254,0.3);\n            border-radius: 999px;\n            margin-bottom: 20px;\n            text-transform: uppercase;\n        }\n        .workflow-section-title {\n            /* [v1.18] .split-target의 display:inline이 h3를 아이브로우 옆에\n               붙여버리는 문제 수정 — 배지 다음 줄에 블록으로 배치 */\n            display: block;\n            font-size: 2.4rem;\n            font-weight: 800;\n            margin: 0 0 12px 0;\n            letter-spacing: -1px;\n            line-height: 1.25;\n            color: #ffffff; /* 강제 다크모드/그라데이션 미지원 브라우저용 fallback */\n            background: linear-gradient(to right, #ffffff, #a1a1aa);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            background-clip: text;\n        }\n        .workflow-section-desc {\n            color: #71717a;\n            font-size: 1.1rem;\n            line-height: 1.65;\n            margin: 0;\n            max-width: 780px;\n        }\n\n        .workflow-card {\n            background: #0f0f11;\n            border: 1px solid #232326;\n            border-radius: 20px;\n            padding: 44px 40px;\n            margin-bottom: 32px;\n            display: grid;\n            grid-template-columns: 200px 1fr;\n            gap: 40px;\n            align-items: start;\n        }\n        .workflow-side {\n            display: flex;\n            flex-direction: column;\n            gap: 14px;\n        }\n        .workflow-num {\n            font-size: 4.5rem;\n            font-weight: 900;\n            line-height: 0.9;\n            letter-spacing: -3px;\n            background: linear-gradient(to bottom right, rgba(79,172,254,0.9) 0%, rgba(79,172,254,0.25) 100%);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            background-clip: text;\n        }\n        .workflow-tag {\n            font-size: 0.75rem;\n            font-weight: 700;\n            color: #71717a;\n            letter-spacing: 2px;\n            text-transform: uppercase;\n        }\n        .workflow-body {\n            display: flex;\n            flex-direction: column;\n            gap: 22px;\n        }\n        .workflow-title {\n            font-size: 1.5rem;\n            font-weight: 700;\n            color: #fff;\n            margin: 0;\n            letter-spacing: -0.5px;\n            line-height: 1.35;\n        }\n        .workflow-caption {\n            color: #a1a1aa;\n            font-size: 1rem;\n            line-height: 1.7;\n            margin: 0;\n        }\n        .workflow-svg-wrap {\n            width: 100%;\n            overflow-x: auto;\n        }\n        .workflow-svg-wrap svg {\n            display: block;\n            width: 100%;\n            height: auto;\n            min-width: 500px;\n        }\n\n        /* SVG 내부 공통 요소 */\n        .wf-strip-before rect { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.12); }\n        .wf-strip-before text { fill: #a1a1aa; font-weight: 600; }\n        .wf-strip-after rect { fill: rgba(79,172,254,0.12); stroke: rgba(79,172,254,0.4); }\n        .wf-strip-after text { fill: #4facfe; font-weight: 700; }\n        .wf-node rect { fill: rgba(79,172,254,0.08); stroke: rgba(79,172,254,0.35); }\n        .wf-node .wf-node-num { fill: #4facfe; font-weight: 700; font-size: 10px; letter-spacing: 1px; }\n        .wf-node .wf-node-title { fill: #fff; font-weight: 700; font-size: 14px; }\n        .wf-node .wf-node-sub { fill: #a1a1aa; font-weight: 500; font-size: 11px; }\n        .wf-arrow { stroke: #4facfe; stroke-width: 1.5; fill: none; }\n        .wf-arrow-head { fill: #4facfe; }\n\n        /* 모바일 대응 */\n        @media (max-width: 768px) {\n            .metrics-strip {\n                padding: 20px 24px;\n                gap: 24px;\n                margin: 30px 0 40px 0;\n            }\n            .metric-item { min-width: 100px; }\n            .metric-num { font-size: 2rem; }\n            .workflow-section { margin-top: 80px; padding-top: 50px; }\n            .workflow-section-title { font-size: 1.6rem; }\n            .workflow-section-desc { font-size: 0.95rem; }\n            .workflow-card {\n                grid-template-columns: 1fr;\n                gap: 24px;\n                padding: 28px 16px; /* 좌우 패딩 축소로 SVG 표시 공간 확보 */\n            }\n            .workflow-side { flex-direction: row; align-items: baseline; gap: 16px; }\n            .workflow-num { font-size: 3rem; }\n            .workflow-title { font-size: 1.2rem; }\n            /* SVG 반응형: min-width 제거 → 화면 폭에 맞춰 완전 축소, 우측 잘림 방지 */\n            .workflow-svg-wrap {\n                overflow-x: visible;\n                margin: 0 -4px; /* 카드 패딩 안쪽 여백을 살짝 밀어내 SVG 표시 폭 확보 */\n            }\n            .workflow-svg-wrap svg {\n                min-width: 0;\n                width: 100%;\n                height: auto;\n            }\n        }\n\n        /* ═══════════════════════════════════════════════════════════\n           ✨ SCROLL REVEAL & INTERACTION ANIMATIONS (v1.11 신규)\n           - 히어로 이후 모든 섹션에 재미 요소 부여\n           - 순수 CSS + IntersectionObserver (외부 라이브러리 없음)\n           - prefers-reduced-motion 사용자는 자동 비활성화\n           ═══════════════════════════════════════════════════════════ */\n\n        /* [1] Scroll Reveal — Blur→Sharp + Slide-up */\n        .reveal {\n            opacity: 0;\n            filter: blur(12px);\n            transform: translateY(28px);\n            transition:\n                opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1),\n                filter 1.1s cubic-bezier(0.22, 1, 0.36, 1),\n                transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);\n            will-change: opacity, filter, transform;\n        }\n        .reveal.is-visible {\n            opacity: 1;\n            filter: blur(0);\n            transform: translateY(0);\n        }\n        /* 카드 그리드 순차 딜레이 */\n        .reveal.delay-1 { transition-delay: 0.08s; }\n        .reveal.delay-2 { transition-delay: 0.16s; }\n        .reveal.delay-3 { transition-delay: 0.24s; }\n        .reveal.delay-4 { transition-delay: 0.32s; }\n        .reveal.delay-5 { transition-delay: 0.40s; }\n        .reveal.delay-6 { transition-delay: 0.48s; }\n\n        /* [2] Text Split — 섹션 제목 단어별 순차 등장 */\n        .split-target {\n            /* 부모 gradient text가 있어도 split-word 자체 색을 우선 사용 */\n            display: inline;\n        }\n        /* [v1.18] 워크플로우 섹션 h3 제목은 예외 — 아이브로우 배지 다음 줄에 배치 */\n        h3.workflow-section-title.split-target {\n            display: block;\n        }\n        .split-word {\n            display: inline-block;\n            opacity: 0;\n            filter: blur(10px);\n            transform: translateY(0.35em);\n            /* 부모의 gradient text 상속을 끊고 흰색으로 표시 (애니메이션 가시성 확보) */\n            color: #ffffff;\n            -webkit-text-fill-color: #ffffff;\n            background: none;\n            transition:\n                opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),\n                filter 0.9s cubic-bezier(0.22, 1, 0.36, 1),\n                transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);\n            will-change: opacity, filter, transform;\n        }\n        .split-target.split-visible .split-word {\n            opacity: 1;\n            filter: blur(0);\n            transform: translateY(0);\n        }\n\n        /* [3] Card Hover 강화 — 배경 대형 숫자 확대 이동 + border glow */\n        .card-num {\n            transition:\n                transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),\n                filter 0.55s ease,\n                letter-spacing 0.55s ease;\n        }\n        .grid-card {\n            transition:\n                transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),\n                border-color 0.45s ease,\n                box-shadow 0.45s ease,\n                background-color 0.45s ease !important;\n        }\n        .card-wrap:hover .card-num {\n            transform: translate(8px, -10px) scale(1.08);\n            letter-spacing: -6px;\n            filter: brightness(1.35);\n        }\n        .card-wrap:hover .grid-card {\n            transform: translateY(-10px) !important;\n            border-color: rgba(79, 172, 254, 0.55);\n            box-shadow:\n                0 24px 60px rgba(0,0,0,0.5),\n                0 0 40px rgba(79, 172, 254, 0.18);\n            background: #17171a;\n        }\n\n        /* [4] SVG Draw-In — 워크플로 화살표 & 노드 순차 등장 */\n        .workflow-svg-wrap svg .wf-arrow {\n            stroke-dasharray: 20;\n            stroke-dashoffset: 20;\n            transition: stroke-dashoffset 0.7s cubic-bezier(0.22, 1, 0.36, 1);\n        }\n        .workflow-svg-wrap svg .wf-node,\n        .workflow-svg-wrap svg .wf-strip-before,\n        .workflow-svg-wrap svg .wf-strip-after {\n            opacity: 0;\n            transform: translateY(8px);\n            transform-box: fill-box;\n            transform-origin: center;\n            transition:\n                opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),\n                transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);\n        }\n        .workflow-svg-wrap.is-drawn svg .wf-arrow {\n            stroke-dashoffset: 0;\n        }\n        .workflow-svg-wrap.is-drawn svg .wf-node,\n        .workflow-svg-wrap.is-drawn svg .wf-strip-before,\n        .workflow-svg-wrap.is-drawn svg .wf-strip-after {\n            opacity: 1;\n            transform: translateY(0);\n        }\n        /* SVG 요소 순차 등장 딜레이는 JS에서 직접 부여 (SVG 태그 구조 특성상\n           :nth-of-type이 클래스 기준이 아닌 태그 기준이라 정확하지 않기 때문) */\n\n        /* [5] Card Number Float — 01~06 대형 숫자 부유 모션\n           [v1.28] 기존 Chapter Number Parallax(workflow-num 대상) 대체.\n           패럴랙스가 번호를 태그와 어긋나게 밀어내던 문제로 제거하고,\n           그리드 카드 번호(01~06)에 과하지 않은 상하 부유 모션 부여.\n           transform이 아닌 개별 속성 translate를 애니메이션하여\n           기존 hover transform(이동·확대)과 충돌 없이 자연스럽게 합성됨. */\n        @keyframes cardNumFloat {\n            0%, 100% { translate: 0 0; }\n            50%      { translate: 0 -7px; }\n        }\n        .card-num {\n            animation: cardNumFloat 6s ease-in-out infinite;\n        }\n        /* 카드마다 위상차(음수 delay = 대기 없이 서로 다른 위상에서 시작)\n           — 여섯 숫자가 파도처럼 일렬로 움직이지 않도록 불규칙 배치 */\n        .card-wrap:nth-child(1) .card-num { animation-delay:  0s; }\n        .card-wrap:nth-child(2) .card-num { animation-delay: -2.1s; }\n        .card-wrap:nth-child(3) .card-num { animation-delay: -4.3s; }\n        .card-wrap:nth-child(4) .card-num { animation-delay: -1.2s; }\n        .card-wrap:nth-child(5) .card-num { animation-delay: -3.4s; }\n        .card-wrap:nth-child(6) .card-num { animation-delay: -5.2s; }\n\n        /* [6] Metric Count-up — 숫자 부분 tabular-nums로 폭 안정화 */\n        .num-target {\n            display: inline-block;\n            font-variant-numeric: tabular-nums;\n        }\n\n        /* [7] Workflow Tag Kinetic Typography ([v1.29])\n           Sales Process / Platform Map / Automation 태그를 글자 단위로\n           분해(JS)하고 글자별 지연을 부여 — 파도가 단어를 좌→우로 훑고\n           지나가며 글자가 살짝 떠오르고 푸른빛으로 밝아지는 연속 모션. */\n        .workflow-tag .wt-char {\n            display: inline-block;\n            animation: wtWave 2.8s ease-in-out infinite;\n            will-change: transform;\n        }\n        @keyframes wtWave {\n            0%, 100% { transform: translateY(0);    color: #71717a; }\n            50%      { transform: translateY(-3px); color: #a9cdf2; }\n        }\n\n        /* ─── 접근성: 애니메이션 최소화 사용자 배려 ─── */\n        @media (prefers-reduced-motion: reduce) {\n            .reveal,\n            .reveal.delay-1, .reveal.delay-2, .reveal.delay-3,\n            .reveal.delay-4, .reveal.delay-5, .reveal.delay-6 {\n                opacity: 1 !important;\n                filter: none !important;\n                transform: none !important;\n                transition: none !important;\n            }\n            .split-word {\n                opacity: 1 !important;\n                filter: none !important;\n                transform: none !important;\n                transition: none !important;\n            }\n            .workflow-svg-wrap svg .wf-arrow {\n                stroke-dashoffset: 0 !important;\n                transition: none !important;\n            }\n            .workflow-svg-wrap svg .wf-node,\n            .workflow-svg-wrap svg .wf-strip-before,\n            .workflow-svg-wrap svg .wf-strip-after {\n                opacity: 1 !important;\n                transform: none !important;\n                transition: none !important;\n            }\n            .card-num, .grid-card {\n                transition: none !important;\n            }\n            /* [v1.28] 부유 모션도 비활성 */\n            .card-num {\n                animation: none !important;\n                translate: none !important;\n            }\n            /* [v1.29] 태그 키네틱 타이포그래피 비활성 */\n            .workflow-tag .wt-char {\n                animation: none !important;\n                transform: none !important;\n            }\n        }\n\n        /* ═══ [v1.36] 히어로 위성 궤도 내비게이션 ═══\n           인트로가 끝나 원(기차)이 멈추는 순간, 원 주위를 태양-위성처럼\n           도는 4개의 바로가기 위성(01/02/03/06)이 나타남.\n           호버 시 회전 정지 + 펄스 링 애니메이션, 클릭 시 해당 페이지 이동. */\n        .sat-orbit {\n            position: fixed; top: 0; left: 0;\n            width: 0; height: 0; z-index: 8;\n            pointer-events: none;\n            opacity: 0; visibility: hidden;\n            transition: opacity 0.9s ease, visibility 0.9s;\n            --spin: 28s;\n        }\n        .sat-orbit.sat-visible { opacity: 1; visibility: visible; }\n        .sat-ring {\n            position: absolute; top: 0; left: 0;\n            width: 380px; height: 380px; margin: -190px 0 0 -190px;\n            border: 1px dashed rgba(79,172,254,0.35);\n            border-radius: 50%;\n            box-shadow: inset 0 0 60px rgba(79,172,254,0.06);\n        }\n        /* [v1.40] 모성 후광: 뒤쪽으로 도는 위성을 가려주는 중앙 글로우 */\n        .sat-halo {\n            position: absolute; top: 0; left: 0; z-index: 2;\n            width: 150px; height: 150px; margin: -75px 0 0 -75px;\n            border-radius: 50%; pointer-events: none;\n            /* [v1.41] 중심부를 불투명하게 — 뒤로 돌아간 위성이 모성에 실제로 가려지도록 */\n            background: radial-gradient(circle,\n                rgba(10,21,40,1) 0%, rgba(10,21,40,1) 38%,\n                rgba(34,78,140,0.88) 46%, rgba(79,172,254,0.35) 56%,\n                rgba(79,172,254,0.10) 65%, rgba(79,172,254,0) 74%);\n        }\n        /* [v1.41] 모성 코어(흰 구체) 복제 — 불투명 헤일로가 캔버스의 모성을\n           덮으므로 동일한 모습을 헤일로 위에 재현 */\n        .sat-halo::after {\n            content: ''; position: absolute; left: 50%; top: 50%;\n            width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;\n            background: #fff;\n            box-shadow: 0 0 12px rgba(255,255,255,0.95), 0 0 30px rgba(79,172,254,0.9), 0 0 60px rgba(79,172,254,0.5);\n        }\n        /* [v1.40] 회전·깊이·배율은 JS가 매 프레임 직접 계산(입체 궤도) */\n        .sat {\n            position: absolute; top: 0; left: 0;\n            width: max-content;\n            display: flex; flex-direction: column; align-items: center;\n            transform-origin: 0 0;\n            text-decoration: none;\n            pointer-events: auto;\n            cursor: pointer;\n            will-change: transform, opacity;\n        }\n        .sat-core {\n            position: relative;\n            width: 46px; height: 46px; border-radius: 50%;\n            background: radial-gradient(circle at 35% 30%, rgba(79,172,254,0.40), rgba(8,16,34,0.92));\n            border: 1.5px solid rgba(79,172,254,0.8);\n            box-shadow: 0 0 18px rgba(79,172,254,0.45), 0 0 44px rgba(79,172,254,0.15);\n            display: flex; align-items: center; justify-content: center;\n            color: #fff; font-weight: 800; font-size: 0.9rem; letter-spacing: 1px;\n            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s;\n        }\n        .sat-core::after {\n            content: ''; position: absolute; inset: -1.5px; border-radius: 50%;\n            border: 1.5px solid rgba(79,172,254,0.9); opacity: 0;\n        }\n        .sat:hover .sat-core {\n            transform: scale(1.18);\n            box-shadow: 0 0 26px rgba(79,172,254,0.9), 0 0 70px rgba(79,172,254,0.35);\n        }\n        .sat:hover .sat-core::after { animation: satPing 1.1s ease-out infinite; }\n        @keyframes satPing {\n            0%   { transform: scale(1);   opacity: 0.9; }\n            100% { transform: scale(2.1); opacity: 0; }\n        }\n        .sat-line {\n            width: 1px; height: 12px;\n            background: linear-gradient(rgba(79,172,254,0.8), rgba(79,172,254,0.15));\n        }\n        .sat-label {\n            margin-top: 2px; text-align: center;\n            background: rgba(13,19,32,0.75);\n            border: 1px solid rgba(79,172,254,0.3);\n            border-radius: 10px; padding: 7px 13px;\n            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);\n            max-width: 180px;\n            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;\n        }\n        .sat-labe
