document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"5d0089c3-2998-46e8-88dd-45101b806765\"><\u002Fscript>\n\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <meta charset=\"utf-8\">\n  <title>KT 하이오더 전환 권유 전화 스크립트 — 주석판<\u002Ftitle>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap\">\n  <style>\n    body { margin: 0; font-family: 'Noto Sans KR', sans-serif; color: #2E261A; }\n    doc-page:not(:defined) { visibility: hidden; }\n    a { color: #7A5117; text-decoration: none; }\n    a:hover { color: #E4002B; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"doc-page\" from=\"624d7127-5c98-4a3c-9151-27504408f327#/doc-page.js\" size=\"a4\" margin=\"0.5in\" hint-size=\"794px,3400px\">\n\n  <h1 style=\"margin: 0 0 4px; font-size: 25px; font-weight: 900; color: #3E2C12;\">KT 하이오더 전환 권유 — 전화 스크립트 <span style=\"font-family:'Gaegu',cursive; font-size:20px; color:#C2185B;\">(코칭 메모판)<\u002Fspan><\u002Fh1>\n  <p style=\"margin: 0 0 6px; font-size: 12.5px; color: #8A7A64;\">완미족발 본사 가맹점 담당용 · 2026. 7 · 대외비<\u002Fp>\n  <div style=\"display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid #3E2C12; padding-bottom: 14px; margin-bottom: 22px;\">\n    <p style=\"margin: 0; flex: 1; font-size: 13px; line-height: 1.65; color: #4A3D2C;\"><strong>통화 원칙<\u002Fstrong> — ① 판매가 아니라 본사가 챙겨주는 안내 톤 ② 가격은 \"상담 시 안내\"로 ③ 목표는 계약이 아니라 <strong style=\"color:#E4002B;\">상담 접수 동의<\u002Fstrong> 하나.<\u002Fp>\n    <p style=\"margin: 0; flex: none; width: 180px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #C2185B; transform: rotate(-1.5deg);\">✎ 색깔 메모 = 읽는 법 코칭.<br>소리 내서 읽지 마세요!<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- 공통 오프닝 -->\n  <div style=\"break-inside: avoid; position: relative; padding-right: 200px; margin-bottom: 24px;\">\n    <h2 style=\"margin: 0 0 10px; font-size: 16px; font-weight: 900; color: #3E2C12;\">공통 오프닝 (모든 케이스)<\u002Fh2>\n    <div style=\"background: #FBF8F3; border-radius: 10px; padding: 14px 18px; margin-bottom: 8px;\">\n      <p style=\"margin: 0; font-size: 13.5px; line-height: 1.7;\">\"안녕하세요 점주님, <span style=\"border-bottom: 2px solid #C62828;\">완미족발 본사<\u002Fspan> ○○○입니다. 다름이 아니라, 저희가 이번에 <strong>KT하고 테이블오더 업무협약(MOU)을 체결<\u002Fstrong>해서요. 본사가 직접 여러 업체를 비교하고 검증해서 KT 하이오더를 공식 파트너로 정했고, <strong>우리 가맹점에만 적용되는 전용 할인 조건<\u002Fstrong>이 나왔습니다. 그래서 점포마다 한 분씩 직접 안내드리고 있어요. <span style=\"border-bottom: 2px solid #00695C;\">지금 2~3분 괜찮으세요?<\u002Fspan>\"<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: 12px; color: #8A7A64; line-height: 1.6;\">→ 바쁘다고 하시면: \"편하신 시간 알려주시면 그때 다시 드릴게요.\" (재통화 약속이 목표)<\u002Fp>\n    <div style=\"position: absolute; top: 34px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #C62828; transform: rotate(-1deg);\">⟵ 첫 마디는 무조건 \"본사\". KT라고 먼저 말하면 영업전화로 끊깁니다.<\u002Fdiv>\n    <div style=\"position: absolute; top: 128px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #00695C; transform: rotate(1deg);\">⟵ 시간 허락을 받으면 중간에 못 끊어요. 꼭 물어보고 시작!<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 케이스 A -->\n  <div style=\"break-inside: avoid; position: relative; padding-right: 200px; margin-bottom: 24px;\">\n    <h2 style=\"margin: 0 0 4px; font-size: 16px; font-weight: 900; color: #E4002B;\">케이스 A — 티오더 사용 중, 약정 만료(임박)<\u002Fh2>\n    <p style=\"margin: 0 0 8px; font-size: 12.5px; color: #8A7A64;\">핵심: 위약금 없는 지금이 최적 시점 + 영업 공백 없는 전환<\u002Fp>\n    <div style=\"background: #FBF8F3; border-radius: 10px; padding: 14px 18px; margin-bottom: 6px;\">\n      <p style=\"margin: 0 0 10px; font-size: 13.5px; line-height: 1.7;\">\"지금 티오더 쓰고 계시죠? 본사에서 약정을 관리하고 있어서 확인해 보니, 점주님 매장이 ○월 ○일에 만료되더라고요. <span style=\"border-bottom: 2px solid #C2185B;\"><strong>위약금이 없어지는 만료일이 사실 갈아타기 제일 좋은 날<\u002Fstrong><\u002Fspan>이에요. 그 날짜에 맞춰 KT가 미리 준비하면 <strong>하루도 영업 공백 없이<\u002Fstrong> 바뀝니다.\"<\u002Fp>\n      <p style=\"margin: 0 0 10px; font-size: 13.5px; line-height: 1.7;\">\"메뉴 등록도 걱정 마세요. 지금 쓰시는 메뉴판 사진만 주시면 KT가 다 세팅해 줍니다.\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13.5px; line-height: 1.7;\">\"제일 큰 차이는 A/S예요. KT는 업계 유일하게 <span style=\"border-bottom: 2px solid #1565C0;\"><strong>직영 직원이 당일 출동<\u002Fstrong>하고, <strong>새벽 2시까지 지원<\u002Fstrong><\u002Fspan>됩니다. 급한 건 본사 카톡방에서 KT 핫라인으로 바로 연결돼요.\"<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: 12px; color: #8A7A64; line-height: 1.6;\">→ 클로징: \"만료일하고 매장 환경만 확인하면 되니까, 상담만 먼저 받아보세요. 계약 강요 없습니다.\"<\u002Fp>\n    <div style=\"position: absolute; top: 52px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #C2185B; transform: rotate(-1.5deg);\">⟵ 만료일은 본사 약정 대장에서 미리 확인하고 전화하세요. 날짜를 콕 집어 말하면 신뢰가 확 올라갑니다.<\u002Fdiv>\n    <div style=\"position: absolute; top: 190px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #1565C0; transform: rotate(1deg);\">⟵ A/S는 우리 카드 중 제일 셉니다. 여기서 천천히, 힘 줘서.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 케이스 B -->\n  <div style=\"break-inside: avoid; position: relative; padding-right: 200px; margin-bottom: 24px;\">\n    <h2 style=\"margin: 0 0 4px; font-size: 16px; font-weight: 900; color: #E4002B;\">케이스 B — 테이블오더 미사용<\u002Fh2>\n    <p style=\"margin: 0 0 8px; font-size: 12.5px; color: #8A7A64;\">핵심: 인건비 숫자 + 완미족발 메뉴 구조에 맞는 기능<\u002Fp>\n    <div style=\"background: #FBF8F3; border-radius: 10px; padding: 14px 18px; margin-bottom: 6px;\">\n      <p style=\"margin: 0 0 10px; font-size: 13.5px; line-height: 1.7;\">\"올해 최저임금이 시간당 <span style=\"border-bottom: 2px solid #6A1B9A;\"><strong>10,320원<\u002Fstrong><\u002Fspan>이잖아요. 주휴수당까지 치면 실질 시급 12,000원이 넘어요. 하이오더 월 이용료는 태블릿 1대 기준 <strong>홀 직원 한두 시간 시급 수준<\u002Fstrong>이고, 35테이블 매장 기준 <strong>인건비 2명분 절감<\u002Fstrong> 효과가 확인됐습니다.\"<\u002Fp>\n      <p style=\"margin: 0 0 10px; font-size: 13.5px; line-height: 1.7;\">\"우리 매장엔 특히 잘 맞아요. 18첩 한상에 소스 조합까지 설명할 게 많잖아요. 사진 메뉴판 + 옵션 필수 선택이라 <strong>주문 착오가 안 생기고<\u002Fstrong>, 처음 온 손님도 꿀조합 그대로 시킵니다.\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13.5px; line-height: 1.7;\">\"막국수나 주류 추가 주문도 태블릿에서 바로 하니까 <strong>객단가가 올라가요<\u002Fstrong>.\"<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: 12px; color: #8A7A64; line-height: 1.6;\">→ 클로징: \"전국 어디든 KT가 무료로 방문 상담·견적 봐 드려요. 매장에 계시기만 하면 됩니다.\"<\u002Fp>\n    <div style=\"position: absolute; top: 52px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #6A1B9A; transform: rotate(-1deg);\">⟵ 숫자는 바꾸지 말고 그대로. 숫자가 흔들리면 신뢰가 흔들려요.<\u002Fdiv>\n    <div style=\"position: absolute; top: 165px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #00695C; transform: rotate(1.5deg);\">⟵ \"우리 매장\" 얘기로 내려와야 남의 얘기가 아니게 됩니다.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 케이스 C -->\n  <div style=\"break-inside: avoid; position: relative; padding-right: 200px; margin-bottom: 26px;\">\n    <h2 style=\"margin: 0 0 4px; font-size: 16px; font-weight: 900; color: #E4002B;\">케이스 C — 티오더 사용 중, 약정 남음<\u002Fh2>\n    <p style=\"margin: 0 0 8px; font-size: 12.5px; color: #8A7A64;\">핵심: 지금 계약이 아니라 만료일에 맞춘 예약 — 부담 제로<\u002Fp>\n    <div style=\"background: #FBF8F3; border-radius: 10px; padding: 14px 18px; margin-bottom: 6px;\">\n      <p style=\"margin: 0 0 10px; font-size: 13.5px; line-height: 1.7;\">\"본사에서 확인해 보니 점주님 매장은 약정이 ○월까지 남아 있더라고요. 괜찮습니다. <span style=\"border-bottom: 2px solid #E65100;\"><strong>중도 해지는 저희도 권하지 않아요.<\u002Fstrong><\u002Fspan> 위약금 내면서 바꿀 이유는 없으니까요.\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13.5px; line-height: 1.7;\">\"대신 상담만 미리 남겨 두시면 <strong>제일 유리한 전환 시점을 같이 계획<\u002Fstrong>해 드리고, 만료일이 다가오면 <strong>KT가 먼저 연락<\u002Fstrong>드립니다. 미리 접수해 두는 것만으로 손해 볼 게 하나도 없어요.\"<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: 12px; color: #8A7A64; line-height: 1.6;\">→ 클로징: \"만료일이 다가오면 제가 미리 연락드리고 챙겨드릴게요. 그때까지는 신경 안 쓰셔도 됩니다.\"<\u002Fp>\n    <div style=\"position: absolute; top: 52px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #E65100; transform: rotate(-1.5deg);\">⟵ 팔지 않는 말이 제일 잘 팔립니다. 이 문장은 꼭 그대로.<\u002Fdiv>\n    <div style=\"position: absolute; top: 150px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #C2185B; transform: rotate(1deg);\">⟵ 이 통화의 성공 기준: \"그때 다시 연락드릴게요\"에 점주가 \"네\" 하는 것.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 반론 Q&A -->\n  <h2 style=\"margin: 0 0 6px; font-size: 16px; font-weight: 900; color: #3E2C12; border-top: 2px solid #3E2C12; padding-top: 16px;\">반론 대응 Q&amp;A<\u002Fh2>\n  <div style=\"position: relative; padding-right: 200px; margin-bottom: 12px;\">\n    <p style=\"margin: 0; font-size: 12.5px; color: #8A7A64; line-height: 1.6;\">공통 원칙: 반론은 부정하지 말고 <strong>인정 → 전환<\u002Fstrong>. \"맞아요, 그래서…\"로 받습니다.<\u002Fp>\n    <div style=\"position: absolute; top: -34px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #1565C0; transform: rotate(-1deg);\">✎ \"아니요\"로 시작하는 순간 싸움이 됩니다.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 13px; margin-bottom: 26px;\">\n    <div style=\"break-inside: avoid;\">\n      <p style=\"margin: 0 0 3px; font-size: 13.5px; font-weight: 900; color: #E4002B;\">Q1. \"지금 티오더 잘 쓰고 있는데 굳이 바꿔야 해요?\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: #4A3D2C;\">\"태블릿 화면은 어디나 비슷해요. 차이는 고장 났을 때예요. KT는 직영 기사가 당일 출동하는데, 다른 데는 전화 응대가 전부인 경우가 많거든요. 본사 협약으로 <strong>가맹점 전용 할인<\u002Fstrong>도 있으니 비교만 한번 해보세요.\"<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"break-inside: avoid; position: relative; padding-right: 200px;\">\n      <p style=\"margin: 0 0 3px; font-size: 13.5px; font-weight: 900; color: #E4002B;\">Q2. \"위약금 있어서 못 바꿔요.\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: #4A3D2C;\">\"맞아요, 그래서 지금 바꾸시라는 게 아닙니다. 만료일에 맞춰 미리 계획만 잡아 두자는 거예요. 무리한 중도 해지는 저희가 먼저 말립니다.\"<\u002Fp>\n      <div style=\"position: absolute; top: 0; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #E65100; transform: rotate(1deg);\">⟵ 제일 자주 나오는 반론. 케이스 C로 자연스럽게 전환.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"break-inside: avoid; position: relative; padding-right: 200px;\">\n      <p style=\"margin: 0 0 3px; font-size: 13.5px; font-weight: 900; color: #E4002B;\">Q3. \"월 이용료가 부담돼요.\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: #4A3D2C;\">\"태블릿 1대 월 이용료가 홀 직원 한두 시간 시급 수준이에요. <strong>이용료 외 추가 비용이 없고<\u002Fstrong>, 지류 메뉴판 제작비도 사라집니다. 정확한 금액은 테이블 수 기준 견적이 제일 빨라요.\"<\u002Fp>\n      <div style=\"position: absolute; top: 0; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #6A1B9A; transform: rotate(-1deg);\">⟵ 금액을 직접 말하지 말 것! 견적 상담으로 넘기세요.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"break-inside: avoid;\">\n      <p style=\"margin: 0 0 3px; font-size: 13.5px; font-weight: 900; color: #E4002B;\">Q4. \"우리 손님은 연세가 있어서 태블릿 못 써요.\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: #4A3D2C;\">\"사진 보고 누르기만 하면 돼서 오히려 메뉴판보다 쉬워하세요. 어려워하시면 직원 호출 버튼으로 부르면 되고, 직원이 직접 넣을 수도 있습니다. 외국인 손님은 10개국어 지원이라 더 편해지고요.\"<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"break-inside: avoid;\">\n      <p style=\"margin: 0 0 3px; font-size: 13.5px; font-weight: 900; color: #E4002B;\">Q5. \"설치하는 동안 장사에 지장 있는 거 아니에요?\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: #4A3D2C;\">\"설치·메뉴 세팅·직원 안내까지 KT가 영업에 맞춰 진행하고, 전환 매장은 만료일에 맞춰 미리 준비해서 <strong>영업 공백 하루도 없이<\u002Fstrong> 바뀝니다. 메뉴는 메뉴판 사진만 주시면 끝이에요.\"<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"break-inside: avoid; position: relative; padding-right: 200px;\">\n      <p style=\"margin: 0 0 3px; font-size: 13.5px; font-weight: 900; color: #E4002B;\">Q6. \"고장 나면 그날 장사 망치는 거잖아요.\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: #4A3D2C;\">\"그게 KT를 고른 제일 큰 이유예요. 협약 때 본사가 제일 먼저 따진 게 A/S였습니다. <strong>직영 기사 당일 출동 원칙<\u002Fstrong>, 저녁 장사에 맞춰 <strong>새벽 2시까지 전담 지원<\u002Fstrong>. 급하면 본사 카톡방에서 KT 핫라인으로 바로 연결됩니다.\"<\u002Fp>\n      <div style=\"position: absolute; top: 0; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #1565C0; transform: rotate(1deg);\">⟵ 걱정이 아니라 우리 강점으로 되받는 질문. 반가워하세요!<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"break-inside: avoid;\">\n      <p style=\"margin: 0 0 3px; font-size: 13.5px; font-weight: 900; color: #E4002B;\">Q7. \"와이파이가 자꾸 끊기던데, 주문 밀리면 어떡해요?\"<\u002Fp>\n      <p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: #4A3D2C;\">\"테이블오더는 결국 통신 서비스예요. KT는 통신 1위 사업자라 설치 전에 전문가가 매장 통신 환경을 직접 설계·점검하고, 피크타임에도 끊기지 않게 잡아 드립니다.\"<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"break-inside: avoid; position: relative; padding-right: 200px;\">\n      <p style=\"margin: 0 0 3px; font-size: 13.5px; font-weight: 900; color: #E4002B;\">Q8. \"생각해 볼게요.\" (미온적 반응)<\u002Fp>\n      <p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: #4A3D2C;\">\"네, 천천히 보셔도 됩니다. 다만 전용 조건은 협약 기간 기준이라 <strong>상담 접수만 미리<\u002Fstrong> 해두시면 조건은 그대로 챙겨드릴 수 있어요. 카톡방에 양식 보내드릴 테니 편하실 때 채워만 주세요. 그건 부담 없으시죠?\"<\u002Fp>\n      <div style=\"position: absolute; top: 0; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #C2185B; transform: rotate(-1.5deg);\">⟵ 거절이 아니라 보류. 작은 부탁(양식 하나)으로 끝내세요.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 마무리 -->\n  <div style=\"break-inside: avoid; position: relative; padding-right: 200px;\">\n    <h2 style=\"margin: 0 0 8px; font-size: 16px; font-weight: 900; color: #3E2C12; border-top: 2px solid #3E2C12; padding-top: 16px;\">통화 마무리 + 접수 안내<\u002Fh2>\n    <div style=\"background: #FBF8F3; border-radius: 10px; padding: 14px 18px; margin-bottom: 10px;\">\n      <p style=\"margin: 0; font-size: 13.5px; line-height: 1.7;\">\"그럼 본사 카카오톡 채널방으로 상담 양식 보내드릴게요. <strong>매장명 / 성함·연락처 / 상담 가능 시간 / 방문·전화 여부<\u002Fstrong>만 적어 주시면, KT 담당자(인천지사 이대희 과장, 010-7300-2632)가 순서대로 연락드립니다. 접수했다고 계약해야 하는 건 전혀 아니고요, 조건 들어보고 결정하시면 됩니다. 감사합니다, 점주님. 장사 잘 되세요!\"<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: 11.5px; color: #8A7A64; line-height: 1.6;\">통화 후 기록: 케이스(A/B/C) · 약정 만료일 · 반응(긍정/보류/거절) · 재통화 예정일 — 접수 건은 당일 중 KT 담당자에게 전달.<\u002Fp>\n    <div style=\"position: absolute; top: 60px; right: 0; width: 178px; font-family: 'Gaegu', cursive; font-size: 15px; line-height: 1.3; color: #00695C; transform: rotate(1deg);\">⟵ 끝인사까지 밝게. 마지막 인상이 다음 통화를 만듭니다.<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
