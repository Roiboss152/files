<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>주차권 QR 출력용 | KT 인천지사</title>
<style>
@font-face{font-family:'DIGICO';src:url('assets/fonts/digicottf-light.ttf') format('truetype');font-weight:300;}
@font-face{font-family:'DIGICO';src:url('assets/fonts/digicottf-medium.ttf') format('truetype');font-weight:500;}
@font-face{font-family:'DIGICO';src:url('assets/fonts/digicottf-bold.ttf') format('truetype');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;}
@page{size:A4 portrait;margin:0;}
body{
  font-family:'DIGICO','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  width:210mm;height:297mm;
  background:#f8f9fa;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}

/* 상단 헤더 바 */
.top-bar{
  background:#343a40;
  padding:18px 48px;
  display:flex;align-items:center;justify-content:space-between;
}
.top-bar img{height:28px;width:auto;filter:brightness(0) invert(1);opacity:0.8;}
.top-bar-right{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:1px;}

/* 기하학 배경 */
.bg-geo{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 80% 30%,rgba(222,226,230,0.6) 0%,transparent 60%),
    radial-gradient(ellipse 60% 70% at 10% 80%,rgba(206,212,218,0.3) 0%,transparent 60%);
}
.circle-deco{
  position:absolute;border-radius:50%;
  border:1px solid rgba(0,0,0,0.04);
}
.circle-deco.a{width:500px;height:500px;top:-150px;right:-150px;}
.circle-deco.b{width:320px;height:320px;top:-80px;right:-80px;}
.circle-deco.c{width:700px;height:700px;bottom:-350px;left:-300px;}

/* 메인 콘텐츠 */
.main{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;z-index:1;
  padding:40px 60px;
  gap:0;
}

/* 빅 타이포 */
.big-p{
  position:absolute;
  right:30px;top:20px;
  font-size:400px;font-weight:700;
  color:rgba(0,0,0,0.03);
  line-height:1;letter-spacing:-20px;
  user-select:none;
}

.eyebrow{
  font-size:11px;font-weight:500;
  color:#6c757d;letter-spacing:4px;
  text-transform:uppercase;
  margin-bottom:16px;
  align-self:flex-start;
}
.main-title{
  font-size:56px;font-weight:700;
  color:#343a40;letter-spacing:-3px;
  line-height:1.1;
  margin-bottom:8px;
  align-self:flex-start;
}
.main-sub{
  font-size:20px;font-weight:300;
  color:#868e96;letter-spacing:-0.5px;
  margin-bottom:48px;
  align-self:flex-start;
}

/* QR + 정보 레이아웃 */
.content-row{
  display:flex;gap:56px;align-items:center;
  width:100%;
}
.qr-side{
  flex-shrink:0;
}
.qr-wrap{
  background:#fff;
  border-radius:24px;
  padding:24px;
  border:1.5px solid #ced4da;
  box-shadow:0 4px 24px rgba(0,0,0,0.06);
}
.qr-wrap img{width:200px;height:200px;display:block;}

.info-side{flex:1;}
.step-item{
  display:flex;gap:20px;align-items:flex-start;
  padding:18px 0;
  border-bottom:1px solid #dee2e6;
}
.step-item:last-child{border-bottom:none;}
.step-num-sm{
  font-size:36px;font-weight:700;
  color:rgba(0,0,0,0.08);
  line-height:1;min-width:44px;
  letter-spacing:-2px;
}
.step-content .st{font-size:15px;font-weight:700;color:#343a40;margin-bottom:3px;}
.step-content .sd{font-size:13px;font-weight:300;color:#868e96;line-height:1.6;}

/* URL 표시 */
.url-bar{
  margin-top:32px;width:100%;
  background:rgba(255,255,255,0.7);
  border:1px solid #dee2e6;
  border-radius:12px;
  padding:14px 20px;
  display:flex;align-items:center;gap:12px;
}
.url-icon{
  width:32px;height:32px;
  background:#e9ecef;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.url-text{font-size:13px;color:#6c757d;font-weight:300;letter-spacing:0.3px;}

/* 하단 바 */
.bottom-bar{
  background:#fff;
  border-top:1px solid #dee2e6;
  padding:16px 48px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:1;
}
.bottom-info{font-size:12px;color:#868e96;font-weight:300;line-height:1.7;}
.bottom-info strong{font-weight:700;color:#343a40;}
.bottom-tag{
  background:#343a40;color:#fff;
  font-size:11px;font-weight:500;
  padding:6px 14px;border-radius:6px;
  letter-spacing:1px;
}

@media print{
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>

<!-- 상단 헤더 -->
<div class="top-bar">

  <span class="top-bar-right">KT 인천지사 · 시너지영업3팀</span>
