<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>밑그림 — 매장운영진단 기초자료 | KT 시너지영업3팀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#FFFFFF; --panel:#F5F5F7; --line:#E5E5E7; --grid:#F4F4F4;
  --ink:#201E1D; --sub:#6E6E73; --faint:#86868B;
  --accent:#EC3013; --accent-ink:#AE1800; --on:#FFFFFF;
  --W:590px; --pitch:147.5px;        /* 4분할 — 선을 절반 이하로 */
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);overflow-x:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:13px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}

.page{position:relative;z-index:1;width:var(--W);margin:0 auto;padding:55px 0 89px;
  background-image:linear-gradient(to right,var(--grid) 0 1px,var(--grid) 1px);
  background-size:1px 100%;background-position:442.5px 0;background-repeat:no-repeat}

/* ── 배경 타이포그래피 — 기능 없는 장식 단어 ── */
.bgw{position:absolute;z-index:-1;font-weight:900;letter-spacing:-.05em;line-height:.78;
  color:#F8F8F8;white-space:nowrap;pointer-events:none;user-select:none}
/* 그리드 — 기준이 되는 텍스트 블록에 붙고, 그 블록을 벗어나면서 흐려져 사라진다 */
.arule{position:absolute;z-index:-1;pointer-events:none;transform-origin:center center;
  transition:transform 1900ms cubic-bezier(.16,1,.3,1) var(--rd,0ms)}
.arule.h{transform:scaleX(0)} .sec.on .arule.h{transform:scaleX(1)}
.arule.v{transform:scaleY(0)} .sec.on .arule.v{transform:scaleY(1)}

/* ── 마스트헤드 ── */
.mast{display:flex;justify-content:space-between;align-items:flex-end;
  padding-bottom:9px;border-bottom:2px solid var(--ink)}
.mast .name{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mast .tag{font-size:11px;color:var(--faint);margin-top:5px}
.mast .tag em{font-style:normal;color:var(--accent);font-weight:700}
.mast .tag .en{color:var(--accent);font-weight:700;letter-spacing:.08em;margin-right:8px}
.mast .ver{font-size:9px;color:var(--faint);letter-spacing:.06em}

/* ── 섹션 ── */
.sec{position:relative;margin-top:55px}
.sec>.hd{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-top:16px;margin-bottom:18px}
.sec>.hd::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(to right,var(--ink) 0,var(--ink) 74%,var(--paper) 100%)}
.chap{position:relative;line-height:0;flex:none}
.chap .dig{display:block;width:58px;text-align:center;font-size:88px;font-weight:800;
  line-height:.92;letter-spacing:-.05em;color:#D2D2D2}
.chap h2{position:absolute;top:50%;left:29px;transform:translateY(-50%);white-space:nowrap;
  font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.sec>.hd .meta{font-size:9px;color:var(--faint);letter-spacing:.04em;white-space:nowrap}

/* ── 01 히어로 ── */
.hero .eyebrow{font-size:9px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:9px}
.hero .nm{font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero .meta2{font-size:11px;color:var(--sub);margin-top:13px}

/* Tier1 — 선 없이 여백으로만 나눈다 */
.kpis{display:grid;grid-template-columns:1fr 1fr;row-gap:34px;column-gap:34px;margin-top:42px;padding-top:21px}
.kpi .k{font-size:9px;letter-spacing:.08em;color:var(--faint);font-weight:600}
.kpi .v{font-size:66px;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin-top:5px;
  font-variant-numeric:tabular-nums}
.kpi .v u{text-decoration:none;font-size:19px;font-weight:600;color:var(--sub);margin-left:3px;
  vertical-align:.45em;letter-spacing:0}
.kpi .s{font-size:9px;color:var(--faint);margin-top:7px}

/* ── 발견 — 레드 면 대신 레드 세로선 하나 ── */
.find{position:relative;margin-top:42px;padding:3px 0 3px 21px;border-left:3px solid var(--accent)}
.find .eyebrow{font-size:9px;letter-spacing:.16em;font-weight:700;color:var(--accent)}
.find .lead{font-size:26px;font-weight:700;letter-spacing:-.022em;line-height:1.38;margin-top:10px}
.find .cite{font-size:9px;color:var(--faint);margin-top:12px;line-height:1.75}

/* ── 세로 막대 ── */
.bars{position:relative;display:grid;justify-content:start;column-gap:59.5px;align-items:end;margin-top:44px}
.bars::after{content:'';position:absolute;left:0;right:0;top:200px;height:1px;background:var(--line)}
.bars.n4{grid-template-columns:repeat(4,88px)}
.bars.n3{grid-template-columns:repeat(3,88px)}
.bar .track{position:relative;height:200px}
.bar .col{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*2px);background:var(--c);
  scale:1 0;transform-origin:bottom;opacity:0;border-radius:1px;
  transition:scale 2200ms cubic-bezier(.16,1,.3,1) var(--d,0ms),
             opacity 900ms ease var(--d,0ms),
             translate 300ms cubic-bezier(.2,.8,.2,1), filter 300ms ease}
.on .bar .col{scale:1 1;opacity:1}
.bar .n{position:absolute;left:0;right:0;text-align:center;bottom:calc(var(--p)*2px + 9px);
  font-size:22px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;
  opacity:0;translate:0 calc(var(--p)*2px + 30px);
  transition:translate 2200ms cubic-bezier(.16,1,.3,1) var(--d,0ms),
             opacity 1100ms ease var(--d,0ms), scale 300ms cubic-bezier(.2,.8,.2,1), color 300ms ease}
.on .bar .n{opacity:1;translate:0 0}
/* 마이크로 인터랙션 */
.bars:hover .bar{opacity:.4;transition:opacity 300ms ease}
.bars .bar:hover{opacity:1}
.bars .bar:hover .col{translate:0 -6px;filter:brightness(.82) saturate(1.1)}
.bars .bar:hover .n{scale:1.14}
.bar{transition:opacity 300ms ease}
.bar .lb{display:block;text-align:center;font-size:11px;color:var(--sub);margin-top:20px}
.bar .lb small{display:block;font-size:9px;color:var(--faint);margin-top:2px}
.bar.hot .n{color:var(--accent)}
.bar.hot .lb{color:var(--accent-ink);font-weight:600}
.axis{font-size:9px;color:var(--faint);margin-top:13px}

/* ── 로즈 ── */
.rosewrap{position:relative;width:100%}
.rose{width:100%;height:auto;display:block;overflow:visible}
.wedge{scale:.1;opacity:0;transform-origin:295px 214px;transform-box:view-box;cursor:default;
  transition:scale 2200ms cubic-bezier(.16,1,.3,1) var(--wd,0ms),
             opacity 1000ms ease var(--wd,0ms),
             translate 340ms cubic-bezier(.2,.8,.2,1), filter 340ms ease}
.on .wedge{scale:1;opacity:1}
.rosewrap:hover .wedge{opacity:.34}
.rosewrap .wedge:hover{opacity:1;translate:var(--ox) var(--oy);filter:brightness(1.06)}
.lbl.lit .n{scale:1.16}
.lbl{transition:opacity 900ms ease calc(var(--wd,0ms) + 1300ms)}
.lbl .n,.lbl .t{transition:scale 300ms cubic-bezier(.2,.8,.2,1),fill 300ms ease;
  transform-origin:center;transform-box:fill-box}
.lead-l{stroke:var(--faint);stroke-width:.75;stroke-dasharray:1.5 2.5;fill:none;opacity:0;
  transition:opacity 900ms ease calc(var(--wd,0ms) + 1100ms)}
.on .lead-l{opacity:.75}
.lbl{opacity:0}
.on .lbl{opacity:1}
.lbl .n{font-size:19px;font-weight:700;letter-spacing:-.02em;fill:var(--ink)}
.lbl .t{font-size:9px;fill:var(--faint)}
.lbl.hot .n{fill:var(--accent)}
.lbl.hot .t{fill:var(--accent-ink)}
/* 어두운 유리 — 색이 깔린 자리 위에만 */
.core{position:absolute;left:50%;top:47.6%;width:122px;height:122px;margin:-61px 0 0 -61px;
  border-radius:50%;display:grid;place-content:center;text-align:center;
  background:rgba(32,30,29,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:var(--on);opacity:0;transform:scale(.72);
  transition:opacity 1100ms ease 2300ms,transform 1600ms cubic-bezier(.16,1,.3,1) 2300ms}
.on .core{opacity:1;transform:scale(1)}
.core b{display:block;font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums}
.core span{display:block;font-size:9px;opacity:.8;margin-top:4px}

/* ── 목록 ── */
.list{list-style:none}
.list li{display:grid;grid-template-columns:70px 1fr;gap:13px;padding:13px 0;
  border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .d{font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px}
.list .ti{font-size:13px;line-height:1.5}
.list .by{font-size:9px;color:var(--faint);display:block;margin-top:3px}

.nt{font-size:9px;color:var(--faint);line-height:1.75;margin-top:13px}
.foot{margin-top:55px;padding-top:13px;border-top:1px solid var(--line);font-size:9px;
  color:var(--faint);line-height:1.85}
.foot .warn{color:var(--accent-ink)}

/* ── 도구 구역 (애플 스타일) + 포커스 스크림 ── */
.tool{position:relative;z-index:41;display:flex;gap:10px;align-items:flex-end;
  margin:21px -14px 0;padding:14px;border-radius:16px;background:transparent;
  transition:background 480ms ease,box-shadow 480ms ease}
.tool.lit{background:var(--paper);box-shadow:0 22px 70px rgba(32,30,29,.22)}
.tf{width:148px;flex:none}.tf.grow{flex:1;width:auto}
.tl{display:block;font-size:9px;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:7px}
.tool input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid transparent;border-radius:12px;padding:11px 14px;outline:none;
  transition:background 300ms ease,border-color 300ms ease,box-shadow 300ms ease}
.tool input::placeholder{color:#B4B4B9}
.tool input:hover{background:#EDEDF0}
.tool input:focus{background:var(--paper);border-color:rgba(32,30,29,.16);
  box-shadow:0 0 0 4px rgba(236,48,19,.13)}
.tbtn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:12px;padding:12px 22px;
  background:var(--ink);color:#fff;cursor:pointer;
  transition:transform 260ms cubic-bezier(.2,.8,.2,1),background 260ms ease}
.tbtn:hover{background:#000;transform:translateY(-2px)}
#scrim{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;
  background:rgba(32,30,29,.19);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:opacity 560ms cubic-bezier(.16,1,.3,1)}
#scrim.on{opacity:1}
.bgw{will-change:transform}
.bar-ui{position:fixed;right:21px;bottom:21px;z-index:9;display:flex;gap:8px;
  background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:12px;padding:8px}
.bar-ui button{font:inherit;font-size:12px;font-weight:600;border:0;border-radius:8px;
  padding:9px 14px;background:var(--ink);color:#fff;cursor:pointer}
.bar-ui button.g{background:var(--panel);color:var(--ink)}

@media screen{ .sec{overflow:hidden} }
@media (max-width:660px){
  :root{--W:100%;--pitch:33.3%}
  .tool{flex-wrap:wrap;margin:16px 0 0;padding:0}
  .tf{width:100%}.tbtn{width:100%}
  .page{padding:34px 16px 55px}
  .bgw{display:none}
  .hero .nm{font-size:44px}
  .kpi .v{font-size:46px}
  .bars{column-gap:16px}
  .bars.n4{grid-template-columns:repeat(4,1fr)}
  .bars.n3{grid-template-columns:repeat(3,1fr)}
}

@media print{
  @page{size:A4;margin:27mm}
  .bar-ui,.tool,#scrim{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page{width:100%;padding:0;background-position:75% 0}
  .sec{overflow:visible}
  .kpis,.find,.bars,.rosewrap,.list{break-inside:avoid;page-break-inside:avoid}
  .foot{margin-top:26px}
  .rose{width:84%}
  .sec>.hd{break-after:avoid;page-break-after:avoid}
  .sec{margin-top:38px}
  .chap .dig{font-size:70px}
  .chap h2{left:24px;font-size:17px}
  .sec>.hd{padding-top:13px;margin-bottom:14px}
  .hero .nm{font-size:64px}
  .kpis{margin-top:34px}
  .kpi .v{font-size:54px}
  .find{margin-top:34px}
  .find .lead{font-size:23px}
  .bgw{color:#F7F7F7}
  .chap .dig{color:#CECECE}
  .bar .col{transform:scaleY(1)!important;transition:none}
  .bar .n,.lbl,.core{opacity:1!important;transform:none!important;transition:none}
  .bgw{transform:none!important}
  .wedge{transform:scale(1)!important;opacity:1!important;transition:none}
  .lead-l{opacity:1!important;stroke:#A4A4A8}
  .arule{transform:none!important;transition:none}
  .core{background:#2A2827;-webkit-backdrop-filter:none;backdrop-filter:none}
  a{color:var(--ink);text-decoration:none}
}
@media (prefers-reduced-motion:reduce){
  .bar .col,.bar .n,.wedge,.lead-l,.lbl,.core,.arule{transition:none!important}
  .arule{transform:none!important}
  .bgw{transform:none!important}
}

fieldset{border:0;margin:0;padding:0;min-width:0}

/* ══ 도구 구역 추가 ══ */
/* 도구 줄이 칸 폭을 다 쓰게 한다 — 안 그러면 내용만큼만 줄어들어 오른쪽에 빈 자리가 남는다
   (둘째 줄을 뺀 뒤 한 줄만 남으면서 드러난 문제) */
#searchSet{flex:1 1 auto;min-width:0}
.trow{display:flex;gap:10px;align-items:flex-end}
.trow+.trow{margin-top:12px}
.trow[aria-disabled="true"]{opacity:.42;pointer-events:none}
.tf.w96{width:96px;flex:none}
.tool select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none;appearance:none;
  transition:background 300ms ease,border-color 300ms ease,box-shadow 300ms ease}
.tool select:hover{background:#EDEDF0}
.tool select:focus{background:var(--paper);border-color:rgba(32,30,29,.16);box-shadow:0 0 0 4px rgba(236,48,19,.13)}
.msg{font-size:11px;color:var(--sub);margin:12px 0 0;line-height:1.7}
.msg.err{color:var(--accent-ink);font-weight:600}
.msg.warn{color:var(--ink);font-weight:600}
.msg.ok{color:var(--sub)}
.msg:empty{display:none}

/* 키 상태 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chips:empty{display:none}
.chip{font-size:9px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.chip.off{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 후보 목록 */
.cands{list-style:none;margin:21px 0 0;padding:0}
/* v3.20 최근 수집 · 불러오기 · 진행 세 칸 */
/* v3.23: 6장의 글 목록(ul.recent)과 이름이 겹쳐 margin:0 에 덮이던 것 — 칩 줄은 id 로 잡는다 */
#recent{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:16px 0 0;padding:12px 0 0;border-top:1px dashed var(--line);font-size:12.5px;color:var(--dim,#6E6E73)}
#recent[hidden]{display:none}
#recent button{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
#recent button.load{border-style:dashed;color:var(--dim,#6E6E73)}
#recent button:hover{border-color:var(--ink)}
body.dropping::after{content:'묶음(.json)을 놓으면 그 매장이 열립니다';position:fixed;inset:14px;border:2px dashed var(--accent);border-radius:16px;display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--accent);background:rgba(233,233,236,.86);z-index:70;pointer-events:none}
.track{display:inline-flex;gap:6px;align-items:center;margin-left:auto;font-size:12.5px;color:var(--dim,#6E6E73);flex-wrap:wrap}
.track .tl{font-size:11px;letter-spacing:.06em;color:var(--sub);margin-right:2px}
.track button{font:inherit;font-size:12.5px;padding:5px 11px;border:1.4px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 1px 0 rgba(32,30,29,.25)}
.track button:hover{background:var(--panel)}
.track button.on{background:var(--ink);color:#fff;font-weight:600}
.track button.diag{border-style:dotted;cursor:default;box-shadow:none;background:transparent;color:var(--ink)}
.track .src9{flex-basis:100%;margin-top:2px}
@media print{#recent,.track{display:none!important}}
.cands:empty{display:none}
.cand{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:16px 0;border-bottom:1px solid var(--line)}
.cand .nm{font-size:17px;font-weight:700;letter-spacing:-.015em}
.cand .meta{font-size:11px;color:var(--faint);margin-top:4px}
.cand .pick{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);border-radius:10px;padding:9px 15px;cursor:pointer;white-space:nowrap;
  transition:background 240ms ease,border-color 240ms ease,transform 240ms cubic-bezier(.2,.8,.2,1)}
.cand .pick:hover{background:var(--ink);border-color:var(--ink);color:#fff;transform:translateY(-2px)}

/* 진행 */
.prog{display:flex;align-items:center;gap:18px;margin-top:21px;font-size:12px;color:var(--sub)}
/* v3.20 수집 진행 — 밑그림이 채워진다. 30장 스프라이트(6×5)를 진행률로 넘긴다 */
.pfr{flex:none;width:300px;height:188px;background:url(sketch_prog.webp) 0 0/600% 500% no-repeat;mix-blend-mode:multiply}
.ptx{min-width:0}.psub{margin-top:6px;font-size:11.5px;color:var(--dim,#6E6E73)}
@media (max-width:560px){.prog{flex-direction:column;align-items:flex-start}.pfr{width:100%;height:auto;aspect-ratio:8/5}}
.skhero{margin:4px 0 22px;max-height:600px;overflow:hidden;transition:max-height .55s ease,opacity .4s ease,margin .55s ease}
.skhero video{display:block;width:100%;height:auto;mix-blend-mode:multiply;background:transparent}
.skhero.away{max-height:0;opacity:0;margin:0}
@media print{.skhero{display:none!important}}
.prog[hidden]{display:none}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);
  animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ 흑백 배지 (색 대신 명도로 상태를 나눈다) ══ */
.bdg{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.03em;
  padding:2px 7px;border-radius:4px;vertical-align:1px}
.bdg.fail{background:var(--ink);color:#fff}            /* 수집 실패 */
.bdg.warn{background:#6E6E73;color:#fff}               /* 확인 필요 */
.bdg.info{background:#E9E9EC;color:var(--ink)}         /* 참고·보조 */

/* ══ 극단적 스케일 대비 (데이터가 디자인) ══ */
.lead-n{font-size:112px;font-weight:800;letter-spacing:-.05em;line-height:.92;margin-top:6px;
  font-variant-numeric:tabular-nums}
.lead-read{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.45;margin-top:11px}
.ev{margin-top:12px}.evl{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.6}.evl li{margin:3px 0}.evl a{color:var(--sub)}
/* v3.21 0장 v2 — 진단서 */
/* v3.24: 가독성 — 제목(판정)과 본문(사실) 사이 24px + 가는 선, 본문은 보통 굵기·줄 간격 1.8, 칩·눈금은 24px 간격. 사진 윗선 = 제목 대문자 윗선 */
.verdict{font-size:24px;line-height:1.38;font-weight:800;letter-spacing:-.03em;margin:0;padding-bottom:22px;border-bottom:1px solid var(--line)}
@supports (text-box: trim-both cap alphabetic){ .sumtop .verdict{text-box:trim-start cap alphabetic} }
@supports not (text-box: trim-both cap alphabetic){ .sumtop .verdict{margin-top:-.2em} }
.sumtop .sumlead.md{margin-top:20px;font-size:16px;font-weight:400;line-height:1.8;letter-spacing:-.01em;color:var(--sub)}
.sumtop .sumlead.md b{font-weight:700;color:var(--accent-ink)}
.axes{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 8px;align-items:center}
.axes .src9{flex-basis:100%;margin-top:2px}
.mz.sumtop{align-items:stretch}
.sumtop .sumph{position:relative;min-height:320px}
.sumtop .sumph .ph{position:absolute;inset:0;height:auto;min-height:0;aspect-ratio:auto}
.ax{font-size:11px;font-weight:700;letter-spacing:.02em;border:1px solid var(--ink);border-radius:999px;padding:2px 9px;cursor:help}
.ax.l2{background:var(--ink);color:#fff}
.glegend{margin-top:0;font-size:11px;color:var(--sub);display:flex;gap:6px;align-items:center}
.mz.sumg{margin-top:34px}
/* 눈금 한 줄 = 12칸 격자 (.mz 와 같은 칸·틈) — 이름 5칸(사진 칸 폭), 막대 3칸 + 값 4칸(글 칸 폭) */
.sumg .gauge{grid-template-columns:repeat(12,minmax(0,1fr));column-gap:34px}
.sumg .gauge .gl{grid-column:span 5}.sumg .gauge .gt{grid-column:span 3}.sumg .gauge .gv{grid-column:span 4}
.glegend i{display:inline-block}.glegend i.bar{width:22px;height:9px;background:var(--accent,#EC3013);border-radius:2px}.glegend i.ref{width:2px;height:13px;background:var(--ink);margin-left:8px}
.gauges{margin-top:6px;border-top:1px solid var(--rule,#DCDCE1)}
.gauge{display:grid;grid-template-columns:1.3fr 1fr 1.1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule,#DCDCE1);font-size:12px}
.gauge .gl{color:var(--sub)}.gauge .gl b{color:var(--ink)}
.gauge .gt{position:relative;height:10px;background:var(--panel,#E9E9EC);border-radius:2px}
.gauge .gt i.bar{position:absolute;left:0;top:0;bottom:0;background:var(--accent,#EC3013);border-radius:2px}
.gauge .gt i.ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-50%)}
.gauge .gv{font-variant-numeric:tabular-nums;white-space:nowrap}
.sumlist.sw li{padding-left:44px;font-size:14px}
.sumlist.sw .so{font-size:12px;color:var(--sub);margin-top:3px}.sumlist.sw .so.w{color:var(--accent-ink,#B8250E);font-weight:600}
/* (v3.24: 사진 칸은 위 .sumtop .sumph 규칙으로 — 글 칸 높이에 맞춰 늘어난다) */
.first .deck{margin-top:8px}.first .acc{color:var(--accent,#EC3013)}
@media (max-width:660px){.gauge,.sumg .gauge{grid-template-columns:1fr 1fr;grid-auto-rows:auto;column-gap:10px}.sumg .gauge .gl,.sumg .gauge .gt{grid-column:auto}.gauge .gv,.sumg .gauge .gv{grid-column:1/-1}.verdict{font-size:20px}.sumtop .sumph{min-height:280px}.sumtop .sumlead.md{font-size:15px}}
@media print{.sumph{display:none!important}.sumtop .b.s7{grid-column:1/-1}}
/* v3.20 0장 요약 */
.sumlead{margin-top:10px}.sumlead b{color:var(--ink)}
.sumlist{list-style:none;margin:10px 0 0;padding:0}
.sumlist li{position:relative;padding:9px 0 9px 52px;border-top:1px solid var(--rule,#DCDCE1);font-size:15px;line-height:1.5}
.sumlist li:first-child{border-top:0}
.sumlist li>a[data-sec]:not(.sl){position:absolute;left:0;top:11px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:1px 7px;line-height:16px}
.sumlist li>a[data-sec]:not(.sl):empty{display:none}
.sumlist li.muted{color:var(--dim,#6E6E73)}
.sumlist.look li{padding-left:0}
.sumlist.look a{color:var(--ink);text-decoration:none;font-weight:600;border-bottom:1.5px solid var(--accent)}
.sumlist.look a:hover{color:var(--accent)}
.lead-ref{font-size:11px;color:var(--faint);margin-top:8px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:26px;padding-top:21px;border-top:1px solid var(--line)}
.two .v{font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums}
.rest{font-size:11px;color:var(--sub);margin-top:26px;padding-top:11px;border-top:1px solid var(--line);
  font-variant-numeric:tabular-nums;line-height:1.95}
.src9{font-size:9px;color:var(--faint);margin-top:7px;line-height:1.7}

/* ══ 표 ══ */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{width:30%;color:var(--sub);font-weight:500}
.tbl td{font-variant-numeric:tabular-nums}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl .tiny{font-size:9px;color:var(--faint)}

/* ══ 아코디언 ══ */
.acc{border-bottom:1px solid var(--line)}
.acc>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:21px 0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .cnt{font-size:9px;color:var(--faint);font-weight:500;letter-spacing:.04em}
.acc .ico{flex:none;width:17px;height:17px;position:relative;
  transition:transform 380ms cubic-bezier(.4,0,.2,1)}
.acc .ico::before,.acc .ico::after{content:'';position:absolute;left:0;top:8px;width:17px;height:1.5px;background:var(--ink)}
.acc .ico::after{transform:rotate(90deg);transition:opacity 380ms cubic-bezier(.4,0,.2,1)}
.acc[open] .ico{transform:rotate(45deg)}
.acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows 520ms cubic-bezier(.4,0,.2,1)}
.acc[open] .body{grid-template-rows:1fr}
.acc .body>div{overflow:hidden;opacity:0;transition:opacity 300ms ease 180ms}
.acc[open] .body>div{opacity:1}
.acc .body .inner{padding-bottom:21px}

/* 지원 제도 목록 */
.sup{list-style:none;margin:0;padding:0}
.sup li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;
  border-bottom:1px solid var(--line)}
.sup li:last-child{border-bottom:0}
.sup .what{font-size:13px;font-weight:600}
.sup .why{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.6}
.sup a{font-size:11px;color:var(--sub);white-space:nowrap}
.ask{margin:0;padding-left:17px;font-size:13px;line-height:1.9}

/* 목록 공통 */
.recent{list-style:none;margin:0;padding:0;font-size:13px}
.recent li{display:grid;grid-template-columns:70px 1fr;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.recent li:last-child{border-bottom:0}
.recent .d{font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px}
.recent .by{display:block;font-size:9px;color:var(--faint);margin-top:3px}
.errs{margin:0;padding-left:17px;font-size:11px;color:var(--sub);line-height:1.85}

/* 결과 동작 버튼 */
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:34px}
.acts[hidden]{display:none}
.abtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);border-radius:11px;padding:11px 17px;cursor:pointer;
  transition:background 240ms ease,border-color 240ms ease,transform 240ms cubic-bezier(.2,.8,.2,1)}
.abtn:hover{border-color:#B9B9BE;transform:translateY(-2px)}
.abtn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.abtn.primary:hover{background:#000}

/* ══ 빠름 모드 ══ */
[data-motion="fast"] .arule,[data-motion="fast"] .bar .col,[data-motion="fast"] .bar .n,
[data-motion="fast"] .wedge,[data-motion="fast"] .lead-l,[data-motion="fast"] .lbl,[data-motion="fast"] .core
  {transition-duration:400ms!important;transition-delay:0ms!important}
[data-motion="fast"] .bgw{transform:none!important}

/* 늦게 도착한 섹션은 연출 없이 바로 */
.sec.static .arule{transform:none!important;transition:none}
.sec.static .bar .col,.sec.static .bar .n,.sec.static .wedge,
.sec.static .lead-l,.sec.static .lbl,.sec.static .core{transition:none!important}
.sec.static .bgw{display:none}

@media print{
  .tool,.chips,.cands,.prog,.acts,.msg,#recent,#scrim{display:none!important}
  .acc:not([open]){display:none!important}          /* 접힌 건 인쇄하지 않는다 */
  .acc>summary .ico{display:none}
  .acc[open]>.body{grid-template-rows:1fr}
  .acc[open]>.body>div{opacity:1}
}
@media (max-width:660px){
  .trow{flex-wrap:wrap}.trow .tf,.trow .tbtn{width:100%}
  .two{grid-template-columns:1fr;gap:26px}
  .lead-n{font-size:72px}
}

/* 리포트 안 링크는 먹색 밑줄 */
#report a{color:var(--ink);text-decoration:underline;text-decoration-color:#C7C7CC;text-underline-offset:3px}
#report a:hover{text-decoration-color:var(--accent)}
.nm{white-space:nowrap}

/* ══ 로그인 팝업 ══ */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:rgba(32,30,29,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:opacity 480ms cubic-bezier(.16,1,.3,1),visibility 480ms}
.modal.done{opacity:0;visibility:hidden;pointer-events:none}
.mcard{width:min(420px,calc(100vw - 32px));background:var(--paper);border-radius:20px;padding:34px 30px 26px;
  box-shadow:0 30px 90px rgba(32,30,29,.26);transform:scale(1);
  transition:transform 480ms cubic-bezier(.16,1,.3,1)}
.modal.done .mcard{transform:scale(.94)}
.mcard .mname{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mcard .mtag{font-size:11px;color:var(--faint);margin-top:6px}
.mcard .mtag .en{color:var(--accent);font-weight:700;letter-spacing:.08em;margin-right:7px}
.mcard .mtag em{font-style:normal;color:var(--accent);font-weight:700}
.mform{display:flex;gap:9px;margin-top:26px}
.mform input{flex:1;font:inherit;font-size:15px;color:var(--ink);background:var(--panel);

.mcard .msg{margin-top:14px}
.mcard .chips{margin-top:13px}

/* ══ 리뷰·차트 부속 ══ */
.rvbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px}
.rvbar input{flex:1;min-width:220px;font:inherit;font-size:13px;color:var(--ink);background:var(--panel);
  border:1px solid transparent;border-radius:11px;padding:10px 13px;outline:none}
.rvbar input:focus{background:var(--paper);border-color:rgba(32,30,29,.16)}
.rvopts{display:flex;flex-direction:column;gap:7px;margin-top:13px;font-size:11px;color:var(--sub)}
.rvopts label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.rvopts input{accent-color:var(--accent)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.cmp{list-style:none;margin:13px 0 0;padding:0}

.cmp .sn{font-size:13px;line-height:1.6;margin-top:8px}
.cmp .fx{font-size:11px;color:var(--accent-ink);font-weight:600;margin-top:6px}
.flag2{position:relative;margin-top:26px;padding:3px 0 3px 21px;border-left:3px solid var(--accent)}
.flag2 .eyebrow{font-size:9px;letter-spacing:.16em;font-weight:700;color:var(--accent)}
.flag2 .lead-read{margin-top:8px;font-size:16px}
svg.trend{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
svg.trend .g{stroke:var(--line);stroke-width:1}
svg.trend .yl{fill:var(--faint);font-size:9px;text-anchor:end}
svg.trend .xl{fill:var(--faint);font-size:9px;text-anchor:middle}
svg.trend path{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.trend path.now{stroke-dasharray:4 4;stroke-width:1.5}
svg.trend circle.now{fill:var(--paper);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11px;color:var(--sub)}
.legend .lg{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.legend .lg i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend .lg small{font-weight:400;color:var(--faint)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;list-style:none;margin:13px 0 0;padding:0}
.thumbs a{display:block;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--panel)}
.thumbs img{width:100%;height:100%;object-fit:contain;display:block}
.menuwrap{display:flex;gap:12px;align-items:flex-start}
.menutbl{flex:1;min-width:0}
.thumbs.mini{grid-template-columns:1fr 1fr;gap:4px;width:96px;flex:none;margin:0;perspective:none}
.thumbs.mini li.brd a{border-color:var(--accent,#EC3013)}
.thumbs.mini a{border-radius:3px;background:#fff;border:1px solid rgba(32,30,29,.12);transform:none!important}
.thumbs.mini img{object-fit:cover}
@media print{.thumbs.mini{display:none}}
/* ══ 거리별 밀도 · 주변 업종 구성 (3장) ══ */
.dist{list-style:none;margin:13px 0 0;padding:0}
.dist li{display:flex;align-items:center;gap:13px;padding:7px 0}
.dist .dl{width:76px;flex:none;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.dist .db{flex:1;height:10px;background:var(--panel);border-radius:2px;overflow:hidden}
.dist .db i{display:block;height:100%;background:#6E6E73;
  transform-origin:left center;transform:scaleX(0);transition:transform 900ms cubic-bezier(.2,.8,.2,1)}
.on .dist .db i{transform:scaleX(1)}
.dist li.hot .db i{background:var(--accent)}
.dist li.hot .dn{color:var(--accent-ink);font-weight:700}
.dist .dn{width:56px;flex:none;text-align:right;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums}
/* 9장 한 달 비용의 크기 — 100 대 14~19 (v3.00) */
.dist.cmp .dl{width:118px;font-size:12px;color:var(--ink)}
.dist.cmp .db{position:relative;height:14px}
.dist.cmp .db i{position:absolute;left:0;top:0}
.dist.cmp li.ink .db i{background:var(--ink)}
.dist.cmp li.hot .db i.lo{background:#F6B9AE}
.dist.cmp .dn{width:96px;font-size:14px;white-space:nowrap}
.mixbar{display:flex;height:21px;border-radius:3px;overflow:hidden;margin-top:13px;background:var(--panel)}
.mixbar i{display:block;height:100%}
.mixleg{list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:9px 26px;margin:16px 0 0;padding:0;font-size:11px;color:var(--sub)}
.mixleg li{display:inline-flex;align-items:baseline;gap:7px}

.mixleg i{width:10px;height:10px;border-radius:3px;flex:none}
.mixleg b{color:var(--ink);font-weight:700}

/* ══ 부정 표현 — 빨강은 절제하기로 했으니 본문에는 진한 쪽(#AE1800)을 쓴다 ══ */
.cmp .sn em.neg{font-style:normal;font-weight:700;color:var(--accent-ink)}
/* 빨간 '글씨'는 문제(부정 표현)에만, 우리 해결책은 빨간 '선'으로 — 둘이 안 섞이게 */
.cmp .fx{color:var(--ink);font-weight:600;border-left:2px solid var(--accent);padding-left:9px}

.tips{list-style:none;margin:13px 0 0;padding:0;font-size:12px;color:var(--sub)}
.tips li{padding:8px 0;border-bottom:1px solid var(--line);line-height:1.65}
.tips li:last-child{border-bottom:0}
.tips b{color:var(--ink);font-weight:700}

/* ══ 키워드 후보 ══ */
.kwtop{list-style:none;margin:13px 0 0;padding:0 0 13px}
.kwtop li{display:flex;align-items:baseline;gap:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.kwtop li:last-child{border-bottom:0}
.kwtop .kt{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.kwtop li:first-child .kt{color:var(--accent-ink)}
.kwtop .kw9{margin-left:auto;font-size:9px;color:var(--faint);text-align:right;white-space:nowrap}

/* ══ 견적 밑그림 ══ */
.chain{list-style:none;counter-reset:ch;margin:21px 0 0;padding:0;font-size:13px}
.chain li{counter-increment:ch;display:grid;grid-template-columns:24px 1fr;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line);line-height:1.6;font-variant-numeric:tabular-nums}
/* li 안의 글과 <b>가 각각 그리드 칸이 되지 않게 — 내용은 span 하나로 감싼다 */
.chain li>span{display:block}
.tbl.fee th{width:38%}
.chain li::before{content:counter(ch,decimal-leading-zero);font-size:9px;color:var(--faint);font-weight:600;
  padding-top:4px;letter-spacing:.04em}
.chain li:last-child{border-bottom:0}
.chain b{font-weight:700;color:var(--ink)}
.tbl.qt th{width:15%}
.tbl.qt td{width:auto}
.tbl.qt .hd9 th,.tbl.qt .hd9 td{font-size:9px;letter-spacing:.06em;color:var(--faint);font-weight:600;padding-bottom:6px}
.tbl.qt td:last-child{font-weight:600}
.tool input[type=number]{-moz-appearance:textfield}
.tool input[type=number]::-webkit-outer-spin-button,.tool input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ══ v2.60 연출 — 종이는 가만히 있고 잉크만 움직인다 ══ */
/* 층: 배경 글자는 맨 뒤(-2), 그리드 선은 그 위(-1), 본문은 그 위 */
.bgw{z-index:-2}
/* 그리드 선은 스크롤 진행도에 묶어 JS가 길이를 정한다 — 전환은 끈다 */
.arule{transition:none}

/* 챕터 숫자 밀기 — 숫자는 왼쪽 아래를 축으로 24° 기운 채 기다리고, 제목이 오른쪽에서 와서 바로 세운다 */
.chap .dig{transform-origin:14% 88%;transform:rotate(24deg);
  transition:transform 1400ms cubic-bezier(.34,1.56,.64,1) 900ms}   /* 제목이 닿는 순간(0.9s)부터 바로 선다 */
.sec.on .chap .dig{transform:rotate(0deg)}
.chap h2{opacity:0;transform:translate(44px,-50%);
  transition:transform 1100ms cubic-bezier(.16,1,.3,1) 250ms,opacity 700ms ease 250ms}
.sec.on .chap h2{opacity:1;transform:translate(0,-50%)}
.sec>.hd .meta{opacity:0;transition:opacity 800ms ease 1600ms}
.sec.on>.hd .meta{opacity:1}
/* 제목 위 가로선은 왼쪽에서 그어진다 */
.sec>.hd::before{transform:scaleX(0);transform-origin:left center;
  transition:transform 1600ms cubic-bezier(.16,1,.3,1) 150ms}
.sec.on>.hd::before{transform:scaleX(1)}

/* 9장 계산 사슬 — 한 줄씩 70ms 간격으로 (다시 그려질 때도 같은 연출) */
.chain li{opacity:0;transform:translateY(9px);
  transition:opacity 700ms ease calc(var(--i,0)*120ms + 500ms),transform 900ms cubic-bezier(.16,1,.3,1) calc(var(--i,0)*120ms + 500ms)}
.sec.on .chain li{opacity:1;transform:none}
/* 키워드 1순위 — 왼쪽부터 잉크처럼 드러난다 */
.kwtop li:first-child .kt{clip-path:inset(-2px 100% -2px 0);
  transition:clip-path 1500ms cubic-bezier(.16,1,.3,1) 600ms}
.sec.on .kwtop li:first-child .kt{clip-path:inset(-2px 0 -2px 0)}

/* 큰 숫자와 표 사이 */
.hero .kpis+.tbl{margin-top:42px}
.two+.chain{margin-top:34px}

/* 메뉴판 사진 카드 — 마우스 자리로 기울고, 빛이 커서를 따라간다 */
.thumbs{perspective:700px}
.thumbs a{position:relative;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)) scale(var(--sc,1));
  transition:transform 380ms cubic-bezier(.2,.8,.2,1),box-shadow 380ms ease;will-change:transform}
.thumbs a::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.6),rgba(255,255,255,0) 58%);
  transition:opacity 380ms ease}
.thumbs a:hover{--ty:-4px;--sc:1.035;box-shadow:0 16px 32px rgba(32,30,29,.16)}
.thumbs a:hover::after{opacity:1}
.thumbs a.tilting{transition:transform 90ms linear,box-shadow 380ms ease}

/* 늦게 도착한 장·빠름 모드·모션 축소 — 연출 없이 최종 상태 */
.sec.static .chap .dig,.sec.static .chap h2,.sec.static>.hd .meta,.sec.static>.hd::before,
.sec.static .chain li,.sec.static .kwtop .kt{transition:none!important}
[data-motion="fast"] .chap .dig,[data-motion="fast"] .chap h2,[data-motion="fast"]>.hd .meta,
[data-motion="fast"] .sec>.hd::before,[data-motion="fast"] .chain li,[data-motion="fast"] .kwtop .kt
  {transition-duration:400ms!important;transition-delay:0ms!important}
[data-motion="fast"] .arule{transform:none!important}
@media (prefers-reduced-motion:reduce){
  .chap .dig,.chap h2,.sec>.hd .meta,.sec>.hd::before,.chain li,.kwtop .kt,.thumbs a{transition:none!important}
  .chap .dig,.sec>.hd::before,.arule,.chain li{transform:none!important}
  .chap h2{opacity:1!important;transform:translate(0,-50%)!important}
  .sec>.hd .meta,.chain li{opacity:1!important}
  .kwtop li:first-child .kt{clip-path:none!important}
}

/* ══ 큰 화면 — 종이 한 장으로 읽히게 ══
   본문 590px은 인쇄 폭(156mm)이라 늘릴 수 없다. 대신 A4 한 장을 통째로 그리고
   배율로 키운다. 인쇄에는 zoom:1이 걸려 있어 출력물은 배율과 무관하다. */
@media screen and (min-width:900px){
  body{background:#E6E6E9}
  .page{width:794px;padding:102px 102px 89px;   /* 794 = A4 폭, 102 = 27mm 여백 */
    background-color:var(--paper);background-origin:content-box;
    box-shadow:0 1px 3px rgba(32,30,29,.10),0 18px 56px rgba(32,30,29,.16);
    zoom:var(--zoom,1)}
  .modal,.zoomui{zoom:var(--zoom,1)}
}
/* 배율 조절 — 우하단 */
.zoomui{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;align-items:center;gap:2px;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;
  box-shadow:0 2px 10px rgba(32,30,29,.10);font-size:11px;color:var(--sub)}
.zoomui button{font:inherit;font-size:14px;line-height:1;border:0;background:none;color:var(--ink);
  width:26px;height:24px;border-radius:7px;cursor:pointer}
.zoomui button:hover{background:var(--panel)}
.zoomui span{min-width:38px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
@media screen and (max-width:899px){ .zoomui{display:none} }

/* ══ 막대 묶음 — 개수에 맞춰 폭·간격이 정해진다 ══ */
.bars{grid-template-columns:repeat(var(--bn,3),var(--bw,88px));column-gap:var(--bgap,59.5px)}

@media print{
  .modal,.rvbar,.rvopts,#sec-images,.zoomui{display:none!important}
  .page{zoom:1!important;box-shadow:none!important}
  .sec.screen-only{display:none!important}
  .core span{opacity:1;color:#D4D4D4}     /* 흰색 80%를 #2A2827 위에 합성한 값 */
  /* 마우스가 차트 위에 있는 채로 인쇄하면 나머지가 흐리게 찍힌다 — 호버 효과를 끈다 */
  /* 낱장 조각이 나지 않게 — 한 덩어리는 한 쪽 안에서 끝낸다 */
  .cmp li,.recent li,.sup li,.tips li,.two,.rest,.flag2,.acts,.tbl tr,.kpi,.bar,.kwtop li,
  .dist,.dist li,.mixbar,.mixleg,.barswrap,.rosewrap,.chain li,.tbl.qt
    {break-inside:avoid;page-break-inside:avoid}
  .k,.eyebrow,.legend{break-after:avoid;page-break-after:avoid}
  .bars *,.rosewrap *{filter:none!important;translate:none!important}
  .bars:hover .bar,.bars .bar:hover,.rosewrap:hover .wedge,.rosewrap .wedge:hover
    {opacity:1!important;scale:1!important}
  .bars .bar:hover .n,.lbl.lit .n{scale:1!important}
  /* 전환(transition)은 !important보다 우선한다 — 지연 구간에 갇히지 않게 아예 끈다 */
  .wedge,.lead-l,.lbl,.lbl .n,.lbl .t,.bar,.bar .col,.bar .n,.core,.arule,.bgw,.dist .db i,
  .chap .dig,.chap h2,.sec>.hd .meta,.sec>.hd::before,.chain li,.kwtop .kt
    {transition:none!important}
  .chap .dig,.sec>.hd::before,.chain li{transform:none!important}
  .chap h2{opacity:1!important;transform:translate(0,-50%)!important}
  .sec>.hd .meta,.chain li{opacity:1!important}
  .kwtop li:first-child .kt{clip-path:none!important}
  .dist .db i{transform:scaleX(1)!important}
  .wedge,.lead-l,.lbl,.bar .col,.bar .n{opacity:1!important}
  .bars{grid-template-columns:repeat(var(--bn,3),1fr)}
}

/* ══ v3.10 매거진 모자이크 — 장마다 다른 칸 나누기, 차트는 자기 칸을 갖는다 ══ */
.mz{display:grid;grid-template-columns:repeat(12,1fr);gap:46px 34px;margin-top:30px;align-items:start}
.mz>.b{min-width:0}
.mz .s12{grid-column:span 12}.mz .s8{grid-column:span 8}.mz .s7{grid-column:span 7}.mz .s6{grid-column:span 6}
.mz .s5{grid-column:span 5}.mz .s4{grid-column:span 4}
.mz .b.rail{padding-left:0}                                   /* 선 대신 여백으로 나눈다 (Neo-minimal) */
.mz .b.top{border-top:1px solid var(--line);padding-top:28px}
.mz .b.tight{margin-top:-8px}
.mz .b>.k:first-child{margin-top:0}
.mz .v,.kv{font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums}
.tbl.fee th,.tbl.fee td{padding:7px 4px;font-size:11px;line-height:1.5}
.deck{font-size:21px;font-weight:700;letter-spacing:-.022em;line-height:1.42;margin:0}
.deck b{color:var(--accent-ink)}
.deck.md{font-size:17px;line-height:1.45}
@media (max-width:660px){.mz>.b{grid-column:1/-1}.mz .b.rail{border-left:0;padding-left:0}.mz .b.top{border-top:0;padding-top:0}}

/* 순위 리스트 */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:20px 12px 1fr auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.rank li:last-child{border-bottom:0}
.rank .no{font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums}
.rank i{width:10px;height:10px;border-radius:3px;display:inline-block;position:relative;top:1px}
.rank .nm{color:var(--ink)}
.rank .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rank .v small{font-weight:500;color:var(--faint);margin-left:5px;font-size:10px}
.rank li.hot .nm,.rank li.hot .v{color:var(--accent-ink)}

/* 도넛 */
.donut{position:relative}
.donut svg{width:100%;height:auto;display:block;overflow:visible}
.donut .arc{fill:none;opacity:0;transition:opacity 500ms ease var(--dd,0ms)}
.on .donut .arc{opacity:1}
.on .donut:hover .arc{opacity:.32}.on .donut .arc:hover{opacity:1}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .ctr b{display:block;font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1}
.donut .ctr span{display:block;font-size:10px;color:var(--faint);margin-top:5px;letter-spacing:.04em}

/* 긴 그림자 세로 막대 */
.cols svg{width:100%;height:auto;display:block;overflow:visible}
.cols .gl{stroke:var(--line);stroke-width:1}
.cols .bl{stroke:var(--ink);stroke-width:1}
.cols .colr{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform 900ms cubic-bezier(.2,.8,.2,1) var(--dd,0ms)}
.cols .shd{opacity:0;transition:opacity 700ms ease calc(var(--dd,0ms) + 500ms)}
.cols .cap{font-size:22px;font-weight:800;letter-spacing:-.03em;fill:var(--ink);opacity:0;transition:opacity 400ms ease var(--dd,0ms)}
.cols .cap.hot{fill:var(--accent-ink)}
.on .cols .colr{transform:scaleY(1)}.on .cols .shd,.on .cols .cap{opacity:1}
.cols:hover .colr{opacity:.4;transition:opacity 300ms}.cols .colr:hover{opacity:1}
.legend3{display:grid;gap:16px;margin-top:14px}
.legend3 .lg{font-size:11px;color:var(--sub);line-height:1.55}
.legend3 .lg b{display:block;color:var(--ink);font-size:13px;margin-bottom:1px}
.legend3 .lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;position:relative;top:1px;
  box-shadow:3px 3px 6px rgba(32,30,29,.18)}

/* 산 */
.mtn svg{width:100%;height:auto;display:block;overflow:visible}
.mtn .pk{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform 900ms cubic-bezier(.2,.8,.2,1) var(--dd,0ms)}
.on .mtn .pk{transform:scaleY(1)}
.mtn .bl{stroke:var(--line);stroke-width:1}
.mtn .ax{font-size:9px;fill:var(--faint)}
.mtn .pv{font-size:12px;font-weight:700;fill:var(--ink);opacity:0;transition:opacity 400ms ease var(--dd,0ms)}
.mtn .tag{opacity:0;transition:opacity 400ms ease var(--dd,0ms)}
.on .mtn .pv,.on .mtn .tag{opacity:1}

/* 알약 기둥 */
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:end;height:236px;padding:0 8px 0 20px;width:calc(100% - 50px)}   /* 오른쪽 칸과 그림자가 닿지 않게 50px 줄임 */
.pill{position:relative;height:calc(var(--p)*1%);min-height:46px;border-radius:24px;background:var(--panel);
  box-shadow:10px 12px 22px rgba(32,30,29,.10),-6px -6px 14px rgba(255,255,255,.95),inset 0 0 0 1px rgba(32,30,29,.035);
  transform-origin:bottom;transform:scaleY(.06);transition:transform 1100ms cubic-bezier(.2,.8,.2,1) var(--dd,0ms)}
.on .pill{transform:scaleY(1)}
.pill.hot{background:linear-gradient(180deg,#F25A40 0%,#EC3013 45%,#B21B04 100%);
  box-shadow:12px 14px 26px rgba(236,48,19,.26),-6px -6px 14px rgba(255,255,255,.95)}
.pill .pv{position:absolute;left:4px;right:4px;top:15px;text-align:center;font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--ink);
  opacity:0;transition:opacity 400ms ease calc(var(--dd,0ms) + 700ms)}
.on .pill .pv{opacity:1}
.pill.hot .pv{color:#fff}
.pill .pv small{display:block;font-size:9px;font-weight:600;opacity:.72;margin-top:3px}
.pill-lb{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:18px;text-align:center;font-size:10px;color:var(--sub);line-height:1.5;padding:0 8px 0 20px;width:calc(100% - 50px)}
.pill-lb b{display:block;color:var(--ink);font-size:12px}

/* 세로 누적 기둥 */
.vstack{display:flex;flex-direction:column-reverse;width:64px;border-radius:4px;overflow:hidden;gap:2px}
.vstack i{display:block;width:100%;transform-origin:bottom;transform:scaleY(0);transition:transform 800ms cubic-bezier(.2,.8,.2,1) var(--dd,0ms)}
.on .vstack i{transform:scaleY(1)}
.vleg{list-style:none;margin:0;padding:0;font-size:11px;color:var(--sub)}
.vleg li{display:grid;grid-template-columns:10px 1fr;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.vleg li:last-child{border-bottom:0}
.vleg i{width:10px;height:10px;border-radius:3px;position:relative;top:1px}
.vleg b{color:var(--ink);font-size:15px;font-weight:700;margin-right:5px;font-variant-numeric:tabular-nums}
.vleg small{display:block;font-size:9px;color:var(--faint);line-height:1.5}
.mixbar.big{height:24px}

@media print{
  .mz{break-inside:auto}
  .mz>.b,.donut,.cols,.mtn,.pills,.pill-lb,.vstack,.rank{break-inside:avoid;page-break-inside:avoid}
  .donut .arc,.cols .colr,.cols .shd,.cols .cap,.mtn .pk,.mtn .pv,.mtn .tag,.pill,.pill .pv,.vstack i{transition:none!important;opacity:1!important;transform:none!important}
  .pill{box-shadow:none!important;border:1px solid var(--line)}
  .pill.hot{border:0}
  .donut:hover .arc,.cols:hover .colr{opacity:1!important}
}

/* 13장 메뉴판 사진 — 페이지 톤에 맞춰 흑백, 마우스를 올리면 컬러 (v3.10) */
.thumbs img{filter:grayscale(1) contrast(1.02);transition:filter 420ms ease}
.thumbs li:hover img{filter:grayscale(0)}

/* 계산 과정·환산표는 접어 둔다 — 화면은 조용하게, 인쇄할 때는 펼친다 */
.chain.quiet li{font-size:12px;color:var(--sub);padding:9px 0}
.chain.quiet li b{color:var(--ink)}
.acc.quiet>summary{font-size:13px;padding:16px 0}
@media print{ .acc.pshow{display:block!important} }

/* ══ v3.10 — 세로 스탯 레일, 사진, 산 모양 추이 ══ */
.stats{display:grid}
.stat{padding:16px 0;border-top:1px solid var(--line)}
.stat:first-child{border-top:0;padding-top:0}
.stat .k{margin:0}
.stat .v{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .v.hot{color:var(--accent-ink)}
.stat .lead-ref{margin-top:4px}
.stat.big .v{font-size:46px}
.stat.row{border-top:0;padding:0}

/* 가게 사진 — 채도를 낮춰 지면에 앉히고, 마우스를 올리면 살아난다. 화면 전용 */
.ph{margin:0;overflow:hidden;border-radius:4px;background:var(--panel);position:relative}
.ph img{display:block;width:100%;height:100%;object-fit:cover;filter:url(#redOnly);mix-blend-mode:multiply;transition:filter 600ms ease}
.ph:hover img{filter:none}
.ph[data-slot]{cursor:pointer}
.ph .pk,.ph .pn{position:absolute;top:6px;font-size:9px;letter-spacing:.04em;padding:2px 6px;border-radius:2px;pointer-events:none}
.ph .pk{left:6px;background:var(--accent,#EC3013);color:#fff}
.ph .pn{right:6px;background:rgba(32,30,29,.72);color:#fff}
@media (hover:none){.ph img{filter:none}}
.ph.wide{aspect-ratio:16/10}.ph.tall{aspect-ratio:4/5}.ph.sq{aspect-ratio:1/1}.ph.band{aspect-ratio:21/9}.ph.h220{height:220px}
.ph figcaption{position:absolute;left:10px;bottom:8px;font-size:9px;color:#fff;opacity:.85;letter-spacing:.04em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.phnote{font-size:9px;color:var(--faint);margin-top:6px}
@media print{.ph,.phnote{display:none!important}}

/* 산 모양 검색 추이 — 선 아래를 옅게 채운다 */
.trend .area{opacity:0;transition:opacity 700ms ease 300ms}
.on .trend .area{opacity:1}
.trend.mtn-line path.ln{stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}

/* 웨이팅 신호 블록 */
.wait{padding:22px 0 6px}
.wait .eyebrow{color:var(--accent-ink)}
.wait .q{margin-top:10px;font-size:12px;color:var(--sub);line-height:1.75}
.wait .q b{color:var(--ink)}

/* 뉴스 2단 · 키워드 2단 */
.mz .b .recent li{grid-template-columns:62px 1fr;gap:10px}
.kwcol{list-style:none;margin:0;padding:0;font-size:12px}
.kwcol li{padding:7px 0;border-bottom:1px solid var(--line)}
.kwcol li:last-child{border-bottom:0}
.kwcol .why{display:block;font-size:9px;color:var(--faint);margin-top:1px}
.rank.kwrank li{grid-template-columns:20px 12px 1fr 44px}
.rank.kwrank .why{display:block;font-size:9px;color:var(--faint);margin-top:1px}

/* 종이 띠 추이 (8장 · 키워드 하나) */
svg.trend.rib .rv{font-size:22px;font-weight:800;letter-spacing:-.03em;fill:var(--ink)}
svg.trend.rib .ribbon{opacity:0;transition:opacity 900ms ease 200ms}
.on svg.trend.rib .ribbon{opacity:1}
svg.trend.rib path.now{stroke:var(--sub)}

/* ══ 회색 종이 + 광명 (화면 전용 · v3.10) — 요소 색 = 종이 색, 그림자는 어두운 것 + 밝은 것 두 겹 ══ */
:root{--fill-lo:#E5E5E7;--guide:#CFCFD5}
@media screen{
  :root{--paper:#E9E9EC;--panel:#E9E9EC;--line:#D3D3D8;--grid:#DFDFE3;--track:#DBDBE0;--fill-lo:#CDCDD3;--guide:#B9B9C2}
  body{background:var(--paper)}
  .bgw{color:#EFEFF2!important}
  .tool input,.tool select,.mform input,.rvbar input{background:var(--paper);border-color:transparent;
    box-shadow:inset 4px 4px 10px rgba(32,30,29,.10),inset -4px -4px 10px rgba(255,255,255,.92)}
  .tool input:hover,.tool select:hover,.rvbar input:hover{background:var(--paper)}
  .tool input:focus,.tool select:focus,.mform input:focus,.rvbar input:focus{background:var(--paper);border-color:transparent;
    box-shadow:inset 4px 4px 10px rgba(32,30,29,.12),inset -4px -4px 10px rgba(255,255,255,.92),0 0 0 4px rgba(236,48,19,.14)}
  .abtn,.cand .pick{background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,0) 60%);border-color:transparent;
    box-shadow:6px 6px 14px rgba(32,30,29,.15),-5px -5px 12px rgba(255,255,255,.95),inset 1px 1px 0 rgba(255,255,255,.6)}
  .abtn:hover,.cand .pick:hover{box-shadow:8px 8px 18px rgba(32,30,29,.18),-6px -6px 14px rgba(255,255,255,.96)}
  .cand .pick:hover{background:var(--ink);color:#fff}
  .abtn.primary{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,0) 60%);color:var(--ink);font-weight:700;border-color:transparent;
    box-shadow:8px 8px 18px rgba(32,30,29,.19),-6px -6px 14px rgba(255,255,255,.95),inset 1px 1px 0 rgba(255,255,255,.65)}
  .abtn.primary:hover{box-shadow:10px 10px 22px rgba(32,30,29,.23),-7px -7px 16px rgba(255,255,255,.98)}
  .abtn.primary::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:9px;position:relative;top:-1px}
  .acts,.rvbar{padding:6px 0 20px 12px}                         /* 볼록 버튼의 그림자가 장 가장자리에서 잘리지 않게 */
  .rvbar{margin-left:0}
  .kw span{background:var(--track)}
  .bdg.info{background:#D8D8DD}
  .dist .db,.mixbar{background:var(--track)}
  .thumbs a,.ph{background:#DFDFE3}
  /* 종이를 오려 얹은 것처럼 — 요소는 색이 없고(투명) 그림자·광명만 있다. 지면의 결이 그대로 이어진다 */
  .pill{background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);
    box-shadow:12px 12px 26px rgba(32,30,29,.17),-10px -10px 24px rgba(255,255,255,.95),inset 1px 1px 0 rgba(255,255,255,.65)}

  .page::before{content:'';position:absolute;z-index:-2;left:-64px;right:-64px;top:-34px;bottom:-40px;
    background-color:var(--paper);background-image:linear-gradient(to right,var(--grid) 0 1px,var(--grid) 1px),var(--paper-img);
    /* 종이 결은 배율과 상관없이 1:1 — 페이지 zoom을 나눠 되돌린다 */
    background-size:1px 100%,calc(560px / var(--zoom,1)) calc(1000px / var(--zoom,1));background-position:506.5px 0,0 0;background-repeat:no-repeat,repeat;
    box-shadow:0 24px 70px rgba(32,30,29,.16),0 2px 6px rgba(32,30,29,.06)}
  .page{background:none}                                   /* 세로 안내선은 지면(::before)이 든다 */
  @media (min-width:900px){ .page::before{inset:0;box-shadow:none;background-position:544.5px 0,0 0} }   /* 794px A4 지면 · 안내선 = 102 + 442.5 */
  /* 모바일: 지면이 곧 화면이다. ±64px로 나가면 레이아웃 폭이 476px로 늘어나 브라우저가 화면을 축소해 버린다(글자 넘침의 원인) */
  @media (max-width:660px){ .page::before{inset:0;box-shadow:none;
    background-image:var(--paper-img);background-size:calc(560px / var(--zoom,1)) calc(1000px / var(--zoom,1));
    background-position:0 0;background-repeat:repeat} }
  /* 유리 — 뒤가 비쳐 흐려지는 반투명 판. 도구 카드·로그인 카드·배율 조절에만 */
  .tool{background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(16px) saturate(1.05);backdrop-filter:blur(16px) saturate(1.05);
    border:1px solid rgba(255,255,255,.72);box-shadow:0 12px 34px rgba(32,30,29,.10),inset 0 1px 0 rgba(255,255,255,.9)}
  .tool.lit{background:rgba(255,255,255,.46);box-shadow:0 26px 70px rgba(32,30,29,.20),inset 0 1px 0 rgba(255,255,255,.95)}
  .mcard{background:rgba(255,255,255,.46);-webkit-backdrop-filter:blur(20px) saturate(1.05);backdrop-filter:blur(20px) saturate(1.05);
    border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 80px rgba(32,30,29,.22),inset 0 1px 0 rgba(255,255,255,.95)}
  .zoomui{background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);
    box-shadow:0 8px 24px rgba(32,30,29,.14),inset 0 1px 0 rgba(255,255,255,.9)}
  .tool input,.tool select,.rvbar input,.mform input{background:rgba(233,233,236,.9)}
}

/* 종이 켜 — 삼각(거리별)·세로 누적(폐업). 화면: 종이 톤 + 부드러운 그림자, 인쇄: 회색 단계 */
.mtn .pk.l0{fill:#DCDCE1}.mtn .pk.l1{fill:#E3E3E7}.mtn .pk.l2{fill:#EBEBEE}.mtn .pk.l3{fill:#F3F3F5}
.mtn .pk.hot{fill:#EC3013}
.vstack{overflow:visible;border-radius:0;gap:6px}
.vstack i{border-radius:4px}
.vstack i.lv-up{background:#F1F1F3}
.vstack i.lv-in{background:#DADADF}
.vstack i.lv-hot{background:linear-gradient(180deg,#F25A40,#EC3013 45%,#B21B04)}
.vleg i.lv-up{background:#F1F1F3;box-shadow:2px 2px 4px rgba(32,30,29,.18),-1px -1px 3px rgba(255,255,255,.9)}
.vleg i.lv-in{background:#DADADF;box-shadow:inset 1px 1px 3px rgba(32,30,29,.18)}
.vleg i.lv-hot{background:#EC3013;box-shadow:2px 2px 4px rgba(236,48,19,.3)}
@media screen{
  .vstack i.lv-up{background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);
    box-shadow:8px 8px 16px rgba(32,30,29,.17),-6px -6px 12px rgba(255,255,255,.95),inset 1px 1px 0 rgba(255,255,255,.65)}
  .vstack i.lv-in{background:rgba(32,30,29,.035);box-shadow:inset 5px 5px 10px rgba(32,30,29,.15),inset -4px -4px 8px rgba(255,255,255,.75)}
  .vleg i.lv-up{background:transparent}.vleg i.lv-in{background:rgba(32,30,29,.05)}
  /* SVG 도형 — 종이 패턴으로 채우고(전역 <pattern id="paper">) 그림자로 두께를 준다 */
  .mtn .pk:not(.hot){fill:url(#paper)}
  .mtn .pk{filter:drop-shadow(9px 11px 10px rgba(32,30,29,.30)) drop-shadow(-1px -1px 1px rgba(255,255,255,.95))}   /* 앞 켜의 그림자가 뒤 켜에 떨어진다 */
  .mtn .pk.hot{filter:drop-shadow(9px 11px 10px rgba(178,27,4,.32))}
  .cols .colr:not(.hot){fill:url(#paper);filter:drop-shadow(3px 4px 5px rgba(32,30,29,.30)) drop-shadow(-1px -1px 1px rgba(255,255,255,.95))}
  .cols .shd{opacity:.8}
  svg.trend.rib .rtp{stroke:url(#paper)}
  .vstack i.lv-hot{box-shadow:10px 10px 20px rgba(178,27,4,.28),-6px -6px 12px rgba(255,255,255,.9)}
}
@media print{
  .mtn .pk,.cols .colr{filter:none!important}
  .mtn .pk.l0{fill:#6E6E73}.mtn .pk.l1{fill:#8E8E93}.mtn .pk.l2{fill:#A9A9AE}.mtn .pk.l3{fill:#C9C9CE}
  .vstack i.lv-up{background:#201E1D}.vstack i.lv-in{background:#E5E5E7}.vstack i.lv-hot{background:#EC3013}
  .vleg i.lv-up{background:#201E1D}.vleg i.lv-in{background:#E5E5E7;box-shadow:none}
  svg.trend .lsh{display:none}
}

/* ══ v3.10 — 잘림 고치기 · 유리판 ══
   장(.sec)의 overflow:hidden은 배경 타이포를 가두려던 것이었는데, 볼록한 것들의 왼쪽 광명·그림자까지 잘랐다.
   배경 타이포만 따로 가두고(.bgwrap) 장은 풀어 준다. 가로 스크롤은 body의 overflow-x:hidden이 이미 막는다. */
.bgwrap{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
@media screen{ .sec{overflow:visible} }

/* 유리판 — 뒤가 비쳐 흐려진다. 종이 결과 배경 타이포(스크롤에 따라 움직인다)가 함께 비친다 */
/* 종이를 오려 얹은 판 — 색은 없고(거의 투명) 그림자·광명만. 「플레이스 리뷰 가져오기」 버튼과 같은 몸 */
.relief{border-radius:18px;padding:20px 22px;margin:-6px -14px}
@media screen{
  .relief{background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,0) 58%);
    box-shadow:11px 11px 24px rgba(32,30,29,.17),-9px -9px 20px rgba(255,255,255,.96),inset 1px 1px 0 rgba(255,255,255,.7)}
  .relief .rank li{border-bottom-color:rgba(32,30,29,.07)}
}
@media print{ .relief{padding:0;margin:0;border-radius:0;background:none;box-shadow:none} }

/* ══ 모바일 (v3.10) — 지면이 곧 화면. 폭을 넘기는 것이 하나라도 있으면 브라우저가 화면 전체를 축소한다 ══ */
@media (max-width:660px){
  .tool{gap:12px}
  .trow{flex-wrap:wrap;gap:10px}
  .trow .tf{flex:0 0 100%;width:auto}                    /* 상호 칸은 한 줄을 통째로 */
  .trow .tf.w96{flex:0 0 calc(50% - 5px);width:auto}     /* 둘째 줄에 반경과 검색을 반씩 */
  .trow .tbtn{width:auto;flex:1 1 calc(50% - 5px);min-width:0;padding:12px 10px}
  .mform{gap:8px}
  .mform input{min-width:0}
  .mform .tbtn{width:auto;flex:none;padding:12px 18px}   /* 「연결」이 입력칸을 덮던 것 */
  .mcard{padding:28px 22px 22px}
  .mcard .mname{font-size:26px}
  .deck{font-size:18px}
  .deck.md{font-size:16px}
  .lead-n{font-size:64px}
  .stat .v,.stat.big .v{font-size:32px}
  .two .v{font-size:34px}
  .kpis{column-gap:20px;row-gap:26px}
  .kpi .v{font-size:min(42px,10vw)}       /* '238 · 47'처럼 긴 값이 두 칸 격자를 밀어내 화면 폭을 늘리던 것 */
  .lead-ref,.src9{word-break:break-word}
  /* 줄어들지 못하는 것들 — 표와 안쪽 격자는 최소 내용 폭이 칸을 밀어내 화면을 넓힌다 */
  .mz{grid-template-columns:minmax(0,1fr)}   /* 12칸 격자의 1fr은 최소 내용 폭을 바닥으로 삼는다 — 모바일은 한 칸, 바닥 0 */
  .tbl{table-layout:fixed}
  .tbl th,.tbl td{word-break:break-word}
  .pills>*,.pill-lb>*,.legend3>*,.rank li>*,.recent li>*,.two>*,.vleg li>*,.mixleg li{min-width:0}
  .recent li{grid-template-columns:54px 1fr}
  .dist .dl{width:80px}.dist .dn{width:64px}.dist.cmp .dl{width:92px}.dist.cmp .dn{width:76px}
  .donut svg{max-width:100%}
  .kw span{max-width:100%;overflow-wrap:anywhere}
  .rank .v{font-size:12px}          /* .mz .v로 뭉뚱그리면 순위표 값까지 커진다 */
  .donut .ctr b{font-size:38px}
  .pills{gap:12px;padding:0 10px;width:100%;height:190px}
  .pill-lb{gap:12px;padding:0 10px;width:100%}
  .pill .pv{font-size:12px}
  .rank li{grid-template-columns:18px 10px 1fr auto;gap:6px}
  .glass{margin:-6px 0;padding:16px 14px}
  .rank.kwrank li{grid-template-columns:18px 10px 1fr auto}
  .chap .dig{font-size:56px;width:44px}
  .chap h2{left:22px;font-size:16px}
  .mtn svg,.cols svg{overflow:hidden!important}
  .donut svg{overflow:visible}   /* 그림자가 장 밖으로 나가면 화면 폭이 늘어난다 */
  .acc>summary{gap:8px;min-width:0;padding-right:4px}
  .acc>summary .cnt{flex:none}
  .acc .ico{margin-right:4px}
  .tbl th{width:34%}
  .tbl th,.tbl td{padding:8px 4px;font-size:12px}
  .chain li{font-size:12px}
  .kwtop .kt{font-size:20px}
}

/* ══ 양각 (화면 전용) — 도넛 고리 · 상호 · 장번호를 종이에서 떠올린다 ══ */
@media screen{
  .donut .ring{filter:drop-shadow(20px 24px 22px rgba(32,30,29,.30)) drop-shadow(10px 12px 11px rgba(32,30,29,.20)) drop-shadow(-8px -10px 12px rgba(255,255,255,.98))}
  /* ── 스케치 글자 — 빗금으로 채우고 윤곽을 덧그은 뒤 선을 흔든다 ──
     --hg: 빗금 간격(글자 크기에 맞춘다) · --sw: 윤곽 두께 */
  .sk{color:transparent;
    background-image:
      repeating-linear-gradient(72deg, rgba(32,30,29,.60) 0 calc(var(--hg) * .21), transparent calc(var(--hg) * .21) var(--hg)),
      repeating-linear-gradient(66deg, rgba(32,30,29,.30) 0 calc(var(--hg) * .18), transparent calc(var(--hg) * .18) calc(var(--hg) * 2.1));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-stroke:var(--sw) var(--ink);paint-order:stroke fill;
    filter:url(#skA)}
  /* 홀로 선 큰 숫자는 SVG(.skv)로 옮겼다. CSS 스케치는 그래프 안에 갇힌 도넛 중앙 값에만 남는다 —
     여기에 밑선을 그으면 고리 안이 어지러워진다 */
  .donut .ctr b{--hg:4.4px;--sw:1.2px}
  /* 34px 값은 스케치를 걷었다 — 빗금이 촘촘해질수록 작은 숫자가 회색 면이 되어 읽히지 않는다.
     손으로 그린 것은 상호와 홀로 선 큰 숫자까지, 그 아래는 읽는 숫자로 둔다 */
  .stat .v.sk{color:var(--ink);background-image:none;-webkit-text-stroke:0;filter:none}
  /* SVG 숫자(막대 위 값)는 패턴으로 직접 채운다 */
  .cols .cap{fill:url(#hatchInk);stroke:var(--ink);stroke-width:1.2;paint-order:stroke fill;filter:url(#skB)}
  .cols .cap.hot{fill:var(--accent);stroke:var(--accent-ink)}
  /* 장번호 — 종이색으로 두고 그림자만. 숫자 모양 그대로 종이에서 솟은 것처럼 보인다 */
  .chap .dig{color:var(--paper);
    text-shadow:3px 4px 6px rgba(32,30,29,.30),-2px -3px 4px rgba(255,255,255,.98),1px 1px 0 rgba(255,255,255,.55)}
}
@media print{
  .donut .ring{filter:none!important}
  .chap .dig{text-shadow:none!important}
  .sk{color:var(--ink)!important;background-image:none!important;-webkit-text-stroke:0!important;filter:none!important}
  .cols .cap{fill:var(--ink)!important;stroke:none!important;filter:none!important}
  .cols .cap.hot{fill:var(--accent-ink)!important}
}

/* ══ 스케치 글자 (SVG) — 상호 · 각 장의 대표 수치 · 페이지 제목 ══
   빗금과 흔들린 윤곽, 자로 그은 밑선을 한 덩어리로 그린다.
   인쇄에는 평범한 잉크 글자(.skp)만 남기고 밑선은 종이에도 함께 찍는다. */
.skv{display:block;width:100%;height:auto;overflow:visible;font-family:inherit}
.skv text{font-family:inherit}
[data-sk]{line-height:1}
.skp{fill:none}                 /* 화면에서는 색만 뺀다 — 끌어서 복사하고 Ctrl+F로 찾을 수 있게 한 벌은 남긴다 */
@media print{
  .skd{display:none}
  .skp{fill:var(--ink)}
  .skg line{stroke:var(--guide)}
}

/* 머리글 제목 — 스케치로 키운다 */
.mast{align-items:flex-end}
.mast>div:first-child{flex:1 1 auto;min-width:0}
.mast .name{font-size:44px;letter-spacing:-.035em;line-height:1}
.mast .tag{margin-top:9px}
@media (max-width:660px){
  .mast .name{font-size:26px}
  .mast .tag{margin-top:6px}
}

/* 숫자가 굴러가는 동안은 덧그은 겹을 쉬게 한다 — 필터가 절반으로 준다 */
.skv[data-roll="1"] .skx{display:none}

/* 1장 지도 — 바탕 타일만 흑백으로 누르고, 매장과 반경 원은 색을 남긴다.
   상자 전체에 filter를 걸면 그 안의 마커까지 같이 흑백이 되므로 타일만 고른다. */
.mapwrap{margin-top:42px}
.mapbox{width:100%;height:460px;background:var(--fill-lo)}
.mapbox img,
.mapbox div[style*="background-image"]{filter:grayscale(1) contrast(.9) brightness(1.12) opacity(.72)}
.mapbox .skpin,.mapbox .skpin.n{filter:none}
.skpin.n{width:22px;height:22px;border-radius:50%;background:#fff;border:1.6px solid #201E1D;color:#201E1D;
  font:700 12px/19px "Pretendard Variable",Pretendard,sans-serif;text-align:center;box-shadow:0 1px 4px rgba(32,30,29,.28)}
.maprow{position:relative}
.maplines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.maplines line{stroke:#201E1D;stroke-width:1;stroke-opacity:.55}
.maplines circle{fill:#201E1D;fill-opacity:.55}
.nlist{list-style:none;margin:6px 0 0;padding:0}
.nlist li{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule,#DCDCE1);font-size:14px}
.nlist li:last-child{border-bottom:0}
.nlist .no{flex:none;width:22px;height:22px;border-radius:50%;border:1.6px solid #201E1D;font-size:12px;font-weight:700;line-height:19px;text-align:center;align-self:center}
.nlist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nlist .d{flex:none;font-size:12.5px;color:var(--dim,#6E6E73)}
.nlist .d.bld{color:var(--accent,#EC3013);font-weight:600}
.mapbox{cursor:pointer}
@media print{.maplines{display:none}#skRow .b.s5{grid-column:1/-1;border-left:0;padding-left:0}}
/* v3.21 (#73): 네이버 지도는 CSS zoom 아래에서 좌표와 화면이 어긋난다 — 지도 상자만 배율을 되돌리고 크기는 배율만큼 키운다 */
.tbl.menu{width:100%;border-collapse:collapse;font-size:12.5px}.tbl.menu td{padding:3px 0;border-bottom:1px dotted var(--rule,#DCDCE1)}.tbl.menu .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl.bands{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 6px}.tbl.bands th,.tbl.bands td{padding:5px 0;border-bottom:1px solid var(--rule,#DCDCE1);text-align:left}.tbl.bands .n{text-align:right;font-variant-numeric:tabular-nums}.tbl.bands tr.hot td{color:var(--accent,#EC3013);font-weight:700}
#skRow .mapbox{zoom:calc(1/var(--zoom,1));width:100%;height:calc(400px*var(--zoom,1))}
.skr{font:700 11px/1 "Pretendard Variable",Pretendard,sans-serif;color:#EC3013;background:rgba(243,239,230,.85);padding:2px 4px;border-radius:2px;white-space:nowrap;letter-spacing:.02em}
.skpin{width:15px;height:15px;border-radius:50%;background:#EC3013;
  border:3px solid #fff;box-shadow:0 1px 6px rgba(32,30,29,.45)}
.mapcap{margin:12px 0 0;font-size:12.5px;letter-spacing:-.01em;color:var(--dim,#6E6E73)}
@media print{.mapwrap{display:none}}
@media print{.int{display:none!important}}
