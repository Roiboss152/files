<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KT 하이오더 맞춤 견적서</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f6f8; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        /* 상단 헤더 */
        .header { text-align: center; padding: 30px 0 20px; }
        .header h1 { font-size: 1.4rem; color: #111; margin-bottom: 8px; font-weight: 700; }
        .header p { color: #ff3366; font-weight: bold; font-size: 1.2rem; }
        
        /* 견적서 카드 내용 */
        .card { background: #fff; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { font-size: 1.2rem; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #111; padding-bottom: 10px; color: #111; }
        
        .item-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.95rem; color: #555; }
        .item-row strong { color: #111; font-size: 1.05rem; }
        
        .divider { border-top: 1px dashed #ddd; margin: 15px 0; }
        
        /* 최종 합계 영역 */
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; background: #f9f9f9; padding: 20px 15px; border-radius: 10px; }
        .total-row span { font-size: 1rem; font-weight: bold; color: #555; }
        .total-row strong { font-size: 1.8rem; color: #00a67e; }
        
        /* 메가커피 쿠폰 안내 영역 */
        .benefit-box { background: #fff0f5; border: 1px solid #ffcccc; border-radius: 15px; padding: 20px; text-align: left; }
        .benefit-box h3 { color: #ff3366; margin-top: 0; font-size: 1.1rem; margin-bottom: 10px; display: flex; align-items: center; }
        .benefit-box p { font-size: 0.9rem; line-height: 1.6; color: #555; margin: 0; word-break: keep-all; }
        
        /* 담당자 연결 버튼 */
        .contact-btn { display: block; width: 100%; background: #111; color: #fff; text-align: center; padding: 18px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.1rem; margin-top: 20px; transition: 0.2s; }
        .contact-btn:active { background: #ff3366; transform: scale(0.98); }
        
        .footer { text-align: center; margin-top: 30px; font-size: 0.85rem; color: #aaa; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>KT 하이오더 모바일 견적서</h1>
            <p id="storeNameDisplay">고객님을 위한 특별 혜택</p>
        </div>

        <div class="card">
            <h2>선택하신 기기 내역</h2>
            
            <div id="itemList">
                <!-- 자바스크립트로 선택한 기기 목록이 여기에 출력됩니다 -->
            </div>
            
            <div class="divider"></div>
            
            <div class="item-row">
                <span>메뉴판 합계 금액</span>
                <strong id="menuSum">0원</strong>
            </div>
            <div class="item-row">
                <span>알림판 합계 금액</span>
                <strong id="alarmSum">0원</strong>
            </div>
            
            <div class="total-row">
                <span>예상 월 이용요금<br><span style="font-size:0.75rem; color:#999; font-weight:normal;">* VAT 별도</span></span>
                <strong id="totalCost">0원</strong>
            </div>
        </div>

        <div class="benefit-box">
            <h3>☕ 메가커피 쿠폰 발송 안내</h3>
            <p>
                현재 보고 계신 견적서를 캡처해 두시면 향후 상담 시 훨씬 수월합니다!<br><br>
                남겨주신 연락처로 <strong>송용의 과장</strong>이 내역을 확인한 후 순차적으로 메가커피 쿠폰을 발송해 드릴 예정입니다. 조금만 기다려 주시면 감사하겠습니다.
            </p>
        </div>
        
        <!-- 과장님 전화번호로 바로 걸리도록 설정하려면 href="tel:010-XXXX-XXXX" 로 변경하세요 -->
        <a href="#" class="contact-btn" onclick="alert('담당자(송용의 과장)에게 상담 요청이 접수되어 있습니다. 곧 연락드리겠습니다!'); return false;">담당자에게 빠른 상담 받기</a>

        <div class="footer">
            KT 하이오더 시너지3팀
        </div>
    </div>

    <script>
        // 숫자에 콤마 찍어주는 함수
        function formatN(num) {
            return num.toLocaleString('ko-KR') + '원';
        }

        // QR코드 주소창에서 정보(파라미터) 빼오기
        const params = new URLSearchParams(window.location.search);
        const store = params.get('store') || '고객';
        const postQty = parseInt(params.get('post') || 0);
        const preQty = parseInt(params.get('pre') || 0);
        const al10Qty = parseInt(params.get('al10') || 0);
        const al15Qty = parseInt(params.get('al15') || 0);

        // 월 요금 세팅
        const pricePost = 20000;
        const pricePre = 22000;
        const priceAl10 = 20000;
        const priceAl15 = 22000;

        // 개별 요금 계산
        const costPost = postQty * pricePost;
        const costPre = preQty * pricePre;
        const costAl10 = al10Qty * priceAl10;
        const costAl15 = al15Qty * priceAl15;

        // 합계 계산
        const menuTotal = costPost + costPre;
        const alarmTotal = costAl10 + costAl15;
        const grandTotal = menuTotal + alarmTotal;

        // 화면에 매장명 뿌려주기
        document.getElementById('storeNameDisplay').innerText = store + ' 매장 맞춤 견적';

        // 선택한 기기만 리스트에 추가
        let itemListHtml = '';
        if(postQty > 0) itemListHtml += `<div class="item-row"><span>✔ 후불형 메뉴판 (${postQty}대)</span><strong>${formatN(costPost)}</strong></div>`;
        if(preQty > 0) itemListHtml += `<div class="item-row"><span>✔ 선불형 메뉴판 (${preQty}대)</span><strong>${formatN(costPre)}</strong></div>`;
        if(al10Qty > 0) itemListHtml += `<div class="item-row"><span>✔ 10인치 알림판 (${al10Qty}대)</span><strong>${formatN(costAl10)}</strong></div>`;
        if(al15Qty > 0) itemListHtml += `<div class="item-row"><span>✔ 15인치 알림판 (${al15Qty}대)</span><strong>${formatN(costAl15)}</strong></div>`;
        
        if(itemListHtml === '') {
            itemListHtml = '<div style="text-align:center; color:#999; padding:20px 0;">선택된 기기가 없습니다.</div>';
        }

        document.getElementById('itemList').innerHTML = itemListHtml;
        document.getElementById('menuSum').innerText = formatN(menuTotal);
        document.getElementById('alarmSum').innerText = formatN(alarmTotal);
        document.getElementById('totalCost').innerText = formatN(grandTotal);
    </script>
</body>
</html>
