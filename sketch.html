      // 면 채움은 뺐다(v3.10) — 회색 종이 위에서 겹치면 흙빛 덩어리가 된다. 곡선 + 선 밑 그림자로 산의 결만 남긴다
      const area = '';
      const lsh = o.mountain && d ? `<path class="lsh" d="${d}" transform="translate(5,9)" style="stroke:#201E1D;stroke-opacity:.16;stroke-width:5;fill:none;filter:blur(3px)"/>` : '';   // 선이 종이에서 살짝 떠 있게
      const dots = pts.filter(p => has(p.ratio)).map(p => `<circle${p.month===td.endMonth?' class="now"':''} cx="${f(x(p.i))}" cy="${f(y(p.ratio))}" r="3" fill="${c}" stroke="${c}"><title>${esc(s.keyword)} ${esc(p.month)}: ${esc(p.ratio)}</title></circle>`).join('');
      return `<g>${area}${lsh}${d?`<path class="ln" stroke="${c}" d="${d}"/>`:''}${nowPath}${dots}</g>`;
    }).join('');
    const legend = series.map((s,si) => `<span class="lg"><i style="background:${TREND_COLORS[si%TREND_COLORS.length]}"></i>${esc(s.keyword)}<small>최고 ${esc(s.peak?`${s.peak.month} (${s.peak.ratio})`:'—')}</small></span>`).join('');
    return `<div class="legend">${legend}</div>
      <svg class="trend${o.mountain?' mtn-line':''}${rb?' rib':''}" viewBox="0 0 ${W} ${H}" data-rule="ht,hb" role="img" aria-label="검색 추이">${grid}${xl}${lines}</svg>`;
  }

  /* ══════════ v3.10 매거진 차트 ══════════
     흑백 5단(순서형) + 강조 주홍 하나. 정체는 색이 아니라 옆의 이름·숫자가 책임진다(순위 리스트·범례·직접 표기). */
  const RAMP5 = ['#201E1D','#4A4846','#6E6E73','#8E8E93','#A9A9AE'];
  const FOLD = '#C9C9CE';
  const f1 = (v) => (Math.round(v*10)/10).toFixed(1);

  /* 도넛 — 각도가 곧 비율. 2px 틈은 종이색으로 조각을 나눈다. 5위까지 진한 순서, 나머지는 한 톤(리스트가 이름을 든다) */
  function donutSVG(data, centerLabel){
    const tot = data.reduce((a,d) => a + d.v, 0);
    if (!tot) return '';
    const S = 300, cx = 150, cy = 150, r = 108, sw = 40, C = 2*Math.PI*r;
    let off = 0, arcs = '';
    data.forEach((d, i) => {
      const len = d.v/tot*C, gap = len > 6 ? 2 : 0;
      const col = d.c || (i < RAMP5.length ? RAMP5[i] : FOLD);
      arcs += `<circle class="arc" cx="${cx}" cy="${cy}" r="${r}" stroke="${col}" stroke-width="${sw}"
        stroke-dasharray="${f1(Math.max(len-gap, 0.4))} ${f1(C)}" stroke-dashoffset="${f1(-off - gap/2)}" style="--dd:${i*90}ms">
        <title>${esc(d.nm)} ${esc(num(d.v,'곳'))} · ${f1(d.v/tot*100)}%</title></circle>`;
      off += len;
    });
    return `<div class="donut" data-rule="vc,hb"><svg viewBox="0 0 ${S} ${S}" role="img" aria-label="구성 비율"><g class="ring"><g transform="rotate(-90 ${cx} ${cy})">${arcs}</g></g></svg>
      <div class="ctr"><b class="sk" data-n="${tot}">${esc(num(tot))}</b><span>${esc(centerLabel||'')}</span></div></div>`;
  }
  function rankList(data, unit){
    const tot = data.reduce((a,d) => a + d.v, 0) || 1;
    return `<ol class="rank">${data.map((d,i) => `<li${d.hot?' class="hot"':''}><span class="no">${String(i+1).padStart(2,'0')}</span><i style="background:${d.c || (i < RAMP5.length ? RAMP5[i] : FOLD)}"></i><span class="nm">${esc(d.nm)}</span><span class="v">${esc(num(d.v,unit||''))}<small>${f1(d.v/tot*100)}%</small></span></li>`).join('')}</ol>`;
  }

  /* 긴 그림자 세로 막대 — 값은 막대 높이가 정직하게 들고, 그림자는 45°로 한 방향(장식이지 값이 아니다) */
  function columnsSVG(data, opt){
    const o = Object.assign({ W:590, H:260, cw:64, shadow:150, top:44, bottom:8 }, opt||{});
    const mx = Math.max(...data.map(d => d.v), 1);
    const n = data.length, base = o.H - o.bottom, ih = base - o.top;
    const slot = o.W / n;
    const gid = 'shd' + Math.random().toString(36).slice(2,7);
    const ticks = [0.25,0.5,0.75,1].map(k => { const y = base - ih*k; return `<line class="gl" x1="0" x2="${o.W}" y1="${f1(y)}" y2="${f1(y)}"/>`; }).join('');
    let shadows = '', cols = '', caps = '';
    data.forEach((d,i) => {
      const h = Math.max(d.v/mx*ih, 6), x1 = slot*i + (slot-o.cw)/2, x2 = x1 + o.cw, top = base - h;
      const S = o.shadow;
      shadows += `<polygon class="shd" points="${f1(x1)},${f1(top)} ${f1(x2)},${f1(top)} ${f1(x2+S)},${f1(top+S)} ${f1(x2+S)},${f1(base)} ${f1(x1)},${f1(base)}" fill="url(#${gid})"/>`;
      cols += `<rect class="colr${d.hot?' hot':''}" x="${f1(x1)}" y="${f1(top)}" width="${o.cw}" height="${f1(h)}" fill="${d.c||RAMP5[i]}" style="--dd:${i*180}ms"><title>${esc(d.nm)} ${esc(num(d.v))}</title></rect>`;
      caps += `<text class="cap${d.hot?' hot':''}" x="${f1(x1 + o.cw/2)}" y="${f1(top-12)}" text-anchor="middle" style="--dd:${i*180+500}ms">${esc(num(d.v))}</text>`;
    });
    return `<div class="cols" data-rule="hb"><svg viewBox="0 0 ${o.W} ${o.H}" role="img" aria-label="세로 막대">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#201E1D" stop-opacity=".13"/><stop offset=".55" stop-color="#201E1D" stop-opacity=".05"/><stop offset="1" stop-color="#201E1D" stop-opacity="0"/></linearGradient>
      <clipPath id="${gid}c"><rect x="0" y="0" width="${o.W}" height="${base}"/></clipPath></defs>
      ${ticks}<g clip-path="url(#${gid}c)">${shadows}</g>${cols}${caps}<line class="bl" x1="0" x2="${o.W}" y1="${base}" y2="${base}"/></svg></div>`;
  }
  /* 막대 아래 범례 — 점 하나에 이름·설명 한 칸씩 */
  function legendCols(data){
    return `<div class="legend3" style="grid-template-columns:repeat(${data.length},1fr)">${data.map((d,i) =>
      `<div class="lg"><i style="background:${d.c||RAMP5[i]}"></i><b>${esc(d.nm)}</b>${esc(d.sub||'')}</div>`).join('')}</div>`;
  }

  /* 산 — 봉우리 높이가 값. 가장 가까운 구간(첫 봉우리)만 주홍, 멀수록 옅어진다 */
  function mountainSVG(items, opt){
    const o = Object.assign({ W:320, H:210, top:34, bottom:26, spread:1.45 }, opt||{});
    const mx = Math.max(...items.map(d => d.v), 1);
    const n = items.length, base = o.H - o.bottom, ih = base - o.top, half = (o.W / n) * o.spread / 2;
    const cxOf = (i) => n > 1 ? half + i * (o.W - 2*half) / (n-1) : o.W/2;   // 양 끝 봉우리의 밑변이 칸 밖으로 나가지 않게
    let sh = '', pk = '', lb = '', tag = '';
    const order = items.map((d,i) => i).reverse();   // 먼 구간(오른쪽)이 뒤, 가까운 구간(왼쪽)이 앞 켜
    order.forEach((i) => {
      const d = items[i];
      const h = Math.max(d.v/mx*ih, 10), cxp = cxOf(i), top = base - h;
      const pts = `${f1(cxp-half)},${base} ${f1(cxp)},${f1(top)} ${f1(cxp+half)},${base}`;
      /* 켜(layer) — 종이를 겹쳐 놓은 것처럼: 앞 켜일수록 조금 진하고 그림자가 크다. 색은 CSS(.pk.l0~l3 · 화면은 종이 톤, 인쇄는 회색) */
      pk += `<polygon class="pk l${Math.min(i,3)}${d.hot?' hot':''}" points="${pts}" style="--dd:${i*140}ms"><title>${esc(d.nm)} ${esc(num(d.v,'곳'))}</title></polygon>`;
    });
    items.forEach((d,i) => {
      const h = Math.max(d.v/mx*ih, 10), cxp = cxOf(i), top = base - h;
      lb += `<text class="ax" x="${f1(cxp)}" y="${o.H-6}" text-anchor="middle">${esc(d.nm)}</text>`;
      if (d.hot){
        const w = 52, hgt = 20, tx = Math.min(Math.max(cxp - w/2, 0), o.W - w), ty = top - hgt - 10;
        tag += `<g class="tag" style="--dd:${i*140+600}ms"><rect x="${f1(tx)}" y="${f1(ty)}" width="${w}" height="${hgt}" rx="3" fill="#EC3013"/><polygon points="${f1(cxp-5)},${f1(ty+hgt)} ${f1(cxp+5)},${f1(ty+hgt)} ${f1(cxp)},${f1(ty+hgt+6)}" fill="#EC3013"/><text x="${f1(cxp)}" y="${f1(ty+14)}" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">${esc(num(d.v,'곳'))}</text></g>`;
      } else {
        tag += `<text class="pv" x="${f1(cxp)}" y="${f1(top-8)}" text-anchor="middle" style="--dd:${i*140+600}ms">${esc(num(d.v))}</text>`;
      }
    });
    return `<div class="mtn" data-rule="hb"><svg viewBox="0 0 ${o.W} ${o.H}" role="img" aria-label="거리별 점포 수" style="overflow:visible">${pk}<line class="bl" x1="0" x2="${o.W}" y1="${base}" y2="${base}"/>${lb}${tag}</svg></div>`;
  }

  /* 알약 기둥 — 세 기둥이 한 눈금(가장 큰 값 = 100). 범위가 있는 기둥은 하한을 진하게, 상한까지는 연하게 */
  function pillsHTML(items){
    const mx = Math.max(...items.map(d => d.hi), 1);
    const cols = items.map((d,i) => {
      const hi = Math.max(d.hi/mx*100, 8), lo = Math.max(d.lo/mx*100, 8);
      const style = `--p:${f1((hi+lo)/2)};--dd:${i*160}ms`;   // 범위는 가운데 값으로 세우고 숫자가 범위를 말한다
      const long = String(d.val).replace(/<[^>]+>/g,'').length >= 10;
      return `<div class="pill${d.hot?' hot':''}" style="${style}" title="${esc(d.title||'')}"><div class="pv"${long?' style="font-size:11px"':''}>${d.val}<small>${esc(d.unit||'')}</small></div></div>`;
    }).join('');
    const labels = items.map(d => `<div><b>${esc(d.nm)}</b>${esc(d.sub||'')}</div>`).join('');
    return `<div class="pills" data-rule="hb">${cols}</div><div class="pill-lb">${labels}</div>`;
  }

  /* 세로 누적 기둥 — 띠를 세워 놓은 것. 옆에 범례 */
  function vstackHTML(segs, h){
    const tot = segs.reduce((a,s) => a + s.v, 0) || 1;
    return `<div class="vstack" style="height:${h||220}px" data-rule="vl,hb">${segs.map((s,i) =>
      `<i class="${s.cls||''}" style="height:${f1(s.v/tot*100)}%;${s.cls?'':`background:${s.c};`}--dd:${i*160}ms" title="${esc(s.nm)} ${esc(num(s.v,'곳'))}"></i>`).join('')}</div>`;
  }

  /* 가게 사진 — 화면 전용이라 인쇄·묶음에는 없다.
     v3.21 (#99): 사진 후보를 한 풀로 모으고(손님 리뷰 사진 → 블로그 사진 → 가게 사진 순), 칸을 클릭하면 다음 후보로 바뀐다.
     고른 사진은 매장별로 브라우저에 기억한다. 흑백+빨강만 남기는 SVG 필터가 걸리고, 마우스를 올리면 원본 색이 보인다. */
  const PHOTO_KEY = 'sketch.photo';
  /* v3.22: 같은 사진이 주소만 다르게 오던 것을 막는다(물음표 뒤·크기 꼬리를 떼고, 파일 이름이 길면 이름으로 본다).
     블로그 글 하나에서 비슷한 사진이 여러 장 오므로 글마다 2장까지만, 글을 번갈아 넣는다. 네이버 업체 사진(사장님이 올린 것)은 중계 서버 v1.32부터 온다. */
  const photoKey = (h) => { const base = h.split('?')[0].replace(/\/(\d{2,4}x\d{2,4}|w\d{2,4})$/, ''); const fn = (base.split('/').pop() || '').toLowerCase(); return fn.length >= 14 ? fn : base; };
  let photoCache = { b: null, rv: null, pool: [] };
  function photoPool(b){
    const p = b && b.modules && b.modules.place;
    if (!p || !p.ok || !p.data || p.data.matched === false) return [];
    const rvData = state.reviews && state.reviews.data;
    if (photoCache.b === b && photoCache.rv === rvData) return photoCache.pool;
    const d = p.data;
    const seen = new Set(); const out = [];
    const add = (u, kind, rid) => { const h = imgHref(u); if (!h) return; const k = photoKey(h); if (seen.has(k)) return; seen.add(k); out.push({ src:h, kind, rid: rid || '' }); };
    const typed = Array.isArray(d.photos) ? d.photos : [];
    const np = Array.isArray(d.naverPhotos) ? d.naverPhotos : [];
    np.filter(x => x && x.kind === '가게').forEach(x => add(x.url, '가게 (네이버)'));      // v3.31: 사장님이 고른 사진이 먼저 — 고객용 진단서에도 이 사진이 들어간다
    ((rvData && rvData.photos && rvData.photos.naver) || []).forEach(u => add(u, '네이버 리뷰'));
    typed.filter(x => x && x.type === 'KMAPREVIEW').forEach(x => add(x.url, '카카오 후기', x.rid));
    np.filter(x => x && x.kind === '네이버 리뷰').forEach(x => add(x.url, '네이버 리뷰'));
    typed.filter(x => x && x.type && x.type !== 'KMAPREVIEW' && x.type !== 'BLOG').forEach(x => add(x.url, '가게', x.rid));
    const byRid = new Map();
    typed.filter(x => x && x.type === 'BLOG').forEach((x, i) => { const r = x.rid || ('b' + i); if (!byRid.has(r)) byRid.set(r, []); byRid.get(r).push(x); });
    for (let round = 0; round < 2; round++) byRid.forEach((arr, r) => { if (arr[round]) add(arr[round].url, '블로그', r); });
    np.filter(x => x && x.kind !== '가게' && x.kind !== '네이버 리뷰').forEach(x => add(x.url, x.kind || '블로그'));
    (d.images || []).forEach(u => add(u, typed.length ? '가게' : '플레이스'));
    photoCache = { b, rv: rvData, pool: out };
    return out;
  }
  /* 안 열리는 사진(주소가 만료됐거나 밖에서 못 여는 것)은 자동으로 다음 사진으로 넘긴다 — 풀 크기만큼만 시도한다 */
  const badPhotos = new Set();
  document.addEventListener('error', (e) => {
    const img = e.target; if (!img || img.tagName !== 'IMG') return;
    const f = img.closest && img.closest('figure.ph[data-slot]'); if (!f || !state.bundle) return;
    badPhotos.add(img.getAttribute('src') || '');
    const pool = photoPool(state.bundle);
    if (pool.every(x => badPhotos.has(x.src))) return;
    photoStep(f, 1, true);
  }, true);
  function photoUsed(except){ const used = new Set(); $$('figure.ph[data-slot]').forEach(f => { if (f !== except && f.dataset.idx) used.add(Number(f.dataset.idx)); }); return used; }
  function placePhotos(b){ return photoPool(b).map(x => x.src); }
  function photoPick(){ try { return JSON.parse(localStorage.getItem(PHOTO_KEY) || '{}'); } catch (_) { return {}; } }
  function photoSlotIndex(b, slot, fallback){
    const key = b ? storeKey(b) : ''; const all = photoPick(); const m = key && all[key] ? all[key] : {};
    return has(m[slot]) ? Number(m[slot]) : fallback;
  }
  function photoHTML(src, cls, cap, slot, b){
    const pool = b ? photoPool(b) : [];
    let idx = typeof slot === 'number' ? photoSlotIndex(b, slot, pool.findIndex(x => x.src === src)) : -1;
    if (idx >= pool.length) idx = pool.length ? idx % pool.length : -1;
    const use = idx >= 0 && pool[idx] ? pool[idx] : { src, kind:'' };
    const kind = use.kind ? `<span class="pk">${esc(use.kind)}</span>` : '';
    const n = pool.length > 1 && idx >= 0 ? `<span class="pn">${idx+1} / ${pool.length}</span>` : '';
    return `<figure class="ph ${cls||'wide'}"${typeof slot === 'number' ? ` data-slot="${slot}" data-idx="${idx}" title="클릭하면 다음 사진 · 오른쪽 클릭은 이전"` : ''}><img src="${esc(use.src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">${kind}${n}${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`;
  }
  /* 칸 클릭 → 다음 후보. 같은 매장이면 기억한다 */
  document.addEventListener('click', (e) => {
    const f = e.target && e.target.closest && e.target.closest('figure.ph[data-slot]'); if (!f || !state.bundle) return;
    photoStep(f, 1);
  });
  document.addEventListener('contextmenu', (e) => {
    const f = e.target && e.target.closest && e.target.closest('figure.ph[data-slot]'); if (!f || !state.bundle) return;
    e.preventDefault(); photoStep(f, -1);
  });
  /* 칸을 넘길 때 다른 칸이 보여 주는 사진과 안 열린 사진은 건너뛴다 (v3.22) — 3·9·10을 다른 칸이 쓰면 4→5→…처럼 */
  function photoStep(f, dir, auto){
    const pool = photoPool(state.bundle); if (pool.length < 2) return;
    const slot = Number(f.dataset.slot); const used = photoUsed(f);
    let idx = Number(f.dataset.idx) || 0;
    for (let i = 0; i < pool.length; i++) { idx = (idx + dir + pool.length) % pool.length; if (!used.has(idx) && !badPhotos.has(pool[idx].src)) break; }
    if (auto && badPhotos.has(pool[idx].src)) return;
    f.dataset.idx = String(idx);
    const img = f.querySelector('img'); if (img) img.src = pool[idx].src;
    const pk = f.querySelector('.pk'); if (pk) pk.textContent = pool[idx].kind;
    const pn = f.querySelector('.pn'); if (pn) pn.textContent = `${idx+1} / ${pool.length}`;
    try { const all = photoPick(); const key = storeKey(state.bundle); all[key] = Object.assign({}, all[key] || {}, { [slot]: idx }); localStorage.setItem(PHOTO_KEY, JSON.stringify(all)); } catch (_) {}
  }


  /* ══════════ 스케치 글자 ══════════
     손으로 그린 제목을 SVG로 만든다. 빗금은 <pattern>, 윤곽은 세 번 덧긋고,
     자로 그은 밑선(윗선·밑선·좌우 수선)과 모서리 ✕를 함께 둔다.
     빗금·흔들기 정의는 문서에 한 벌만 두고 크기별로 골라 쓴다(필터가 무거워서 매번 만들지 않는다).
     인쇄에는 평범한 잉크 글자 한 벌을 따로 넣고 스케치 쪽을 숨긴다. */
  const SK = (() => {
    const NS = 'http://www.w3.org/2000/svg';
    const mk = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };

    const HG = 0.0487;      // 빗금 간격 ÷ 글자 크기 — 76px에서 3.7px (2배 빽빽)
    const SW = 0.0178;      // 윤곽 두께 ÷ 글자 크기 — 76px에서 1.35px
    const made = new Set();
    let defs = null, uid = 0;

    function pool(){
      if (defs) return defs;
      const svg = document.getElementById('skDefs');
      defs = svg ? svg.querySelector('defs') : null;
      return defs;
    }
    /* 빗금 한 겹 — 같은 규격은 한 번만 만든다 */
    function hatch(gap, w, op, rot){
      const id = `skh${String(gap.toFixed(2)).replace('.','_')}x${String(w.toFixed(2)).replace('.','_')}r${rot}`;
      if (!made.has(id) && pool()){
        made.add(id);
        const pt = mk('pattern', { id, width:gap, height:gap, patternUnits:'userSpaceOnUse', patternTransform:`rotate(${rot})` });
        pt.appendChild(mk('line', { x1:0, y1:0, x2:0, y2:gap, stroke:'var(--ink)', 'stroke-width':w, 'stroke-opacity':op }));
        pool().appendChild(pt);
      }
      return id;
    }
    /* 흔들기 — 크기를 0.5px 칸으로 묶어 정의 수를 줄인다 */
    function wob(key, bf, oct, scale){
      const s = Math.round(scale * 2) / 2;
      const id = `skw${key}${String(s).replace('.','_')}`;
      if (!made.has(id) && pool()){
        made.add(id);
        const f = mk('filter', { id, x:'-14%', y:'-46%', width:'128%', height:'192%' });
        f.appendChild(mk('feTurbulence', { type:'fractalNoise', baseFrequency:bf, numOctaves:oct, seed:key.charCodeAt(0)*3, result:'n' }));
        f.appendChild(mk('feDisplacementMap', { in:'SourceGraphic', in2:'n', scale:s, xChannelSelector:'R', yChannelSelector:'G' }));
        pool().appendChild(f);
      }
      return id;
    }

    /* 윤곽 — 획을 합친 뒤 그 둘레만 딴다.
       글자에 그냥 stroke를 걸면 폰트가 자모를 겹쳐 쌓아 둔 자리(가로획이 세로획을 지나가는 곳 등)의
       숨은 사각형 테두리까지 같이 그어져 속이 겹선으로 지저분해진다.
       알파를 radius만큼 부풀린 뒤 원본을 빼면 바깥 둘레만 남으므로 이음매가 나오지 않는다. */
    function ring(key, bf, oct, scale, radius){
      const s = Math.round(scale*2)/2, r = Math.round(radius*20)/20;
      const id = `skr${key}${String(s).replace('.','_')}n${String(r).replace('.','_')}`;
      if (!made.has(id) && pool()){
        made.add(id);
        const f = mk('filter', { id, x:'-20%', y:'-50%', width:'140%', height:'200%' });
        f.appendChild(mk('feMorphology', { operator:'dilate', radius:r, in:'SourceAlpha', result:'d' }));
        f.appendChild(mk('feComposite', { in:'d', in2:'SourceAlpha', operator:'out', result:'k' }));
        f.appendChild(mk('feFlood', { 'flood-color':'#201E1D', result:'c' }));
        f.appendChild(mk('feComposite', { in:'c', in2:'k', operator:'in', result:'o' }));
        f.appendChild(mk('feTurbulence', { type:'fractalNoise', baseFrequency:bf, numOctaves:oct, seed:key.charCodeAt(0)*3, result:'n' }));
        f.appendChild(mk('feDisplacementMap', { in:'o', in2:'n', scale:s, xChannelSelector:'R', yChannelSelector:'G' }));
        pool().appendChild(f);
      }
      return id;
    }

    /* host 안을 비우고 스케치 글자를 그린다. host의 폭을 재서 밑선을 칼럼 끝까지 늘인다. */
    function draw(host, txt, opt){
      const o = Object.assign({ size:76, min:26 }, opt || {});
      if (txt === '—' || txt === '-') { host.textContent = txt; return null; }   // 셀 것이 없는 칸은 빗금 친 줄표가 되어 어색하다
      const size = o.size;
      const hg = o.hg != null ? o.hg : size * HG;
      const sw = o.sw != null ? o.sw : Math.max(0.85, size * SW);
      const padX = o.padX != null ? o.padX : size * 0.30;
      const padY = o.padY != null ? o.padY : size * 0.28;
      if (!txt) return;

      /* v3.27: 연필 인쇄용 흔적(.inkp)은 남기고 비운다 — 숫자가 올라가는 동안 다시 그려도 동그라미가 지워지지 않게 */
      [...host.childNodes].forEach(n => { if (!(n.nodeType === 1 && n.classList && n.classList.contains('inkp'))) host.removeChild(n); });
      const svg = mk('svg', { role:'img', 'aria-label':txt, focusable:'false' });
      svg.classList.add('skv');
      host.appendChild(svg);

      const ls = o.ls != null ? o.ls : -(size*0.035);
      const common = { x:0, y:size, 'font-size':size, 'font-weight':800, 'letter-spacing':ls };

      /* 글자 폭을 먼저 잰다 */
      const probe = mk('text', Object.assign({}, common, { fill:'none' }));
      probe.textContent = txt; svg.appendChild(probe);
      let bb; try { bb = probe.getBBox(); } catch(_) { bb = { x:0, width:txt.length*size*0.9 }; }
      svg.removeChild(probe);

      const capTop = size - size*0.725, base = size;
      const L = bb.x, R = bb.x + bb.width;
      /* 큰 제목(wide)의 밑선은 칼럼 끝까지 늘여 지면을 가로지르고, 숫자는 글자 폭에만 긋는다 */
      const hostW = o.wide
        ? ((o.width != null ? o.width : (host.clientWidth || (host.parentElement && host.parentElement.clientWidth) || 0)) || (R + padX*2))
        : (R + padX*2);
      const VBW = Math.max(hostW, R + padX*2);
      const VBH = (base - capTop) + padY*2;
      svg.setAttribute('viewBox', `${-padX} ${capTop-padY} ${VBW} ${VBH}`);
      svg.dataset.gb = [L, capTop, R, base].map(v => (+v).toFixed(2)).join(',');   // v3.27: 연필이 쓰는 글자 상자
      svg.setAttribute('preserveAspectRatio', 'xMinYMid meet');
      svg.style.maxWidth = VBW + 'px';        // 짧은 상호가 칸을 채우려 커지지 않게 — 줄어들기만 한다
      const GL = -padX, GR = VBW - padX;

      /* 1. 자로 그은 밑선 — 흔들지 않는다 */
      const g = mk('g', { class:'skg', fill:'none', stroke:'var(--guide)', 'stroke-width':Math.max(.6, size*0.0118) });
      [capTop, base].forEach((y) => g.appendChild(mk('line', { x1:GL, y1:y, x2:GR, y2:y })));
      [L, R].forEach((x) => g.appendChild(mk('line', { x1:x, y1:capTop-padY*0.72, x2:x, y2:base+padY*0.72 })));
      const s = size*0.055;
      [[L,capTop],[R,capTop],[L,base],[R,base]].forEach(([x,y]) => {
        g.appendChild(mk('line', { x1:x-s, y1:y-s, x2:x+s, y2:y+s }));
        g.appendChild(mk('line', { x1:x-s, y1:y+s, x2:x+s, y2:y-s }));
      });
      svg.appendChild(g);

      /* 글자는 한 벌만 둔다 — 빗금과 윤곽은 이것을 <use>로 다섯 번 되쓴다.
         복사하거나 Ctrl+F로 찾을 때 같은 이름이 여러 번 잡히지 않게 하기 위함.
         <defs>에 넣으면 크롬이 innerText에 한 번 더 세므로 그냥 두고, 색을 감싼 <g>에서 뺀다.
         (색을 글자에 직접 걸면 <use>로 복제된 쪽까지 같은 규칙에 걸려 빗금이 지워진다) */
      const src = 'skt' + (++uid);
      const wrap = mk('g', { class:'skp' });
      const master = mk('text', Object.assign({}, common, { id:src }));
      master.textContent = txt; wrap.appendChild(master); svg.appendChild(wrap);

      /* 2. 빗금 채움 — 촘촘한 겹과 성긴 겹 */
      const fill = mk('g', { class:'skd', filter:`url(#${wob('f', .016, 3, size*0.035)})` });
      [[hg, sw*0.76, .5, 72, ''], [hg*2.1, sw*0.68, .28, 66, 'skx']].forEach(([gap, w, op, rot, cls]) => {
        fill.appendChild(mk('use', { href:`#${src}`, class:cls, fill:`url(#${hatch(gap, w, op, rot)})` }));
      });
      svg.appendChild(fill);

      /* 3. 세 번 덧그은 윤곽 — <use>의 x·y는 밀어 놓는 값이다 */
      const out = mk('g', { class:'skd', fill:'#201E1D' });
      [['a', -size*0.012,  size*0.008, sw*0.62, .45, .013, 3, size*0.062, 'skx'],
       ['b',  size*0.008, -size*0.008, sw*0.62, .50, .018, 3, size*0.041, 'skx'],
       ['c',  0,           0,          sw*0.80, .86, .022, 2, size*0.027, '' ]].forEach(([k, dx, dy, r, op, bf, oc, sc, cls]) => {
        out.appendChild(mk('use', { href:`#${src}`, class:cls, x:dx, y:dy, opacity:op, filter:`url(#${ring(k, bf, oc, sc, r)})` }));
      });
      svg.appendChild(out);


      host.dataset.skDone = '1';
      return master;            // 굴러가는 동안 글자만 갈아 끼우라고 원본을 돌려준다
    }

    /* 크기와 자간은 CSS에서 읽는다 — 화면 폭에 따른 본문의 단계(76 → 64 → 44 …)를 그대로 따라간다 */
    function optFor(e){
      const cs = getComputedStyle(e);
      const size = parseFloat(cs.fontSize) || 76;
      const ls = parseFloat(cs.letterSpacing);
      return { size, ls: Number.isFinite(ls) ? ls : -(size*0.035),
               wide: e.dataset.skWide === '1' };
    }
    /* data-sk가 붙은 것을 모아 그린다. 카운트업이 걸린 숫자는 굴러가는 동안 건너뛴다. */
    function paintAll(root){
      (root || document).querySelectorAll('[data-sk]').forEach((e) => {
        if (e.dataset.skWait === '1' || e.dataset.skLive === '1') return;   // 아직 차례가 아니거나 굴러가는 중
        const txt = e.dataset.skTxt != null ? e.dataset.skTxt : (e.dataset.skTxt = e.textContent.trim());
        draw(e, txt, optFor(e));
      });
    }
    /* 굴러가기 전에 미리 그려 둔다 — 칸(밑선·모서리 ✕)은 마지막 값 기준으로 한 번만 재고,
       그 안에서 글자만 바꾼다. <use> 다섯 벌이 원본을 따라가므로 DOM은 한 군데만 건드린다.
       돌려주는 함수로 매 프레임 값을 넣는다. 못 그리면 null. */
    function paintLive(e, finalTxt){
      if (!e || !e.dataset.sk) return null;
      const master = draw(e, String(finalTxt).trim(), optFor(e));
      if (!master) return null;
      e.dataset.skTxt = String(finalTxt).trim();
      const svg = e.querySelector('svg.skv');
      /* 굴러가는 동안은 덧그은 겹(.skx)을 쉬게 한다 — 필터 네 개가 두 개로 준다.
         멎는 순간 다시 켜지므로 선이 한 번 더 눌리는 것처럼 보인다 */
      if (svg) svg.dataset.roll = '1';
      e.dataset.skLive = '1';                 // 다시 그리기(paintAll)가 굴러가는 값을 덮지 않게
      /* 글자 마디만 갈아 끼운다 — textContent를 다시 넣으면 자식이 바뀌어 페이지가 매번 다시 재려 든다 */
      const tn = master.firstChild || master.appendChild(document.createTextNode(''));
      return (v, last) => {
        if (!master.isConnected) return;
        tn.nodeValue = v;
        if (last){ e.dataset.skLive = '0'; if (svg) svg.removeAttribute('data-roll'); }
      };
    }

    /* 카운트업이 끝난 숫자 하나를 그린다 */
    function paintOne(e){
      if (!e || !e.dataset.sk) return;
      const o = optFor(e);                                     // 글자를 지우기 전에 재야 한다
      e.dataset.skWait = '0';
      const txt = e.dataset.skTxt = (e.dataset.final != null ? e.dataset.final : e.textContent).trim();
      draw(e, txt, o);
    }
    return { draw, paintAll, paintOne, paintLive };
  })();


  /* ══════════ 섹션 렌더러 ══════════
     각 렌더러는 { html, meta } 를 돌려주거나, 쓸 데이터가 없으면 null 을 돌려준다.
     null 이면 그 섹션은 통째로 그려지지 않고 장번호도 건너뛴다.
     "수집은 됐는데 0건"은 정보이므로 null 이 아니다 — 실패만 null 이다. */

  const badge = (kind, text) => `<span class="bdg ${kind}">${esc(text)}</span>`;
  const failNote = (m) => `<p class="src9">${badge('fail','수집 안 됨')} ${esc(errLine(m))}</p>`;
  function errLine(m){
    const show = m && has(m.seconds) && (isSlow(m) || Number(m.seconds) >= 1);
    return `${(m && m.error) || '수집하지 못했습니다'}${show ? ` (${m.seconds}초)` : ''}`;
  }
  const isSlow = (m) => /시간 초과|끊겼|연결 실패/.test(String((m && m.error) || ''));
  function tbl(pairs){
    return `<table class="tbl">${pairs.map(([k,v]) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join('')}</table>`;
  }
  function linkText(link, title){
    const t = esc(title || '(제목 없음)');
    const u = safeHref(link);
    return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t}</a>` : t;
  }

  /* ── 01 매장 ── */
  function renderStore(b){
    const s = b.store || {};
    const R = (b.options && b.options.radius) || 500;
    const region = mod(b,'region'), comp = mod(b,'competition'), pop = mod(b,'population');
    const online = mod(b,'online'), notices = mod(b,'notices');

    const blog = od && part(od.blog), cafe = od && part(od.cafe);

    /* 숫자 하나짜리 값에는 data-n을 달아 카운트업이 굴러가게 한다 ("486 · 5" 같은 쌍은 그대로) */
    const kpi = (k,v,sub) => {
      const raw = String(v).replace(/,/g,''), ok = /^\d+(\.\d+)?$/.test(raw);
      /* "238 · 47"처럼 두 값을 가운뎃점으로 이어 붙인 칸도 같이 굴린다 — 혼자만 멈춰 있으면 눈에 걸린다 */
      const pair = !ok && /^\d+(\.\d+)? · \d+(\.\d+)?$/.test(raw) ? raw.split(' · ') : null;

      const roll = ok ? ` data-n="${raw}" data-d="${dOf(raw)}" data-sk-wait="1"`
        : pair ? ` data-r="${pair.join('~')}" data-sep=" · " data-d="${Math.max(...pair.map(dOf))}" data-sk-wait="1"` : '';
      return `<div class="kpi"><div class="k">${esc(k)}</div>

      kpi('블로그 · 카페 언급', od ? `${num(blog && blog.total)} · ${num(cafe && cafe.total)}` : '—',
        od ? '검색 결과 수라 다른 매장 글이 섞일 수 있습니다' : '수집 안 됨'),
      kpi('지금 접수 중인 지원사업', notices.ok ? num(supportLive(b).nOk.length) : '—',
        notices.ok ? `${notices.data.sido}${supportLive(b).gu ? ` ${supportLive(b).gu}` : ''} 기준` : '수집 안 됨'),
    ].join('') + '</div>';

    const lic = licence(b), P = placeInfo(b);

      P && P.url ? `<a href="${esc(P.url)}" target="_blank" rel="noopener">네이버 플레이스</a>` : '',

    ].filter(Boolean).join(' · ');
    /* 전화 — 검색 결과에 없으면 플레이스 번호(가상번호일 수 있음)를 쓴다 */

    const ld = mod(b,'localdata');
    const rows = [
      ['업종 (카카오)', esc(s.category || '—')],
      ['업종 (네이버)', esc(s.naverCategory || '—')],
      ['도로명 주소', esc(s.roadAddress || '—')],
      ['지번 주소', esc(s.address || '—')],
      ['전화', phone],
      ['행정동', region.ok ? esc(admin ? `${admin.name} (코드 ${admin.code})` : '—') : badge('fail','수집 안 됨')],

    if (P && hoursText(P)) rows.push(['영업일 · 시간', esc(hoursText(P)) + pWarn]);

      .map(c => `<li>주변 시설 ${esc(c.label)} — ${esc(c.error)}</li>`) : [];
    const od = online.ok ? onlineParts(online.data) : null;
    if (od) [['blog','블로그'],['waiting','‘웨이팅’ 블로그'],['cafe','카페']].forEach(([k,n]) => {
      if (od[k] && od[k].error) partial.push(`<li>온라인 언급 ${esc(n)} — ${esc(od[k].error)}</li>`); });
    if (news.ok) (news.data.queries||[]).filter(x=>x.error)
      .forEach(x => partial.push(`<li>뉴스 ‘${esc(x.q)}’ — ${esc(x.error)}</li>`));
    const list = fails.concat(partial);
    const slow = failed.some(([,m]) => isSlow(m))
      ? '<p class="src9">서버가 느리거나 연결이 끊겨 못 가져온 항목이 있습니다. 한 번 더 수집하면 대개 채워집니다.</p>' : '';
    return `<footer class="foot">
      ${list.length ? `<div class="sale" style="margin-bottom:13px"><b style="color:var(--ink)">수집하지 못한 항목</b>
        <ul class="errs" style="margin-top:6px">${list.join('')}</ul>${slow}</div>` : ''}
      모든 숫자에는 출처와 조회 시각이 붙습니다. 공개 데이터와 추정치<span class="sale">이므로 리포트에 쓰기 전에 원본과 한 번 대조해 주세요</span><span class="custonly">입니다</span>.<br>
      수집 ${esc(b.collectedAt||'')} · 반경 ${dist((b.options&&b.options.radius)||500)} · 수집기 ${esc(b.version||'')} / 페이지 ${PAGE_VERSION}
    </footer>`;
  }

  /* 배경 타이포 — 글자 폭을 역산해 마지막 글자의 24%만 칼럼 밖으로 나가게 둔다.
     위로 올려 붙이면 장의 overflow:hidden에 윗부분이 잘려 '추'가 '수'로 읽힌다 — 제목 줄 아래 8~40px에서 시작.
     짧은 장에서는 아래가 잘리므로 그린 뒤 fitBg()가 장 높이에 맞춰 줄인다. */
  function bgWord(word, no){
    const F = 250 + ((no*29)%60);                 // 250~309px
    const w = F * 0.95 * word.length;             // 한글 글자 폭 ≈ 0.95em
    const left = Math.round(590 + 0.24*F - w);
    const top = 8 + ((no*37)%32);
    return `<div class="bgw" data-w="${esc(word)}" data-f="${F}" data-t="${top}" style="left:${left}px;top:${top}px;font-size:${F}px">${esc(word)}</div>`;
  }

  /* 한 장만 다시 그린다 — 장번호·제목은 그대로, 본문과 메타만 바꾼다 */
  function repaintSection(id){
    if (!state.bundle) return;
    const sec = document.getElementById(`sec-${id}`), sd = SECTIONS.find(x => x.id === id);
    if (!sec || !sd) return;
    let r = null;
    try { r = sd.render(state.bundle); } catch (e) { console.error(id, e); }
    if (!r) return;
    const hd = sec.querySelector(':scope > .hd'), meta = hd && hd.querySelector('.meta');
    if (meta) meta.textContent = r.meta || '';
    [...sec.children].forEach(ch => { if (!ch.classList.contains('hd') && !ch.classList.contains('bgw') && !ch.classList.contains('arule')) ch.remove(); });
    sec.insertAdjacentHTML('beforeend', rxFor(id, state.bundle) + r.html);
  }

  /* ── 리포트 조립 — 장번호는 실제로 그려진 섹션에만 순서대로 매긴다 ── */
  const CUST_SKIP = new Set(['quote', 'news', 'manual']);   // v3.31: 고객용 진단서에서 빼는 장 — 견적은 제안서 몫, 뉴스는 부정 기사가 섞일 수 있다 · v3.33: 플레이스 점검은 고객에게도 (영업 메모만 숨김)
  function renderReport(b){
    let no = 0;
    const parts = SECTIONS.map((sd) => {
      if (state.cust && CUST_SKIP.has(sd.id)) return '';
      let r = null;
      try { r = sd.render(b); } catch (e) { console.error(sd.id, e); r = null; }
      if (!r) return '';
      const label = sd.dig != null ? sd.dig : String(++no);           // 요약은 0, 나머지는 1부터
      return `<section class="sec ${sd.cls||''}${r.static?' static':''}${r.screenOnly?' screen-only':''}" id="sec-${sd.id}">
        ${sd.bg ? `<i class="bgwrap">${bgWord(sd.bg, sd.dig != null ? 0 : no)}</i>` : ''}
        <div class="hd">
          <div class="chap" data-rule="hb,vr"><span class="dig">${esc(label)}</span><h2>${esc(sd.title)}</h2></div>
          <span class="meta">${esc(r.meta||'')}</span>
        </div>
        ${rxFor(sd.id, b)}${r.html}
      </section>`;
    });
    setTimeout(() => { mountMap(b); numberSumLinks(); window.dispatchEvent(new Event('sketch:rendered')); }, 0);          // innerHTML이 들어간 다음에 올린다
    return custHeadHTML(b) + parts.join('') + renderFoot(b);
  }
  function custHeadHTML(b){
    if (!state.cust || !b || !b.store) return '';
    const day = String(b.collectedAt || '').slice(0, 10);
    return `<div class="custhead"><div class="eyebrow">매장 진단서</div><p class="deck">${esc(b.store.name || '')}</p>
      <p class="src9">${day ? `${esc(day)} 기준 · ` : ''}공개 자료와 손님 리뷰로 만든 진단입니다 · 판정은 정해 둔 규칙으로만 합니다</p></div>`;
  }

  /* ── 1장 지도 (네이버 Dynamic Map) ──
     키가 없거나 좌표가 없으면 위에서 상자를 아예 만들지 않으므로 여기도 조용히 지나간다. */
  let _mapSdk = null;
  function loadMapSdk(){
    if (window.naver && window.naver.maps) return Promise.resolve(true);
    if (_mapSdk) return _mapSdk;
    _mapSdk = new Promise((resolve) => {
      const el = document.createElement('script');
      el.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(NAVER_MAP_KEY);
      el.onload = () => resolve(Boolean(window.naver && window.naver.maps));
      el.onerror = () => resolve(false);
      document.head.appendChild(el);
    });
    return _mapSdk;
  }
  async function mountMap(b){
    const box = document.getElementById('skMap');
    if (!box || box.dataset.done === '1') return;
    const s = (b && b.store) || {};
    if (!NAVER_MAP_KEY || !has(s.x) || !has(s.y)) return;
    box.dataset.done = '1';
    const ok = await loadMapSdk();
    if (!ok){                                  // 키가 틀렸거나 도메인 미등록 — 자리를 남기지 않는다
      const wrap = box.closest('.mapwrap'); if (wrap) wrap.remove();
      const row = document.getElementById('skRow'); if (row){ const l = row.querySelector('.b.s5'); if (l){ l.classList.remove('s5','rail'); l.classList.add('s12'); } }
      return;
    }
    try {
      const M = naver.maps;
      const at = new M.LatLng(Number(s.y), Number(s.x));
      const R = Number((b.options && b.options.radius) || 500);
      const map = new M.Map(box, {
        center: at, zoom: R >= 1000 ? 14 : (R >= 500 ? 15 : 16),
        /* v3.21 (#77): 컨트롤·휠·드래그를 끈 정지 지도 — 클릭하면 네이버 지도가 새 창으로 열린다 */
        mapDataControl: false, scaleControl: false, zoomControl: false, logoControlOptions: { position: M.Position.BOTTOM_LEFT },
        scrollWheel: false, draggable: false, pinchZoom: false, keyboardShortcuts: false, disableDoubleClickZoom: true, disableDoubleTapZoom: true, disableTwoFingerTapZoom: true,
      });
      /* 반경 밖은 어둡게 — 큰 사각형에 원 모양 구멍을 낸 다각형 */
      const dLat = R / 111320, dLng = R / (111320 * Math.cos(Number(s.y) * Math.PI / 180) || 1);
      const outer = [[-0.08,-0.08],[-0.08,0.08],[0.08,0.08],[0.08,-0.08]].map(([a,o]) => new M.LatLng(Number(s.y)+a, Number(s.x)+o));
      const hole = []; for (let i = 0; i < 72; i++){ const t = i/72*Math.PI*2; hole.push(new M.LatLng(Number(s.y) + dLat*Math.sin(t), Number(s.x) + dLng*Math.cos(t))); }
      new M.Polygon({ map, paths: [outer, hole], fillColor: '#201E1D', fillOpacity: .16, strokeWeight: 0, clickable: false });
      new M.Circle({ map, center: at, radius: R, strokeColor: '#EC3013', strokeOpacity: .6, strokeWeight: 1.4, fillOpacity: 0, clickable: false });
      new M.Marker({ map, position: at, title: s.name || '', icon: { content: '<div class="skpin"></div>', anchor: new M.Point(7, 7) }, zIndex: 20 });
      /* 반경 표시 — 원 오른쪽 가장자리에 빨간 글씨 (#77) */
      new M.Marker({ map, position: new M.LatLng(Number(s.y), Number(s.x) + dLng), clickable: false,
        icon: { content: `<div class="skr">${R >= 1000 ? (R/1000)+'km' : R+'m'}</div>`, anchor: new M.Point(-4, 9) }, zIndex: 18 });
      /* 옆 가게 번호 핀 — 중계 서버 v1.30부터 좌표가 온다. 없으면 목록만 남는다 */
      const cd = ((b.modules||{}).competition||{}).data || {};
      const near = (cd.neighbors || []).filter(x => x && x.name).slice(0, 6);
      const pins = near.map((x, i) => (has(x.x) && has(x.y))
        ? new M.Marker({ map, position: new M.LatLng(Number(x.y), Number(x.x)), title: x.name,
            icon: { content: `<div class="skpin n">${i+1}</div>`, anchor: new M.Point(11, 11) }, zIndex: 15 })
        : null);
      map.fitBounds(new M.LatLngBounds(new M.LatLng(Number(s.y)-dLat, Number(s.x)-dLng), new M.LatLng(Number(s.y)+dLat, Number(s.x)+dLng)),
        { top: 20, right: 20, bottom: 20, left: 20 });
      /* 지도 클릭 → 네이버 지도 새 창 */
      const nav = `https://map.naver.com/p/search/${encodeURIComponent([s.name, s.roadAddress || s.address].filter(Boolean).join(' '))}`;
      M.Event.addListener(map, 'click', () => window.open(nav, '_blank', 'noopener'));
      /* 지시선 — 핀에서 목록 번호까지. 지도가 움직이거나 창이 바뀌면 다시 긋는다 */
      const row = document.getElementById('skRow'), svg = document.getElementById('skLines'), list = document.getElementById('skNear');
      const drawLines = () => {
        if (!row || !svg || !list) return;
        const rb = row.getBoundingClientRect(), bb = box.getBoundingClientRect();
        const proj = map.getProjection && map.getProjection();
        svg.setAttribute('viewBox', `0 0 ${rb.width} ${rb.height}`);
        let out = '';
        pins.forEach((pin, i) => {
          if (!pin || !proj) return;
          const li = list.querySelector(`li[data-i="${i}"] .no`); if (!li) return;
          const o = proj.fromCoordToOffset(pin.getPosition());
          const px = bb.left - rb.left + o.x, py = bb.top - rb.top + o.y;
          if (px < bb.left - rb.left || px > bb.right - rb.left || py < bb.top - rb.top || py > bb.bottom - rb.top) return;   // 화면 밖 핀은 선을 안 긋는다
          const lb = li.getBoundingClientRect();
          const tx = lb.left - rb.left, ty = lb.top - rb.top + lb.height/2;
          /* v3.22: 꺾지 않고 핀에서 번호까지 사선 한 줄 — 번호 쪽 끝에 작은 점 */
          out += `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${(tx-3).toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#201E1D" stroke-width="1" stroke-opacity=".55"/><circle cx="${(tx-3).toFixed(1)}" cy="${ty.toFixed(1)}" r="1.6" fill="#201E1D" fill-opacity=".6"/>`;
        });
        svg.innerHTML = out;
      };
      M.Event.addListener(map, 'idle', drawLines);
      window.addEventListener('resize', drawLines);
      setTimeout(drawLines, 400);
    } catch (e) {
      console.error('map', e);
      const wrap = box.closest('.mapwrap'); if (wrap) wrap.remove();
    }
  }

  function renderNearby(b){
    const m = mod(b,'nearby');
    if (!m.ok) return null;
    const R = (b.options && b.options.radius) || 500;
    const cats = (m.data.categories||[]).filter(c => !c.error && has(c.count) && Number(c.count) > 0);
    const uni = m.data.universities || { list: [] };
    const data = cats.map(c => ({ nm:c.label, v:Number(c.count) }));
    if (!uni.error && (uni.list||[]).length) data.push({ nm:'대학교', v:(uni.list||[]).length });
    if (!data.length) return null;                       // 반경 안에 아무것도 없음 → 섹션 생략
    data.sort((a,c) => c.v - a.v);
    // 숙박이 있으면 관광 상권 신호라 빨강 하나를 여기에 준다
    const lodge = data.find(d => /숙박/.test(d.nm));
    if (lodge){ lodge.c = '#EC3013'; lodge.hot = 1; }
    const near = cats.filter(c => (c.nearest||[]).length)
      .map(c => `${esc(c.label)} ${(c.nearest||[]).map(x => `${esc(x.name)} ${esc(dist(x.distance))}`).join(', ')}`).join(' · ');
    const tot = data.reduce((a,d)=>a+d.v,0);
    const top = data[0];
    const read = lodge && lodge.v/tot >= 0.08
      ? `숙박 ${lodge.v}곳이 전체의 <b>${(lodge.v/tot*100).toFixed(1)}%</b>입니다 — 밖에서 오는 손님이 섞이는 상권으로 읽습니다.`
      : `반경 ${dist(R)} 시설 ${num(tot,'곳')} 가운데 <b>${esc(top.nm)} ${num(top.v,'곳')}</b> — 열 곳 중 ${Math.round(top.v/tot*10)}곳이 ${esc(top.nm)}인 동네입니다.`;
    return { html: `<div class="mz">
        <div class="b s7">${donutSVG(data, `반경 ${dist(R)} · 곳`)}</div>
        <div class="b s5 rail"><div class="relief"><p class="k">많은 순</p>${rankList(data, '곳')}</div></div>
        <div class="b s12 top"><p class="deck">${read}</p>
          ${/* v3.26: 관광 신호를 눈에 보이게 — 0장 '외국인 손님' 판정의 근거 */''}
          ${m.data.tourism && (m.data.tourism.list||[]).length ? `<p class="src9" style="margin-top:8px">관광 신호 (반경 ${esc(dist(m.data.tourism.radius||R))} · 카카오 키워드 검색) — ${m.data.tourism.list.map(x => `${esc(x.word)} <b>${esc(num(x.count,'곳'))}</b>`).join(' · ')} · 면세점은 검색이 넓게 잡혀 뺐습니다 · 0장 ‘외국인 손님’ 판정에 씁니다</p>` : ''}
          ${data.some(d => d.nm === '음식점') ? `<p class="src9">카카오맵 분류로 센 수라 3장(상가정보 · 카페 포함)의 음식 업소 수와 다릅니다.</p>` : ''}
          <p class="src9 int">각도가 비율이고, 정확한 값은 오른쪽 숫자가 책임집니다. 조각은 5위까지 진한 순서, 그 아래는 한 톤입니다.
          ${near ? `<br>가까운 곳 — ${near}` : ''}
          ${(m.data.notes||[]).map(t=>`<br>${esc(t)}`).join('')}</p></div>
      </div>`,
      meta: `${srcText(m).toUpperCase()} · 반경 ${dist(R)}` };
  }

  /* ── 같은 업종 점포 (세로 막대) ── */
  function renderComp(b){
    const m = mod(b,'competition');
    if (!m.ok) return null;
    const R = (b.options && b.options.radius) || 500;
    const cd = m.data;
    if (!cd.matched && !cd.fallback){
      const nb = cd.nearby || {};
      const list = (nb.list||[]).slice(0,10).map(x => `${esc(x.name)}<span class="src9"> ${esc([x.small||x.large, x.floor?`${x.floor}층`:''].filter(Boolean).join(' '))}</span>`).join(' · ');
      return { html: state.cust ? `<p class="lead-read" style="font-size:15px">상가정보에 이 매장이 올라 있지 않아 같은 업종 수를 세지 못했습니다.</p>`
        : `<p class="lead-read" style="font-size:15px">${badge('warn','매장 못 찾음')} ${esc(cd.note||'상가정보에서 이 매장을 찾지 못했습니다.')}</p>
        ${list ? `<p class="src9">${esc(nb.from||'주변')}에 등록된 상가 (매장 확인용이지 경쟁 수치가 아닙니다)<br>${list}</p>` : ''}`,
        meta: srcText(m).toUpperCase() };
    }
    const data = [
      { nm:cd.industry.large||'대분류', v:Number(cd.sameLarge.count||0), sub:'대분류', c:'#C7C7CC' },
      { nm:cd.industry.middle||'중분류', v:Number(cd.sameMiddle.count||0), sub:`중분류 · ${cd.sameLarge.count?((cd.sameMiddle.count/cd.sameLarge.count)*100).toFixed(1):'—'}%`, c:'#6E6E73' },
      { nm:cd.industry.small||'소분류', v:Number(cd.sameSmall.count||0), sub:`소분류 · ${cd.sameLarge.count?((cd.sameSmall.count/cd.sameLarge.count)*100).toFixed(1):'—'}%`, c:'#EC3013', hot:1 },
    ];
    /* 상가정보는 점포 목록을 통째로 주는 API다. 개수로 접어 두면 아까운 것 셋을 더 편다. */
    const bands = (cd.sameSmall.bands || []);
    const near  = (cd.neighbors || []).filter(x => x && x.name);
    const mix   = (cd.mix || []).filter(x => x && x.small && x.count);

    /* 매장은 못 찾았지만 업종으로 대체한 경우 — 숫자는 같은 방식으로 그리되, 위에 경고를 달고 '이 매장 제외'라고 쓰지 않는다 */
    const fb = !cd.matched && cd.fallback ? cd.fallback : null;
    const nb = cd.nearby || {};
    const nbList = fb ? (nb.list||[]).slice(0,10).map(x => `${esc(x.name)}<span class="src9"> ${esc([x.small||x.large, x.floor?`${x.floor}층`:''].filter(Boolean).join(' '))}</span>`).join(' · ') : '';
    const fbHead = !fb ? '' : state.cust
      ? `<p class="src9">같은 업종은 소분류 ‘${esc(cd.industry.small)}’${jo(cd.industry.small,'으로/로')} 셌습니다. 이 매장이 포함됐을 수 있습니다.</p>`
      : `<p class="lead-read" style="font-size:15px">${badge('warn','업종으로 대체')} 상가정보에서 이 매장을 찾지 못해, ${esc(fb.from)} ‘${esc(fb.category)}’${jo(fb.category,'으로/로')} 소분류 <b>${esc(cd.industry.small)}</b>${jo(cd.industry.small,'을/를')} 골라 셌습니다. 이 매장이 등록돼 있다면 아래 숫자에 1곳이 포함돼 있습니다.</p>`;
    const src = fb
      ? (state.cust ? `자료 기준월 ${esc(ym(cd.stdrYm))}` : `${esc(cd.note||'')}${nbList ? `<br>${esc(nb.from||'주변')}에 등록된 상가 (매장 확인용) — ${nbList}` : ''} · 자료 기준월 ${esc(ym(cd.stdrYm))}`)
      : `상가정보 등록 상호 ‘${esc(cd.matchedName)}’ (좌표 차이 ${esc(dist(cd.matchedDistance))}${cd.floor?`, ${esc(cd.floor)}층`:''})${cd.how?` · ${esc(cd.how)}에서 찾음`:''} · 자료 기준월 ${esc(ym(cd.stdrYm))}${bands.length?'':` · 거리별 — ${esc(bandText(bands,' · '))}`}`;
    const legend = data.map((d,i) => ({ ...d, sub: i === 0 ? '대분류' : d.sub }));
    /* v3.21 (#78): 산 차트는 왼쪽 반, 오른쪽엔 거리대 표·밀도 문장·같은 건물 — 전폭일 때 종이 질감 배율이 어긋나던 것을 되돌린다 */
    const estTag = cd.industry && cd.industry.estimated ? ' <span class="bdg warn">추정</span>' : '';
    const sameBld = near.filter(x => x.sameBldg).length;

  /* 거리별 밀도 — 가까울수록 위협이다. 세로 막대를 또 쓰면 지루하니 가로 띠로 */
  function distHTML(bands, small, R, total){
    if (!bands.length) return '';
    const mx = Math.max(...bands.map(x => Number(x.count)||0), 1);
    const lab = (x) => `${x.from ? `${x.from}~` : ''}${x.to}m`;
    const closest = bands[0];
    return `<p class="k" style="margin-top:34px">거리별 ${esc(small||'같은 업종')} — 가까울수록 같은 손님을 나눕니다</p>
      <ul class="dist" data-rule="vl,vr">${bands.map((x,i) => {
        const v = Number(x.count)||0, w = Math.max(v/mx*100, 1.5);
        return `<li${i===0?' class="hot"':''}><span class="dl">${esc(lab(x))}</span>
          <span class="db"><i style="width:${w.toFixed(1)}%"></i></span>
          <span class="dn">${esc(num(v,'곳'))}</span></li>`;
      }).join('')}</ul>
      ${densLine(closest, R, total)}`;
  }
  /* 개수만 보면 먼 구간이 늘 커 보인다 — 땅 넓이로 나눠야 '촘촘함'이 보인다 */
  function densLine(c, R, total){
    if (!c || !Number(c.count) || !R || !total) return '';
    const ring = Math.PI * (Math.pow(Number(c.to),2) - Math.pow(Number(c.from)||0, 2));
    const all  = Math.PI * Math.pow(Number(R), 2);
    if (!(ring > 0) || !(all > 0)) return '';
    const k = (all/total) / (ring/Number(c.count));
    const lab = `${c.from ? `${c.from}~` : ''}${c.to}m`;
    return `<p class="src9">가장 가까운 ${esc(lab)} 안에 ${esc(num(c.count,'곳'))} — 땅 넓이로 따지면
      반경 ${dist(R)} 평균보다 <b>${k.toFixed(1)}배 촘촘</b>합니다. 이 구간이 실제 경쟁입니다.</p>`;
  }

  /* 동네 업력 — 인허가 자료로만 나오는 숫자. 새로 여는 곳과 닫은 곳이 경쟁 압력이다.
     v3.10: 큰 숫자 두 개(왼쪽) + 세로 누적 기둥(오른쪽). 폐업 누계는 자료가 쌓인 기간 전체라 연하게. */
  function hoodHTML(L, R){

            <div class="v" style="font-size:58px" data-sk="1" data-sk-wait="1" data-n="${closed}">${esc(num(closed))}</div>

        </div>
        <p class="src9">행정동이 아니라 <b>주소에 ‘${esc(h.where)}’${jo(h.where,'이/가')} 들어간 곳</b>을 센 값이라, 위의 반경 ${dist(R)} 숫자와 기준이 다릅니다. 같이 놓고 비교하지 마세요.</p></div>

      </div></div>`;

  /* 주변 업종 구성 — 이 골목이 무슨 골목인지 */
  function mixHTML(mix, total, R){

        rest > 0 ? `<i style="width:${pc(rest).toFixed(2)}%;background:var(--fill-lo)"></i>` : ''}</div>
      <ul class="mixleg">${top.map((x,i) =>
        `<li><i style="background:${['#201E1D','#4A4846','#6E6E73','#A1A1A6','#C7C7CC'][i]}"></i>${esc(x.small)}

  /* ── 온라인 언급 — 숫자 셋 · 웨이팅 신호 · 최근 글 (v3.10) ── */
  const HIORDER_WAIT = '하이오더 웨이팅으로 되는 것 — 입구 태블릿에서 대기번호 발급(현재 대기 팀 수 표시), 연락처·인원 등록, 알림톡으로 등록 안내와 입장 호출(건당 12원 · VAT 포함), 손님이 실시간 대기 확인·취소, 매니저에서 호출·노쇼 취소·착석 처리, 즉시입장·입장마감 화면 (하이오더 매뉴얼 7351·8161·8871 · 2026-09 기준)';
  function waitingBlock(waiting, blogScanned){
    const rv = state.reviews && state.reviews.data ? state.reviews.data : null;

    const parts = [];

    return `<div class="b s12 top wait"><div class="eyebrow">WAITING</div>
      <p class="deck">웨이팅 신호 — ${parts.join(', ')}에 웨이팅·대기가 적혀 있습니다.</p>

  }
  function renderOnline(b){

    const others = blog ? (blog.recent||[]).filter(r=>r.otherBranch) : [];

    const rel = (r) => !r.otherBranch && (!brandTok || String(r.title || '').includes(brandTok));   // v3.35: 고객용에는 가게 이름이 제목에 있는 글만

      <div class="b s5 top rail">${cafeList ? `<p class="k">최근 카페 글</p><ul class="recent nod">${cafeList}</ul>` : ''}${ph[2] ? `<div style="margin-top:${cafeList?'24px':'0'}">${photoHTML(ph[2],'sq','',2,b)}</div>` : ''}</div>
      <div class="b s12"><p class="src9">블로그·카페 수는 검색 결과 수라서 다른 매장 글이 섞일 수 있습니다. 많고 적음을 보는 참고치로만 씁니다.${waiting && has(waiting.scanned) ? ' 웨이팅 수는 최근 글의 제목·요약에서 센 것이라 본문에만 적힌 것은 빠집니다.' : ''}
        ${others.length && !state.cust?`<br>${badge('warn','주의')} 최근 블로그 글 ${(blog.recent||[]).length}건 중 ${others.length}건이 같은 브랜드의 다른 지점(${esc([...new Set(others.map(r=>r.otherBranch))].join(', '))}) 글입니다.`:''}</p></div>
    </div>`, meta: srcText(m).toUpperCase() };

  /* ── 뉴스 — 상호 | 동네 상권 2단 (v3.10) ── */

  /* ── 메뉴 검색 추이 ── */
  function renderTrend(b){

    box.outerHTML = r.html;
    const meta = document.querySelector('#sec-keyword > .hd .meta'); if (meta) meta.textContent = r.meta || '';
  }

  /* ── 검색어 후보 (v2.x, v3.33부터 소개글·소식용) ──
     지역어 × 업종어 × 상황어로 손님이 칠 법한 말을 조합한다. 대표키워드 칸이 아니라 소개글·소식·체험단 글에 문장으로 쓰는 말이다
     (대표키워드는 메뉴명·서비스 한 낱말 — 작성기준 10항). 검색량은 데이터랩 상대값으로만 본다. */

  const KW_OCC = [
    { w:'회식',   adj:'회식',     place:true  },
    { w:'모임',   adj:'모임',     place:true  },
    { w:'단체',   adj:'단체',     place:true  },
    { w:'가족',   adj:'가족',     place:true  },
    { w:'돌잔치', adj:'돌잔치',   place:true  },
    { w:'상견례', adj:'상견례',   place:true  },
    { w:'데이트', adj:'데이트',   place:true  },
    { w:'점심',   adj:'점심',     place:false },
    { w:'혼밥',   adj:'혼밥',     place:false },
    { w:'룸',     adj:'룸 있는',  place:false, ask:'룸이 실제로 있는지' },
    { w:'주차',   adj:'주차되는', place:false, ask:'매장 주차가 되는지' },
    { w:'포장',   adj:'포장되는', place:false, ask:'포장을 받는지' },
  ];
  const KW_KIND = [
    [/육류|고기|구이|갈비|삼겹|막창|곱창/, '고깃집'],
    [/횟집|물회|막회|생선|수산|해물/,      '횟집'],
    [/치킨|닭강정/,                        '치킨집'],
    [/중식|중국|짜장|짬뽕/,                '중국집'],
    [/일식|초밥|스시|돈카츠|돈까스/,        '일식당'],
    [/분식|떡볶이|김밥/,                   '분식집'],
    [/주점|술집|호프|포차|이자카야/,        '술집'],
    [/카페|커피|디저트|베이커리/,           '카페'],
    [/한식|백반|국밥|찌개/,                '한식당'],
  ];
  const KW_FOOD = ['숯불갈비','생갈비','양념갈비','소갈비','돼지갈비','갈비','삼겹살','목살','오겹살','막창','곱창',
    '불고기','한우','냉면','칼국수','보쌈','족발','감자탕','부대찌개','해물탕','물회','막회','회','초밥','돈까스',
    '치킨','피자','파스타','국밥','설렁탕','삼계탕','떡볶이','짜장면','짬뽕','곰탕','추어탕','아구찜','장어'];

  /* 지역어 — 행정동, 시군구, 가까운 지하철역 */
  function kwPlaces(b){
    const region = mod(b,'region'), nb = mod(b,'nearby'), out = [];
    const ad = region.ok && region.data.admin;
    if (ad){
      if (ad.dong) out.push({ t:String(ad.dong).replace(/\d+동$/,'동'), why:'행정동', s:3 });
      const tk = String(ad.name||'').split(/\s+/).filter(Boolean);
      const gu = tk.slice(1,-1).filter(x => /[시군구]$/.test(x)).pop();
      if (gu) out.push({ t:gu, why:'시·군·구', s:2 });
    }
    if (nb.ok){
      const c = (nb.data.categories||[]).find(c => c.label==='지하철역');
      const st = c && (c.nearest||[])[0];
      /* 카카오는 '인천터미널역 인천1호선'처럼 노선명을 붙여 준다 — 첫 '역'까지만 쓴다.
         그리고 800m가 넘으면 도보 10분 밖이라 역 이름으로 찾아오지 않는다. */
      const nm = st && st.name ? (/^(.+?역)/.exec(String(st.name)) || [])[1] : '';
      if (nm && (!has(st.distance) || Number(st.distance) <= 800))
        out.push({ t:nm, why:`가까운 역 ${dist(st.distance)}`, s:3 });
    }
    return out;
  }

  /* 업종어 — 상호에 박힌 음식 이름이 제일 세다 */
  function kwKinds(b){
    const s = b.store || {}, comp = mod(b,'competition'), out = [];
    const nm = String(s.name||'');
    const P = placeInfo(b);
    const hay = [nm, s.category, s.naverCategory, P && P.intro,
      comp.ok && comp.data.industry && comp.data.industry.small].filter(Boolean).join(' ');
    KW_FOOD.forEach(f => {                       // 뒤에 한글이 이어지면 다른 낱말이다 ('한우리'의 '한우')
      if (new RegExp(f + '(?![가-힣])').test(nm) && !out.some(o=>o.t===f)) out.push({ t:f, why:'상호', s:3 });
    });
    for (let i=out.length-1; i>=0; i--){          // '숯불갈비'가 있으면 '갈비'는 군더더기
      if (out.some((o,j) => j!==i && o.t.includes(out[i].t) && o.t.length>out[i].t.length)) out.splice(i,1);
    }
    ((b.options && b.options.keywords) || []).forEach(k => {
      k = String(k).trim(); if (k && !out.some(o=>o.t===k)) out.push({ t:k, why:'대표 메뉴', s:2 });
    });
    /* v2.90 — 플레이스 메뉴판·리뷰에서 많이 언급된 메뉴·블로그 제목의 음식 이름. 검색어로 쓸 수 있게 짧은 한글 이름만 */
    const menuWord = (v) => { const t = String(v||'').split(/[(\[/·,]/)[0].replace(/\s+/g,'').trim().replace(/(세트|정식|코스)$/, ''); return /^[가-힣]{2,6}$/.test(t) ? t : ''; };   // v3.35: 세트·정식 꼬리를 떼고 여섯 자까지 (검색어로 치는 길이)
    const addMenu = (v, why, sc) => { const t = menuWord(v); if (t && !out.some(o=>o.t===t) && !out.some(o=>o.t.includes(t)||t.includes(o.t))) out.push({ t, why, s:sc }); };
    if (P){
      (P.reviewMenus||[]).slice(0,3).forEach(v => addMenu(v, '리뷰에 많이 나온 메뉴', 3));
      (P.menus||[]).filter(m => m.recommend).concat(P.menus||[]).slice(0,4).forEach(m => addMenu(m.name, '플레이스 메뉴판', 2));
    }
    const online = mod(b,'online');
    if (online.ok){
      const titles = ((online.data.blog && online.data.blog.recent) || []).filter(x => !x.otherBranch).map(x => String(x.title||'')).join(' ');
      KW_FOOD.forEach(f => { if (new RegExp(f + '(?![가-힣])').test(titles)) addMenu(f, '블로그 제목', 1); });
    }
    for (const [re, label] of KW_KIND){
      if (re.test(hay)){ if(!out.some(o=>o.t===label)) out.push({ t:label, why:'업종', s:2 }); break; }
    }
    const lbl = out.find(o => o.why === '업종');                 // 업종어는 메뉴어에 밀려 잘리지 않게 한 자리를 남긴다
    const rest = out.filter(o => o !== lbl);
    return lbl ? rest.slice(0,3).concat([lbl]) : rest.slice(0,4);
  }

  /* 상황어 — 동네 사람들이 실제로 쓴 말에서만 고른다 */
  function kwOccs(b){
    const online = mod(b,'online'), news = mod(b,'news'), nb = mod(b,'nearby'), texts = [];
    const P = placeInfo(b);
    if (P && P.intro) texts.push(P.intro);            // 사장님이 직접 쓴 말이 제일 세다
    if (online.ok){
      const d = online.data;
      ((d.blog && d.blog.recent) || []).forEach(x => texts.push(x.title));
      ((d.cafe && d.cafe.recent) || []).forEach(x => texts.push(x.title));
    }
    if (news.ok) (news.data.queries || []).forEach(q => (q.recent||[]).forEach(x => texts.push(x.title)));
    const hay = texts.filter(Boolean).join(' ');
    const out = [];
    const why0 = (w) => (P && P.intro && P.intro.includes(w)) ? '매장 소개글에 있는 말' : '동네 글에 나온 말';
    KW_OCC.forEach(o => { if (hay.includes(o.w)) out.push(Object.assign({ why:why0(o.w), s:2 }, o)); });
    /* 편의시설이 들어오면 추측을 확정으로 바꾸고 ASK를 뗀다 */
    if (P){
      const amen = (P.amenities||[]).join(' ');
      const conf = (w, ok, why) => {
        if (!ok) return;
        const d = KW_OCC.find(x => x.w === w); if (!d) return;
        const i = out.findIndex(o => o.w === w);
        const row = Object.assign({}, d, { why, s:3, ask:'' });
        if (i >= 0) out[i] = row; else out.push(row);
      };
      conf('주차', P.parking && P.parking.available !== false, `플레이스에 주차 가능${P.parking && P.parking.paid ? '(유료)' : ''}`);
      conf('포장', /포장/.test(amen), '플레이스 편의시설에 포장');
      conf('단체', /단체/.test(amen), '플레이스 편의시설에 단체석');
      conf('룸', /룸|개별\s?공간|프라이빗/.test(amen), '플레이스 편의시설에 룸');
      /* 손님이 고른 리뷰 테마('단체모임 하기 좋아요', '혼밥하기 좋아요')는 실제 이용 상황이다 */
      const themes = (P.themes||[]).map(t => t.word).join(' ');
      const th = (w, re) => { if (!re.test(themes)) return; const d = KW_OCC.find(x=>x.w===w); if (!d) return;
        const i = out.findIndex(o=>o.w===w); const row = Object.assign({}, d, { why:'플레이스 리뷰 테마', s:2, ask: d.ask||'' });
        if (i < 0) out.push(row); else if (out[i].s < 2) out[i] = row; };
      th('단체', /단체|모임/); th('데이트', /데이트/); th('혼밥', /혼밥|혼자/); th('가족', /가족|아이|어린이/); th('회식', /회식/);
    }
    /* v2.90 — 동네 성격: 종사자 ÷ 인구가 1 이상이면 직장가(회식·점심), 아니면 주거지(가족·모임) */
    const pop = mod(b,'population');
    if (pop.ok && has(pop.data.workerPerResident)){
      const r = Number(pop.data.workerPerResident);
      const add2 = (w, why) => { const d = KW_OCC.find(x=>x.w===w); if (d && !out.some(o=>o.w===w)) out.push(Object.assign({ why, s:1 }, d)); };
      if (r >= 1){ add2('회식', `직장가 — 종사자 ÷ 인구 ${r}`); add2('점심', `직장가 — 종사자 ÷ 인구 ${r}`); }
      else { add2('가족', `주거지 — 종사자 ÷ 인구 ${r}`); add2('모임', `주거지 — 종사자 ÷ 인구 ${r}`); }
    }
    if (nb.ok){
      const g = (L) => { const c=(nb.data.categories||[]).find(c=>c.label===L); return c ? c.count : 0; };
      const add = (w, why) => { const d = KW_OCC.find(x=>x.w===w);
        if (d && !out.some(o=>o.w===w)) out.push(Object.assign({ why, s:1 }, d)); };
      if (g('숙박') >= 5) add('회식', `주변 숙박 ${g('숙박')}곳 — 밖에서 오는 손님`);
      if (g('주차장') >= 5) add('주차', `주변 주차장 ${g('주차장')}곳`);
      if (g('관광명소') >= 3) add('가족', `주변 관광명소 ${g('관광명소')}곳`);
    }
    return out.slice(0,5);
  }

  /* 후보 조합 — 지역 × 업종이 뼈대, 상황은 덧붙임 */
  function kwBuild(b){
    const places = kwPlaces(b), kinds = kwKinds(b), occs = kwOccs(b);
    if (!places.length || !kinds.length) return null;
    const list = [];
    const push = (t, why, s, ask) => {
      t = t.replace(/\s+/g,' ').trim();
      if (t.length > 22) return;
      if (!list.some(c => c.t === t)) list.push({ t, why, s, ask: ask||'' });
    };
    places.forEach(p => kinds.forEach(k => {
      push(`${p.t} ${k.t}`, `${p.why} × ${k.why}`, p.s + k.s);
      const c = list[list.length-1]; if (c) c.basic = true;
    }));
    /* v3.35: '중구 회식 깍둑꽃살세트'처럼 아무도 치지 않는 말은 만들지 않는다 — 지역 + 상황은 두 낱말('명동 회식'),
       룸·주차·포장처럼 확인이 필요한 말만 업종어를 붙여 '명동 룸 있는 한식'. 첫 주문 2인분 이상인 가게는 '혼밥'을 빼고 */
    const MINO = minOrderSignal(b, state.reviews && state.reviews.data);
    const kindWord = kinds.find(k => k.why === '업종');
    places.slice(0,2).forEach(p => occs.filter(o => !(o.w === '혼밥' && MINO)).forEach(o => {
      if (o.ask) { if (kindWord) push(`${p.t} ${o.adj} ${kindWord.t}`, o.why, p.s + kindWord.s + o.s - 1, o.ask); }
      else push(`${p.t} ${o.w}`, o.why, p.s + o.s, o.ask);
      if (o.place) push(`${p.t} ${o.w} 장소`, o.why, p.s + o.s, o.ask);
    }));
    list.sort((a,c) => c.s - a.s);
    const top = [], useP = {}, useK = {};          // 한 지역·한 업종이 다섯 칸을 다 먹지 않게
    const take = (c) => {
      if (top.length >= 5 || top.indexOf(c) >= 0) return;
      const pl = (places.find(p => c.t.indexOf(p.t) === 0) || {}).t || '';
      const kd = (kinds.find(k => c.t.slice(-k.t.length) === k.t) || {}).t || '';
      if ((useP[pl]||0) >= 3 || (useK[kd]||0) >= 3) return;
      useP[pl] = (useP[pl]||0) + 1; useK[kd] = (useK[kd]||0) + 1; top.push(c);
    };
    list.filter(c => c.basic).slice(0,2).forEach(take);   // 기본형 두 자리는 먼저 잡아 둔다
    list.forEach(take);
    const rest = list.filter(c => top.indexOf(c) < 0).slice(0,12);
    return { top, rest, places, kinds, occs, total: list.length };
  }

  function renderKeyword(b){
    const C = placeCheck(b), K = kwBuild(b), O = kwOrder(b), R = kwRep(b);
    if (!C.known && !K) return null;
    const W = { ok:'양호', warn:'보완', bad:'고칠 것', na:'확인 못 함' };
    const rows = C.rows.map(r => `<li class="pc-${r.st}"><span class="pst ${r.st}">${W[r.st]}</span>
      <div class="pc-b"><b class="pc-l">${esc(r.label)}</b><span class="pc-v">${r.val}</span><span class="pc-t">→ ${r.todo}</span>${r.sale ? `<span class="pc-s sale">영업 — ${r.sale}</span>` : ''}</div>
      <span class="pc-src">${esc(r.src)}</span></li>`).join('');
    const list = (arr) => `<ol class="kwl">${arr.map(c => `<li><span class="kt2">${esc(c.t)}</span><span class="kw9">${esc(c.why)}</span></li>`).join('')}</ol>`;
    const cur = (R.current || []).length ? `지금 등록된 것: ${R.current.map(esc).join(' · ')}` : '지금 등록된 대표키워드는 이번에 확인하지 못했습니다. 스마트플레이스에서 확인하세요.';
    let search = '';
    if (K) {
      const asks = K.top.concat(K.rest).filter(c => c.ask), seen = [];
      asks.forEach(c => { if (!seen.includes(c.ask)) seen.push(c.ask); });
      const half = Math.ceil(K.rest.length / 2);
      const restCol = (arr) => `<ul class="kwcol">${arr.map(c => `<li>${esc(c.t)}<span class="why">${esc(c.why)}</span></li>`).join('')}</ul>`;
      const T = state.kwTrend, tKey = (kwTrendKeys(b) || []).join('|');
      const trendBox = state.cust && !(T && T.ok && T.key === tKey) ? '' : `<div class="b s12 top" id="kwTrendBox">${kwTrendHTML()}</div>`;   // 고객용에는 받아 온 추이만
      search = `<div class="b s12 top"><p class="k">손님이 검색하는 말 — 소개글·소식에 문장으로</p>
        <ol class="kwtop" data-rule="vl,hb">${K.top.map(c => `<li><span class="kt">${esc(c.t)}</span><span class="kw9">${esc(c.why)}</span></li>`).join('')}</ol>
        <p class="src9">지역 이름에 업종·상황을 붙인 말입니다(‘맛집’·‘추천’처럼 누구나 쓰는 말은 뺐습니다). 대표키워드 칸이 아니라 소개글·소식에 손님에게 설명하듯 넣으세요 — 네이버는 소개글과 리뷰의 뜻을 맞춰 ‘역 근처 아이와 갈 만한 고깃집’ 같은 긴 문장 검색에도 씁니다(도움말 25167, 음식점).</p></div>
        ${trendBox}
        ${K.rest.length ? `<div class="b s12 top kwrest"><p class="k">글에 섞어 쓸 말 ${esc(num(K.rest.length,'개'))}</p></div>
        <div class="b s6 tight kwrest">${restCol(K.rest.slice(0, half))}</div><div class="b s6 tight rail kwrest">${restCol(K.rest.slice(half))}</div>` : ''}
        ${seen.length ? `<div class="b s12"><div class="flag2"><div class="eyebrow">ASK</div>
          <div class="lead-read">사장님께 먼저 여쭐 것 — ${esc(seen.join(' / '))}</div>
          <p class="src9">주변에 주차장이 많다고 우리 가게에 주차가 되는 것은 아닙니다. 확인 못 한 말을 넣으면 손님이 헛걸음합니다.</p></div></div>` : ''}`;
    }
    const html = `<div class="mz" id="pcBox">
      <div class="b s12"><div class="pcsum"><span class="big">${C.known ? C.ok : '—'}<small>/ ${C.known}</small></span>

  function mergePlace(place){

    state.bundle.modules.place = place.ok ? place : { ok:false, error: place.error || '플레이스 정보를 받지 못했습니다', source:{ name:'네이버 플레이스 (지도 수집기)' } };

      const start = await api('/reviews/start', { method:'POST', body:{ store:state.bundle.store, placeUrl:placeUrl||undefined, sources }, timeout:30000 });
      const runs = {};
      Object.entries(start.runs||{}).forEach(([key,r]) => { if (r && r.runId) runs[key] = r.runId; });
      if (!runs.naver && start.runId) runs.naver = start.runId;
      const skipped = Object.entries(start.runs||{}).filter(([,r]) => r && r.error).map(([key,r]) => `${RV_LABEL[key]||key}: ${r.error}`);
      const label = Object.keys(runs).filter(k => k !== 'place').map(key => RV_LABEL[key]||key).join('·');
      let final = null, placeDone = false, extra = 0;
      for (let i = 0; i < RV_TRIES + PLACE_EXTRA_POLLS; i += 1){
        await new Promise(r => setTimeout(r, RV_POLL_MS));
        const secs = Math.round(((i+1)*RV_POLL_MS)/1000);
        state.reviews = { running:true, message: final
          ? `리뷰는 다 왔습니다 · 영업시간·편의시설을 기다리는 중 (${secs}초)`
          : `${label} 리뷰를 모으는 중입니다 · ${secs}초 지남 (1~3분 걸립니다)${skipped.length?` · 건너뜀 — ${skipped.join(' / ')}`:''}` };
        paintReviews();
        if (final){
          // 리뷰는 끝났고 기본정보만 남았다 — 이것만 묻는다 (구글은 다시 부르지 않는다)
          const p = await api('/reviews/result', { method:'POST', body:{ runs:{ place:runs.place }, store:state.bundle.store, placeOnly:true }, timeout:30000 });
          if (p.place && !p.place.pending){ placeDone = true; mergePlace(p.place); break; }
          extra += 1;
          if (extra >= PLACE_EXTRA_POLLS) break;
          continue;
        }
        const r = await api('/reviews/result', { method:'POST', body:{ runs, runId:runs.naver, store:state.bundle.store, sources }, timeout:30000 });
        if (r.place && !r.place.pending){ placeDone = true; mergePlace(r.place); }
        if (r.done){
          if (r.usage) state.apifyUsage = r.usage;
          final = r;
          if (!runs.place || placeDone) break;
          state.reviews = { running:true, message:'리뷰는 다 왔습니다 · 영업시간·편의시설을 기다리는 중 (40초까지)' };
          paintReviews();
          continue;
        }
        if (r.failed) throw new Error('리뷰 수집이 중간에 멈췄습니다. 잠시 뒤 다시 시도해 주세요.');
        if (i >= RV_TRIES - 1) throw new Error('리뷰 수집이 너무 오래 걸립니다. 잠시 뒤 다시 시도해 주세요.');
      }
      if (!final) throw new Error('리뷰 수집이 너무 오래 걸립니다. 잠시 뒤 다시 시도해 주세요.');
      if (runs.place && !placeDone) skipped.push('플레이스 정보: 40초 안에 오지 않아 이번에는 뺐습니다. 리뷰를 다시 가져오면 다시 시도합니다');
      state.reviews = { running:false, data:final.data, source:final.source, fetchedAt:final.fetchedAt, skipped, mode:'apify', auto: Boolean(opt.auto), why: opt.auto ? prevErr : '' };
      if (state.bundle) { state.bundle.modules = state.bundle.modules || {}; state.bundle.modules.reviews = { ok:true, source:final.source, fetchedAt:final.fetchedAt, data:final.data, mode:'apify' }; }
      paintReviews();
      repaintSection('online');          // 6장 웨이팅 신호가 리뷰 쪽 건수를 읽는다
    } catch (err) {
      state.reviews = { running:false, error: err && err.message ? err.message : String(err) };
      paintReviews();
      if (err && err.status === 401) lockAuth('연결이 끊겼습니다. 팀 비밀번호로 다시 연결해 주세요.');
    }
  }


  /* ══════════ 배관 ══════════
     리포트는 수집이 끝난 뒤(20~40초) 한 번, 리뷰가 늦게 오면(대체 수집 1~3분) 또 한 번 그려진다.
     기준선은 요소의 실측 좌표로, 스크러빙은 섹션의 문서 좌표로 그리므로
     내용이 바뀔 때마다 둘 다 다시 재야 한다. */

  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* 화면 배율 — getBoundingClientRect는 배율이 곱해진 값을 돌려주므로 잴 때 나눠 준다 */
  let ZOOM = 1;
  const GC='#E4E4E4', GC2='#FAFAFA', GC0='#FFFFFF', EXT=168, LO=-26;   // HI(가로선 오른쪽 끝)는 장 폭에서 잰다 — 590px로 박아 두면 모바일에서 장 밖으로 나가 화면 폭이 늘어난다
  let _drawing = false;

  function inkRect(e){
    try { const r=document.createRange(); r.selectNodeContents(e);
      const b=r.getBoundingClientRect(); if(b.width>4&&b.height>4) return b; } catch(_){}
    return e.getBoundingClientRect();
  }
  /* v3.10: 끝을 흰색으로 흐리던 것을 뺐다 — 회색 종이 위에서는 흰 번짐이 깨진 그림처럼 보인다. 선 하나로 */
  function grad(dir, span, fade){
    return 'var(--line)';
  }
  function drawRules(){
    _drawing = true;
    $$('.arule').forEach(n => n.remove());
    const cnt = new Map();
    $$('[data-rule]').forEach((e) => {
      const sec = e.closest('.sec'); if(!sec) return;
      const a = inkRect(e), b = sec.getBoundingClientRect(), Z = ZOOM;
      const x=(a.left-b.left)/Z, y=(a.top-b.top)/Z, w=a.width/Z, h=a.height/Z;
      e.dataset.rule.split(/\s*,\s*/).forEach((kind) => {
        const i = document.createElement('i');
        i.className = 'arule';
        i.classList.add(kind[0]==='v' ? 'v' : 'h');
        const rd = cnt.get(sec) || 0; cnt.set(sec, rd+1);
        if (kind[0]==='v'){
          const SH=b.height/Z, s0=Math.max(y-EXT,-18), s1=Math.min(y+h+EXT,SH+18), span=s1-s0;
          const fade=Math.min(EXT, span*.34);
          const cx = kind==='vl' ? x : kind==='vr' ? x+w : x+w/2;
          i.style.cssText = `left:${cx.toFixed(1)}px;top:${s0.toFixed(1)}px;width:1px;`+
            `height:${span.toFixed(1)}px;background:${grad('to bottom',span,fade)}`;
        } else {
          /* 장 밖으로 26px씩 흘려 보내는 건 여백이 넉넉한 화면에서만. 모바일에서는 그 26px이 화면 폭을 늘려
             브라우저가 페이지 전체를 축소해 버린다(글자가 작아지고 잘려 보이던 원인). */
          const OVER = innerWidth > 660 ? 26 : 0;
          const HI = b.width/Z + OVER;
          const s0=Math.max(x-EXT,-OVER), s1=Math.min(x+w+EXT,HI), span=s1-s0;
          const fade=Math.min(EXT, span*.34);
          const cy = kind==='ht' ? y : y+h;
          i.style.cssText = `left:${s0.toFixed(1)}px;top:${cy.toFixed(1)}px;height:1px;`+
            `width:${span.toFixed(1)}px;background:${grad('to right',span,fade)}`;
        }
        i.style.setProperty('--rd', (rd*110)+'ms');   // cssText 뒤에 설정해야 살아남는다
        sec.insertBefore(i, sec.firstChild);
      });
    });
    Promise.resolve().then(() => { _drawing = false; });
  }

  /* 배경 타이포 맞춤 — 장이 글자보다 짧으면 글자를 줄이고, 그래도 안 들어가면 밑변을 장 바닥에 맞춘다.
     인쇄에서도 같은 자리에 찍힌다. */
  function fitBg(){
    $$('.sec .bgw').forEach((w) => {
      const sec = w.closest('.sec'), word = w.dataset.w || w.textContent;   // v3.10: .bgwrap 안으로 들어갔다
      const F0 = +w.dataset.f || 250, top0 = +w.dataset.t || 8;
      const H = sec.getBoundingClientRect().height / ZOOM;
      let F = F0, top = top0;
      const ink = (f) => f * 0.92;                     // 한글 글자의 실제 잉크 높이 ≈ 0.92em
      if (top + ink(F) > H - 4) F = Math.max(120, (H - 4 - top) / 0.92);
      if (top + ink(F) > H - 4) top = Math.max(0, H - 4 - ink(F));
      w.style.fontSize = `${Math.round(F)}px`;
      w.style.top = `${Math.round(top)}px`;
      w.style.left = `${Math.round(590 + 0.24*F - F*0.95*word.length)}px`;
    });
  }

  /* 스크러빙 — 배경 타이포는 오른쪽 밖에서 300% 크기로 들어와 제자리로,
     그리드 선은 15% 길이에서 시작해 장이 화면 45% 지점에 오면 100%가 된다 (읽는 자리에서는 늘 완성). */
  let SCRUB = [], RULES = [], _sy = 0, _run = false;
  const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
  function buildScrub(){
    SCRUB = $$('.bgw').filter(e => !e.closest('.sec.static')).map((e,i) => ({
      el:e, ax:790+((i*67)%170), top:0 }));
    const cnt = new Map();
    RULES = $$('.arule').filter(e => !e.closest('.sec.static')).map((e) => {
      const sec = e.closest('.sec'), idx = cnt.get(sec) || 0; cnt.set(sec, idx+1);
      return { el:e, sec, idx, h:e.classList.contains('h'), top:0 };
    });
    _sy = window.scrollY;
    measure();
  }
  function measure(){
    const so = window.scrollY;
    SCRUB.forEach(o => { o.el.style.transform = 'none'; });      // 변형을 걷고 원래 자리를 잰다
    SCRUB.forEach(o => { o.top = o.el.getBoundingClientRect().top + so; });
    const tops = new Map();
    RULES.forEach(o => {
      if (!tops.has(o.sec)) tops.set(o.sec, o.sec.getBoundingClientRect().top + so);
      o.top = tops.get(o.sec);
    });
  }
  function paint(sy){
    const vh = innerHeight || 900;
    SCRUB.forEach((o) => {
      // 글자가 화면 바닥에 들어오면 0, 거기서 0.62화면 더 내려오면 1 (화면 중상단에서 수렴 완료)
      let p = (sy + vh - o.top) / (vh*.62); p = p<0?0:p>1?1:p;
      const k = (1-p)*(1-p);
      o.el.style.transform = `translate3d(${(o.ax*k).toFixed(2)}px,0,0) scale(${(1+2.00*k).toFixed(4)})`;
    });
    RULES.forEach((o) => {
      const p = clamp01((sy + vh - o.top) / (vh*.55));            // 장 위가 화면 45% 지점이면 1
      const q = clamp01((p - o.idx*.05) / (1 - o.idx*.05));        // 선마다 살짝 뒤따라온다
      const s = 0.15 + 0.85*(1 - Math.pow(1-q, 3));
      o.el.style.transform = `${o.h ? 'scaleX' : 'scaleY'}(${s.toFixed(3)})`;
    });
  }
  function tick(){
    const t = window.scrollY;
    _sy += (t-_sy)*0.11;                 // 휠은 100px씩 튄다 — 부드러운 값을 따로 두고 따라간다
    if (Math.abs(t-_sy) < 0.3) _sy = t;
    paint(_sy);
    if (_sy !== t) requestAnimationFrame(tick); else _run = false;
  }
  function kick(){ if(!_run){ _run=true; requestAnimationFrame(tick); } }

  /* 숫자 카운트업 — data-n 하나짜리도, data-r "18~25"·"238~47" 여러 값도 굴린다.
     스케치 숫자는 장이 보이는 순간 칸(밑선·모서리 ✕)을 먼저 긋고 비워 둔 뒤, 제 차례가 오면
     그 안에서 글자만 바뀐다. 자로 칸을 잡고 숫자를 채워 넣는 순서다. */
  const _cnt = new WeakMap();
  function prep(e){
    if (_cnt.has(e)) return _cnt.get(e);
    const R = e.dataset.r ? e.dataset.r.split('~').map(Number) : [parseFloat(e.dataset.n)];
    if (R.some(v => !Number.isFinite(v))) return null;             // 굴릴 수 없는 값은 건드리지 않는다
    const final = e.textContent.trim();
    e.dataset.final = final;
    let put = (v) => { e.textContent = v; }, every = 0;
    if (e.dataset.sk){
      /* 스케치 한 벌을 다시 그리는 데 필터가 돈다. 60번/초로 갈면 한 장에서 네 칸이 겹칠 때 프레임이 밀린다
         — 숫자는 초당 22번만 바꾼다(그 속도면 이미 읽을 수 없이 빠르다). */
      const live = SK.paintLive(e, final);
      if (live){ put = live; every = 45; }
      e.dataset.skWait = '0';                                      // 그리지 못했더라도 다시 집어 들지 않게
    }
    const st = { R, final, put, every, dec:+(e.dataset.d||0), sep:e.dataset.sep||'~', run:false };
    _cnt.set(e, st);
    return st;
  }
  /* 칸만 긋고 비워 둔다 — 제 차례를 기다리는 동안 혼자 완성된 숫자로 서 있지 않게 */
  function prime(e){ const st = prep(e); if (st && st.every) st.put('', false); }
  function countUp(e){
    const st = prep(e);
    if (!st || st.run) return;
    st.run = true;
    const t0 = performance.now(); let _last = -1e9;
    const fmt = (x) => x.toLocaleString('ko-KR',{minimumFractionDigits:st.dec,maximumFractionDigits:st.dec});
    (function step(t){
      const k = Math.min((t-t0)/2800, 1), q = 1-Math.pow(1-k,4);
      if (k >= 1) st.put(st.final, true);
      else if (t - _last >= st.every){ _last = t; st.put(st.R.map(v => fmt(v*q)).join(st.sep), false); }
      if (k<1) requestAnimationFrame(step);
    })(t0);
  }
  function finishCounts(){
    $$('[data-final]').forEach(e => {
      const t = e.querySelector('svg.skv text');                   // 스케치는 안쪽 글자만 되돌린다
      if (t) t.textContent = e.dataset.final; else e.textContent = e.dataset.final;
    });
  }
  function fire(sec){
    sec.classList.add('on');
    if (MOTION==='fast' || reduce || sec.classList.contains('static')){
      sec.querySelectorAll('[data-sk-wait="1"]').forEach(n => SK.paintOne(n));
      return;
    }
    run(sec, [...sec.querySelectorAll('[data-n],[data-r]')], 400);
  }
  function run(sec, nums, lead){
    nums.forEach(prime);                                           // 칸을 먼저 전부 긋고
    nums.forEach((n,i) => setTimeout(() => countUp(n), lead + i*300));   // 하나씩 채워 넣는다
  }
  /* 리뷰가 도착하면 5·6·12장은 다시 그려진다. 그 장은 이미 한 번 나타났다고 표시돼 있어
     관찰자가 다시 부르지 않으므로, 새로 생긴 숫자는 여기서 챙긴다(없으면 평범한 글자로 남는다). */
  function catchUp(){
    $$('.sec.on').forEach((sec) => {
      const pend = [...sec.querySelectorAll('[data-sk-wait="1"]')];
      if (!pend.length) return;
      if (MOTION==='fast' || reduce || sec.classList.contains('static')){ pend.forEach(n => SK.paintOne(n)); return; }
      const nums = [], rest = [];
      pend.forEach(n => (n.dataset.n != null || n.dataset.r != null ? nums : rest).push(n));
      rest.forEach(n => SK.paintOne(n));
      run(sec, nums, 200);
    });
  }
  /* 장이 화면 아래 140px 안쪽까지 들어와야 시작한다 — 가장자리에서 시작하면 보기 전에 끝난다.
     v3.29: '장의 20%가 보일 때'만 보던 것 — 폰 화면에서는 긴 장(3장·9장 약 3,200px, 2장 6,000px)이 20%를 채우지 못해
     끝까지 켜지지 않았다(막대 숫자·견적 칸이 빈 채로). 이제 장의 20%와 화면의 45% 중 작은 쪽만 보이면 시작한다 */
  const IO_T = Array.from({ length: 21 }, (_, i) => i / 100);   // 0 ~ 0.20 — 긴 장은 비율이 조금씩 오르므로 촘촘하게 깨운다
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    const rootH = (e.rootBounds && e.rootBounds.height) || Math.max(1, innerHeight - 140);
    const need = Math.min(e.boundingClientRect.height * 0.2, rootH * 0.45);
    if (e.intersectionRect.height + 0.5 >= need){ fire(e.target); io.unobserve(e.target); } }), { threshold: IO_T, rootMargin:'0px 0px -140px 0px' });

  /* 상호를 글자 크기로 줄이던 fitHero는 뺐다 — SVG 스케치가 칼럼 폭에 맞춰 스스로 줄어든다 */

  /* 내용이 바뀌면 다시 재고 다시 붙인다 */
  let _rt = 0;
  function refresh(){
    _drawing = true;              // paintAll이 DOM을 건드려 관찰자를 다시 깨우지 않게 (drawRules가 끝나며 풀어 준다)
    SK.paintAll();
    fitBg();
    drawRules();
    buildScrub();
    $$('.sec').forEach((s) => {
      if (s.classList.contains('static')){ s.classList.add('on'); return; }
      if (!s.dataset.obs){ s.dataset.obs='1'; io.observe(s); }
    });
    catchUp();
    paint(_sy);
  }
  function scheduleRefresh(){ clearTimeout(_rt); _rt = setTimeout(refresh, 90); }

  new MutationObserver(() => { if(!_drawing) scheduleRefresh(); })
    .observe(el.result, { childList:true, subtree:true });
  new ResizeObserver(() => { if(!_drawing) scheduleRefresh(); }).observe(el.result);

  if (!reduce && MOTION!=='fast'){
    ['scroll','wheel','touchmove','keydown'].forEach(e => addEventListener(e, kick, {passive:true}));
  }
  /* 종이 패턴 — 지면과 같은 이미지(CSS --paper-img)를 SVG 패턴에 넣는다. 삼각·막대·띠가 종이를 오려 얹은 것처럼 보인다 */
  (function paperPattern(){
    const im = document.getElementById('paperImg'); if (!im) return;
    const m = /url\("?(data:[^")]+)"?\)/.exec(getComputedStyle(document.documentElement).getPropertyValue('--paper-img') || '');
    if (m) im.setAttribute('href', m[1]);
  })();
  addEventListener('resize', () => { measure(); scheduleRefresh(); }, {passive:true});
  addEventListener('load', () => scheduleRefresh());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => scheduleRefresh());
  /* 접어 둔 계산 과정·환산표는 종이에는 펼쳐서 낸다 (인쇄가 끝나면 원래대로) */
  const _pshow = [];
  addEventListener('afterprint', () => { _pshow.splice(0).forEach(d => { d.open = false; }); });
  addEventListener('beforeprint', () => {
    $$('.acc.pshow:not([open])').forEach(d => { d.open = true; _pshow.push(d); });
    finishCounts();
    $$('[data-sk-wait="1"]').forEach(n => SK.paintOne(n));   // 굴러가던 중에 인쇄를 눌러도 빠지지 않게
    SCRUB.forEach(o => { o.el.style.transform='none'; });
    $$('.sec').forEach(s => s.classList.add('on'));
    drawRules();
  });

  /* 메뉴판 사진 카드 — 마우스 자리에 따라 기울고, 빛이 커서를 따라 스친다 */
  el.result.addEventListener('pointermove', (e) => {
    const a = e.target.closest('.thumbs a');
    if (!a || reduce || MOTION==='fast') return;
    const r = a.getBoundingClientRect();
    const px = clamp01((e.clientX - r.left) / r.width), py = clamp01((e.clientY - r.top) / r.height);
    a.classList.add('tilting');
    a.style.setProperty('--ry', `${((px-.5)*14).toFixed(2)}deg`);
    a.style.setProperty('--rx', `${((.5-py)*14).toFixed(2)}deg`);
    a.style.setProperty('--mx', `${(px*100).toFixed(1)}%`);
    a.style.setProperty('--my', `${(py*100).toFixed(1)}%`);
  });
  el.result.addEventListener('pointerout', (e) => {
    const a = e.target.closest('.thumbs a');
    if (!a || (e.relatedTarget && a.contains(e.relatedTarget))) return;
    a.classList.remove('tilting');
    ['--rx','--ry'].forEach(k => a.style.removeProperty(k));
  });

  /* 입력 구역 스포트라이트 */
  (() => {
    /* v3.21 (#71): 흐림막은 첫 글자를 입력한 뒤부터 — 자동 포커스만으로 히어로 영상을 가리지 않는다 */
    let typed = false;
    const set = (on) => { el.scrim.classList.toggle('on', on && typed); el.tool.classList.toggle('lit', on); };
    const active = () => el.tool.contains(document.activeElement) || el.tool.matches(':hover');
    el.q.addEventListener('input', () => { if (!typed && el.q.value.trim()) { typed = true; set(active()); } });
    ['mouseenter','focusin'].forEach(e => el.tool.addEventListener(e, () => set(true)));
    ['mouseleave','focusout'].forEach(e => el.tool.addEventListener(e, () => setTimeout(() => set(active()), 0)));
  })();

  /* ══ 화면 배율 — 590px는 인쇄 폭이라 못 늘린다. 종이째 확대한다 ══
     인쇄에는 zoom:1이 걸려 있어 출력물은 배율과 무관하다. */
  (() => {
    const STEPS = [100,125,150,175,200,225,250];
    let touched = false;
    const ZKEY = 'sketch.zoom';

    /* v3.21 (#100): 단계 대신 연속 — 종이가 창 너비의 70%를 차지하게, 상한 250%. 1080p에서 약 169%, 4K(150% 배율)에서 약 226% */
    function auto(){
      const w = innerWidth;
      if (w < 900) return 100;
      return Math.round(Math.min(250, Math.max(100, w * 0.70 / 794 * 100)));
    }
    function apply(pc, why){
      pc = Math.min(250, Math.max(100, pc));
      ZOOM = pc/100;
      document.documentElement.style.setProperty('--zoom', ZOOM);
      const pat = document.getElementById('paper');                 // 종이 패턴도 1:1 — 배율만큼 되돌린다
      if (pat) pat.setAttribute('patternTransform', `scale(${(1/ZOOM).toFixed(4)})`);
      const lb = document.getElementById('zoomNow');
      if (lb) lb.textContent = pc + '%';
      if (why==='user') { touched = true; try { localStorage.setItem(ZKEY, String(pc)); } catch (_) {} }
      scheduleRefresh();
    }
    function step(dir){
      const now = Math.round(ZOOM*100);
      let i = STEPS.indexOf(now);
      if (i < 0) i = STEPS.findIndex(v => v>=now);
      i = Math.min(STEPS.length-1, Math.max(0, (i<0?0:i)+dir));
      apply(STEPS[i], 'user');
    }

    const ui = document.createElement('div');
    ui.className = 'zoomui';
    ui.innerHTML = '<button type="button" id="zoomOut" aria-label="작게">−</button>'+
      '<span id="zoomNow">100%</span>'+
      '<button type="button" id="zoomIn" aria-label="크게">+</button>';
    document.body.appendChild(ui);
    ui.querySelector('#zoomOut').addEventListener('click', () => step(-1));
    ui.querySelector('#zoomIn').addEventListener('click', () => step(1));

    let saved = 0; try { saved = Number(localStorage.getItem(ZKEY)) || 0; } catch (_) {}
    if (saved && innerWidth >= 900) { touched = true; apply(saved, 'saved'); } else apply(auto(), 'auto');
    addEventListener('resize', () => { if(!touched) apply(auto(),'auto'); }, {passive:true});
    /* 저장된 배율을 지우려면 배율 표시(%)를 두 번 클릭 */
    ui.querySelector('#zoomNow').addEventListener('dblclick', () => { touched = false; try { localStorage.removeItem(ZKEY); } catch (_) {} apply(auto(), 'auto'); });
  })();

  function buildMarkdown(b) {

    try {

      L.push(`- 근거: ${md(m0.evidence)}`);
      const keys = evidenceKeys(m0);
      if (keys.length) {
        L.push('');
        L.push('### 예상되는 망설임과 근거');

      }
      L.push(`- 시장 흐름: ${MARKET.lines.map((l) => `${md(l.t)} (${md(l.src)})`).join(' / ')}`);
      /* v3.27: 장별 제안 (규칙) — 읽은 것 → 제안 */
      const RXN = { store:'매장 정보', reviews:'손님 목소리', comp:'같은 업종 점포', nearby:'주변 시설 구성', pop:'동네 인구·사업체' };
      const rxl = [];

    } catch (_) { /* 요약이 안 만들어지면 묶음은 그대로 나간다 */ }
    L.push('## 1. 매장 정보');
    L.push('| 항목 | 값 | 출처 |', '|---|---|---|');

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 아래 방식으로 재시도 */ }
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'absolute';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  function fileStem() {
    const s = state.bundle.store || {};
    const day = String(state.bundle.collectedAt || '').slice(0, 10);
    return `${String(s.name || '매장').replace(/[\\/:*?"<>|\s]+/g, '_')}_${day}`;
  }
  function downloadFile(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    setMsg(el.copyMsg, `${name} 파일로 저장했습니다.`, 'ok');
  }

  const RECENT_KEY = 'sketch.recent', TRACK_KEY = 'sketch.track';

  function rememberBundle(bundle){
    if (!bundle || !bundle.store) return;
    const key = storeKey(bundle), list = readRecent().filter(x => x.key !== key);
    const rv = state.reviews && !state.reviews.running && state.reviews.data ? state.reviews : null;
    list.unshift({ key, name: bundle.store.name || '매장', addr: bundle.store.roadAddress || bundle.store.address || '', at: bundle.collectedAt || '', bundle, reviews: rv });
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5))); } catch (_) { /* 저장 공간이 없으면 조용히 */ }
