<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>용의쇼룸 가로 패럴랙스</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
            -webkit-user-select: none; /* 패드 글자 선택 방지 */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            color: #ffffff;
        }

        /* 가로로 길게 이어붙인 전체 컨테이너 */
        .horizontal-scroll-wrapper {
            display: flex;
            width: 400vw; /* 총 4개의 와이드 섹션 (1920px x 4) */
            height: 100vh;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* 부드러운 스와이프 느낌 */
            will-change: transform;
        }

        /* 개별 페이지 섹션 (정확히 패드 화면 1개 크기) */
        .section {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 100px;
            overflow: hidden;
        }

        /* 3D 입체감을 내기 위한 배경 글자 (가장 느리게 움직임) */
        .bg-text {
            position: absolute;
            font-size: 15rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            z-index: 1;
            white-space: nowrap;
            transition: transform 0.5s ease-out;
        }

        /* 중앙 콘텐츠 영역 */
        .content-box {
            position: relative;
            z-index: 3;
            max-width: 600px;
            transition: transform 0.3s ease-out;
        }

        .section-num {
            font-size: 2rem;
            color: #ff3366;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 4rem;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 30px;
            word-break: keep-all;
        }

        /* 버튼 묶음 그리드 (섹션당 2개씩 배치하여 총 8버튼) */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 500px;
        }

        .kiosk-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            color: #fff;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            transition: background 0.2s;
        }

        .kiosk-btn:active {
            background: #ff3366;
            border-color: #ff3366;
        }

        /* 우측에 배치될 메인 비주얼 이미지 (글자와 다른 속도로 입체 작동) */
        .image-box {
            position: absolute;
            right: 10%;
            width: 700px;
            height: 700px;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            z-index: 2;
            transition: transform 0.4s ease-out; /* 글자보다 약간 느리게 타겟팅 */
        }

        /* 페이지 유도 안내선 */
        .swipe-guide {
            position: absolute;
            bottom: 50px;
            right: 100px;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.4);
            animation: pulse 2s infinite;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: translateX(0); opacity: 0.4; }
            50% { transform: translateX(-10px); opacity: 1; }
            100% { transform: translateX(0); opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="horizontal-scroll-wrapper" id="scrollContainer">
        
        <div class="section" style="background-color: #0d0d11;">
            <div class="bg-text" style="top: 10%; left: 5%;">SYNERGY</div>
            <div class="content-box">
                <div class="section-num">*01</div>
                <div class="main-title">용의쇼룸<br>디지털 플랫폼</div>
                <div class="btn-grid">
                    <a href="#" class="kiosk-btn">자담치킨 제안서</a>
                    <a href="#" class="kiosk-btn">하이오더 시연</a>
                </div>
            </div>
            <div class="image-box" style="background-image: url('https://images.unsplash.com/photo-1551434678-e076c223a692?q=80&w=800');"></div>
        </div>

        <div class="section" style="background-color: #14141a;">
            <div class="bg-text" style="bottom: 10%; left: 10%;">DX SOLUTION</div>
            <div class="content-box">
                <div class="section-num">*02</div>
                <div class="main-title">KT 하이오더<br>미래형 매장 솔루션</div>
                <div class="btn-grid">
                    <a href="https://www.naver.com" class="kiosk-btn">네이버 포털</a>
                    <a href="#" class="kiosk-btn">KT DX 솔루션</a>
                </div>
            </div>
            <div class="image-box" style="background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=800');"></div>
        </div>

        <div class="section" style="background-color: #0f111a;">
            <div class="bg-text" style="top: 15%; left: 20%;">SUCCESS</div>
            <div class="content-box">
                <div class="section-num">*03</div>
                <div class="main-title">가맹점 상생<br>성공 비즈니스</div>
                <div class="btn-grid">
                    <a href="#" class="kiosk-btn">성공 사례 영상</a>
                    <a href="#" class="kiosk-btn">프로모션 안내</a>
                </div>
            </div>
            <div class="image-box" style="background-image: url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800');"></div>
        </div>

        <div class="section" style="background-color: #16131c;">
            <div class="bg-text" style="bottom: 15%; left: 5%;">SUPPORT</div>
            <div class="content-box">
                <div class="section-num">*04</div>
                <div class="main-title">KT 시너지<br>신속 지원 체계</div>
                <div class="btn-grid">
                    <a href="#" class="kiosk-btn">가맹점 상생 방안</a>
                    <a href="#" class="kiosk-btn">고객센터 문의</a>
                </div>
            </div>
            <div class="image-box" style="background-image: url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=800');"></div>
        </div>

    </div>

    <div class="swipe-guide">왼쪽으로 쓸어넘기세요 ➔</div>

    <script>
        const container = document.getElementById('scrollContainer');
        let startX = 0;
        let currentIdx = 0;
        const totalSections = 4;

        window.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
        });

        window.addEventListener('touchend', e => {
            const endX = e.changedTouches[0].clientX;
            const diffX = startX - endX;

            // 터치 밀어내기 판단 기준값 (50px 이상 밀었을 때 전환)
            if (Math.abs(diffX) > 50) {
                if (diffX > 0 && currentIdx < totalSections - 1) {
                    currentIdx++; // 왼쪽으로 밀기 (다음 페이지)
                } else if (diffX < 0 && currentIdx > 0) {
                    currentIdx--; // 오른쪽으로 밀기 (이전 페이지)
                }
                
                // 가로 전체 화면 이동
                container.style.transform = `translateX(-${currentIdx * 100}vw)`;
                
                // [시차 효과 적용] 각 섹션 내부 엘리먼트들을 서로 다른 속도로 엇갈리게 밀어내기
                const bgTexts = document.querySelectorAll('.bg-text');
                const imgBoxes = document.querySelectorAll('.image-box');
                const contentBoxes = document.querySelectorAll('.content-box');

                bgTexts.forEach(bg => {
                    bg.style.transform = `translateX(${diffX * 0.4}px)`; // 가짜 배경 글자는 매우 느리게
                });
                imgBoxes.forEach(img => {
                    img.style.transform = `translateX(${diffX * -0.15}px) scale(1.02)`; // 이미지는 반대 방향 느낌으로 입체감 부여
                });
            }
        });
    </style>
</body>
</html>
