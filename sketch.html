    }
    /* v3.24: 동그라미 — 긴 이름은 타원이 글자 귀퉁이를 가로질렀다. 초타원(|x/rx|^q + |y/ry|^q = 1)으로 둘러 네 귀퉁이가 여유 있게 안에 들게 하고,
       왼쪽 위에서 시작해 한 바퀴 조금 넘게 돌며 끝이 살짝 바깥으로 빠지게(사람이 닫는 모양) 그린다. 굵기는 글자 크기를 따르고 처음·끝은 가늘다 */
    function circleStroke(wd, red){
      const a0 = wd.w/2, b0 = wd.h/2, h = Math.max(10, wd.h);
      let rx = a0 + Math.max(10, h*0.5), ry = b0 + Math.max(7, h*0.45);
      const q = Math.max(2.2, Math.min(3.4, 2.1 + 0.28*(rx/ry - 1)));
      for (let k = 0; k < 16 && Math.pow(a0/rx, q) + Math.pow(b0/ry, q) > 0.78; k++){ rx *= 1.02; ry *= 1.05; }
      const s = newStroke(red, wd.x, wd.y); s.circle = wd.key; s.word = wd; s.clean = true;
      const tilt = (Math.random()-0.5)*0.07;
      const start = -2.25 + (Math.random()-0.5)*0.5;
      const sweep = Math.PI*2 + 0.3 + Math.random()*0.35;
      const drift = 0.045 + Math.random()*0.035;
      const ph1 = Math.random()*6.28, ph2 = Math.random()*6.28;
      const per = 2*Math.PI*Math.sqrt((rx*rx + ry*ry)/2);
      const n = Math.max(72, Math.round(per*(sweep/(2*Math.PI))/1.6));
      const pw = Math.max(2.1, Math.min(4.6, h*0.12));
      const sp = (v) => Math.sign(v)*Math.pow(Math.abs(v), 2/q);
      for (let i = 0; i <= n; i++){
        const u = i/n, ang = start + u*sweep;
        const r = 1 + drift*u*u + 0.016*Math.sin(ang*2 + ph1) + 0.01*Math.sin(ang*3 + ph2);
        const ex = rx*r*sp(Math.cos(ang)), ey = ry*r*sp(Math.sin(ang));
        const press = Math.sin(Math.PI*Math.min(1, 0.08 + u*0.95));
        s.pts.push([wd.x + ex*Math.cos(tilt) - ey*Math.sin(tilt), wd.y + ex*Math.sin(tilt) + ey*Math.cos(tilt),
          pw*(0.45 + 0.55*press)*(1 + 0.07*Math.sin(u*13 + ph1)), 1]);
      }
      return s;
    }
    /* 줄 찾기 → 빨간 밑줄 */
    function lineAt(x, y){
      let node;
      if (document.caretPositionFromPoint){ const c = document.caretPositionFromPoint(x, y); if (!c) return null; node = c.offsetNode; }
      else if (document.caretRangeFromPoint){ const r = document.caretRangeFromPoint(x, y); if (!r) return null; node = r.startContainer; }
      if (!node) return null;
      let blk = node.nodeType === 3 ? node.parentElement : node;
      while (blk && blk !== document.body && getComputedStyle(blk).display.startsWith('inline')) blk = blk.parentElement;
      if (!blk || blk === document.body || isCtl(blk)) return null;
      const rg = document.createRange(); rg.selectNodeContents(blk);
      const rects = [...rg.getClientRects()].filter(r => r.width > 0 && r.height > 0);
      const hit = rects.filter(r => r.top - 2 <= y && r.bottom + 2 >= y); if (!hit.length) return null;
      const T = Math.min(...hit.map(r => r.top)), B = Math.max(...hit.map(r => r.bottom));
      const line = rects.filter(r => r.top < B && r.bottom > T);
      const L = Math.min(...line.map(r => r.left)), R = Math.max(...line.map(r => r.right));
      if (x < L - 6 || x > R + 6) return null;
      /* v3.21: 글자 크기가 아니라 줄 상자 높이로 잰다 — 배율(zoom)이 걸려도 글씨 아래에 붙는다 */
      const h = Math.max(8, B - T);
      const base = B - h*0.06 + 1.5;
      return { L: L + scrollX, R: R + scrollX, y: base + scrollY, fs: h, blk, key: 'ul@' + Math.round(L + scrollX) + ',' + Math.round(B + scrollY) };
    }
    function underlineStroke(ln){
      const s = newStroke(true, ln.L, ln.y); s.circle = ln.key; s.blk = ln.blk; s.clean = true;
      const y0 = ln.y, W = ln.R - ln.L + 8, n = Math.max(40, Math.round(W/2));
      const amp = Math.max(0.6, ln.fs*0.028), ph = Math.random()*6.28, drift = (Math.random()-0.5)*ln.fs*0.05;
      const pw = Math.max(1.8, Math.min(3.8, ln.fs*0.1));
      for (let i = 0; i <= n; i++){ const t = i/n, press = Math.sin(Math.PI*Math.min(1, 0.06 + t*0.97));
        s.pts.push([ln.L - 4 + W*t, y0 + drift*t + Math.sin(t*6.28*1.2 + ph)*amp, pw*(0.5 + 0.5*press), 1]); }
      return s;
    }
    function animate(s){ const all = s.pts, total = all.length, t0 = performance.now(); const prev = cur; cur = s;
      const step = (now) => { const k = Math.min(1, (now - t0)/300); s.pts = all.slice(0, Math.max(2, Math.round(total*k)));
        paintFrame(); if (k < 1) requestAnimationFrame(step); else { s.pts = all; cur = prev; redraw(); } };
      paintCommitted(); requestAnimationFrame(step); }
    /* ── 인쇄용 흔적 (v3.23) — 화면 캔버스는 인쇄에 안 나가므로, 획마다 붙은 요소 안에 SVG 를 넣어 둔다.
       요소의 상자(그릴 때 크기)를 viewBox 로 잡고 width·height 100% 로 늘리니, 인쇄 배치(A4·배율 1)에서도 그 요소를 따라간다.
       낱말 동그라미는 낱말을 <span class="inkw">로 감싸 그 안에, 밑줄은 그 줄이 든 블록에, 손으로 그은 획은 첫 점 아래 블록에 붙는다. */
    const NSVG = 'http://www.w3.org/2000/svg';
    const mkEl = (t, a) => { const n = document.createElementNS(NSVG, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
    function inkPattern(red){
      const id = red ? 'inkPatRed' : 'inkPatInk';
      if (document.getElementById(id)) return id;
      let defs = document.getElementById('inkdefs');
      if (!defs){ defs = mkEl('svg', { id:'inkdefs', 'aria-hidden':'true' }); defs.appendChild(mkEl('defs', {})); document.body.appendChild(defs); }
      const p = mkEl('pattern', { id, patternUnits:'userSpaceOnUse', width:'128', height:'128' });
      const im = mkEl('image', { width:'128', height:'128' }); im.setAttribute('href', (red ? toothCanvas(214, 40, 16) : toothCanvas(38, 36, 34)).toDataURL('image/png'));
      p.appendChild(im); defs.querySelector('defs').appendChild(p); return id;
    }
    const docRect = (el) => { const r = el.getBoundingClientRect(); return { left: r.left + scrollX, top: r.top + scrollY, width: Math.max(1, r.width), height: Math.max(1, r.height) }; };
    function anchorFor(x, y){
      let e = document.elementFromPoint(x - scrollX, y - scrollY);
      const bad = (el) => { const d = getComputedStyle(el).display; return d.startsWith('inline') || d === 'table-row' || d === 'table-row-group' || d === 'contents' || el.matches('svg,svg *,canvas,img,video,figure.ph,.bgw,.arule'); };
      while (e && e !== document.body && bad(e)) e = e.parentElement;
      if (!e || e === document.body || e === document.documentElement || e.id === 'ink') e = document.querySelector('.page') || document.body;
      return e;
    }
    function ribbonPath(s, dx, dy, wmul, ox0, oy0, clean){
      const P = s.pts; if (P.length < 2) return '';
      const n = P.length, L = new Array(n), R = new Array(n);
      for (let i = 0; i < n; i++){
        const a = P[Math.max(0,i-1)], b = P[Math.min(n-1,i+1)];
        let nx = -(b[1]-a[1]), ny = (b[0]-a[0]); const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
        const taper = clean ? 1 : Math.min(1, (i+1)/3, (n-i)/3);
        const w = P[i][2] * wmul * (0.35 + 0.65*taper) / 2;
        L[i] = [P[i][0] + nx*w + dx - ox0, P[i][1] + ny*w + dy - oy0]; R[i] = [P[i][0] - nx*w + dx - ox0, P[i][1] - ny*w + dy - oy0];
      }
      const f = (p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
      return 'M' + L.map(f).join(' L') + ' L' + R.slice().reverse().map(f).join(' L') + ' Z';
    }
    function attachPrint(s){
      try {
        if (s.dom) return;
        let anchor = null;
        if (s.word && s.word.node && s.word.node.parentNode){
          const rg = document.createRange(); rg.setStart(s.word.node, s.word.a); rg.setEnd(s.word.node, s.word.b);
          const span = document.createElement('span'); span.className = 'inkw'; rg.surroundContents(span); s.wrap = span; anchor = span;
        } else if (s.blk && s.blk.isConnected) anchor = s.blk;
        else anchor = anchorFor(s.pts[0][0], s.pts[0][1]);
        if (!anchor) return;
        if (getComputedStyle(anchor).position === 'static') anchor.style.position = 'relative';
        const r = docRect(anchor);
        const svg = mkEl('svg', { class:'inkp', viewBox:`0 0 ${r.width.toFixed(1)} ${r.height.toFixed(1)}`, preserveAspectRatio:'none', 'aria-hidden':'true' });
        const avgA = s.pts.reduce((a, p) => a + p[3], 0) / Math.max(1, s.pts.length), pid = inkPattern(s.red);
        passesOf(s).forEach(([dx,dy,pa,wm]) => {
          const d = ribbonPath(s, dx, dy, wm, r.left, r.top, s.clean); if (d) svg.appendChild(mkEl('path', { d, fill:`url(#${pid})`, 'fill-opacity': Math.min(1, pa*avgA*1.25).toFixed(3) }));   // 종이에선 조금 진하게
        });
        anchor.appendChild(svg); s.dom = svg;
      } catch (_) { /* 인쇄용 흔적이 안 붙어도 화면 그리기는 그대로 */ }
    }
    function detachPrint(s){
      if (!s) return;
      if (s.dom){ s.dom.remove(); s.dom = null; }
      if (s.wrap){ const w = s.wrap, p = w.parentNode; if (p){ while (w.firstChild) p.insertBefore(w.firstChild, w); w.remove(); p.normalize(); } s.wrap = null; }
    }
    function dropAll(){ strokes.forEach(detachPrint); strokes = []; }
    function popStroke(){ const s = strokes.pop(); detachPrint(s); }
    function toggle(key, make){ const i = strokes.findIndex(s => s.circle === key); if (i >= 0){ detachPrint(strokes[i]); strokes.splice(i, 1); redraw(); return; } const s = make(); strokes.push(s); animate(s); attachPrint(s); }
    function clickAt(x, y, red){ const wd = wordAt(x - scrollX, y - scrollY); if (wd) toggle(wd.key, () => circleStroke(wd, red)); }
    function middleAt(x, y){ const ln = lineAt(x - scrollX, y - scrollY); if (ln) toggle(ln.key, () => underlineStroke(ln)); }

    const mq = matchMedia('(hover: hover) and (pointer: fine)');
    let ac = null;
    function enable(){
      if (ac) return; ac = new AbortController(); const o = { signal: ac.signal }; cv.style.display = ''; fit();
      document.addEventListener('pointerdown', (e) => {
        if ((e.pointerType !== 'mouse' && e.pointerType !== 'pen') || isCtl(e.target)) return;
        if (e.button === 1){ e.preventDefault(); fit(); middleAt(e.pageX, e.pageY); return; }
        if (e.button !== 0 && e.button !== 2) return;
        e.preventDefault(); fit();
        cur = newStroke(e.button === 2, e.pageX, e.pageY); cur.t = e.timeStamp; addPoint(cur, e.pageX, e.pageY, e.timeStamp); strokes.push(cur);
      }, o);
      document.addEventListener('pointermove', (e) => { if (!cur) return;
        const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of evs) addPoint(cur, ev.pageX, ev.pageY, ev.timeStamp);
        schedule(); }, o);
      const end = () => { if (cur && cur.pts.length < 2){ const c = cur; strokes.pop(); cur = null; clickAt(c.x0, c.y0, c.red); return; } const done = cur; cur = null; redraw(); if (done) attachPrint(done); };
      document.addEventListener('pointerup', end, o); document.addEventListener('pointercancel', end, o);
      document.addEventListener('contextmenu', (e) => { if (!isCtl(e.target)) e.preventDefault(); }, o);
      document.addEventListener('mousedown', (e) => { if (e.button === 1 && !isCtl(e.target)) e.preventDefault(); }, o);
      document.addEventListener('auxclick', (e) => { if (e.button === 1 && !isCtl(e.target)) e.preventDefault(); }, o);
      document.addEventListener('keydown', (e) => {
        if (e.target && (e.target.matches('input,textarea,select') )) return;
        if (e.key === 'Escape'){ dropAll(); redraw(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ popStroke(); redraw(); e.preventDefault(); } }, o);
      window.addEventListener('resize', fit, o);
      document.getElementById('inkUndo').addEventListener('click', () => { popStroke(); redraw(); }, o);
      document.getElementById('inkClear').addEventListener('click', () => { dropAll(); redraw(); }, o);
    }
    function disable(){ if (ac){ ac.abort(); ac = null; } cur = null; dropAll(); redraw(); cv.style.display = 'none'; ui.style.display = 'none'; }
    const apply = () => mq.matches ? enable() : disable();
    mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply);
    apply();
    /* 리포트가 새로 그려지면 표시는 뜻을 잃는다 — 지운다 */
    window.addEventListener('sketch:rendered', () => { strokes = []; redraw(); fit(); });   // 새 DOM 이라 인쇄용 흔적도 같이 사라진다
  })();

  if (!configured) setMsg(el.authMsg, '중계 서버 주소가 설정되지 않았습니다. 이 파일의 API_BASE 값을 바꿔 주세요.', 'err');
})();

</script>
</body></html>
