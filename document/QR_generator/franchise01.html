<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 안드로이드 크롬/삼성 인터넷의 강제 다크 모드가 gradient text를 반전시키는 문제 방지 -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#020202">
  <title>프랜차이즈 전용 Wi-Fi QR 생성기 v1.12 | KT 인천지사 시너지영업3팀</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700,900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      /* v1.12 다크 톤앤매너 (KT-Synergy 통일) */
      --kt-accent: #4facfe;                    /* KT 블루 (기존 --kt-red 대체) */
      --kt-accent-soft: rgba(79,172,254,0.12);
      --kt-dark: #ffffff;                       /* 텍스트 (원래 짙은 색이었지만 다크 페이지에서는 흰색) */
      --kt-bg: #020202;                         /* 페이지 배경 */
      --kt-surface: #0f0f11;                    /* 카드 배경 */
      --kt-surface-2: #17171a;                  /* 인풋/서브 카드 */
      --kt-gray: #141416;                       /* 옅은 배경 대체 */
      --kt-border: #232326;                     /* 기본 border */
      --kt-muted: #a1a1aa;                      /* 보조 텍스트 */
      --kt-faint: #71717a;                      /* 힌트/placeholder */
      /* 하위 호환 - 기존 이름 유지하며 값만 KT 블루로 */
      --kt-red: #4facfe;
      --radius: 16px;
      --transition: 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; color-scheme: dark; }
    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: radial-gradient(ellipse at top, #0b0b0f 0%, #020202 55%, #020202 100%);
      color: #fff;
      min-height: 100dvh;
      position: relative;
      color-scheme: dark;
    }
    /* 은은한 KT 블루 글로우 (Editorial Minimalism 톤) */
    body::before {
      content: '';
      position: fixed;
      top: -20%; left: 50%;
      width: 900px; height: 900px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(79,172,254,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: bgDrift 22s ease-in-out infinite;
    }
    @keyframes bgDrift {
      0%,100% { transform: translateX(-50%) translateY(0); opacity: 1; }
      50%     { transform: translateX(-45%) translateY(30px); opacity: 0.7; }
    }

    /* ── Header ── */
    header {
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-bottom: 1px solid rgba(79,172,254,0.15);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    header img.kt-logo {
      height: 32px;
      /* KT 원본 로고가 검정이라 다크 배경에서 안보임 → 반전 + 살짝 밝게 */
      filter: brightness(0) invert(1);
    }
    header .divider { width: 1px; height: 28px; background: rgba(255,255,255,0.12); }
    header .header-text h1 {
      font-size: 1rem; font-weight: 800;
      color: #ffffff; /* fallback */
      background: linear-gradient(to right, #ffffff, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header .header-text p { font-size: 0.78rem; color: var(--kt-muted); font-weight: 500; margin-top: 1px; }

    /* ── Layout ── */
    .page-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 32px;
      align-items: start;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 900px) {
      .page-wrap { grid-template-columns: 1fr; }
    }

    /* ── Section cards ── */
    .card {
      background: var(--kt-surface);
      border-radius: var(--radius);
      border: 1px solid var(--kt-border);
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      transition: border-color .3s ease, box-shadow .3s ease;
    }
    .card:hover {
      border-color: rgba(79,172,254,0.25);
    }
    .card + .card { margin-top: 20px; }
    .section-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #4facfe 0%, #3a95e6 100%);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      border-radius: 50%;
      margin-right: 10px;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(79,172,254,0.35);
    }
    .section-title {
      display: flex;
      align-items: center;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 24px;
      color: #ffffff;
    }

    /* ── Franchise Grid ── */
    .franchise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .franchise-label { cursor: pointer; }
    .franchise-label input { display: none; }
    .franchise-card {
      border: 2px solid var(--kt-border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      background: var(--kt-surface-2);
      transition: var(--transition);
      position: relative;
    }
    .franchise-card .brand-thumb {
      width: 80px; height: 80px;
      object-fit: contain;
      border-radius: 10px;
      margin: 0 auto 10px;
      display: block;
      background: #fff;
      padding: 4px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    }
    .franchise-card .brand-thumb-placeholder {
      width: 80px; height: 80px;
      border-radius: 8px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #232326;
      font-size: 1.8rem;
    }
    .franchise-card .brand-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }
    .franchise-label input:checked ~ .franchise-card {
      border-color: var(--kt-accent);
      background: rgba(79,172,254,0.08);
      box-shadow:
        0 4px 20px rgba(79,172,254,0.25),
        0 0 30px rgba(79,172,254,0.12);
      transform: translateY(-2px);
    }
    .franchise-label input:checked ~ .franchise-card::after {
      content: '✓';
      position: absolute;
      top: 8px; right: 10px;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--kt-accent);
      animation: checkPop .35s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes checkPop {
      0%   { transform: scale(.4); opacity: 0; }
      70%  { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    .franchise-card:hover {
      border-color: rgba(79,172,254,0.4);
      background: #1c1c20;
      transform: translateY(-2px);
    }

    /* ── Form ── */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--kt-accent);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .form-group input, .form-group select {
      width: 100%;
      border: 1.5px solid var(--kt-border);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 1rem;
      font-family: inherit;
      color: #ffffff;
      background: var(--kt-surface-2);
      outline: none;
      transition: var(--transition);
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--kt-accent);
      background: #1c1c20;
      box-shadow: 0 0 0 3px rgba(79,172,254,0.12);
    }
    .form-group input::placeholder { color: var(--kt-faint); }
    /* select 옵션도 다크 톤으로 (브라우저 기본 흰 배경 방지) */
    .form-group select option { background: #0f0f11; color: #fff; }

    /* ── Generate Button ── */
    .btn-generate {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #4facfe 0%, #3a95e6 100%);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow:
        0 6px 20px rgba(79,172,254,0.25),
        0 0 40px rgba(79,172,254,0.1);
      margin-top: 8px;
      font-family: inherit;
      letter-spacing: -0.01em;
    }
    .btn-generate:hover {
      background: linear-gradient(135deg, #60b8ff 0%, #4facfe 100%);
      box-shadow:
        0 8px 28px rgba(79,172,254,0.4),
        0 0 50px rgba(79,172,254,0.15);
      transform: translateY(-2px);
    }
    .btn-generate:active { transform: translateY(0) scale(0.98); }

    /* ── Preview Panel ── */
    .preview-panel {
      position: sticky;
      top: 88px;
    }
    .preview-inner {
      background: var(--kt-surface);
      border-radius: var(--radius);
      border: 1px solid var(--kt-border);
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .preview-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .preview-title::before {
      content: '';
      width: 4px; height: 18px;
      background: var(--kt-accent);
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(79,172,254,0.5);
    }
    #previewCanvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--kt-border);
      display: block;
      background: #fff; /* QR 이미지 자체는 흰색 유지 (인쇄용) */
    }
    .preview-placeholder {
      aspect-ratio: 1240/1754;
      background: var(--kt-surface-2);
      border-radius: 10px;
      border: 2px dashed var(--kt-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--kt-faint);
      font-size: 0.9rem;
      font-weight: 600;
      gap: 10px;
    }
    .preview-placeholder svg { opacity: 0.3; }

    /* ── Download Button ── */
    .btn-download {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: var(--kt-surface-2);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      border: 1px solid var(--kt-border);
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      font-family: inherit;
    }
    .btn-download:hover:not(:disabled) {
      background: rgba(79,172,254,0.12);
      border-color: rgba(79,172,254,0.5);
      color: var(--kt-accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79,172,254,0.15);
    }
    .btn-download:disabled {
      background: #17171a;
      color: #52525b;
      border-color: var(--kt-border);
      cursor: not-allowed;
    }

    /* ── Status ── */
    .status-bar {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      display: none;
    }
    .status-bar.success {
      display: block;
      background: rgba(74,222,128,0.08);
      color: #4ade80;
      border: 1px solid rgba(74,222,128,0.3);
    }
    .status-bar.error {
      display: block;
      background: rgba(248,113,113,0.08);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.3);
    }
    .status-bar.loading {
      display: block;
      background: rgba(79,172,254,0.08);
      color: var(--kt-accent);
      border: 1px solid rgba(79,172,254,0.3);
    }

    /* ── Notice ── */
    .notice {
      background: rgba(251,191,36,0.06);
      border: 1px solid rgba(251,191,36,0.25);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.82rem;
      color: #fbbf24;
      line-height: 1.6;
      margin-top: 20px;
    }
    .notice strong { display: block; margin-bottom: 4px; font-weight: 800; }

    /* ── Custom (직접 만들기) ── */
    .franchise-label.custom .franchise-card {
      background: linear-gradient(135deg, rgba(79,172,254,0.08) 0%, rgba(79,172,254,0.03) 100%);
      border-color: rgba(79,172,254,0.3);
      border-style: dashed;
    }
    .franchise-label.custom .franchise-card:hover {
      background: rgba(79,172,254,0.1);
      border-color: var(--kt-accent);
      border-style: solid;
    }
    .franchise-label.custom .brand-thumb-placeholder {
      background: #17171a;
      border: 2px dashed rgba(79,172,254,0.35);
      color: var(--kt-accent);
    }

    /* Custom 입력 패널 */
    .custom-panel {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: rgba(79,172,254,0.05);
      border: 1.5px solid rgba(79,172,254,0.25);
      border-radius: 12px;
      animation: fadeIn 0.3s ease;
    }
    .custom-panel.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .custom-panel .panel-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--kt-accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 파일 업로드 */
    .file-upload {
      position: relative;
      width: 100%;
      border: 2px dashed rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 24px;
      background: var(--kt-surface-2);
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }
    .file-upload:hover {
      border-color: var(--kt-accent);
      background: rgba(79,172,254,0.05);
    }
    .file-upload input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-upload-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--kt-muted);
      font-size: 0.88rem;
      font-weight: 600;
      pointer-events: none;
    }
    .file-upload-label svg { color: var(--kt-accent); }
    .file-upload.has-file {
      border-style: solid;
      border-color: #4ade80;
      background: rgba(74,222,128,0.06);
    }
    .file-upload.has-file .file-upload-label { color: #4ade80; }
    .file-preview {
      display: none;
      margin-top: 12px;
      text-align: center;
    }
    .file-preview.active { display: block; }
    .file-preview img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .file-preview .file-name {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--kt-muted);
      word-break: break-all;
    }

    /* ═══════════════════════════════════════════════════════════
       ✨ SCROLL REVEAL & TEXT SPLIT ANIMATIONS (v1.12 신규)
       - 메인 index.html과 동일한 애니메이션 시스템 이식
       ═══════════════════════════════════════════════════════════ */
    .reveal {
      opacity: 0;
      filter: blur(12px);
      transform: translateY(28px);
      transition:
        opacity 1.0s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1.0s cubic-bezier(0.22, 1, 0.36, 1),
        transform 1.0s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, filter, transform;
    }
    .reveal.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }
    .reveal.delay-1 { transition-delay: 0.08s; }
    .reveal.delay-2 { transition-delay: 0.16s; }

    /* 프랜차이즈 카드 stagger reveal */
    .franchise-label.reveal-stagger {
      opacity: 0;
      filter: blur(8px);
      transform: translateY(16px) scale(0.95);
      transition:
        opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, filter, transform;
    }
    .franchise-label.reveal-stagger.is-visible {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0) scale(1);
    }

    /* Text Split */
    .split-target { display: inline; }
    .split-word {
      display: inline-block;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(0.35em);
      color: #ffffff;
      -webkit-text-fill-color: #ffffff;
      background: none;
      transition:
        opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.9s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, filter, transform;
    }
    .split-target.split-visible .split-word {
      opacity: 1; filter: blur(0); transform: translateY(0);
    }

    /* ─── 접근성: 애니메이션 최소화 사용자 배려 ─── */
    @media (prefers-reduced-motion: reduce) {
      .reveal, .franchise-label.reveal-stagger {
        opacity: 1 !important; filter: none !important; transform: none !important; transition: none !important;
      }
      .split-word {
        opacity: 1 !important; filter: none !important; transform: none !important; transition: none !important;
      }
      body::before { animation: none !important; }
    }
  </style>
</head>
<body>

<header>
  <img src="https://kt-synergy.com/assets/image/CI_BI/KT_CI_G01.png" class="kt-logo" alt="KT" onerror="this.style.display='none'">
  <div class="divider"></div>
  <div class="header-text">
    <h1><span class="split-target">프랜차이즈 전용 Wi-Fi QR 생성기</span> <span style="font-size:0.7rem;color:#71717a;font-weight:600;-webkit-text-fill-color:#71717a;background:none;">v1.12</span></h1>
    <p>KT 인천지사 시너지영업3팀 · DX상품 영업 지원 서비스</p>
  </div>
</header>

<div class="page-wrap">

  <!-- Left column: steps -->
  <div class="left-col">

    <!-- Step 1: 프랜차이즈 선택 -->
    <div class="card">
      <div class="section-title">
        <span class="section-num">1</span>
        프랜차이즈 선택
      </div>
      <div class="franchise-grid" id="franchiseGrid">

        <!-- 직접 만들기 (Custom) -->
        <label class="franchise-label custom">
          <input type="radio" name="franchise" value="custom">
          <div class="franchise-card">
            <div class="brand-thumb-placeholder">✏️</div>
            <div class="brand-name">직접 만들기</div>
          </div>
        </label>

        <!-- tem01 강경불고기 -->
        <label class="franchise-label">
          <input type="radio" name="franchise" value="0">
          <div class="franchise-card">
            <img src="https://kt-synergy.com/assets/image/qr_templates/tem01_s.png"
                 class="brand-thumb"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                 alt="강경불고기">
            <div class="brand-thumb-placeholder" style="display:none;">🍖</div>
            <div class="brand-name">강경불고기</div>
          </div>
        </label>

        <!-- tem02 경아식당 -->
        <label class="franchise-label">
          <input type="radio" name="franchise" value="1">
          <div class="franchise-card">
            <img src="https://kt-synergy.com/assets/image/qr_templates/tem02_s.png"
                 class="brand-thumb"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                 alt="경아식당">
            <div class="brand-thumb-placeholder" style="display:none;">🍽️</div>
            <div class="brand-name">경아식당</div>
          </div>
        </label>

        <!-- tem03 귀한족발 -->
        <label class="franchise-label">
          <input type="radio" name="franchise" value="2">
          <div class="franchise-card">
            <img src="https://kt-synergy.com/assets/image/qr_templates/tem03_s.png"
                 class="brand-thumb"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                 alt="귀한족발">

<script>
// ── 프랜차이즈 데이터 ──────────────────────────────────────────────
// 모든 이미지 사이즈: 1240x1754px (동일)
// QR / 텍스트 좌표: 모든 템플릿 동일
const BASE_URL = 'https://kt-synergy.com/assets/image/qr_templates/';

const FRANCHISES = [
  { name: '강경불고기', file: 'tem01.png' },
  { name: '경아식당',   file: 'tem02.png' },
  { name: '귀한족발',   file: 'tem03.png' },
  { name: '뉴욕야시장', file: 'tem04.png' },
  { name: '신포우리만두',file: 'tem05.png' },
  { name: '오봉집',     file: 'tem06.png' },
  { name: '오븐마루',   file: 'tem07.png' },
  { name: '육대장',     file: 'tem08.png' },
  { name: '자담치킨',   file: 'tem09.png' },
];

// ── Canvas 렌더링 좌표 (1240×1754 기준, 픽셀 분석 결과) ──────────
const LAYOUT = {
  canvasW: 1240,
  canvasH: 1754,
  // QR코드 영역
  qr: { x: 444, y: 1212, size: 350 },
  // 검정 바
  bar: { top: 1357, bottom: 1410 },
  // 텍스트 (center-aligned)
  ssid: { x: 247,  y: 1387 },
  pw:   { x: 970,  y: 1387 },
  // 폰트
  fontSize: 36,
  fontBold: 42,
  // ── Custom 모드용 추가 좌표 ──
  // 가게 사진 영역 (출력템플릿02.png의 투명 영역에 정확히 맞춤)
  photo:    { x: 98,  y: 33,  w: 1043, h: 998, radius: 0 },
  // 가게 상호 위치 (사진 위 오버레이, 가운데 정렬)
  shopName: { x: 620, y: 260, maxWidth: 920, maxFont: 140, minFont: 70 },
};

// ── 직접 만들기 모드용 템플릿 (출력템플릿01.png base64 인라인) ──
// (외부 호스팅 없이 자체 포함되어 작동)
const CUSTOM_TEMPLATE_URL = 'https://kt-synergy.com/assets/image/qr_templates/%EC%B6%9C%EB%A0%A5%ED%85%9C%ED%94%8C%EB%A6%BF02.png';

let generatedCanvas = null;
let selectedFranchise = null;    // 정수(0~8) 또는 'custom'
let customImageData = null;       // base64 dataURL

// ── 프랜차이즈 선택 감지 ──────────────────────────────────────────
document.querySelectorAll('input[name="franchise"]').forEach(radio => {
  radio.addEventListener('change', () => {
    const v = radio.value;
    selectedFranchise = (v === 'custom') ? 'custom' : parseInt(v);
    const panel = document.getElementById('customPanel');
    if (selectedFranchise === 'custom') {
      panel.classList.add('active');
    } else {
      panel.classList.remove('active');
    }
  });
});

// ── 이미지 업로드 처리 ────────────────────────────────────────────
document.getElementById('inputShopImage').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    customImageData = ev.target.result;
    const previewImg = document.getElementById('filePreviewImg');
    previewImg.src = customImageData;
    document.getElementById('filePreview').classList.add('active');
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileUploadBox').classList.add('has-file');
    document.getElementById('fileUploadText').textContent = '✓ 이미지 업로드 완료 (다시 선택하여 변경)';
  };
  reader.readAsDataURL(file);
});

// ── QR 생성 메인 함수 ─────────────────────────────────────────────
async function generateQR() {
  const ssid = document.getElementById('inputSSID').value.trim();
  const pw   = document.getElementById('inputPW').value.trim();
  const sec  = document.getElementById('inputSec').value;

  // 유효성 검사
  if (selectedFranchise === null) {
    showStatus('error', '❌ 프랜차이즈를 먼저 선택해 주세요.');
    return;
  }
  if (!ssid) {
    showStatus('error', '❌ 네트워크 이름(SSID)을 입력해 주세요.');
    return;
  }

  // Custom 모드 추가 검증
  const isCustom = (selectedFranchise === 'custom');
  const shopName = document.getElementById('inputShopName').value.trim();
  if (isCustom) {
    if (!shopName) {
      showStatus('error', '❌ 가게 상호를 입력해 주세요.');
      return;
    }
    if (!customImageData) {
      showStatus('error', '❌ 가게 이미지를 업로드해 주세요.');
      return;
    }
  }

  showStatus('loading', '⏳ QR코드를 생성하는 중입니다...');

  const qrData = `WIFI:T:${sec};S:${ssid};P:${pw};H:false;;`;
  const brandName = isCustom ? shopName : FRANCHISES[selectedFranchise].name;

  try {
    // 1. QR코드 이미지 생성
    const qrDataURL = await new Promise((resolve, reject) => {
      QRCode.toDataURL(qrData, {
        width: LAYOUT.qr.size,
        margin: 0,
        color: { dark: '#000000', light: '#ffffff' },
        errorCorrectionLevel: 'H'
      }, (err, url) => err ? reject(err) : resolve(url));
    });
    const qrImg = await loadImage(qrDataURL);

    // 2. 배경 템플릿 로드
    let bgImg;
    if (isCustom) {
      bgImg = await loadImage(CUSTOM_TEMPLATE_URL);
    } else {
      bgImg = await loadImage(BASE_URL + FRANCHISES[selectedFranchise].file);
    }

    // 3. Canvas 렌더링
    const canvas = document.getElementById('previewCanvas');
    canvas.width  = LAYOUT.canvasW;
    canvas.height = LAYOUT.canvasH;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, LAYOUT.canvasW, LAYOUT.canvasH);

    // Custom 모드: 먼저 가게 사진을 그린 후 배경 템플릿(검정바·QR박스·WIFI아이콘·KT로고) 오버레이
    if (isCustom) {
      const shopImg = await loadImage(customImageData);
      drawImageCover(ctx, shopImg, LAYOUT.photo.x, LAYOUT.photo.y,
                                   LAYOUT.photo.w, LAYOUT.photo.h, LAYOUT.photo.radius);
      // 배경 템플릿(투명PNG)을 위에 덮기
      ctx.drawImage(bgImg, 0, 0, LAYOUT.canvasW, LAYOUT.canvasH);
      // 가게 상호 (검은 글씨 + 두꺼운 흰 stroke)
      drawShopName(ctx, shopName);
    } else {
      // 기존 프랜차이즈 모드: 배경만 깔기
      ctx.drawImage(bgImg, 0, 0, LAYOUT.canvasW, LAYOUT.canvasH);
    }

    // QR코드 그리기 (가운데 박스에)
    ctx.drawImage(qrImg, LAYOUT.qr.x, LAYOUT.qr.y, LAYOUT.qr.size, LAYOUT.qr.size);

    // SSID / PW 텍스트 (검정바 위, 자동 폰트 축소)
    drawBarText(ctx, ssid, LAYOUT.ssid.x, LAYOUT.ssid.y);
    if (pw) drawBarText(ctx, pw, LAYOUT.pw.x, LAYOUT.pw.y);

    // 미리보기 표시
    document.getElementById('previewPlaceholder').style.display = 'none';
    canvas.style.display = 'block';
    generatedCanvas = canvas;

    document.getElementById('btnDownload').disabled = false;
    showStatus('success', `✅ ${brandName} Wi-Fi QR코드 생성 완료!`);

  } catch (err) {
    console.error(err);
    showStatus('error', '❌ 생성 중 오류가 발생했습니다. 이미지 경로를 확인해 주세요.');
  }
}

// ── 검정바 텍스트 그리기 (자동 폰트 축소) ─────────────────────────
function drawBarText(ctx, text, x, y) {
  // 검정바 좌/우 영역 너비: 약 323px → 좌우 20px 마진 → 약 280
  const maxWidth = 280;
  let fs = LAYOUT.fontBold;
  const fontFamily = `'Pretendard', 'Apple SD Gothic Neo', sans-serif`;
  ctx.font = `800 ${fs}px ${fontFamily}`;
  const w = ctx.measureText(text).width;
  if (w > maxWidth) {
    fs = Math.max(22, Math.floor(fs * maxWidth / w));
    ctx.font = `800 ${fs}px ${fontFamily}`;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, x, y);
}

// ── 둥근 사각형 클립 + object-fit: cover로 이미지 그리기 ──────────
function drawImageCover(ctx, img, x, y, w, h, radius) {
  ctx.save();
  // 둥근 사각형 path
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  ctx.clip();

  // cover: 영역을 가득 채우고 잘리는 부분은 중앙 기준으로 잘림
  const imgRatio = img.width / img.height;
  const dstRatio = w / h;
  let drawW, drawH, drawX, drawY;
  if (imgRatio > dstRatio) {
    // 이미지가 더 가로형 → 높이를 맞추고 가로는 잘림
    drawH = h;
    drawW = h * imgRatio;
    drawX = x - (drawW - w) / 2;
    drawY = y;
  } else {
    // 이미지가 더 세로형 → 너비를 맞추고 세로는 잘림
    drawW = w;
    drawH = w / imgRatio;
    drawX = x;
    drawY = y - (drawH - h) / 2;
  }
  ctx.drawImage(img, drawX, drawY, drawW, drawH);
  ctx.restore();
}

// ── 가게 상호 그리기 (검은 글씨 + 흰 stroke / 자동 폰트 크기) ────
function drawShopName(ctx, text) {
  const cfg = LAYOUT.shopName;
  // 폰트 크기 자동 조정
  let fontSize = cfg.maxFont;
  const fontFamily = `'Pretendard', 'Apple SD Gothic Neo', sans-serif`;
  ctx.font = `900 ${fontSize}px ${fontFamily}`;
  let textWidth = ctx.measureText(text).width;
  if (textWidth > cfg.maxWidth) {
    fontSize = Math.max(cfg.minFont, Math.floor(fontSize * cfg.maxWidth / textWidth));
    ctx.font = `900 ${fontSize}px ${fontFamily}`;
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;

  // 두꺼운 흰색 외곽선 (어떤 배경색에서도 가독성 보장)
  ctx.lineWidth = Math.max(14, fontSize * 0.18);
  ctx.strokeStyle = '#ffffff';
  ctx.strokeText(text, cfg.x, cfg.y);

  // 검은색 본문
  ctx.fillStyle = '#000000';
  ctx.fillText(text, cfg.x, cfg.y);
}

// ── 이미지 로드 헬퍼 ──────────────────────────────────────────────
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`이미지 로드 실패: ${src}`));
    img.src = src;
  });
}

// ── PNG 다운로드 ──────────────────────────────────────────────────
function downloadImage() {
  if (!generatedCanvas) return;

  const ssid = document.getElementById('inputSSID').value.trim();
  const safeName = ssid.replace(/[^a-zA-Z0-9가-힣_\-]/g, '_');
  const isCustom = (selectedFranchise === 'custom');
  const brandName = isCustom
    ? document.getElementById('inputShopName').value.trim().replace(/[^a-zA-Z0-9가-힣_\-]/g, '_')
    : FRANCHISES[selectedFranchise].name;
  const filename = `wifi_qr_${brandName}_${safeName}.png`;

  generatedCanvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }, 'image/png');
}

// ── 상태 메시지 ───────────────────────────────────────────────────
function showStatus(type, msg) {
  const el = document.getElementById('statusBar');
  el.className = `status-bar ${type}`;
  el.textContent = msg;
}

// ═══════════════════════════════════════════════════════════
// ✨ v1.12 애니메이션 로직 (메인 index.html과 동일한 시스템)
// - Scroll Reveal / Text Split / 프랜차이즈 카드 stagger
// ═══════════════════════════════════════════════════════════
(function initSectionAnimations() {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  // ─── [1] Text Split - 헤더 제목 단어 단위 분할 ───
  document.querySelectorAll('.split-target').forEach(el => {
    if (el.querySelector('.split-word')) return;
    const raw = el.textContent;
    const parts = raw.split(/(\s+)/);
    el.textContent = '';
    let wordIndex = 0;
    parts.forEach(part => {
      if (/^\s+$/.test(part)) {
        el.appendChild(document.createTextNode(part));
      } else if (part.length > 0) {
        const span = document.createElement('span');
        span.className = 'split-word';
        span.textContent = part;
        span.style.transitionDelay = (wordIndex * 0.05) + 's';
        el.appendChild(span);
        wordIndex++;
      }
    });
  });

  // ─── [2] Reveal 대상: 카드, notice, preview 패널 ───
  const revealSelectors = ['.card', '.notice', '.preview-inner'];
  revealSelectors.forEach(sel => {
    document.querySelectorAll(sel).forEach(el => el.classList.add('reveal'));
  });

  // ─── [3] 프랜차이즈 카드 stagger - 격자 순차 등장 ───
  document.querySelectorAll('.franchise-label').forEach((el, i) => {
    el.classList.add('reveal-stagger');
    // 최대 10개 카드까지 40ms 간격
    el.style.transitionDelay = Math.min(i * 0.04, 0.4) + 's';
  });

  // ─── [4] IntersectionObserver - 뷰포트 진입 시 발동 ───
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      if (el.classList.contains('reveal')) el.classList.add('is-visible');
      if (el.classList.contains('reveal-stagger')) el.classList.add('is-visible');
      if (el.classList.contains('split-target')) el.classList.add('split-visible');
      io.unobserve(el);
    });
  }, {
    threshold: 0.1,
    rootMargin: '0px 0px -20px 0px'
  });

  document.querySelectorAll('.reveal, .reveal-stagger, .split-target').forEach(el => io.observe(el));

  // ─── [5] 초기 화면에 있는 요소 즉시 활성화 ───
  setTimeout(() => {
    document.querySelectorAll('.split-target').forEach(el => {
      const rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight * 0.9 && rect.bottom > 0) {
        el.classList.add('split-visible');
      }
    });
  }, 50);
})();
</script>
</body>
</html>
